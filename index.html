<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L.A. Crimes 4-Server Control Panel</title>
<style>
*{box-sizing:border-box}
:root{
  --bg:#0a0d14;
  --card:#141a26;
  --card2:#1a2130;
  --text:#f4f6fb;
  --muted:#929bad;
  --border:rgba(255,255,255,.09);
  --green:#8ff0b5;
  --yellow:#f5d67e;
  --red:#ff9cad;
  --blue:#91c7ff;
  --purple:#b8a5ff;
}
body{
  margin:0;
  min-height:100vh;
  padding:20px;
  color:var(--text);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:
    radial-gradient(circle at 10% 0%,rgba(184,165,255,.14),transparent 30%),
    radial-gradient(circle at 90% 10%,rgba(145,199,255,.10),transparent 30%),
    var(--bg);
}
.container{width:min(1100px,100%);margin:auto}
.card{
  background:linear-gradient(145deg,rgba(255,255,255,.065),rgba(255,255,255,.025));
  border:1px solid var(--border);
  border-radius:20px;
  padding:20px;
  margin-bottom:16px;
  backdrop-filter:blur(14px);
  box-shadow:0 18px 45px rgba(0,0,0,.25);
}
.header{display:flex;align-items:center;gap:15px}
.logo{
  width:56px;height:56px;border-radius:17px;
  display:grid;place-items:center;
  background:rgba(184,165,255,.13);
  border:1px solid rgba(184,165,255,.2);
  font-size:27px
}
h1{margin:0;font-size:clamp(24px,6vw,36px)}
.subtitle{color:var(--muted);font-size:12px;margin-top:4px}
.auth{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end}
label{display:block;font-size:13px;font-weight:800;margin-bottom:7px}
input{
  width:100%;height:46px;padding:0 13px;border-radius:12px;
  border:1px solid rgba(255,255,255,.1);
  outline:none;background:rgba(0,0,0,.25);color:var(--text)
}
input:focus{border-color:rgba(184,165,255,.55)}
button{
  border:0;border-radius:12px;padding:12px 16px;
  font-weight:850;cursor:pointer;transition:.15s;
}
button:hover:not(:disabled){transform:translateY(-2px)}
button:disabled{opacity:.4;cursor:not-allowed}
.refresh{background:var(--purple);color:#211b3d}
.servers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.server-card{margin:0}
.server-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.server-name{font-size:20px;font-weight:900}
.badge{
  padding:5px 9px;border-radius:999px;font-size:10px;font-weight:900;
  background:rgba(255,255,255,.07);color:var(--muted)
}
.badge.online{background:rgba(143,240,181,.12);color:var(--green)}
.badge.starting{background:rgba(245,214,126,.12);color:var(--yellow)}
.badge.offline,.badge.available{background:rgba(255,156,173,.10);color:var(--red)}
.meta{margin-top:14px;display:grid;gap:8px}
.row{
  display:flex;justify-content:space-between;gap:12px;
  padding:10px 12px;border-radius:11px;background:rgba(0,0,0,.2)
}
.row span:first-child{color:var(--muted)}
.value{font-family:Consolas,monospace;color:var(--blue);text-align:right;word-break:break-all}
.buttons{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}
.start{background:var(--green);color:#183a29}
.stop{background:var(--red);color:#492631}
.log{
  height:180px;overflow:auto;padding:13px;border-radius:13px;
  background:#080a10;color:#dfe2ed;font:12px/1.5 Consolas,monospace;
  white-space:pre-wrap
}
.small{font-size:11px;color:var(--muted)}
.warning{
  margin-top:10px;padding:10px 12px;border-radius:11px;
  background:rgba(245,214,126,.08);color:var(--yellow);font-size:11px
}
@media(max-width:700px){
  .servers{grid-template-columns:1fr}
  .auth{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="container">

  <div class="card header">
    <div class="logo">ðŸŽ®</div>
    <div>
      <h1>L.A. Crimes Server Panel</h1>
      <div class="subtitle">Four independent servers Â· one Playit agent Â· four tunnels</div>
    </div>
  </div>

  <div class="card">
    <div class="auth">
      <div>
        <label for="token">GitHub Personal Access Token</label>
        <input id="token" type="password" placeholder="github_pat_..." autocomplete="off">
        <div class="small">Stored only in this browser session.</div>
      </div>
      <button class="refresh" id="refreshBtn">Refresh</button>
    </div>
    <div class="warning">
      Never put the token directly in this HTML file or commit it to GitHub.
    </div>
  </div>

  <div id="servers" class="servers"></div>

  <div class="card">
    <strong>Controller log</strong>
    <div id="log" class="log">Waiting...</div>
  </div>

</div>

<script>
const OWNER = "LACServer";
const REPO = "Dashboard";
const WORKFLOW = "main.yml";
const GIST_ID = "cb2aaaece7a231ec707429d41e1457f4";
const GIST_FILE = "servers.json";
const API = "https://api.github.com";
const API_VERSION = "2022-11-28";

let database = null;
let pollTimer = null;

const tokenInput = document.getElementById("token");
const serversElement = document.getElementById("servers");
const logElement = document.getElementById("log");
const refreshBtn = document.getElementById("refreshBtn");

const savedToken = sessionStorage.getItem("lac_dashboard_token");
if (savedToken) tokenInput.value = savedToken;

tokenInput.addEventListener("input", () => {
  const token = tokenInput.value.trim();
  if (token) sessionStorage.setItem("lac_dashboard_token", token);
  else sessionStorage.removeItem("lac_dashboard_token");
});

function getToken() {
  const token = tokenInput.value.trim();
  if (!token) throw new Error("Enter your GitHub token.");
  return token;
}

async function github(path, options = {}) {
  const response = await fetch(API + path, {
    ...options,
    headers: {
      "Accept": "application/vnd.github+json",
      "Authorization": "Bearer " + getToken(),
      "X-GitHub-Api-Version": API_VERSION,
      ...(options.headers || {})
    }
  });

  if (!response.ok) {
    let message = response.statusText;
    try {
      const data = await response.json();
      if (data.message) message = data.message;
    } catch (_) {}
    throw new Error(`GitHub API ${response.status}: ${message}`);
  }

  if (response.status === 204) return null;
  return response.json();
}

function log(text) {
  const stamp = new Date().toLocaleTimeString();
  logElement.textContent = `[${stamp}] ${text}\n` + logElement.textContent;
}

async function getGist() {
  const data = await github(`/gists/${GIST_ID}`);
  const file = data.files?.[GIST_FILE];

  if (!file || typeof file.content !== "string") {
    throw new Error(`Gist does not contain ${GIST_FILE}.`);
  }

  return JSON.parse(file.content);
}

async function saveGist(data) {
  await github(`/gists/${GIST_ID}`, {
    method: "PATCH",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      files: {
        [GIST_FILE]: {
          content: JSON.stringify(data, null, 2) + "\n"
        }
      }
    })
  });
}

function statusClass(status) {
  if (status === "online") return "online";
  if (status === "starting") return "starting";
  if (status === "available") return "available";
  return "offline";
}

function statusText(status) {
  if (status === "online") return "ONLINE";
  if (status === "starting") return "STARTING";
  if (status === "available") return "AVAILABLE";
  return "OFFLINE";
}

function render() {
  if (!database) return;

  serversElement.innerHTML = "";

  for (const server of database.servers) {
    const card = document.createElement("div");
    card.className = "card server-card";

    const isOnline = server.status === "online";
    const isStarting = server.status === "starting";
    const desiredOnline = server.desired === "online";

    card.innerHTML = `
      <div class="server-top">
        <div class="server-name">Server ${server.slot}</div>
        <div class="badge ${statusClass(server.status)}">${statusText(server.status)}</div>
      </div>

      <div class="small" style="margin-top:5px">${server.name}</div>

      <div class="meta">
        <div class="row">
          <span>Domain</span>
          <span class="value">${server.domain}:${server.port}</span>
        </div>

        <div class="row">
          <span>IP</span>
          <span class="value">${server.ip}:${server.port}</span>
        </div>

        <div class="row">
          <span>Local UDP</span>
          <span class="value">${server.local_port}</span>
        </div>

        <div class="row">
          <span>Requested</span>
          <span class="value">${desiredOnline ? "ONLINE" : "OFFLINE"}</span>
        </div>
      </div>

      <div class="buttons">
        <button
          class="start"
          onclick="setServerDesired(${server.slot}, 'online')"
          ${desiredOnline || isOnline || isStarting ? "disabled" : ""}
        >
          â–¶ Start Server ${server.slot}
        </button>

        <button
          class="stop"
          onclick="setServerDesired(${server.slot}, 'offline')"
          ${!desiredOnline && !isOnline && !isStarting ? "disabled" : ""}
        >
          â–  End Server ${server.slot}
        </button>
      </div>
    `;

    serversElement.appendChild(card);
  }
}

async function findControllerRun() {
  const data = await github(
    `/repos/${OWNER}/${REPO}/actions/workflows/${WORKFLOW}/runs?per_page=20`
  );

  return data.workflow_runs?.find(run =>
    run.status === "queued" ||
    run.status === "in_progress"
  ) || null;
}

async function dispatchController() {
  await github(
    `/repos/${OWNER}/${REPO}/actions/workflows/${WORKFLOW}/dispatches`,
    {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ref: "main"})
    }
  );
}

async function ensureControllerRunning() {
  const active = await findControllerRun();

  if (active) {
    log(`Controller already running: ${active.id}`);
    return active;
  }

  log("No controller workflow is running. Starting it...");
  await dispatchController();
  log("Controller workflow dispatched.");

  return null;
}

async function setServerDesired(slot, desired) {
  try {
    const server = database.servers.find(s => Number(s.slot) === Number(slot));
    if (!server) throw new Error(`Server ${slot} was not found.`);

    server.desired = desired;

    if (desired === "online") {
      server.status = "starting";
    } else {
      server.status = "offline";
    }

    render();
    log(`${desired === "online" ? "Starting" : "Ending"} Server ${slot}...`);

    await saveGist(database);

    if (desired === "online") {
      await ensureControllerRunning();
    }

    await refreshDatabase();
  } catch (error) {
    log(`Server ${slot} action failed: ${error.message}`);
    await refreshDatabase().catch(() => {});
  }
}

async function refreshDatabase() {
  const data = await getGist();

  if (!Array.isArray(data.servers) || data.servers.length !== 4) {
    throw new Error("Gist servers.json must contain exactly 4 servers.");
  }

  database = data;
  render();
}

async function refresh() {
  try {
    refreshBtn.disabled = true;
    await refreshDatabase();

    const active = await findControllerRun();
    if (active) {
      log(`Controller: ${active.status} Â· run ${active.id}`);
    } else {
      log("Controller: not running.");
    }
  } catch (error) {
    log(`Refresh failed: ${error.message}`);
  } finally {
    refreshBtn.disabled = false;
  }
}

refreshBtn.addEventListener("click", refresh);

window.addEventListener("load", () => {
  if (tokenInput.value.trim()) {
    refresh();
    pollTimer = setInterval(refreshDatabase, 5000);
  } else {
    log("Enter your GitHub token to connect.");
  }
});
</script>
</body>
</html>

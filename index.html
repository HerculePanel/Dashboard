<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HPanel Dashboard v1.2</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0a09;--text:#fff6ea;--muted:#c3b09a;--line:rgba(255,186,92,.22);--gold:#ffb43a;--mint:#3ee39a;--rose:#ff7180;--ink:#140f0a}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Lalezar,Tahoma;color:var(--text);background:radial-gradient(circle at 12% 0%,rgba(255,180,58,.18),transparent 32%),linear-gradient(180deg,#120e0b,#070605)}.wrap{width:min(1160px,calc(100% - 30px));margin:auto;padding:35px 0 70px}.header{display:flex;justify-content:space-between;gap:15px;align-items:center;flex-wrap:wrap}.brand{font-size:40px}.gold{color:var(--gold)}.badge{display:inline-block;padding:5px 10px;border-radius:999px;background:rgba(62,227,154,.15);color:var(--mint)}.actions,.row{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;cursor:pointer;border-radius:15px;padding:11px 15px;font:17px Lalezar;box-shadow:0 5px 0 rgba(0,0,0,.3)}.mint{background:linear-gradient(180deg,#6af3b8,#17c77a);color:#042016}.goldbtn{background:linear-gradient(180deg,#ffd27a,#ff9d1f);color:var(--ink)}.rose{background:linear-gradient(180deg,#ff8a97,#e23b4d);color:#fff}.home{background:linear-gradient(180deg,#8ab0ff,#4d7dff);color:#061018;text-decoration:none}.ghost{background:rgba(255,255,255,.06);color:var(--text);border:1px solid var(--line);box-shadow:none}.panel,.server{border:1px solid var(--line);border-radius:22px;background:rgba(255,255,255,.035);padding:18px;margin-top:16px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.server.on{border-color:rgba(62,227,154,.5);background:linear-gradient(160deg,rgba(62,227,154,.16),rgba(255,180,58,.04))}.server.starting{border-color:rgba(255,180,58,.5)}.name{font-size:24px}.sub,.hint{color:var(--muted)}.bits{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.bit{padding:10px;border-radius:12px;background:rgba(0,0,0,.28);word-break:break-word}.tabbar{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.tab{padding:9px 13px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--muted);cursor:pointer;font:16px Lalezar}.tab.on{color:var(--text);background:rgba(255,180,58,.14)}.view{display:none}.view.on{display:block}input,textarea{width:100%;padding:12px;border-radius:13px;border:1px solid var(--line);background:rgba(0,0,0,.35);color:var(--text);font:16px Lalezar}textarea{min-height:300px;direction:ltr;text-align:left}.modal{position:fixed;inset:0;background:rgba(8,6,4,.8);backdrop-filter:blur(14px);display:flex;align-items:center;justify-content:center;z-index:10}.modal.hidden{display:none}.modalbox{width:min(560px,calc(100% - 30px));padding:25px;border-radius:25px;border:1px solid var(--line);background:#16110c}.field{margin:10px 0}.field label{display:block;color:var(--gold);margin-bottom:5px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:12px 18px;border-radius:14px;background:#17120d;border:1px solid var(--line);z-index:20}.ok{color:#9dffc9}.err{color:#ffb0b7}.spin{display:inline-block;width:16px;height:16px;border:2px solid rgba(0,0,0,.25);border-top-color:#111;border-radius:50%;animation:s .7s linear infinite}@keyframes s{to{transform:rotate(360deg)}}@media(max-width:850px){.grid{grid-template-columns:1fr}.bits{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<div class="header"><div><div class="brand"><span class="gold">HP</span>anel Dashboard <span class="gold">v1.2</span></div><span id="role" class="badge"></span></div><div class="actions"><button class="btn rose" onclick="logout()">خروج</button><a class="btn home" href="https://herculepanel.github.io/">منوی اصلی</a><button class="btn ghost" onclick="refreshDashboard()">تازه‌سازی</button></div></div>
<div id="loading" class="panel" style="text-align:center">checking login data... <span class="spin"></span></div>
<div id="app" style="display:none">
<div class="tabbar"><button class="tab on" onclick="tab('servers',this)">سرورها</button><button id="gistTab" class="tab" style="display:none" onclick="tab('gist',this)">گیست</button><button id="flowTab" class="tab" style="display:none" onclick="tab('flows',this)">ورک‌فلوها</button></div>
<section id="servers" class="view on"><div id="serverGrid" class="grid"></div></section>
<section id="gist" class="view"><div class="panel"><h2>servers.json</h2><textarea id="gistEditor"></textarea><button class="btn goldbtn" onclick="saveGist()">ذخیره گیست</button></div></section>
<section id="flows" class="view"><div class="panel"><button class="btn ghost" onclick="loadFlows()">بارگذاری ورک‌فلوها</button><div id="flowsList"></div></div></section>
</div>
</div>
<div id="startModal" class="modal hidden"><div class="modalbox"><h2>شروع سرور</h2><div class="field"><label>نسخه</label><select id="version" style="width:100%;padding:12px;background:#100d09;color:white;border:1px solid var(--line);border-radius:13px;font:16px Lalezar"><option>1.9.7</option><option>1.9.6</option></select></div><div class="field"><label>نقشه</label><select id="map" style="width:100%;padding:12px;background:#100d09;color:white;border:1px solid var(--line);border-radius:13px;font:16px Lalezar"><option>City</option><option>Garage</option><option>RagdollParty</option><option>TrainFacility</option><option>ZombieSurvival</option><option>NewTerrainRamps</option><option>Island</option><option>CarSoccer</option><option>Custom</option></select></div><div class="field"><label>کد ادمین سرور</label><input id="adminCode" value="12345"></div><div class="field" id="customBox" style="display:none"><label>نام فایل نقشه</label><input id="customName" placeholder="Prime.txt"><label>محتوای نقشه</label><textarea id="customBody"></textarea></div><button class="btn mint" onclick="startServer()">روشن کردن سرور</button><button class="btn ghost" onclick="closeModal()">لغو</button></div></div>
<script>
const C={owner:"HerculePanel",repo:"Dashboard",workflow:"main.yml",gist:"cb2aaaece7a231ec707429d41e1457f4",file:"servers.json",branch:"main"};
const AUTH="hpanel_auth",DT="hpanel_dashboard_token";let token="",admin=false,data=null,pending=null;
function getAuth(){try{return JSON.parse(localStorage.getItem(AUTH)||"null")}catch{return null}}
function toast(t,c=""){const x=document.createElement("div");x.className="toast "+c;x.textContent=t;document.body.appendChild(x);setTimeout(()=>x.remove(),3000)}
function api(path,opt={}){return fetch("https://api.github.com"+path,{...opt,headers:{"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28","Authorization":"Bearer "+token,...(opt.headers||{})}})}
async function json(path,opt={}){const r=await api(path,opt),d=await r.json().catch(()=>null);if(!r.ok)throw Error(d?.message||"GitHub API "+r.status);return d}
async function gist(){const d=await json("/gists/"+C.gist);return d.files?.[C.file]?.content||""}
async function refreshDashboard(){try{data=JSON.parse(await gist());render()}catch(e){toast(e.message,"err")}}
function render(){const root=document.getElementById("serverGrid");root.innerHTML="";(data?.servers||[]).forEach(s=>{const st=String(s.status||"offline").toLowerCase(),on=st==="online";const d=document.createElement("div");d.className="server "+(on?"on":st==="starting"?"starting":"");d.innerHTML=`<div class="name">سرور ${s.slot}</div><div class="sub">${st}${s.map?" · "+s.map:""}${s.version?" · v"+s.version:""}</div><div class="bits"><div class="bit">آدرس<br>${s.endpoint||"—"}</div><div class="bit">IP<br>${s.ip||"—"}</div><div class="bit">پورت<br>${s.port||"—"}</div><div class="bit">وضعیت<br>${st}</div></div><div class="row"><button class="btn mint" ${st!=="offline"?"disabled":""} onclick="openStart(${s.slot})">روشن</button><button class="btn rose" ${st==="offline"?"disabled":""} onclick="stopServer(${s.slot},${s.run_id||"null"})">خاموش</button></div>`;root.appendChild(d)})}
function tab(id,b){document.querySelectorAll(".view").forEach(x=>x.classList.remove("on"));document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));document.getElementById(id).classList.add("on");b.classList.add("on");if(id==="gist")loadGistEditor()}
async function loadGistEditor(){document.getElementById("gistEditor").value=await gist()}
async function saveGist(){try{JSON.parse(document.getElementById("gistEditor").value);await json("/gists/"+C.gist,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({files:{[C.file]:{content:document.getElementById("gistEditor").value}}})});toast("گیست ذخیره شد","ok");refreshDashboard()}catch(e){toast(e.message,"err")}}
function openStart(slot){pending=slot;document.getElementById("startModal").classList.remove("hidden")}
function closeModal(){document.getElementById("startModal").classList.add("hidden")}
document.getElementById("map").onchange=()=>document.getElementById("customBox").style.display=document.getElementById("map").value==="Custom"?"block":"none";
async function startServer(){const slot=pending,map=document.getElementById("map").value,version=document.getElementById("version").value,code=document.getElementById("adminCode").value.trim();if(!/^\d+$/.test(code))return toast("کد ادمین باید عدد باشد","err");let name="",body="";if(map==="Custom"){name=document.getElementById("customName").value.trim();body=document.getElementById("customBody").value;if(!name||!body.trim())return toast("نقشه سفارشی کامل نیست","err");await json("/gists/"+C.gist,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({files:{["custom-map-"+slot+".txt"]:{content:body}}})})}try{await json(`/repos/${C.owner}/${C.repo}/actions/workflows/${encodeURIComponent(C.workflow)}/dispatches`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({ref:C.branch,inputs:{mode:"start",slot:String(slot),map,admin_code:code,custom_map_name:name,version}})});toast("درخواست روشن شدن ارسال شد","ok");closeModal();setTimeout(refreshDashboard,2500)}catch(e){toast(e.message,"err")}}
async function stopServer(slot,run){if(!run)return toast("شناسه اجرا پیدا نشد","err");if(!confirm("سرور خاموش شود؟"))return;try{const r=await api(`/repos/${C.owner}/${C.repo}/actions/runs/${run}/cancel`,{method:"POST"});if(!r.ok&&r.status!==409)throw Error("خاموش نشد");toast("درخواست خاموشی ارسال شد","ok");setTimeout(refreshDashboard,2500)}catch(e){toast(e.message,"err")}}
async function loadFlows(){const d=await json(`/repos/${C.owner}/${C.repo}/actions/runs?per_page=20`);document.getElementById("flowsList").innerHTML=(d.workflow_runs||[]).map(x=>`<div class="panel"><b>${x.name}</b><div class="sub">${x.status} ${x.conclusion||""}</div></div>`).join("")}
function logout(){localStorage.removeItem(AUTH);localStorage.removeItem(DT);location.href="https://herculepanel.github.io/"}
(async()=>{const a=getAuth();document.getElementById("loading").style.display="block";if(!a?.loggedIn){location.href="https://herculepanel.github.io/vault/";return}admin=!!a.admin;token=localStorage.getItem(DT)||"";if(!token){toast("توکن داشبورد پیدا نشد","err");location.href="https://herculepanel.github.io/vault/";return}document.getElementById("role").textContent=admin?"مدیر":"کاربر";if(admin){document.getElementById("gistTab").style.display="inline-block";document.getElementById("flowTab").style.display="inline-block"}try{await json(`/repos/${C.owner}/${C.repo}`);document.getElementById("loading").style.display="none";document.getElementById("app").style.display="block";await refreshDashboard()}catch(e){toast("checking login data... ناموفق: "+e.message,"err")}})();
</script>
</body></html>

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HPanel v1.1</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lalezar&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0a09;
      --text: #fff6ea;
      --muted: #c3b09a;
      --line: rgba(255, 186, 92, .22);
      --gold: #ffb43a;
      --gold2: #ffe08a;
      --mint: #3ee39a;
      --ink: #140f0a;
      --shadow: 0 28px 70px rgba(0,0,0,.55);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Lalezar, Tahoma, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 12% 0%, rgba(255,180,58,.18), transparent 32%),
        radial-gradient(circle at 92% 18%, rgba(62,227,154,.10), transparent 28%),
        linear-gradient(180deg, #120e0b, #070605);
    }
    .gold { color: var(--gold); }
    .login-modal, .map-modal, .fm-modal, .stop-modal {
      position: fixed; inset: 0; z-index: 1000;
      display: flex; align-items: center; justify-content: center;
      background: rgba(8,6,4,.78); backdrop-filter: blur(16px);
      opacity: 1; visibility: visible;
      transition: opacity .35s ease, visibility .35s ease;
    }
    .login-modal.hidden, .map-modal.hidden, .fm-modal.hidden, .stop-modal.hidden {
      opacity: 0; visibility: hidden; pointer-events: none;
    }
    .card-box {
      width: min(520px, calc(100% - 32px));
      padding: 30px 26px; border-radius: 28px;
      border: 1px solid var(--line);
      background: linear-gradient(165deg, rgba(255,180,58,.12), rgba(255,255,255,.03));
      box-shadow: var(--shadow); text-align: center;
    }
    .fm-box { width: min(920px, calc(100% - 28px)); text-align: right; max-height: 92vh; overflow: auto; }
    h1, h2 { margin: 0 0 8px; }
    .sub { margin: 0 0 16px; color: var(--muted); font-size: 16px; }
    .field { text-align: right; margin-bottom: 10px; }
    .field label { display: block; margin-bottom: 6px; color: var(--gold); font-size: 15px; }
    input, textarea {
      width: 100%; padding: 13px 14px; border-radius: 14px;
      border: 1px solid var(--line); background: rgba(0,0,0,.38);
      color: var(--text); margin-bottom: 0; outline: none;
      font-family: inherit; font-size: 16px;
    }
    textarea { min-height: 180px; font-family: ui-monospace, Consolas, monospace; font-size: 13px; }
    #fmEditor {
      min-height: 48vh;
      max-height: none;
      height: auto;
      overflow: auto;
      white-space: pre;
      word-break: normal;
      overflow-wrap: normal;
    }
    .ltr { direction: ltr; text-align: left; unicode-bidi: isolate; }
    .btn {
      border: 0; cursor: pointer; border-radius: 16px; padding: 12px 14px;
      font-family: inherit; font-size: 17px;
      box-shadow: 0 6px 0 rgba(0,0,0,.35);
      display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    }
    .btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 3px 0 rgba(0,0,0,.35); }
    .btn:disabled { opacity: .4; cursor: not-allowed; }
    .btn-gold { background: linear-gradient(180deg, #ffd27a, #ff9d1f); color: var(--ink); }
    .btn-mint { background: linear-gradient(180deg, #6af3b8, #17c77a); color: #042016; }
    .btn-rose { background: linear-gradient(180deg, #ff8a97, #e23b4d); color: #fff; }
    .btn-home { background: linear-gradient(180deg, #8ab0ff, #4d7dff); color: #061018; text-decoration:none; }
    .btn-refresh {
      background: linear-gradient(180deg, #7dfff0, #19c4b8);
      color: #04221f;
      border: 1px solid rgba(125,255,240,.45);
    }
    .btn-ghost { background: rgba(255,255,255,.06); color: var(--text); border: 1px solid var(--line); box-shadow: none; }
    .spin {
      width: 16px; height: 16px; border-radius: 50%;
      border: 2px solid rgba(20,15,10,.25); border-top-color: var(--ink);
      display: inline-block; flex: 0 0 16px;
      animation: spin .7s linear infinite;
    }
    .spin.light { border-color: rgba(255,255,255,.25); border-top-color: #fff6ea; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .app {
      width: min(1160px, calc(100% - 30px));
      margin: auto; padding: 36px 0 80px;
      opacity: 0; transform: translateY(12px); pointer-events: none; transition: .35s ease;
    }
    .app.visible { opacity: 1; transform: none; pointer-events: auto; }
    .hero { display: flex; justify-content: space-between; gap: 16px; align-items: center; flex-wrap: wrap; margin-bottom: 18px; }
    .brand { font-size: clamp(30px, 6vw, 48px); }
    .hero-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
    .tab {
      padding: 9px 13px; border-radius: 12px; border: 1px solid var(--line);
      background: rgba(255,255,255,.04); color: var(--muted); cursor: pointer;
    }
    .tab.on { color: var(--text); background: rgba(255,180,58,.14); border-color: rgba(255,180,58,.4); }
    .view { display: none; }
    .view.on { display: block; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 14px; }
    .server { padding: 18px; border-radius: 24px; border: 1px solid var(--line); background: rgba(255,255,255,.035); }
    .server.on { border-color: rgba(62,227,154,.5); background: linear-gradient(160deg, rgba(62,227,154,.16), rgba(255,180,58,.04)); }
    .name { font-size: 24px; }
    .bits { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0; }
    .bit { padding: 10px; border-radius: 12px; background: rgba(0,0,0,.28); font-size: 15px; word-break: break-word; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; }
    .row .btn { flex: 1; min-width: 90px; }
    .panel { padding: 16px; border-radius: 22px; border: 1px solid var(--line); background: rgba(255,255,255,.03); }
    .picker { position: relative; }
    .picker-btn {
      width: 100%; text-align: right;
      background: rgba(0,0,0,.38); color: var(--text);
      border: 1px solid var(--line); border-radius: 14px;
      padding: 13px 14px; font-family: inherit; font-size: 16px; cursor: pointer;
    }
    .picker-menu {
      display: none; position: absolute; right: 0; left: 0; top: calc(100% + 6px);
      z-index: 20; max-height: 240px; overflow: auto;
      border: 1px solid var(--line); border-radius: 14px;
      background: #16110c; box-shadow: var(--shadow);
    }
    .picker.open .picker-menu { display: block; }
    .picker-opt { padding: 11px 14px; cursor: pointer; color: var(--text); }
    .picker-opt:hover { background: rgba(255,255,255,.06); }
    .picker-opt.on { background: rgba(255,180,58,.14); }
    .picker-opt.custom {
      color: var(--ink);
      background: linear-gradient(180deg, #ffe08a, #ffb43a);
      font-weight: 700;
    }
    .fm-item {
      padding: 10px 12px; border-radius: 12px; cursor: pointer;
      direction: ltr; text-align: left; margin-bottom: 8px;
      border: 1px solid var(--line); background: rgba(255,255,255,.04);
    }
    .fm-item:hover { background: rgba(255,255,255,.08); }
    .crumb { direction: ltr; text-align: left; margin-bottom: 10px; color: var(--muted); }
    .flow-card { padding: 14px; border-radius: 16px; border: 1px solid var(--line); background: rgba(0,0,0,.22); margin-bottom: 10px; text-align: right; }
    .flow-top { display: flex; justify-content: space-between; gap: 10px; align-items: center; flex-wrap: wrap; }
    .badge { padding: 4px 10px; border-radius: 999px; font-size: 13px; }
    .badge.run { background: rgba(255,180,58,.16); color: var(--gold); }
    .badge.ok { background: rgba(62,227,154,.16); color: var(--mint); }
    .badge.bad { background: rgba(255,93,115,.16); color: #ff8a97; }
    .flow-meta { color: var(--muted); font-size: 14px; margin-top: 6px; }
    .flow-extra { display: none; margin-top: 10px; direction: ltr; text-align: left; font-size: 13px; color: var(--muted); }
    .flow-card.open .flow-extra { display: block; }
    .hidden-block { display: none; }
    .toast-box { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); width: min(420px, calc(100% - 28px)); z-index: 2000; }
    .toast {
      margin-top: 8px; padding: 12px 14px; border-radius: 14px;
      border: 1px solid var(--line); background: rgba(18,14,10,.94);
      animation: toastIn .25s ease;
    }
    .toast.out { animation: toastOut .28s ease forwards; }
    @keyframes toastIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @keyframes toastOut { to { opacity: 0; transform: translateY(12px); } }
    .ok { color: #9dffc9; } .err { color: #ffb0b7; } .info { color: #ffd27a; }
    .foot { margin-top: 28px; text-align: center; color: #7a6b5a; font-size: 14px; }
    @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div id="loginModal" class="login-modal">
    <div class="card-box">
      <h1><span class="gold">HP</span>anel <span class="gold">v1.1</span></h1>
      <p class="sub">توکن گیت‌هاب را وارد کن</p>
      <input id="tokenInput" type="password" placeholder="github_pat_...">
      <button id="loginBtn" class="btn btn-gold" style="width:100%" onclick="connectGitHub()">ورود</button>
    </div>
  </div>

  <div id="mapModal" class="map-modal hidden">
    <div class="card-box">
      <h2>شروع سرور</h2>
      <p class="sub" id="mapSlotText">نقشه و کد ادمین</p>
      <div class="field">
        <label for="mapPickerBtn">نقشه سرور</label>
        <div class="picker" id="mapPicker">
          <button type="button" class="picker-btn" id="mapPickerBtn" onclick="togglePicker()">TrainFacility</button>
          <div class="picker-menu" id="mapPickerMenu"></div>
        </div>
      </div>
      <div class="field">
        <label for="adminCodeInput">کد ادمین</label>
        <input id="adminCodeInput" type="text" inputmode="numeric" value="12345" placeholder="۱۲۳۴۵">
      </div>
      <div id="customMapBox" class="hidden-block">
        <div class="field">
          <label for="customMapName">نام فایل نقشه</label>
          <input id="customMapName" class="ltr" type="text" placeholder="Prime.txt">
        </div>
        <div class="field">
          <label for="customMapBody">محتوای نقشه</label>
          <textarea id="customMapBody" class="ltr" placeholder="محتوای نقشه را اینجا بچسبان"></textarea>
        </div>
      </div>
      <button id="startBtn" class="btn btn-mint" style="width:100%;margin-top:8px" onclick="confirmStart()">روشن کردن سرور</button>
      <button class="btn btn-ghost" style="width:100%;margin-top:8px" onclick="closeMapModal()">لغو</button>
    </div>
  </div>

  <div id="stopModal" class="stop-modal hidden">
    <div class="card-box">
      <h2>خاموش کردن سرور</h2>
      <p class="sub" id="stopSlotText">این سرور خاموش شود؟</p>
      <button class="btn btn-rose" style="width:100%" onclick="confirmStop()">بله، خاموش کن</button>
      <button class="btn btn-ghost" style="width:100%;margin-top:8px" onclick="closeStopModal()">لغو</button>
    </div>
  </div>

  <div id="fmModal" class="fm-modal hidden">
    <div class="card-box fm-box">
      <h2 id="fmTitle">فایل‌های سرور</h2>
      <p class="sub">فقط مشاهده فایل‌های رانر موقت</p>
      <div id="fmCrumb" class="crumb ltr"></div>
      <div id="fmList" class="ltr"></div>
      <textarea id="fmEditor" class="ltr" readonly placeholder="یک فایل را انتخاب کن"></textarea>
      <button class="btn btn-ghost" style="width:100%" onclick="closeFm()">بستن</button>
    </div>
  </div>

  <div class="app" id="app">
    <div class="hero">
      <div>
        <div class="brand"><span class="gold">HP</span>anel <span class="gold">v1.1</span></div>
        <p class="sub" style="margin:6px 0 0">کنترل سرورهای لک</p>
      </div>
      <div class="hero-actions">
        <button class="btn btn-rose" onclick="logout()">خروج</button>
        <a class="btn btn-home" href="https://herculepanel.github.io/">برگشت به صفحه نخست</a>
        <button class="btn btn-refresh" onclick="refreshDashboard()">تازه‌سازی</button>
      </div>
    </div>

    <div class="tabs" id="tabs">
      <button class="tab on" style="font-family: Lalezar;" data-view="servers" onclick="switchView('servers')">سرورها</button>
      <button class="tab admin-only" style="font-family: Lalezar; display:none;" data-view="gist" onclick="switchView('gist')">گیست</button>
      <button class="tab admin-only" style="font-family: Lalezar; display:none;" data-view="flows" onclick="switchView('flows')">ورک‌فلوها</button>
    </div>

    <div id="view-servers" class="view on">
      <div id="servers" class="grid"></div>
    </div>
    <div id="view-gist" class="view">
      <div class="panel">
        <h2>ویرایش servers.json</h2>
        <textarea id="gistEditor" class="ltr"></textarea>
        <button class="btn btn-gold" onclick="saveGist()">ذخیره گیست</button>
      </div>
    </div>
    <div id="view-flows" class="view">
      <div class="panel">
        <h2>همه ورک‌فلوها</h2>
        <button class="btn btn-ghost" onclick="loadWorkflows()">بارگذاری</button>
        <div id="flowList" style="margin-top:12px"></div>
      </div>
    </div>

    <div class="foot"><span class="gold">H</span>ercule<span class="gold">P</span>anel © 2026</div>
  </div>
  <div class="toast-box" id="toasts"></div>

<script>
const CONFIG = {
  owner: "HerculePanel",
  repo: "Dashboard",
  workflow: "main.yml",
  gistId: "cb2aaaece7a231ec707429d41e1457f4",
  gistFile: "servers.json",
  branch: "main",
  api: "https://api.github.com",
  home: "https://herculepanel.github.io/",
  limitMs: (5 * 60 + 45) * 60 * 1000,
  maps: ["Custom","City","Garage","RagdollParty","TrainFacility","ZombieSurvival","NewTerrainRamps","Island","CarSoccer"]
};
const TOKEN_KEY = "hpanel_github_token";
const ADMIN_KEY = "hpanel_is_admin";
const ADMIN_SUFFIX = "_thisisadmin";
let githubToken = "";
let isAdmin = false;
let serversData = null;
let pendingSlot = null;
let pendingStopSlot = null;
let selectedMap = "TrainFacility";
let fmTree = {};
let fmPath = [];
let tickTimer = null;

function mapLabel(map) {
  return map === "Custom" ? "سفارشی" : map;
}
function toast(msg, type) {
  const el = document.createElement("div");
  el.className = "toast " + (type === "error" ? "err" : type === "success" ? "ok" : "info");
  el.textContent = msg;
  document.getElementById("toasts").appendChild(el);
  setTimeout(() => {
    el.classList.add("out");
    setTimeout(() => el.remove(), 280);
  }, 3200);
}
function saveSession(token, admin) {
  localStorage.setItem(TOKEN_KEY, token);
  localStorage.setItem(ADMIN_KEY, admin ? "1" : "0");
  document.cookie = "github_token=" + encodeURIComponent(token) + "; path=/; max-age=" + (30*24*60*60) + "; SameSite=Lax";
}
function loadToken() {
  return localStorage.getItem(TOKEN_KEY) || "";
}
function clearSession() {
  localStorage.removeItem(TOKEN_KEY);
  localStorage.removeItem(ADMIN_KEY);
  document.cookie = "github_token=; path=/; max-age=0; SameSite=Lax";
}
function showApp() {
  document.getElementById("loginModal").classList.add("hidden");
  document.getElementById("app").classList.add("visible");
  document.querySelectorAll(".admin-only").forEach(el => {
    el.style.display = isAdmin ? "" : "none";
  });
}
function hideApp() {
  document.getElementById("app").classList.remove("visible");
  document.getElementById("loginModal").classList.remove("hidden");
}
async function api(path, options) {
  options = options || {};
  const headers = Object.assign({
    "Accept": "application/vnd.github+json",
    "X-GitHub-Api-Version": "2022-11-28"
  }, options.headers || {});
  if (githubToken) headers.Authorization = "Bearer " + githubToken;
  return fetch(CONFIG.api + path, Object.assign({}, options, { headers }));
}
function esc(s) {
  return String(s ?? "").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;");
}
function statusFa(status) {
  if (status === "online") return "آنلاین";
  if (status === "starting") return "در حال روشن شدن";
  return "خاموش";
}
function parseLogin(raw) {
  const value = (raw || "").trim();
  if (value.endsWith(ADMIN_SUFFIX)) {
    return { token: value.slice(0, -ADMIN_SUFFIX.length), admin: true };
  }
  return { token: value, admin: false };
}
function setLoginLoading(on) {
  const btn = document.getElementById("loginBtn");
  btn.disabled = on;
  btn.innerHTML = on ? 'ورود<span class="spin"></span>' : "ورود";
}
function setStartLoading(on) {
  const btn = document.getElementById("startBtn");
  btn.disabled = on;
  btn.innerHTML = on ? 'در حال شروع<span class="spin light"></span>' : "روشن کردن سرور";
}
async function connectGitHub() {
  const parsed = parseLogin(document.getElementById("tokenInput").value || loadToken());
  if (!parsed.token) return toast("توکن را وارد کن", "error");
  setLoginLoading(true);
  githubToken = parsed.token;
  isAdmin = parsed.admin;
  try {
    const r = await api("/repos/" + CONFIG.owner + "/" + CONFIG.repo);
    if (!r.ok) throw new Error("دسترسی به ریپو نشد (" + r.status + ")");
    const g = await api("/gists/" + CONFIG.gistId);
    if (!g.ok) throw new Error("دسترسی به گیست نشد (" + g.status + ")");
    saveSession(parsed.token, parsed.admin);
    showApp();
    toast(isAdmin ? "ورود ادمین" : "وارد شدی", "success");
    refreshDashboard();
    if (!tickTimer) tickTimer = setInterval(refreshDashboard, 10000);
  } catch (e) {
    githubToken = "";
    isAdmin = false;
    hideApp();
    toast(e.message || "ورود ناموفق", "error");
  } finally {
    setLoginLoading(false);
  }
}
function logout() {
  clearSession();
  githubToken = "";
  isAdmin = false;
  document.getElementById("tokenInput").value = "";
  hideApp();
  switchView("servers");
  toast("خارج شدی", "info");
}
function switchView(name) {
  document.querySelectorAll(".view").forEach(v => v.classList.remove("on"));
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.getAttribute("data-view") === name));
  document.getElementById("view-" + name).classList.add("on");
  if (name === "gist") loadGistEditor();
  if (name === "flows") loadWorkflows();
}
async function gistJson() {
  const res = await api("/gists/" + CONFIG.gistId);
  if (!res.ok) throw new Error("خواندن گیست ناموفق");
  return res.json();
}
async function gistFileContent(filename) {
  const data = await gistJson();
  const file = data.files && data.files[filename];
  if (!file) return null;
  if (file.truncated && file.raw_url) return await (await fetch(file.raw_url)).text();
  return file.content || "";
}
async function loadServers() {
  const content = await gistFileContent(CONFIG.gistFile);
  if (!content) throw new Error("servers.json نیست");
  return JSON.parse(content);
}
function remainText(startedAt) {
  if (!startedAt) return "—";
  const end = new Date(startedAt).getTime() + CONFIG.limitMs;
  const left = end - Date.now();
  if (left <= 0) return "پایان زمان";
  const s = Math.floor(left / 1000);
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  return String(h).padStart(2,"0") + ":" + String(m).padStart(2,"0") + ":" + String(sec).padStart(2,"0");
}
function renderServers(data) {
  serversData = data;
  const root = document.getElementById("servers");
  root.innerHTML = "";
  [...data.servers].sort((a,b) => a.slot - b.slot).forEach(server => {
    const status = String(server.status || "offline").toLowerCase();
    const running = status === "online" || status === "starting";
    const card = document.createElement("div");
    card.className = "server" + (status === "online" ? " on" : "");
    card.innerHTML =
      '<div class="name">سرور ' + esc(server.slot) + '</div>' +
      '<div class="sub">' + esc(statusFa(status)) + (server.map ? " · " + esc(server.map) : "") + '</div>' +
      '<div class="bits">' +
        '<div class="bit">آدرس<br><span class="ltr">' + esc(server.endpoint || "—") + '</span></div>' +
        '<div class="bit">آی‌پی<br><span class="ltr">' + esc(server.ip || "—") + '</span></div>' +
        '<div class="bit">پورت<br><span class="ltr">' + esc(server.port || "—") + '</span></div>' +
        '<div class="bit">باقی‌مانده<br>' + esc(remainText(server.started_at)) + '</div>' +
      '</div>' +
      '<div class="row">' +
        '<button class="btn btn-mint"' + (status !== "offline" ? " disabled" : "") + ' onclick="openMapModal(' + Number(server.slot) + ')">روشن</button>' +
        '<button class="btn btn-rose"' + (status === "offline" ? " disabled" : "") + ' onclick="openStopModal(' + Number(server.slot) + ')">خاموش</button>' +
        '<button class="btn btn-ghost"' + (running ? "" : " disabled") + ' onclick="openFiles(' + Number(server.slot) + ')">فایل‌ها</button>' +
      '</div>';
    root.appendChild(card);
  });
}
async function refreshDashboard() {
  if (!githubToken) return;
  try { renderServers(await loadServers()); }
  catch (e) { toast(e.message || "تازه‌سازی ناموفق", "error"); }
}
function buildMapPicker() {
  const menu = document.getElementById("mapPickerMenu");
  menu.innerHTML = "";
  CONFIG.maps.forEach(m => {
    const opt = document.createElement("div");
    opt.className = "picker-opt" + (m === "Custom" ? " custom" : "") + (m === selectedMap ? " on" : "");
    opt.textContent = mapLabel(m);
    opt.onclick = function (e) {
      e.stopPropagation();
      chooseMap(m);
    };
    menu.appendChild(opt);
  });
  const btn = document.getElementById("mapPickerBtn");
  btn.textContent = mapLabel(selectedMap);
  btn.style.background = selectedMap === "Custom"
    ? "linear-gradient(180deg, #ffe08a, #ffb43a)"
    : "rgba(0,0,0,.38)";
  btn.style.color = selectedMap === "Custom" ? "#140f0a" : "#fff6ea";
}
function togglePicker() {
  document.getElementById("mapPicker").classList.toggle("open");
}
function chooseMap(map) {
  selectedMap = map;
  document.getElementById("mapPicker").classList.remove("open");
  buildMapPicker();
  onMapTypeChange();
}
function openMapModal(slot) {
  pendingSlot = slot;
  selectedMap = "TrainFacility";
  document.getElementById("mapSlotText").textContent = "نقشه و کد ادمین سرور " + slot;
  document.getElementById("adminCodeInput").value = "12345";
  document.getElementById("customMapName").value = "";
  document.getElementById("customMapBody").value = "";
  setStartLoading(false);
  buildMapPicker();
  onMapTypeChange();
  document.getElementById("mapModal").classList.remove("hidden");
}
function onMapTypeChange() {
  document.getElementById("customMapBox").classList.toggle("hidden-block", selectedMap !== "Custom");
}
function closeMapModal() {
  pendingSlot = null;
  setStartLoading(false);
  document.getElementById("mapPicker").classList.remove("open");
  document.getElementById("mapModal").classList.add("hidden");
}
function openStopModal(slot) {
  pendingStopSlot = slot;
  document.getElementById("stopSlotText").textContent = "سرور " + slot + " خاموش شود؟";
  document.getElementById("stopModal").classList.remove("hidden");
}
function closeStopModal() {
  pendingStopSlot = null;
  document.getElementById("stopModal").classList.add("hidden");
}
function cleanMapName(name) {
  return String(name || "").replace(/\.txt$/i, "").replace(/[^A-Za-z0-9_-]/g, "");
}
async function confirmStart() {
  const slot = pendingSlot;
  const map = selectedMap;
  const admin = (document.getElementById("adminCodeInput").value || "12345").trim();
  if (!slot) return;
  if (!/^\d+$/.test(admin)) return toast("کد ادمین باید عدد باشد", "error");
  let customName = "";
  if (map === "Custom") {
    customName = cleanMapName(document.getElementById("customMapName").value);
    const body = document.getElementById("customMapBody").value;
    if (!customName) return toast("نام نقشه سفارشی را بنویس", "error");
    if (!body.trim()) return toast("محتوای نقشه خالی است", "error");
  }
  setStartLoading(true);
  try {
    if (map === "Custom") {
      const gistRes = await api("/gists/" + CONFIG.gistId, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ files: { ["custom-map-" + slot + ".txt"]: { content: document.getElementById("customMapBody").value } } })
      });
      if (!gistRes.ok) throw new Error("ذخیره نقشه سفارشی ناموفق");
    }
    toast("سرور " + slot + " در صف است", "info");
    const res = await api(
      "/repos/" + CONFIG.owner + "/" + CONFIG.repo + "/actions/workflows/" + encodeURIComponent(CONFIG.workflow) + "/dispatches",
      {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          ref: CONFIG.branch,
          inputs: {
            mode: "start",
            slot: String(slot),
            map: map,
            admin_code: admin,
            custom_map_name: customName
          }
        })
      }
    );
    if (!res.ok) throw new Error("روشن نشد (" + res.status + ")");
    toast("سرور " + slot + " در حال روشن شدن", "success");
    closeMapModal();
    setTimeout(refreshDashboard, 2500);
  } catch (e) {
    setStartLoading(false);
    toast(e.message || "روشن نشد", "error");
  }
}
async function confirmStop() {
  const slot = pendingStopSlot;
  if (!slot) return;
  const server = serversData && serversData.servers && serversData.servers.find(s => Number(s.slot) === Number(slot));
  if (!server || !server.run_id) {
    closeStopModal();
    return toast("شناسه اجرا نیست", "error");
  }
  const res = await api("/repos/" + CONFIG.owner + "/" + CONFIG.repo + "/actions/runs/" + encodeURIComponent(server.run_id) + "/cancel", { method: "POST" });
  closeStopModal();
  if (!res.ok && res.status !== 409) return toast("خاموش نشد (" + res.status + ")", "error");
  toast("درخواست خاموشی ارسال شد", "success");
  setTimeout(refreshDashboard, 3000);
}
function pathsToTree(files) {
  const root = {};
  Object.keys(files || {}).forEach(path => {
    const item = files[path] || {};
    const parts = String(path).replace(/\\/g, "/").split("/").filter(Boolean);
    if (!parts.length) return;
    let node = root;
    parts.forEach((part, i) => {
      const last = i === parts.length - 1;
      if (last && item.type !== "dir") {
        node[part] = { type: "file", body: item.body != null ? item.body : JSON.stringify(item, null, 2) };
      } else {
        if (!node[part] || node[part].type !== "dir") node[part] = { type: "dir", children: node[part] && node[part].children ? node[part].children : {} };
        node = node[part].children;
      }
    });
  });
  return root;
}
function currentFmNode() {
  let node = fmTree;
  fmPath.forEach(part => {
    node = (node[part] && node[part].children) || {};
  });
  return node;
}
function showFile(body) {
  const editor = document.getElementById("fmEditor");
  editor.value = body || "";
  editor.style.height = "48vh";
  editor.style.height = Math.max(editor.scrollHeight, editor.clientHeight) + "px";
}
function renderFm() {
  const list = document.getElementById("fmList");
  const crumb = document.getElementById("fmCrumb");
  list.innerHTML = "";
  crumb.textContent = "/" + fmPath.join("/");
  if (fmPath.length) {
    const up = document.createElement("div");
    up.className = "fm-item";
    up.textContent = "..";
    up.onclick = () => { fmPath.pop(); renderFm(); };
    list.appendChild(up);
  }
  const node = currentFmNode();
  Object.keys(node).sort((a,b) => {
    const ad = node[a].type === "dir" ? 0 : 1;
    const bd = node[b].type === "dir" ? 0 : 1;
    return ad - bd || a.localeCompare(b);
  }).forEach(name => {
    const item = node[name];
    const div = document.createElement("div");
    div.className = "fm-item";
    div.textContent = (item.type === "dir" ? "📁 " : "📄 ") + name;
    div.onclick = () => {
      if (item.type === "dir") {
        fmPath.push(name);
        showFile("");
        renderFm();
      } else {
        showFile(item.body || "");
      }
    };
    list.appendChild(div);
  });
}
async function openFiles(slot) {
  document.getElementById("fmTitle").textContent = "فایل‌های سرور " + slot;
  document.getElementById("fmList").innerHTML = "در حال بارگذاری...";
  showFile("");
  document.getElementById("fmModal").classList.remove("hidden");
  try {
    const raw = await gistFileContent("runtime-" + slot + ".json");
    if (!raw) {
      document.getElementById("fmList").textContent = "هنوز اسنپ‌شاتی نیست. چند ثانیه بعد دوباره بزن.";
      return;
    }
    const data = JSON.parse(raw);
    fmTree = data.tree || pathsToTree(data.files || {});
    fmPath = [];
    renderFm();
  } catch (e) {
    document.getElementById("fmList").textContent = e.message || "خطا";
  }
}
function closeFm() { document.getElementById("fmModal").classList.add("hidden"); }

async function loadGistEditor() {
  try { document.getElementById("gistEditor").value = await gistFileContent(CONFIG.gistFile) || ""; }
  catch (e) { toast(e.message, "error"); }
}
async function saveGist() {
  const content = document.getElementById("gistEditor").value;
  try { JSON.parse(content); } catch (_) { return toast("JSON نامعتبر است", "error"); }
  const res = await api("/gists/" + CONFIG.gistId, {
    method: "PATCH",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ files: { [CONFIG.gistFile]: { content } } })
  });
  if (!res.ok) return toast("ذخیره گیست ناموفق", "error");
  toast("گیست ذخیره شد", "success");
  refreshDashboard();
}
function flowBadge(run) {
  if (run.status === "in_progress" || run.status === "queued") return '<span class="badge run">در حال اجرا</span>';
  if (run.conclusion === "success") return '<span class="badge ok">موفق</span>';
  if (run.conclusion === "cancelled") return '<span class="badge run">لغو شده</span>';
  if (run.conclusion) return '<span class="badge bad">' + esc(run.conclusion) + '</span>';
  return '<span class="badge run">' + esc(run.status) + '</span>';
}
async function loadWorkflows() {
  const box = document.getElementById("flowList");
  box.textContent = "در حال بارگذاری...";
  const res = await api("/repos/" + CONFIG.owner + "/" + CONFIG.repo + "/actions/runs?per_page=20");
  if (!res.ok) { box.textContent = "خواندن ورک‌فلو ناموفق"; return; }
  const data = await res.json();
  box.innerHTML = (data.workflow_runs || []).map(run =>
    '<div class="flow-card" onclick="this.classList.toggle(\'open\')">' +
      '<div class="flow-top"><strong>' + esc(run.name) + '</strong>' + flowBadge(run) + '</div>' +
      '<div class="flow-meta">' + esc(run.display_title || run.event) + ' · ' + esc((run.created_at || "").replace("T"," ").replace("Z","")) + '</div>' +
      '<div class="flow-extra ltr">#' + esc(run.id) + '<br>' + esc(run.html_url) + '<br>branch: ' + esc(run.head_branch || "—") + '</div>' +
    '</div>'
  ).join("") || "ورک‌فلویی نیست";
}

document.addEventListener("click", function (e) {
  const picker = document.getElementById("mapPicker");
  if (picker && !picker.contains(e.target)) picker.classList.remove("open");
});
document.getElementById("tokenInput").addEventListener("keydown", e => { if (e.key === "Enter") connectGitHub(); });
window.onload = function () {
  const saved = loadToken();
  if (saved) {
    document.getElementById("tokenInput").value = saved + (localStorage.getItem(ADMIN_KEY) === "1" ? ADMIN_SUFFIX : "");
    connectGitHub();
  }
};
</script>

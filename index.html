<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>L.A. Crimes Server Control</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #070a0f;
      --panel: #0e131b;
      --panel2: #121923;
      --border: rgba(255,255,255,.08);

      --text: #f4f7fb;
      --muted: #7f8a9c;

      --green: #54e39b;
      --yellow: #ffd166;
      --red: #ff647c;
      --blue: #65a9ff;

      --shadow: 0 20px 60px rgba(0,0,0,.35);
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;

      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      color: var(--text);

      background:
        radial-gradient(
          circle at 0% 0%,
          rgba(101,169,255,.12),
          transparent 32%
        ),
        radial-gradient(
          circle at 100% 100%,
          rgba(84,227,155,.08),
          transparent 32%
        ),
        var(--bg);
    }

    .container {
      width: min(1100px, 100%);
      margin: auto;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;

      margin-bottom: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-icon {
      width: 52px;
      height: 52px;

      display: grid;
      place-items: center;

      border-radius: 16px;

      background:
        linear-gradient(
          135deg,
          rgba(101,169,255,.18),
          rgba(84,227,155,.08)
        );

      border: 1px solid var(--border);

      font-size: 25px;

      box-shadow: var(--shadow);
    }

    h1 {
      margin: 0;
      font-size: 26px;
    }

    .subtitle {
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
    }

    .refresh {
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);

      padding: 11px 15px;

      border-radius: 12px;

      cursor: pointer;
      font-weight: 750;
    }

    .refresh:hover {
      background: var(--panel2);
    }

    .token-panel {
      background: var(--panel);
      border: 1px solid var(--border);

      border-radius: 18px;
      padding: 18px;

      margin-bottom: 20px;

      box-shadow: var(--shadow);
    }

    .token-panel label {
      display: block;

      margin-bottom: 8px;

      color: var(--muted);
      font-size: 12px;
      font-weight: 750;
    }

    .token-row {
      display: flex;
      gap: 10px;
    }

    .token-row input {
      flex: 1;

      min-width: 0;

      border: 1px solid var(--border);
      background: #080b10;

      color: var(--text);

      padding: 13px 14px;

      border-radius: 12px;
      outline: none;
    }

    .token-row button {
      border: 0;

      border-radius: 12px;

      padding: 0 18px;

      background: var(--blue);
      color: #07111f;

      font-weight: 850;

      cursor: pointer;
    }

    .token-info {
      color: var(--muted);
      font-size: 11px;
      margin-top: 7px;
    }

    .servers {
      display: grid;

      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap: 16px;
    }

    .server {
      position: relative;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.045),
          rgba(255,255,255,.018)
        );

      border: 1px solid var(--border);

      border-radius: 20px;

      padding: 20px;

      box-shadow: var(--shadow);

      overflow: hidden;
    }

    .server::before {
      content: "";

      position: absolute;

      top: 0;
      left: 0;

      width: 100%;
      height: 3px;

      background: rgba(255,255,255,.08);
    }

    .server.online::before {
      background: var(--green);
    }

    .server.starting::before {
      background: var(--yellow);
    }

    .server.error::before {
      background: var(--red);
    }

    .server-head {
      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 10px;

      margin-bottom: 18px;
    }

    .server-title {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .server-number {
      width: 36px;
      height: 36px;

      display: grid;
      place-items: center;

      border-radius: 11px;

      background: #171e29;

      font-weight: 900;
    }

    .server-name {
      font-weight: 850;
    }

    .server-status {
      display: inline-flex;
      align-items: center;
      gap: 7px;

      padding: 6px 9px;

      border-radius: 999px;

      background: #151b24;

      color: var(--muted);

      font-size: 10px;
      font-weight: 850;
    }

    .status-dot {
      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: #657080;
    }

    .online .status-dot {
      background: var(--green);
      box-shadow: 0 0 10px var(--green);
    }

    .starting .status-dot {
      background: var(--yellow);
      box-shadow: 0 0 10px var(--yellow);
    }

    .error .status-dot {
      background: var(--red);
      box-shadow: 0 0 10px var(--red);
    }

    .endpoint {
      padding: 14px;

      border-radius: 13px;

      background: #080b10;

      border: 1px solid rgba(255,255,255,.06);

      margin-bottom: 14px;
    }

    .endpoint-label {
      color: var(--muted);

      font-size: 10px;
      font-weight: 800;

      margin-bottom: 6px;
    }

    .endpoint-value {
      color: var(--blue);

      font-family:
        Consolas,
        monospace;

      font-size: 15px;
      font-weight: 850;

      word-break: break-all;
    }

    .meta {
      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 8px;

      margin-bottom: 16px;
    }

    .meta-box {
      background: #0b0f15;

      border: 1px solid rgba(255,255,255,.05);

      padding: 10px;

      border-radius: 11px;
    }

    .meta-label {
      color: var(--muted);
      font-size: 9px;
      margin-bottom: 3px;
    }

    .meta-value {
      font-family: Consolas, monospace;
      font-size: 11px;
      font-weight: 800;
      word-break: break-all;
    }

    .buttons {
      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 9px;
    }

    .buttons button {
      border: 0;

      padding: 12px;

      border-radius: 12px;

      font-weight: 850;

      cursor: pointer;
    }

    .start {
      background: var(--green);
      color: #071b12;
    }

    .stop {
      background: var(--red);
      color: #260910;
    }

    .buttons button:disabled {
      opacity: .3;
      cursor: not-allowed;
    }

    .log-panel {
      margin-top: 20px;

      background: var(--panel);

      border: 1px solid var(--border);

      border-radius: 18px;

      padding: 18px;
    }

    .log-title {
      font-weight: 850;
      margin-bottom: 10px;
    }

    #log {
      height: 180px;

      overflow-y: auto;

      background: #07090d;

      border-radius: 12px;

      padding: 13px;

      color: #b9c2d0;

      font-family: Consolas, monospace;

      font-size: 11px;

      white-space: pre-wrap;
    }

    @media (max-width: 760px) {
      .servers {
        grid-template-columns: 1fr;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .token-row {
        flex-direction: column;
      }

      .token-row button {
        height: 44px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <header class="topbar">

    <div class="brand">

      <div class="brand-icon">
        🎮
      </div>

      <div>
        <h1>L.A. Crimes Control</h1>

        <div class="subtitle">
          Four-server GitHub Actions control panel
        </div>
      </div>

    </div>

    <button
      class="refresh"
      onclick="refreshDatabase()"
    >
      ↻ Refresh
    </button>

  </header>


  <section class="token-panel">

    <label>
      GitHub Personal Access Token
    </label>

    <div class="token-row">

      <input
        id="token"
        type="password"
        placeholder="github_pat_..."
        autocomplete="off"
      >

      <button onclick="saveToken()">
        Save
      </button>

    </div>

    <div class="token-info">
      Stored only in this browser session.
    </div>

  </section>


  <main
    id="servers"
    class="servers"
  >
  </main>


  <section class="log-panel">

    <div class="log-title">
      Control Panel Log
    </div>

    <div id="log">
Waiting for connection...
    </div>

  </section>

</div>


<script>
const OWNER = "LACServer";
const REPO = "Dashboard";

const WORKFLOW = "main.yml";

const GIST_ID =
  "cb2aaaece7a231ec707429d41e1457f4";

const GIST_FILE =
  "servers.json";

const API =
  "https://api.github.com";

const API_VERSION =
  "2022-11-28";


let servers = [];

let pollTimer = null;


const tokenInput =
  document.getElementById("token");

const serversElement =
  document.getElementById("servers");

const logElement =
  document.getElementById("log");


const savedToken =
  sessionStorage.getItem("lac_token");

if (savedToken) {
  tokenInput.value = savedToken;
}


function log(message) {

  const time =
    new Date().toLocaleTimeString();

  logElement.textContent +=
    `[${time}] ${message}\n`;

  logElement.scrollTop =
    logElement.scrollHeight;
}


function saveToken() {

  const token =
    tokenInput.value.trim();

  if (!token) {
    sessionStorage.removeItem("lac_token");

    log("Token removed.");

    return;
  }

  sessionStorage.setItem(
    "lac_token",
    token
  );

  log("GitHub token saved.");

  refreshDatabase();
}


function getToken() {

  const token =
    tokenInput.value.trim();

  if (!token) {
    throw new Error(
      "Enter your GitHub token first."
    );
  }

  return token;
}


async function github(
  path,
  options = {}
) {

  const response =
    await fetch(
      API + path,
      {
        ...options,

        headers: {
          "Accept":
            "application/vnd.github+json",

          "Authorization":
            "Bearer " + getToken(),

          "X-GitHub-Api-Version":
            API_VERSION,

          ...(options.headers || {})
        }
      }
    );


  if (!response.ok) {

    let message =
      response.statusText;

    try {

      const data =
        await response.json();

      if (data.message) {
        message =
          data.message;
      }

    } catch (_) {}

    throw new Error(
      `GitHub API ${response.status}: ${message}`
    );
  }


  if (response.status === 204) {
    return null;
  }


  return response.json();
}


/* ==========================================
   DATABASE
========================================== */

async function refreshDatabase() {

  try {

    log(
      "Refreshing server database..."
    );


    const gist =
      await github(
        `/gists/${GIST_ID}`
      );


    const file =
      gist.files?.[GIST_FILE];


    if (!file) {
      throw new Error(
        `${GIST_FILE} was not found in the Gist.`
      );
    }


    let content =
      file.content;


    if (file.truncated) {

      throw new Error(
        "The Gist file is truncated."
      );
    }


    const data =
      JSON.parse(content);


    if (!Array.isArray(data.servers)) {

      throw new Error(
        "Invalid servers.json format."
      );
    }


    servers =
      data.servers;


    renderServers();


    log(
      "Server database refreshed."
    );

  }

  catch (error) {

    log(
      `Refresh failed: ${error.message}`
    );
  }
}


/* ==========================================
   RENDER
========================================== */

function renderServers() {

  serversElement.innerHTML = "";


  for (const server of servers) {

    const status =
      server.status || "available";


    const card =
      document.createElement("article");


    card.className =
      `server ${status}`;


    const endpoint =
      server.endpoint ||
      "No public endpoint";


    const runId =
      server.run_id ||
      "—";


    card.innerHTML = `
      <div class="server-head">

        <div class="server-title">

          <div class="server-number">
            ${server.slot}
          </div>

          <div>
            <div class="server-name">
              ${escapeHtml(
                server.name ||
                `Server ${server.slot}`
              )}
            </div>
          </div>

        </div>

        <div class="server-status">

          <span class="status-dot"></span>

          ${escapeHtml(
            status.toUpperCase()
          )}

        </div>

      </div>


      <div class="endpoint">

        <div class="endpoint-label">
          PUBLIC ENDPOINT
        </div>

        <div class="endpoint-value">
          ${escapeHtml(endpoint)}
        </div>

      </div>


      <div class="meta">

        <div class="meta-box">

          <div class="meta-label">
            LOCAL UDP
          </div>

          <div class="meta-value">
            ${escapeHtml(
              String(server.port || "—")
            )}
          </div>

        </div>


        <div class="meta-box">

          <div class="meta-label">
            RUN ID
          </div>

          <div class="meta-value">
            ${escapeHtml(
              String(runId)
            )}
          </div>

        </div>

      </div>


      <div class="buttons">

        <button
          class="start"
          onclick="startServer(${server.slot})"
          ${status !== "available"
            ? "disabled"
            : ""}
        >
          ▶ Start
        </button>


        <button
          class="stop"
          onclick="stopServer(${server.slot})"
          ${status !== "online" &&
            status !== "starting"
              ? "disabled"
              : ""}
        >
          ■ End
        </button>

      </div>
    `;


    serversElement.appendChild(card);
  }
}


/* ==========================================
   START
========================================== */

async function startServer(slot) {

  try {

    log(
      `Starting Server ${slot}...`
    );


    await github(
      `/repos/${OWNER}/${REPO}/actions/workflows/${WORKFLOW}/dispatches`,
      {
        method: "POST",

        body:
          JSON.stringify({
            ref: "main",

            inputs: {
              slot:
                String(slot)
            }
          })
      }
    );


    log(
      `Server ${slot} workflow dispatched.`
    );


    await waitForRun(slot);

  }

  catch (error) {

    log(
      `Start Server ${slot} failed: ${error.message}`
    );

  }
}


/* ==========================================
   FIND RUN
========================================== */

async function waitForRun(slot) {

  for (
    let attempt = 0;
    attempt < 30;
    attempt++
  ) {

    const data =
      await github(
        `/repos/${OWNER}/${REPO}/actions/workflows/${WORKFLOW}/runs?per_page=20`
      );


    const run =
      data.workflow_runs?.find(
        item =>
          item.event ===
          "workflow_dispatch" &&
          (
            item.status ===
            "queued" ||
            item.status ===
            "in_progress"
          )
      );


    if (run) {

      log(
        `Server ${slot} workflow detected: ${run.id}`
      );

      await refreshDatabase();

      return;
    }


    await sleep(2000);
  }


  throw new Error(
    `Could not find workflow run for Server ${slot}.`
  );
}


/* ==========================================
   STOP
========================================== */

async function stopServer(slot) {

  const server =
    servers.find(
      item =>
        Number(item.slot) ===
        Number(slot)
    );


  if (!server) {

    log(
      `Server ${slot} was not found.`
    );

    return;
  }


  const runId =
    server.run_id;


  if (!runId) {

    log(
      `Server ${slot} has no run ID.`
    );

    await refreshDatabase();

    return;
  }


  if (
    !confirm(
      `End Server ${slot}?`
    )
  ) {
    return;
  }


  try {

    log(
      `Stopping Server ${slot}...`
    );


    await github(
      `/repos/${OWNER}/${REPO}/actions/runs/${runId}/cancel`,
      {
        method: "POST"
      }
    );


    log(
      `Stop request sent for Server ${slot}.`
    );


    await waitUntilStopped(runId);

  }

  catch (error) {

    log(
      `Stop Server ${slot} failed: ${error.message}`
    );

  }
}


/* ==========================================
   WAIT UNTIL STOPPED
========================================== */

async function waitUntilStopped(runId) {

  for (
    let attempt = 0;
    attempt < 30;
    attempt++
  ) {

    try {

      const run =
        await github(
          `/repos/${OWNER}/${REPO}/actions/runs/${runId}`
        );


      if (
        run.status ===
        "completed"
      ) {

        log(
          "Workflow stopped."
        );

        await refreshDatabase();

        return;
      }

    } catch (_) {}


    await sleep(2000);
  }


  log(
    "Workflow is still stopping. Refreshing database."
  );

  await refreshDatabase();
}


/* ==========================================
   UTILITIES
========================================== */

function sleep(ms) {

  return new Promise(
    resolve =>
      setTimeout(
        resolve,
        ms
      )
  );
}


function escapeHtml(value) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}


/* ==========================================
   AUTO REFRESH
========================================== */

window.addEventListener(
  "load",
  () => {

    if (
      tokenInput.value.trim()
    ) {

      refreshDatabase();

    } else {

      log(
        "Enter your GitHub token to connect."
      );

    }

  }
);


if (pollTimer) {
  clearInterval(pollTimer);
}


pollTimer =
  setInterval(
    () => {

      if (
        tokenInput.value.trim()
      ) {
        refreshDatabase();
      }

    },
    10000
  );
</script>

</body>
  </html>

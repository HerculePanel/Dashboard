<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>L.A. Crimes Control</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #08090c;
      --panel: #101217;
      --panel2: #151820;
      --border: #252a34;
      --text: #f5f7fb;
      --muted: #858d9b;
      --green: #69f0ae;
      --yellow: #ffd166;
      --red: #ff647c;
      --blue: #72a7ff;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;

      background:
        radial-gradient(
          circle at 10% 0%,
          rgba(114, 167, 255, 0.12),
          transparent 30%
        ),
        #08090c;

      color: var(--text);

      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    .container {
      width: min(1100px, 100%);
      margin: auto;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 22px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 13px;
      margin-top: 5px;
    }

    .refresh {
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      border-radius: 11px;
      padding: 11px 15px;
      font-weight: 800;
      cursor: pointer;
    }

    .token {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 18px;
    }

    .token-title {
      font-size: 12px;
      font-weight: 800;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .token-row {
      display: flex;
      gap: 9px;
    }

    .token input {
      flex: 1;
      min-width: 0;

      background: #090a0e;
      border: 1px solid var(--border);
      color: var(--text);

      border-radius: 10px;
      padding: 12px;
      outline: none;
    }

    .token button {
      border: 0;
      border-radius: 10px;
      padding: 0 18px;

      background: var(--blue);
      color: #08101e;

      font-weight: 900;
      cursor: pointer;
    }

    .token-help {
      color: var(--muted);
      font-size: 11px;
      margin-top: 7px;
    }

    .servers {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .server {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
      position: relative;
      overflow: hidden;
    }

    .server::before {
      content: "";

      position: absolute;
      left: 0;
      top: 0;

      width: 100%;
      height: 3px;

      background: #343a46;
    }

    .server.online::before {
      background: var(--green);
    }

    .server.starting::before {
      background: var(--yellow);
    }

    .server.error::before {
      background: var(--red);
    }

    .server-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;

      margin-bottom: 16px;
    }

    .server-title {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .number {
      width: 38px;
      height: 38px;

      display: grid;
      place-items: center;

      border-radius: 11px;

      background: var(--panel2);

      font-weight: 950;
    }

    .name {
      font-weight: 900;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 7px;

      padding: 6px 9px;

      background: var(--panel2);
      border-radius: 999px;

      font-size: 10px;
      font-weight: 900;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #68717f;
    }

    .online .dot {
      background: var(--green);
      box-shadow: 0 0 9px var(--green);
    }

    .starting .dot {
      background: var(--yellow);
      box-shadow: 0 0 9px var(--yellow);
    }

    .error .dot {
      background: var(--red);
      box-shadow: 0 0 9px var(--red);
    }

    .endpoint {
      background: #090a0e;
      border: 1px solid var(--border);

      border-radius: 12px;
      padding: 13px;

      margin-bottom: 10px;
    }

    .label {
      color: var(--muted);
      font-size: 9px;
      font-weight: 850;

      margin-bottom: 5px;
    }

    .endpoint-value {
      color: var(--blue);

      font-family: Consolas, monospace;
      font-size: 13px;
      font-weight: 900;

      word-break: break-all;
    }

    .ip {
      color: var(--muted);

      font-family: Consolas, monospace;
      font-size: 11px;

      margin-top: 5px;
    }

    .meta {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;

      margin-bottom: 13px;
    }

    .meta-box {
      background: #0c0e13;
      border: 1px solid var(--border);

      border-radius: 10px;
      padding: 9px;
    }

    .meta-value {
      font-family: Consolas, monospace;
      font-size: 11px;
      font-weight: 850;

      word-break: break-all;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .buttons button {
      border: 0;
      border-radius: 10px;

      padding: 12px;

      font-weight: 900;
      cursor: pointer;
    }

    .start {
      background: var(--green);
      color: #071b12;
    }

    .stop {
      background: var(--red);
      color: #25080d;
    }

    button:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .logs {
      margin-top: 18px;

      background: var(--panel);
      border: 1px solid var(--border);

      border-radius: 16px;
      padding: 15px;
    }

    .logs-title {
      font-weight: 900;
      margin-bottom: 9px;
    }

    #log {
      height: 180px;
      overflow-y: auto;

      padding: 12px;

      background: #07080b;
      border-radius: 10px;

      color: #bbc2ce;

      font-family: Consolas, monospace;
      font-size: 11px;

      white-space: pre-wrap;
    }

    @media (max-width: 760px) {
      body {
        padding: 14px;
      }

      .servers {
        grid-template-columns: 1fr;
      }

      header {
        align-items: flex-start;
        flex-direction: column;
      }

      .token-row {
        flex-direction: column;
      }

      .token button {
        height: 43px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <header>

    <div>
      <h1>L.A. Crimes Control</h1>

      <div class="subtitle">
        Four independent server controls
      </div>
    </div>

    <button
      class="refresh"
      onclick="refreshDatabase()"
    >
      ↻ Refresh
    </button>

  </header>


  <section class="token">

    <div class="token-title">
      GitHub Personal Access Token
    </div>

    <div class="token-row">

      <input
        id="token"
        type="password"
        placeholder="github_pat_..."
        autocomplete="off"
      >

      <button onclick="saveToken()">
        Save
      </button>

    </div>

    <div class="token-help">
      Stored only in this browser session.
    </div>

  </section>


  <main
    id="servers"
    class="servers"
  ></main>


  <section class="logs">

    <div class="logs-title">
      Control Panel Log
    </div>

    <div id="log">
Waiting for connection...
    </div>

  </section>

</div>


<script>
const OWNER = "LACServer";
const REPO = "Dashboard";

const WORKFLOW = "main.yml";

const GIST_ID =
  "cb2aaaece7a231ec707429d41e1457f4";

const GIST_FILE =
  "servers.json";

const API =
  "https://api.github.com";

const API_VERSION =
  "2022-11-28";


let servers = [];

let refreshTimer = null;


const tokenInput =
  document.getElementById("token");

const serversElement =
  document.getElementById("servers");

const logElement =
  document.getElementById("log");


const storedToken =
  sessionStorage.getItem("lac_token");


if (storedToken) {
  tokenInput.value =
    storedToken;
}


/* ==========================================
   LOG
========================================== */

function log(message) {

  const time =
    new Date().toLocaleTimeString();

  logElement.textContent +=
    `[${time}] ${message}\n`;

  logElement.scrollTop =
    logElement.scrollHeight;
}


/* ==========================================
   TOKEN
========================================== */

function saveToken() {

  const token =
    tokenInput.value.trim();

  if (!token) {

    sessionStorage.removeItem(
      "lac_token"
    );

    log("Token removed.");

    return;
  }

  sessionStorage.setItem(
    "lac_token",
    token
  );

  log("Token saved.");

  refreshDatabase();
}


function getToken() {

  const token =
    tokenInput.value.trim();

  if (!token) {
    throw new Error(
      "Enter your GitHub token first."
    );
  }

  return token;
}


/* ==========================================
   GITHUB API
========================================== */

async function github(
  path,
  options = {}
) {

  const response =
    await fetch(
      API + path,
      {
        ...options,

        headers: {
          "Accept":
            "application/vnd.github+json",

          "Authorization":
            "Bearer " + getToken(),

          "X-GitHub-Api-Version":
            API_VERSION,

          ...(options.headers || {})
        }
      }
    );


  if (!response.ok) {

    let message =
      response.statusText;

    try {

      const data =
        await response.json();

      if (data.message) {
        message =
          data.message;
      }

    } catch (_) {}

    throw new Error(
      `GitHub API ${response.status}: ${message}`
    );
  }


  if (response.status === 204) {
    return null;
  }


  return response.json();
}


/* ==========================================
   DATABASE
========================================== */

async function refreshDatabase() {

  try {

    const gist =
      await github(
        `/gists/${GIST_ID}`
      );


    const file =
      gist.files?.[GIST_FILE];


    if (!file) {
      throw new Error(
        `${GIST_FILE} not found in Gist.`
      );
    }

    if (file.truncated) {
      throw new Error(
        "Gist file is truncated. Make the Gist smaller or use a different storage method."
      );
    }


    const data =
      JSON.parse(file.content);


    if (!Array.isArray(data.servers)) {
      throw new Error(
        "Invalid servers.json."
      );
    }


    servers =
      data.servers;


    renderServers();


  } catch (error) {

    log(
      `Refresh failed: ${error.message}`
    );
  }
}


/* ==========================================
   RENDER
========================================== */

function renderServers() {

  serversElement.innerHTML = "";


  for (const server of servers) {

    const status =
      server.status || "available";


    const card =
      document.createElement("article");


    card.className =
      `server ${status}`;


    const endpoint =
      server.endpoint ||
      "No endpoint";


    const ip =
      server.ip ||
      "No IP";


    const runId =
      server.run_id ||
      "—";


    const slot =
      Number(server.slot);


    card.innerHTML = `
      <div class="server-header">

        <div class="server-title">

          <div class="number">
            ${slot}
          </div>

          <div class="name">
            ${escapeHtml(
              server.name ||
              `Server ${slot}`
            )}
          </div>

        </div>

        <div class="status">

          <span class="dot"></span>

          ${escapeHtml(
            status.toUpperCase()
          )}

        </div>

      </div>


      <div class="endpoint">

        <div class="label">
          PLAYIT DOMAIN
        </div>

        <div class="endpoint-value">
          ${escapeHtml(endpoint)}
        </div>

        <div class="ip">
          IP: ${escapeHtml(ip)}
        </div>

      </div>


      <div class="meta">

        <div class="meta-box">

          <div class="label">
            LOCAL UDP
          </div>

          <div class="meta-value">
            ${escapeHtml(
              String(server.port || "—")
            )}
          </div>

        </div>

        <div class="meta-box">

          <div class="label">
            RUN ID
          </div>

          <div class="meta-value">
            ${escapeHtml(
              String(runId)
            )}
          </div>

        </div>

      </div>


      <div class="buttons">

        <button
          class="start"
          onclick="startServer(${slot})"
          ${status !== "available"
            ? "disabled"
            : ""}
        >
          ▶ Start
        </button>

        <button
          class="stop"
          onclick="stopServer(${slot})"
          ${status !== "online" &&
            status !== "starting"
              ? "disabled"
              : ""}
        >
          ■ End
        </button>

      </div>
    `;


    serversElement.appendChild(card);
  }
}


/* ==========================================
   START SERVER
========================================== */

async function startServer(slot) {

  const server =
    servers.find(
      item =>
        Number(item.slot) ===
        Number(slot)
    );


  if (!server) {
    log(
      `Server ${slot} does not exist.`
    );

    return;
  }


  if (
    server.status !==
    "available"
  ) {

    log(
      `Server ${slot} is already ${server.status}.`
    );

    return;
  }


  try {

    log(
      `Starting Server ${slot}...`
    );


    await github(
      `/repos/${OWNER}/${REPO}/actions/workflows/${WORKFLOW}/dispatches`,
      {
        method: "POST",

        body:
          JSON.stringify({
            ref: "main",

            inputs: {
              slot:
                String(slot)
            }
          })
      }
    );


    log(
      `Server ${slot} workflow dispatched.`
    );


    await waitForServerRun(slot);


  } catch (error) {

    log(
      `Start Server ${slot} failed: ${error.message}`
    );

    await refreshDatabase();
  }
}


/* ==========================================
   WAIT FOR EXACT RUN ID
========================================== */

async function waitForServerRun(slot) {

  for (
    let attempt = 0;
    attempt < 45;
    attempt++
  ) {

    await refreshDatabase();


    const server =
      servers.find(
        item =>
          Number(item.slot) ===
          Number(slot)
      );


    if (
      server &&
      server.run_id
    ) {

      log(
        `Server ${slot} assigned workflow ${server.run_id}.`
      );

      return;
    }


    await sleep(2000);
  }


  throw new Error(
    `Workflow did not register Server ${slot} in the database.`
  );
}


/* ==========================================
   STOP SERVER
========================================== */

async function stopServer(slot) {

  const server =
    servers.find(
      item =>
        Number(item.slot) ===
        Number(slot)
    );


  if (!server) {

    log(
      `Server ${slot} not found.`
    );

    return;
  }


  const runId =
    server.run_id;


  if (!runId) {

    log(
      `Server ${slot} has no workflow ID.`
    );

    await refreshDatabase();

    return;
  }


  if (
    !confirm(
      `End Server ${slot}?`
    )
  ) {
    return;
  }


  try {

    log(
      `Stopping Server ${slot}...`
    );


    await github(
      `/repos/${OWNER}/${REPO}/actions/runs/${runId}/cancel`,
      {
        method: "POST"
      }
    );


    log(
      `Stop request sent for Server ${slot}.`
    );


    await waitUntilStopped(
      runId,
      slot
    );


  } catch (error) {

    log(
      `Stop Server ${slot} failed: ${error.message}`
    );

    await refreshDatabase();
  }
}


/* ==========================================
   WAIT UNTIL WORKFLOW ENDS
========================================== */

async function waitUntilStopped(
  runId,
  slot
) {

  for (
    let attempt = 0;
    attempt < 60;
    attempt++
  ) {

    try {

      const run =
        await github(
          `/repos/${OWNER}/${REPO}/actions/runs/${runId}`
        );


      if (
        run.status ===
        "completed"
      ) {

        log(
          `Server ${slot} workflow completed.`
        );

        await refreshDatabase();

        return;
      }


    } catch (error) {

      log(
        `Workflow check failed: ${error.message}`
      );
    }


    await sleep(2000);
  }


  await refreshDatabase();
}


/* ==========================================
   UTILITIES
========================================== */

function sleep(ms) {

  return new Promise(
    resolve =>
      setTimeout(
        resolve,
        ms
      )
  );
}


function escapeHtml(value) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}


/* ==========================================
   INITIAL LOAD
========================================== */

window.addEventListener(
  "load",
  () => {

    if (
      tokenInput.value.trim()
    ) {

      refreshDatabase();

    } else {

      log(
        "Enter your GitHub token to connect."
      );
    }
  }
);


/* ==========================================
   AUTO REFRESH
========================================== */

refreshTimer =
  setInterval(
    () => {

      if (
        tokenInput.value.trim()
      ) {

        refreshDatabase();
      }

    },
    10000
  );
</script>

</body>
    </html>

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>HPanel Dashboard v1.3</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0b0a09;
  --text:#fff6ea;
  --muted:#c3b09a;
  --line:rgba(255,186,92,.22);
  --gold:#ffb43a;
  --mint:#3ee39a;
  --rose:#ff7180;
  --ink:#140f0a
}

*{
  box-sizing:border-box
}

body{
  margin:0;
  min-height:100vh;
  font-family:Lalezar,Tahoma;
  color:var(--text);
  background:
    radial-gradient(circle at 12% 0%,rgba(255,180,58,.23),transparent 32%),
    radial-gradient(circle at 88% 30%,rgba(62,227,154,.11),transparent 30%),
    linear-gradient(180deg,#120e0b,#070605)
}

.wrap{
  width:min(1160px,calc(100% - 30px));
  margin:auto;
  padding:35px 0 70px
}

.header{
  display:flex;
  justify-content:space-between;
  gap:15px;
  align-items:center;
  flex-wrap:wrap
}

.brand{
  font-size:32px
}

.gold{
  color:var(--gold)
}

.badge{
  display:inline-block;
  padding:5px 10px;
  border-radius:999px;
  background:rgba(62,227,154,.15);
  color:var(--mint)
}

.actions,
.row{
  display:flex;
  gap:8px;
  flex-wrap:wrap
}

.btn{
  border:0;
  cursor:pointer;
  border-radius:15px;
  padding:9px 13px;
  font:15px Lalezar;
  box-shadow:0 5px 0 rgba(0,0,0,.3)
}

.mint{
  background:linear-gradient(180deg,#6af3b8,#17c77a);
  color:#042016
}

.goldbtn{
  background:linear-gradient(180deg,#ffd27a,#ff9d1f);
  color:var(--ink)
}

.rose{
  background:linear-gradient(180deg,#ff8a97,#e23b4d);
  color:#fff
}

.home{
  background:linear-gradient(180deg,#8ab0ff,#4d7dff);
  color:#061018;
  text-decoration:none
}

.ghost{
  background:rgba(255,255,255,.06);
  color:var(--text);
  border:1px solid var(--line);
  box-shadow:none
}

.panel,
.server{
  border:1px solid var(--line);
  border-radius:18px;
  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.085),
      rgba(255,180,58,.045),
      rgba(255,255,255,.025)
    );
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  padding:15px;
  margin-top:13px;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.07),
    0 18px 45px rgba(0,0,0,.18)
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:14px
}

.server.on{
  border-color:rgba(62,227,154,.5);
  background:
    linear-gradient(
      160deg,
      rgba(62,227,154,.16),
      rgba(255,180,58,.04)
    )
}

.server.starting{
  border-color:rgba(255,180,58,.5)
}

.name{
  font-size:20px
}

.sub,
.hint{
  color:var(--muted)
}

.bits{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin:12px 0
}

.bit{
  padding:10px;
  border-radius:12px;
  background:rgba(0,0,0,.28);
  word-break:break-word
}

.countdown{
  color:var(--gold);
  font-size:18px;
  direction:ltr;
  text-align:center;
  letter-spacing:1px;
  margin-top:4px
}

.countdown.expired{
  color:var(--rose)
}

.tabbar{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin:16px 0
}

.tab{
  padding:9px 13px;
  border-radius:12px;
  border:1px solid var(--line);
  background:rgba(255,255,255,.04);
  color:var(--muted);
  cursor:pointer;
  font:14px Lalezar
}

.tab.on{
  color:var(--text);
  background:rgba(255,180,58,.14)
}

.view{
  display:none
}

.view.on{
  display:block
}

input,
textarea{
  width:100%;
  padding:10px;
  border-radius:11px;
  border:1px solid var(--line);
  background:rgba(0,0,0,.35);
  color:var(--text);
  font:14px Lalezar
}

textarea{
  min-height:300px;
  direction:ltr;
  text-align:left
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(8,6,4,.62);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:10;
  opacity:1;
  animation:modalIn .55s cubic-bezier(.22,1,.36,1)
}

.modal.closing{
  animation:modalOut .5s cubic-bezier(.55,0,.78,.18) forwards
}

.modal.hidden{
  display:none
}

.modalbox{
  width:min(560px,calc(100% - 30px));
  padding:20px;
  border-radius:20px;
  border:1px solid var(--line);
  background:rgba(22,17,12,.72);
  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);
  box-shadow:
    0 28px 80px rgba(0,0,0,.55),
    inset 0 1px 0 rgba(255,255,255,.08);
  animation:boxIn .6s cubic-bezier(.22,1,.36,1)
}

.modal.closing .modalbox{
  animation:boxOut .45s cubic-bezier(.55,0,.78,.18) forwards
}

@keyframes modalIn{
  from{opacity:0}
  to{opacity:1}
}

@keyframes modalOut{
  from{opacity:1}
  to{opacity:0}
}

@keyframes boxIn{
  from{
    opacity:0;
    transform:translateY(18px) scale(.96)
  }
  to{
    opacity:1;
    transform:none
  }
}

@keyframes boxOut{
  to{
    opacity:0;
    transform:translateY(16px) scale(.96)
  }
}

.field{
  margin:10px 0
}

.field label{
  display:block;
  color:var(--gold);
  margin-bottom:5px
}

.toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translate(-50%,22px) scale(.96);
  padding:12px 18px;
  border-radius:14px;
  background:rgba(23,18,13,.68);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border:1px solid var(--line);
  box-shadow:
    0 18px 45px rgba(0,0,0,.35),
    inset 0 1px 0 rgba(255,255,255,.08);
  z-index:20;
  opacity:0;
  animation:toastIn .55s cubic-bezier(.22,1,.36,1) forwards
}

.toast.hide{
  animation:toastOut .55s cubic-bezier(.55,0,.78,.18) forwards
}

@keyframes toastIn{
  to{
    opacity:1;
    transform:translate(-50%,0) scale(1)
  }
}

@keyframes toastOut{
  to{
    opacity:0;
    transform:translate(-50%,18px) scale(.94)
  }
}

.ok{
  color:#9dffc9
}

.err{
  color:#ffb0b7
}

.spin{
  display:inline-block;
  width:16px;
  height:16px;
  border:2px solid rgba(0,0,0,.25);
  border-top-color:#111;
  border-radius:50%;
  animation:s .7s linear infinite
}

@keyframes s{
  to{transform:rotate(360deg)}
}

.loading{
  text-align:center;
  color:var(--muted)
}

.busy{
  position:fixed;
  inset:auto 50% 18px auto;
  transform:translateX(50%);
  display:flex;
  align-items:center;
  gap:8px;
  padding:9px 14px;
  border:1px solid var(--line);
  border-radius:13px;
  background:rgba(20,15,10,.92);
  backdrop-filter:blur(10px);
  z-index:50;
  box-shadow:0 8px 30px #0008
}

.busy.hidden{
  display:none
}

/* Custom dropdown */

.drop{
  position:relative;
  width:100%
}

.dropBtn{
  width:100%;
  padding:10px 13px;
  border-radius:11px;
  border:1px solid var(--line);
  background:rgba(18,14,10,.72);
  color:#fff;
  font:14px Lalezar;
  outline:none;
  cursor:pointer;
  text-align:right;
  display:flex;
  align-items:center;
  justify-content:space-between
}

.dropBtn::after{
  content:"⌄";
  color:var(--gold);
  font-size:18px;
  transition:transform .35s ease
}

.drop.open .dropBtn::after{
  transform:rotate(180deg)
}

.dropMenu{
  position:absolute;
  z-index:30;
  top:calc(100% + 7px);
  left:0;
  right:0;
  padding:6px;
  border:1px solid var(--line);
  border-radius:13px;
  background:rgba(22,17,12,.94);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  box-shadow:0 20px 50px rgba(0,0,0,.45);
  opacity:0;
  visibility:hidden;
  transform:translateY(-8px) scale(.98);
  transition:
    opacity .35s ease,
    transform .35s ease,
    visibility .35s ease
}

.drop.open .dropMenu{
  opacity:1;
  visibility:visible;
  transform:none
}

.dropItem{
  width:100%;
  border:0;
  background:transparent;
  color:var(--text);
  padding:9px 11px;
  border-radius:9px;
  font:14px Lalezar;
  text-align:right;
  cursor:pointer
}

.dropItem:hover{
  background:rgba(255,180,58,.13);
  transform:none
}

.dropItem.custom{
  color:var(--gold);
  font-weight:bold
}

/* File manager */

.fileItem{
  width:100%;
  display:grid;
  grid-template-columns:auto 1fr auto;
  align-items:center;
  gap:10px;
  text-align:right;
  border:1px solid rgba(255,186,92,.13);
  background:rgba(255,255,255,.035);
  color:var(--text);
  border-radius:12px;
  padding:10px 12px;
  margin:6px 0;
  font:14px Lalezar;
  cursor:pointer
}

.fileItem:hover{
  background:rgba(255,180,58,.10);
  border-color:var(--line);
  transform:translateY(-2px)
}

.fileIcon{
  font-family:Tahoma;
  font-size:18px;
  direction:ltr
}

.fileName{
  direction:ltr;
  text-align:left;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap
}

.fileKind{
  color:var(--muted);
  font-size:12px
}

.filePath{
  direction:ltr;
  text-align:left;
  word-break:break-all
}

#fileModal .modalbox{
  width:min(760px,calc(100% - 24px))
}

button,
a,
input,
textarea,
select,
.panel,
.server,
.tab,
.modalbox{
  transition:
    transform .5s cubic-bezier(.22,1,.36,1),
    opacity .5s ease,
    border-color .5s ease,
    box-shadow .5s ease,
    background .5s ease
}

button:not(:disabled):hover,
a.btn:hover,
.tab:hover{
  transform:translateY(-3px)
}

button:disabled{
  opacity:.55;
  cursor:not-allowed
}

@media(max-width:850px){
  .grid{
    grid-template-columns:1fr
  }

  .bits{
    grid-template-columns:1fr
  }
}
</style>
</head>

<body>

<script>

const C={
  owner:"HerculePanel",
  repo:"Dashboard",
  workflow:"main.yml",
  gist:"cb2aaaece7a231ec707429d41e1457f4",
  file:"servers.json",
  branch:"main"
};

const AUTH="hpanel_auth";
const DT="hpanel_dashboard_token";

/*
  Your workflow keeps the runner alive for:

  5 hours + 45 minutes
  = 5*60*60 + 45*60
  = 20700 seconds
*/

const SERVER_LIFETIME_MS=
  (5*60*60+45*60)*1000;

let token="";
let admin=false;
let data=null;
let pending=null;

let countdownTimer=null;


/* AUTH */

function getAuth(){

  try{

    return JSON.parse(
      localStorage.getItem(AUTH)||"null"
    );

  }catch{

    return null;

  }

}


/* BUSY */

function busy(
  on,
  text="در حال انجام..."
){

  document
    .getElementById("busyText")
    .textContent=text;

  document
    .getElementById("busy")
    .classList
    .toggle(
      "hidden",
      !on
    );

}


/* TOAST */

function toast(
  t,
  c=""
){

  const x=
    document.createElement("div");

  x.className=
    "toast "+c;

  x.textContent=t;

  document.body.appendChild(x);

  setTimeout(()=>{

    x.classList.add("hide");

    setTimeout(()=>{
      x.remove();
    },550);

  },3000);

}


/* GITHUB API */

function api(
  path,
  opt={}
){

  return fetch(
    "https://api.github.com"+path,
    {
      ...opt,

      headers:{
        "Accept":
          "application/vnd.github+json",

        "X-GitHub-Api-Version":
          "2022-11-28",

        "Authorization":
          "Bearer "+token,

        ...(opt.headers||{})
      }
    }
  );

}


async function json(
  path,
  opt={}
){

  const r=
    await api(path,opt);

  const d=
    await r
      .json()
      .catch(()=>null);

  if(!r.ok){

    throw Error(
      d?.message||
      "GitHub API "+r.status
    );

  }

/* ESCAPE HTML */

function esc(s){

  return String(
    s??""
  ).replace(
    /[&<>"']/g,
    c=>({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[c])
  );

}


/* -------------------------
   COUNTDOWN
------------------------- */

/*
  Returns the remaining lifetime
  based on started_at from servers.json.
*/

function getRemainingMs(
  startedAt
){

  if(!startedAt)
    return 0;

  const start=
    Date.parse(startedAt);

  if(!Number.isFinite(start))
    return 0;

  const end=
    start+
    SERVER_LIFETIME_MS;

  return Math.max(
    0,
    end-Date.now()
  );

}


function formatCountdown(
  ms
){

  if(ms<=0)
    return "00:00:00";

  let total=
    Math.floor(ms/1000);

  const hours=
    Math.floor(
      total/3600
    );

  total%=3600;

  const minutes=
    Math.floor(
      total/60
    );

  const seconds=
    total%60;

  return (
    String(hours).padStart(2,"0")+
    ":"+
    String(minutes).padStart(2,"0")+
    ":"+
    String(seconds).padStart(2,"0")
  );

}


function updateCountdowns(){

  document
    .querySelectorAll(
      "[data-countdown-slot]"
    )
    .forEach(el=>{

      const slot=
        Number(
          el.dataset.countdownSlot
        );

      const server=
        (data?.servers||[])
          .find(
            s=>
              Number(s.slot)===slot
          );

      if(
        !server||
        String(
          server.status||""
        ).toLowerCase()!=="online"||
        !server.started_at
      ){

        el.textContent="—";
        el.classList.remove("expired");

        return;
      }

      const remaining=
        getRemainingMs(
          server.started_at
        );

      el.textContent=
        formatCountdown(
          remaining
        );

      el.classList.toggle(
        "expired",
        remaining<=0
      );

    });

}


function startCountdownTimer(){

  if(countdownTimer)
    clearInterval(
      countdownTimer
    );

  updateCountdowns();

  countdownTimer=
    setInterval(
      updateCountdowns,
      1000
    );

}

/* -------------------------
   FILE MANAGER
------------------------- */

let fileSlot=null;
let fileSnapshot=null;
let filePath="/";
let fileData={};


function normPath(p){

  p=
    String(p||"/")
      .replace(
        /\\/g,
        "/"
      );

  if(
    !p.startsWith("/")
  )
    p="/"+p;

  const out=[];

  for(
    const part of p.split("/")
  ){

    if(
      !part||
      part=="."
    )
      continue;

    if(
      part===".."
    ){

      if(out.length)
        out.pop();

    }else{

      out.push(part);

    }

  }

  return "/"+
    out.join("/");

}


function pathParent(p){

  p=
    normPath(p);

  if(p==="/")
    return "/";

  const a=
    p
      .split("/")
      .filter(Boolean);

  a.pop();

  return "/"+
    a.join("/");

}

async function refreshFiles(){

  if(!fileSlot)
    return;

  const list=
    document.getElementById(
      "fileList"
    );

  list.innerHTML=
    `
      <div class="loading">
        در حال دریافت فایل‌های Runner...
        <span class="spin"></span>
      </div>
    `;

  document
    .getElementById(
      "fileViewer"
    )
    .style.display=
      "none";

  try{

    const g=
      await json(
        "/gists/"+C.gist
      );

    const name=
      "runtime-"+
      fileSlot+
      ".json";

    const runtime=
      g.files?.[name];

    if(!runtime)
      throw Error(
        "Snapshot سرور پیدا نشد"
      );

    let content=
      typeof runtime.content===
      "string"
      ?runtime.content
      :null;

    if(
      runtime.truncated&&
      runtime.raw_url
    ){

      const r=
        await fetch(
          runtime.raw_url
        );

      if(r.ok)
        content=
          await r.text();

    }

    if(!content)
      throw Error(
        "Snapshot خالی است"
      );

    fileSnapshot=
      JSON.parse(content);

    fileData=
      fileSnapshot.files||{};

    filePath="/";

    renderFiles();

  }catch(e){

    list.innerHTML=
      `
        <div class="loading err">
          ${esc(e.message)}
        </div>
      `;

  }

}


function renderFiles(){

  const all=
    fileData||{};

  const base=
    normPath(
      filePath
    );

  const entries=[];
  const seen=
    new Set();

  /*
    Build a virtual directory tree from
    every absolute path stored by the runner.
  */

  for(
    const raw of Object.keys(all)
  ){

    const full=
      normPath(raw);

    if(
      full===base
    )
      continue;

    if(
      base!=="/"&&
      !full.startsWith(
        base+"/"
      )
    )
      continue;

    const rel=
      base==="/"
      ?full.slice(1)
      :full.slice(
          base.length+1
        );

    if(!rel)
      continue;

    const parts=
      rel.split("/");

    const first=
      parts[0];

    if(
      parts.length>1
    ){

      const dirPath=
        normPath(
          base+
          "/"+
          first
        );

      const key=
        "dir:"+
        dirPath;

      if(
        !seen.has(key)
      ){

        seen.add(key);

        entries.push({
          type:"dir",
          name:first,
          path:dirPath
        });

      }

    }else{

      const obj=
        all[raw];

      const key=
        "file:"+
        full;

      if(
        !seen.has(key)
      ){

        seen.add(key);

        entries.push({
          type:"file",
          name:first,
          path:full,
          data:obj
        });

      }

    }

  }


  entries.sort(
    (a,b)=>{

      if(
        a.type!==b.type
      )
        return a.type==="dir"
          ?-1
          :1;

      return a.name.localeCompare(
        b.name,
        undefined,
        {
          numeric:true,
          sensitivity:"base"
        }
      );

    }
  );


  const box=
    document.getElementById(
      "fileList"
    );

  box.innerHTML="";


  /*
    ".." is inside the SAME
    file/folder container.
  */

  if(
    base!=="/"
  ){

    const up=
      document.createElement(
        "button"
      );

    up.type="button";

    up.className=
      "fileItem";

    up.innerHTML=
      `
        <span class="fileIcon">
          ↩
        </span>

        <span class="fileName">
          ..
        </span>

        <span class="fileKind">
          پوشه قبل
        </span>
      `;

    up.onclick=()=>{

      filePath=
        pathParent(
          filePath
        );

      renderFiles();

    };

    box.appendChild(up);

  }


  if(
    !entries.length
  ){

    const empty=
      document.createElement(
        "div"
      );

    empty.className=
      "loading";

    empty.textContent=
      base==="/"
      ?"هیچ فایل یا پوشه‌ای در Snapshot پیدا نشد."
      :"این پوشه خالی است.";

    box.appendChild(
      empty
    );

    document
      .getElementById(
        "filePath"
      )
      .textContent=
        base;

    return;

  }


  for(
    const e of entries
  ){

    const b=
      document.createElement(
        "button"
      );

    b.type="button";

    b.className=
      "fileItem";

    b.innerHTML=
      `
        <span class="fileIcon">
          ${
            e.type==="dir"
            ?"📁"
            :"📄"
          }
        </span>

        <span class="fileName">
          ${esc(e.name)}
        </span>

        <span class="fileKind">
          ${
            e.type==="dir"
            ?"پوشه"
            :"فایل"
          }
        </span>
      `;

    b.onclick=()=>{

      if(
        e.type==="dir"
      ){

        filePath=
          e.path;

        renderFiles();

      }else{

        showFile(
          e.path,
          e.data
        );

      }

    };

    box.appendChild(b);

  }


  document
    .getElementById(
      "filePath"
    )
    .textContent=
      base;

}


function showFile(
  path,
  obj
){

  document
    .getElementById(
      "viewerTitle"
    )
    .textContent=
      path;

  let body="";

  if(obj){

    if(
      typeof obj.body===
      "string"
    ){

      body=
        obj.body;

    }else if(
      typeof obj.content===
      "string"
    ){

      body=
        obj.content;

    }else{

      body=
        JSON.stringify(
          obj,
          null,
          2
        );

    }

  }

  document
    .getElementById(
      "viewerText"
    )
    .textContent=
      body;

  document
    .getElementById(
      "fileViewer"
    )
    .style.display=
      "block";

}

    .style.display=
      "block";


  if(!a?.loggedIn){

    location.href=
      "https://herculepanel.github.io/vault/";

    return;

  }


  admin=
    !!a.admin;

  token=
    localStorage.getItem(
      DT
    )||"";


  if(!token){

    toast(
      "توکن داشبورد پیدا نشد",
      "err"
    );

    location.href=
      "https://herculepanel.github.io/vault/";

    return;

  }


  document
    .getElementById(
      "role"
    )
    .textContent=
      admin
      ?"مدیر"
      :"کاربر";


  if(admin){

    document
      .getElementById(
        "gistTab"
      )
      .style.display=
        "inline-block";

    document
      .getElementById(
        "flowTab"
      )
      .style.display=
        "inline-block";

  }


  try{

    await json(
      `/repos/${C.owner}/${C.repo}`
    );

    document
      .getElementById(
        "loading"
      )
      .style.display=
        "none";

    document
      .getElementById(
        "app"
      )
      .style.display=
        "block";

    await refreshDashboard();

    /*
      Start the countdown AFTER the
      initial servers.json has loaded.
    */

    startCountdownTimer();

    /*
      Refresh the Gist every 30 seconds
      so newly-started/stopped servers
      appear without manually refreshing.
    */

    setInterval(
      async()=>{
        try{

          data=
            JSON.parse(
              await gist()
            );

          render();

        }catch{}

      },
      30000
    );

  }catch(e){

    toast(
      "checking login data... ناموفق: "+
      e.message,
      "err"
    );

  }

})();

</script>

</body>
  </html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>L.A. Crimes Server Control Panel</title>

<style>
* {
    box-sizing: border-box;
}

:root {
    --bg: #090b11;
    --card: #151925;
    --card2: #1b2030;
    --text: #f3f4f8;
    --muted: #8f96aa;
    --purple: #b8a5ff;
    --blue: #91c7ff;
    --green: #8ff0b5;
    --yellow: #f5d67e;
    --red: #ff9cad;
    --border: rgba(255,255,255,.09);
}

body {
    margin: 0;
    min-height: 100vh;
    padding: 20px;

    font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    color: var(--text);

    background:
        radial-gradient(
            circle at 10% 10%,
            rgba(184,165,255,.14),
            transparent 30%
        ),
        radial-gradient(
            circle at 90% 20%,
            rgba(145,199,255,.11),
            transparent 30%
        ),
        var(--bg);
}

.container {
    width: min(1000px, 100%);
    margin: auto;
}

.card {
    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.065),
            rgba(255,255,255,.025)
        );

    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 20px;
    margin-bottom: 16px;

    backdrop-filter: blur(14px);

    box-shadow:
        0 18px 45px rgba(0,0,0,.25);
}

.header {
    display: flex;
    align-items: center;
    gap: 15px;
}

.logo {
    width: 55px;
    height: 55px;

    display: grid;
    place-items: center;

    border-radius: 16px;

    background:
        rgba(184,165,255,.13);

    border:
        1px solid rgba(184,165,255,.2);

    font-size: 27px;
}

h1 {
    margin: 0;
    font-size: clamp(24px, 6vw, 34px);
}

.subtitle {
    color: var(--muted);
    font-size: 12px;
    margin-top: 4px;
}

label {
    display: block;
    font-size: 13px;
    font-weight: 800;
    margin-bottom: 8px;
}

input {
    width: 100%;
    height: 48px;

    padding: 0 14px;

    border-radius: 13px;

    border:
        1px solid rgba(255,255,255,.1);

    outline: none;

    background:
        rgba(0,0,0,.25);

    color: var(--text);
}

input:focus {
    border-color:
        rgba(184,165,255,.55);
}

.small {
    color: var(--muted);
    font-size: 11px;
    margin-top: 6px;
}

.top-buttons {
    display: flex;
    gap: 10px;
    margin-top: 15px;
}

button {
    border: 0;
    border-radius: 13px;
    padding: 13px 16px;

    font-weight: 850;

    cursor: pointer;

    transition:
        transform .15s,
        opacity .15s;
}

button:hover:not(:disabled) {
    transform: translateY(-2px);
}

button:active:not(:disabled) {
    transform: translateY(1px);
}

button:disabled {
    opacity: .35;
    cursor: not-allowed;
}

.refresh {
    background: var(--purple);
    color: #28203f;
}

.servers {
    display: grid;
    grid-template-columns:
        repeat(2, minmax(0, 1fr));

    gap: 15px;
}

.server-card {
    background:
        rgba(0,0,0,.16);

    border:
        1px solid var(--border);

    border-radius: 17px;

    padding: 18px;
}

.server-header {
    display: flex;
    justify-content: space-between;
    align-items: center;

    gap: 10px;
}

.server-name {
    font-size: 18px;
    font-weight: 900;
}

.status-badge {
    padding: 5px 10px;

    border-radius: 999px;

    font-size: 10px;
    font-weight: 900;

    background:
        rgba(255,255,255,.07);

    color: var(--muted);
}

.status-badge.online {
    color: #183a29;
    background: var(--green);
}

.status-badge.starting {
    color: #4a3d18;
    background: var(--yellow);
}

.status-badge.error {
    color: #492631;
    background: var(--red);
}

.server-info {
    margin-top: 15px;
}

.info-row {
    display: flex;
    justify-content: space-between;
    gap: 10px;

    padding: 8px 0;

    border-bottom:
        1px solid rgba(255,255,255,.05);
}

.info-row:last-child {
    border-bottom: 0;
}

.info-label {
    color: var(--muted);
    font-size: 11px;
}

.info-value {
    font-size: 12px;
    font-weight: 750;
    text-align: right;
    word-break: break-all;
}

.endpoint {
    margin-top: 12px;

    padding: 12px;

    border-radius: 12px;

    background:
        rgba(145,199,255,.08);

    color: var(--blue);

    font-family: Consolas, monospace;

    font-size: 14px;
    font-weight: 800;

    word-break: break-all;
}

.server-buttons {
    display: flex;
    gap: 8px;
    margin-top: 15px;
}

.start {
    flex: 1;
    background: var(--green);
    color: #183a29;
}

.stop {
    flex: 1;
    background: var(--red);
    color: #492631;
}

.log-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.badge {
    padding: 5px 9px;
    border-radius: 999px;

    font-size: 10px;
    font-weight: 850;

    background:
        rgba(184,165,255,.1);

    color: var(--purple);
}

.log {
    height: 300px;

    overflow-y: auto;

    margin-top: 12px;
    padding: 15px;

    border-radius: 14px;

    background: #080a10;

    border:
        1px solid rgba(255,255,255,.06);

    color: #dfe2ed;

    font-family: Consolas, monospace;

    font-size: 12px;
    line-height: 1.5;

    white-space: pre-wrap;
    word-break: break-word;
}

.footer {
    text-align: center;

    color:
        rgba(255,255,255,.25);

    font-size: 10px;

    padding: 10px;
}

@media (max-width: 700px) {
    body {
        padding: 10px;
    }

    .servers {
        grid-template-columns: 1fr;
    }

    .top-buttons {
        flex-direction: column;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="card header">
        <div class="logo">🎮</div>

        <div>
            <h1>L.A. Crimes Server</h1>

            <div class="subtitle">
                4-server GitHub Actions control panel
            </div>
        </div>
    </div>


    <div class="card">

        <label for="token">
            GitHub Personal Access Token
        </label>

        <input
            id="token"
            type="password"
            placeholder="github_pat_..."
            autocomplete="off"
        >

        <div class="small">
            The token is stored only in this browser's session storage.
            Never put a token directly into this HTML/JS file.
        </div>

        <div class="top-buttons">

            <button
                id="refreshButton"
                class="refresh"
                onclick="refreshDatabase()"
            >
                ↻ Refresh Servers
            </button>

        </div>

    </div>


    <div class="card">

        <div class="log-title">
            <strong>Servers</strong>

            <span class="badge">
                4 SLOTS
            </span>
        </div>

        <div
            id="servers"
            class="servers"
            style="margin-top:15px;"
        >
        </div>

    </div>


    <div class="card">

        <div class="log-title">

            <strong>
                Dashboard Log
            </strong>

            <span class="badge">
                LIVE
            </span>

        </div>

        <div
            id="log"
            class="log"
        >Dashboard starting...</div>

    </div>


    <div class="footer">
        L.A. Crimes Server Dashboard
    </div>

</div>


<script>

/* =====================================================
   CONFIGURATION
===================================================== */

const OWNER =
    "LACServer";

const REPO =
    "Dashboard";

const WORKFLOW =
    "main.yml";

/*
 * PUT YOUR NEW GIST ID HERE.
 *
 * Example:
 *
 * const GIST_ID =
 *     "a6bd68866931ce5999003aa4f59d50b5";
 */

const GIST_ID =
    "cb2aaaece7a231ec707429d41e1457f4";

const GIST_FILE =
    "servers.json";

const API =
    "https://api.github.com";

const API_VERSION =
    "2022-11-28";


/* =====================================================
   STATE
===================================================== */

let servers = [];

let pollTimer = null;


/* =====================================================
   ELEMENTS
===================================================== */

const tokenInput =
    document.getElementById(
        "token"
    );

const serversElement =
    document.getElementById(
        "servers"
    );

const logElement =
    document.getElementById(
        "log"
    );

const refreshButton =
    document.getElementById(
        "refreshButton"
    );


/* =====================================================
   TOKEN STORAGE
===================================================== */

const savedToken =
    sessionStorage.getItem(
        "lac_dashboard_token"
    );

if (savedToken) {
    tokenInput.value =
        savedToken;
}


tokenInput.addEventListener(
    "input",
    () => {

        const value =
            tokenInput.value.trim();

        if (value) {

            sessionStorage.setItem(
                "lac_dashboard_token",
                value
            );

        } else {

            sessionStorage.removeItem(
                "lac_dashboard_token"
            );
        }
    }
);


function getToken() {

    const token =
        tokenInput.value.trim();

    if (!token) {
        throw new Error(
            "Enter your GitHub token first."
        );
    }

    return token;
}


/* =====================================================
   LOGGING
===================================================== */

function log(message) {

    const time =
        new Date().toLocaleTimeString();

    logElement.textContent +=
        `\n[${time}] ${message}`;

    logElement.scrollTop =
        logElement.scrollHeight;
}


/* =====================================================
   GITHUB API
===================================================== */

async function github(
    path,
    options = {}
) {

    const response =
        await fetch(
            API + path,
            {
                ...options,

                headers: {
                    "Accept":
                        "application/vnd.github+json",

                    "Authorization":
                        "Bearer " + getToken(),

                    "X-GitHub-Api-Version":
                        API_VERSION,

                    ...(options.headers || {})
                }
            }
        );


    if (!response.ok) {

        let message =
            response.statusText;

        try {

            const data =
                await response.json();

            if (data.message) {
                message =
                    data.message;
            }

        } catch (_) {}

        throw new Error(
            `GitHub API ${response.status}: ${message}`
        );
    }


    if (response.status === 204) {
        return null;
    }


    return response.json();
}


/* =====================================================
   GIST
===================================================== */

async function getDatabase() {

    if (
        !GIST_ID ||
        GIST_ID ===
        "PUT_YOUR_NEW_GIST_ID_HERE"
    ) {

        throw new Error(
            "GIST_ID has not been configured in the JavaScript."
        );
    }


    const data =
        await github(
            `/gists/${GIST_ID}`
        );


    if (
        !data.files ||
        !data.files[GIST_FILE]
    ) {

        throw new Error(
            `Gist does not contain ${GIST_FILE}.`
        );
    }


    let content =
        data.files[GIST_FILE].content;


    /*
     * GitHub may return truncated file
     * information for larger files.
     *
     * Our servers.json is tiny, but this
     * handles it anyway.
     */

    if (
        data.files[GIST_FILE].truncated &&
        data.files[GIST_FILE].raw_url
    ) {

        const response =
            await fetch(
                data.files[GIST_FILE].raw_url
            );

        if (!response.ok) {
            throw new Error(
                "Could not download raw servers.json."
            );
        }

        content =
            await response.text();
    }


    try {

        return JSON.parse(
            content
        );

    } catch (error) {

        throw new Error(
            "servers.json contains invalid JSON."
        );
    }
}


/* =====================================================
   UPDATE GIST
===================================================== */

async function updateDatabase(
    database
) {

    const content =
        JSON.stringify(
            database,
            null,
            2
        );


    const payload = {

        files: {

            [GIST_FILE]: {

                content:
                    content
            }
        }
    };


    await github(
        `/gists/${GIST_ID}`,
        {
            method: "PATCH",

            headers: {
                "Content-Type":
                    "application/json"
            },

            body:
                JSON.stringify(
                    payload
                )
        }
    );
}


/* =====================================================
   VALIDATE DATABASE
===================================================== */

function validateDatabase(
    database
) {

    if (
        !database ||
        !Array.isArray(
            database.servers
        )
    ) {

        throw new Error(
            "Invalid servers.json: servers array is missing."
        );
    }


    for (
        const server of database.servers
    ) {

        if (
            !server.slot ||
            !server.name
        ) {

            throw new Error(
                "Invalid server entry in servers.json."
            );
        }
    }
}


/* =====================================================
   RENDER SERVERS
===================================================== */

function renderServers() {

    serversElement.innerHTML = "";


    for (
        const server of servers
    ) {

        const card =
            document.createElement(
                "div"
            );

        card.className =
            "server-card";


        const status =
            String(
                server.status ||
                "available"
            ).toLowerCase();


        let badgeClass = "";

        if (
            status === "online"
        ) {

            badgeClass =
                "online";

        } else if (
            status === "starting"
        ) {

            badgeClass =
                "starting";

        } else if (
            status === "error"
        ) {

            badgeClass =
                "error";
        }


        const endpoint =
            server.endpoint ||
            "—";


        const runId =
            server.run_id ||
            "—";


        card.innerHTML = `

            <div class="server-header">

                <div class="server-name">
                    ${escapeHtml(
                        server.name
                    )}
                </div>

                <div class="status-badge ${badgeClass}">
                    ${escapeHtml(
                        status.toUpperCase()
                    )}
                </div>

            </div>


            <div class="server-info">

                <div class="info-row">

                    <div class="info-label">
                        Slot
                    </div>

                    <div class="info-value">
                        ${escapeHtml(
                            String(server.slot)
                        )}
                    </div>

                </div>


                <div class="info-row">

                    <div class="info-label">
                        Run ID
                    </div>

                    <div class="info-value">
                        ${escapeHtml(
                            String(runId)
                        )}
                    </div>

                </div>


                <div class="info-row">

                    <div class="info-label">
                        Local UDP
                    </div>

                    <div class="info-value">
                        7777
                    </div>

                </div>

            </div>


            ${
                server.endpoint
                ?
                `
                <div class="endpoint">
                    ${escapeHtml(
                        server.endpoint
                    )}
                </div>
                `
                :
                ""
            }


            <div class="server-buttons">

                <button
                    class="start"
                    ${(
                        status === "online" ||
                        status === "starting"
                    ) ? "disabled" : ""}
                    onclick="startServer(
                        ${Number(server.slot)}
                    )"
                >
                    ▶ Start
                </button>


                <button
                    class="stop"
                    ${(
                        !server.run_id ||
                        status === "available"
                    ) ? "disabled" : ""}
                    onclick="stopServer(
                        ${Number(server.slot)}
                    )"
                >
                    ■ Stop
                </button>

            </div>
        `;


        serversElement.appendChild(
            card
        );
    }
}


/* =====================================================
   HTML ESCAPE
===================================================== */

function escapeHtml(
    value
) {

    return String(value)
        .replaceAll(
            "&",
            "&amp;"
        )
        .replaceAll(
            "<",
            "&lt;"
        )
        .replaceAll(
            ">",
            "&gt;"
        )
        .replaceAll(
            '"',
            "&quot;"
        )
        .replaceAll(
            "'",
            "&#039;"
        );
}


/* =====================================================
   GET RUN
===================================================== */

async function getRun(
    runId
) {

    return github(
        `/repos/${OWNER}/${REPO}/actions/runs/${runId}`
    );
}


/* =====================================================
   CHECK WHETHER RUN IS REALLY ACTIVE
===================================================== */

async function isRunActive(
    runId
) {

    if (!runId) {
        return false;
    }


    try {

        const run =
            await getRun(
                runId
            );


        return (
            run.status === "queued" ||
            run.status === "in_progress" ||
            run.status === "waiting" ||
            run.status === "requested" ||
            run.status === "pending"
        );

    } catch (error) {

        /*
         * A missing run should not leave
         * a server permanently marked online.
         */

        return false;
    }
}


/* =====================================================
   RECONCILE DATABASE
===================================================== */

async function reconcileDatabase(
    database
) {

    let changed = false;


    for (
        const server of database.servers
    ) {

        /*
         * AVAILABLE servers should never
         * retain a run ID or endpoint.
         */

        if (
            server.status === "available"
        ) {

            if (
                server.run_id !== null ||
                server.endpoint !== null
            ) {

                server.run_id =
                    null;

                server.endpoint =
                    null;

                changed = true;
            }

            continue;
        }


        /*
         * If a server says STARTING or ONLINE
         * but has no run_id, it cannot be
         * reliably associated with a workflow.
         */

        if (!server.run_id) {

            server.status =
                "available";

            server.endpoint =
                null;

            changed = true;

            continue;
        }


        /*
         * Verify the actual GitHub Actions run.
         */

        const active =
            await isRunActive(
                server.run_id
            );


        if (!active) {

            log(
                `Server ${server.slot}: stale run ${server.run_id} detected. Marking AVAILABLE.`
            );


            server.status =
                "available";

            server.endpoint =
                null;

            server.run_id =
                null;

            changed = true;
        }
    }


    return changed;
}


/* =====================================================
   REFRESH DATABASE
===================================================== */

async function refreshDatabase() {

    try {

        refreshButton.disabled =
            true;


        log(
            "Refreshing server database..."
        );


        let database =
            await getDatabase();


        validateDatabase(
            database
        );


        /*
         * IMPORTANT:
         *
         * This checks every stored run_id
         * against GitHub Actions.
         *
         * This prevents stale Gist data
         * from making a dead server appear
         * online forever.
         */

        const changed =
            await reconcileDatabase(
                database
            );


        if (changed) {

            log(
                "Database contained stale server state. Updating Gist..."
            );


            await updateDatabase(
                database
            );


            /*
             * Reload after updating so the UI
             * displays exactly what GitHub has.
             */

            database =
                await getDatabase();
        }


        servers =
            database.servers;


        renderServers();


        log(
            "Server database refreshed."
        );

    }

    catch (error) {

        log(
            `Refresh failed: ${error.message}`
        );

    }

    finally {

        refreshButton.disabled =
            false;
    }
}


/* =====================================================
   START SERVER
===================================================== */

async function startServer(
    slot
) {

    try {

        log(
            `Starting Server ${slot}...`
        );


        /*
         * Refresh first so we don't start
         * a slot that is actually occupied.
         */

        const database =
            await getDatabase();


        validateDatabase(
            database
        );


        const server =
            database.servers.find(
                item =>
                    Number(item.slot) ===
                    Number(slot)
            );


        if (!server) {

            throw new Error(
                `Server slot ${slot} does not exist.`
            );
        }


        /*
         * If it has a run_id, verify it.
         */

        if (server.run_id) {

            const active =
                await isRunActive(
                    server.run_id
                );


            if (active) {

                log(
                    `Server ${slot} already has active run ${server.run_id}.`
                );

                await refreshDatabase();

                return;
            }


            /*
             * Stale state.
             */

            server.status =
                "available";

            server.endpoint =
                null;

            server.run_id =
                null;

            await updateDatabase(
                database
            );
        }


        /*
         * Mark STARTING before dispatch.
         */

        server.status =
            "starting";

        server.endpoint =
            null;

        server.run_id =
            null;


        await updateDatabase(
            database
        );


        /*
         * Dispatch workflow.
         */

        await github(
            `/repos/${OWNER}/${REPO}/actions/workflows/${WORKFLOW}/dispatches`,
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body:
                    JSON.stringify({
                        ref: "main",

                        inputs: {
                            slot:
                                String(slot)
                        }
                    })
            }
        );


        log(
            `Server ${slot}: workflow dispatched.`
        );


        /*
         * GitHub can take a moment to create
         * the workflow run.
         */

        let foundRun =
            null;


        for (
            let attempt = 1;
            attempt <= 30;
            attempt++
        ) {

            log(
                `Looking for workflow run... ${attempt}/30`
            );


            const data =
                await github(
                    `/repos/${OWNER}/${REPO}/actions/workflows/${WORKFLOW}/runs?event=workflow_dispatch&per_page=20`
                );


            const candidates =
                data.workflow_runs || [];


            /*
             * Find a recent run that is active.
             */

            foundRun =
                candidates.find(
                    run =>
                        (
                            run.status ===
                            "queued" ||
                            run.status ===
                            "in_progress"
                        ) &&
                        run.event ===
                            "workflow_dispatch"
                );


            if (foundRun) {
                break;
            }


            await sleep(
                2000
            );
        }


        if (!foundRun) {

            throw new Error(
                "Workflow was dispatched, but no active run could be found."
            );
        }


        /*
         * Store the real run ID.
         */

        database =
            await getDatabase();


        const updatedServer =
            database.servers.find(
                item =>
                    Number(item.slot) ===
                    Number(slot)
            );


        if (!updatedServer) {

            throw new Error(
                "Server disappeared from database."
            );
        }


        updatedServer.status =
            "starting";

        updatedServer.endpoint =
            null;

        updatedServer.run_id =
            foundRun.id;


        await updateDatabase(
            database
        );


        log(
            `Server ${slot}: Run ID ${foundRun.id} assigned.`
        );


        await refreshDatabase();

    }

    catch (error) {

        log(
            `Start Server ${slot} failed: ${error.message}`
        );

        await refreshDatabase();
    }
}


/* =====================================================
   STOP SERVER
===================================================== */

async function stopServer(
    slot
) {

    try {

        const database =
            await getDatabase();


        validateDatabase(
            database
        );


        const server =
            database.servers.find(
                item =>
                    Number(item.slot) ===
                    Number(slot)
            );


        if (!server) {

            throw new Error(
                `Server ${slot} does not exist.`
            );
        }


        if (!server.run_id) {

            /*
             * No run_id means there is no
             * workflow we can safely cancel.
             *
             * Clean stale database state.
             */

            server.status =
                "available";

            server.endpoint =
                null;

            server.run_id =
                null;


            await updateDatabase(
                database
            );


            log(
                `Server ${slot} had no run ID. Database cleaned.`
            );


            await refreshDatabase();

            return;
        }


        const runId =
            server.run_id;


        log(
            `Stopping Server ${slot} (Run ${runId})...`
        );


        /*
         * Cancel the EXACT workflow run
         * associated with this server.
         */

        await github(
            `/repos/${OWNER}/${REPO}/actions/runs/${runId}/cancel`,
            {
                method: "POST"
            }
        );


        log(
            `Cancellation requested for Server ${slot}.`
        );


        /*
         * Wait for the workflow to actually
         * finish before declaring it available.
         */

        for (
            let attempt = 1;
            attempt <= 30;
            attempt++
        ) {

            const run =
                await getRun(
                    runId
                );


            log(
                `Waiting for run ${runId} to finish... ${attempt}/30`
            );


            if (
                run.status ===
                "completed"
            ) {

                break;
            }


            await sleep(
                2000
            );
        }


        /*
         * Clear the server's database entry.
         */

        const finalDatabase =
            await getDatabase();


        const finalServer =
            finalDatabase.servers.find(
                item =>
                    Number(item.slot) ===
                    Number(slot)
            );


        if (finalServer) {

            finalServer.status =
                "available";

            finalServer.endpoint =
                null;

            finalServer.run_id =
                null;
        }


        await updateDatabase(
            finalDatabase
        );


        log(
            `Server ${slot} is now AVAILABLE.`
        );


        await refreshDatabase();

    }

    catch (error) {

        log(
            `Stop Server ${slot} failed: ${error.message}`
        );


        /*
         * Refresh after an error because the
         * workflow may have stopped even if
         * the cancellation request returned
         * an error.
         */

        await refreshDatabase();
    }
}


/* =====================================================
   SLEEP
===================================================== */

function sleep(
    milliseconds
) {

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                milliseconds
            )
    );
}


/* =====================================================
   AUTOMATIC REFRESH
===================================================== */

function startPolling() {

    if (pollTimer) {

        clearInterval(
            pollTimer
        );
    }


    pollTimer =
        setInterval(
            () => {

                refreshDatabase();

            },
            10000
        );
}


/* =====================================================
   STARTUP
===================================================== */

window.addEventListener(
    "load",
    async () => {

        if (
            !tokenInput.value.trim()
        ) {

            log(
                "Enter your GitHub token to connect."
            );

            return;
        }


        await refreshDatabase();

        startPolling();
    }
);

</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>L.A. Crimes 4-Server Dashboard</title>

<style>
* {
    box-sizing: border-box;
}

:root {
    --bg: #090b12;
    --card: #151925;
    --card2: #1b1f2d;
    --text: #f2f3f8;
    --muted: #8e94a8;
    --blue: #91c7ff;
    --green: #8ff0b5;
    --yellow: #f5d67e;
    --red: #ff9cad;
    --border: rgba(255,255,255,.09);
}

body {
    margin: 0;
    min-height: 100vh;
    padding: 20px;

    font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    color: var(--text);

    background:
        radial-gradient(
            circle at 10% 10%,
            rgba(184,165,255,.14),
            transparent 30%
        ),
        radial-gradient(
            circle at 90% 20%,
            rgba(145,199,255,.11),
            transparent 30%
        ),
        var(--bg);
}

.container {
    width: min(950px, 100%);
    margin: auto;
}

.card {
    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.065),
            rgba(255,255,255,.025)
        );

    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 22px;
    margin-bottom: 16px;

    backdrop-filter: blur(14px);

    box-shadow:
        0 18px 45px rgba(0,0,0,.25);
}

.header {
    display: flex;
    align-items: center;
    gap: 15px;
}

.logo {
    width: 54px;
    height: 54px;

    display: grid;
    place-items: center;

    border-radius: 16px;

    background:
        rgba(184,165,255,.13);

    font-size: 26px;
}

h1 {
    margin: 0;
    font-size: clamp(25px, 6vw, 34px);
}

.subtitle {
    color: var(--muted);
    font-size: 12px;
    margin-top: 4px;
}

label {
    display: block;
    font-weight: 800;
    font-size: 13px;
    margin-bottom: 8px;
}

input {
    width: 100%;
    height: 48px;

    padding: 0 14px;

    border-radius: 13px;

    border:
        1px solid
        rgba(255,255,255,.1);

    outline: none;

    background:
        rgba(0,0,0,.25);

    color: var(--text);
}

input:focus {
    border-color:
        rgba(184,165,255,.55);
}

.buttons {
    display: flex;
    gap: 10px;
    margin-top: 15px;
}

button {
    flex: 1;

    border: 0;
    border-radius: 13px;

    padding: 14px;

    font-weight: 850;

    cursor: pointer;

    transition:
        transform .15s,
        opacity .15s;
}

button:hover:not(:disabled) {
    transform: translateY(-2px);
}

button:disabled {
    opacity: .35;
    cursor: not-allowed;
}

.start {
    background: var(--green);
    color: #183a29;
}

.stop {
    background: var(--red);
    color: #492631;
}

.refresh {
    background: var(--blue);
    color: #173047;
}

.server-grid {
    display: grid;

    grid-template-columns:
        repeat(2, minmax(0, 1fr));

    gap: 16px;
}

.server {
    margin: 0;
}

.server-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.server-number {
    font-size: 19px;
    font-weight: 900;
}

.status {
    display: inline-flex;
    align-items: center;
    gap: 7px;

    font-size: 11px;
    font-weight: 850;
}

.dot {
    width: 10px;
    height: 10px;

    border-radius: 50%;

    background: #666;
}

.dot.online {
    background: var(--green);

    box-shadow:
        0 0 15px
        rgba(143,240,181,.65);
}

.dot.starting {
    background: var(--yellow);

    box-shadow:
        0 0 15px
        rgba(245,214,126,.5);
}

.dot.offline {
    background: var(--red);
}

.endpoint {
    margin-top: 15px;

    padding: 14px;

    border-radius: 13px;

    background:
        rgba(0,0,0,.28);

    color: var(--blue);

    font-family:
        Consolas,
        monospace;

    font-size: 17px;

    font-weight: 850;

    word-break: break-all;
}

.no-endpoint {
    color: var(--muted);
    font-size: 13px;
}

.info {
    margin-top: 10px;

    color: var(--muted);

    font-size: 11px;

    line-height: 1.6;
}

.log {
    min-height: 150px;

    max-height: 300px;

    overflow-y: auto;

    padding: 15px;

    border-radius: 14px;

    background: #080a10;

    border:
        1px solid
        rgba(255,255,255,.06);

    color: #dfe2ed;

    font-family:
        Consolas,
        monospace;

    font-size: 12px;

    white-space: pre-wrap;
}

.footer {
    text-align: center;

    color:
        rgba(255,255,255,.25);

    font-size: 10px;
}

@media (max-width: 700px) {
    .server-grid {
        grid-template-columns: 1fr;
    }

    .buttons {
        flex-direction: column;
    }

    body {
        padding: 10px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="card header">
        <div class="logo">🎮</div>

        <div>
            <h1>L.A. Crimes</h1>

            <div class="subtitle">
                4-Server GitHub Actions Control Panel
            </div>
        </div>
    </div>

    <div class="card">

        <label>
            GitHub Personal Access Token
        </label>

        <input
            id="token"
            type="password"
            placeholder="github_pat_..."
            autocomplete="off"
        >

        <div class="info">
            The token is stored only in this browser session.
        </div>

        <div class="buttons">

            <button
                id="startButton"
                class="start"
                onclick="startServers()"
            >
                ▶ Start 4 Servers
            </button>

            <button
                id="stopButton"
                class="stop"
                onclick="stopServers()"
                disabled
            >
                ■ Stop Servers
            </button>

            <button
                class="refresh"
                onclick="refreshDatabase()"
            >
                ↻ Refresh
            </button>

        </div>

    </div>

    <div class="card">

        <strong>
            System Status
        </strong>

        <div
            id="systemStatus"
            class="info"
        >
            Enter your token and press Refresh.
        </div>

    </div>

    <div
        id="serverGrid"
        class="server-grid"
    ></div>

    <div class="card">

        <strong>
            Activity
        </strong>

        <div
            id="log"
            class="log"
        >Dashboard ready.</div>

    </div>

    <div class="footer">
        L.A. Crimes Server Dashboard
    </div>

</div>

<script>
const OWNER = "LACServer";
const REPO = "Dashboard";
const WORKFLOW = "main.yml";

const GIST_ID =
    "cb2aaaece7a231ec707429d41e1457f4";

const GIST_FILE =
    "servers.json";

const API =
    "https://api.github.com";

const API_VERSION =
    "2022-11-28";

let currentRunId =
    sessionStorage.getItem("lac_run_id");

let pollTimer = null;

const tokenInput =
    document.getElementById("token");

const startButton =
    document.getElementById("startButton");

const stopButton =
    document.getElementById("stopButton");

const systemStatus =
    document.getElementById("systemStatus");

const serverGrid =
    document.getElementById("serverGrid");

const logElement =
    document.getElementById("log");


const savedToken =
    sessionStorage.getItem("lac_token");

if (savedToken) {
    tokenInput.value = savedToken;
}


tokenInput.addEventListener(
    "input",
    () => {

        const value =
            tokenInput.value.trim();

        if (value) {
            sessionStorage.setItem(
                "lac_token",
                value
            );
        } else {
            sessionStorage.removeItem(
                "lac_token"
            );
        }
    }
);


function getToken() {

    const token =
        tokenInput.value.trim();

    if (!token) {
        throw new Error(
            "Enter your GitHub token first."
        );
    }

    return token;
}


async function github(
    path,
    options = {}
) {

    const response =
        await fetch(
            API + path,
            {
                ...options,

                headers: {
                    "Accept":
                        "application/vnd.github+json",

                    "Authorization":
                        "Bearer " + getToken(),

                    "X-GitHub-Api-Version":
                        API_VERSION,

                    ...(options.headers || {})
                }
            }
        );


    if (!response.ok) {

        let message =
            response.statusText;

        try {

            const data =
                await response.json();

            if (data.message) {
                message =
                    data.message;
            }

        } catch (_) {}

        throw new Error(
            `GitHub API ${response.status}: ${message}`
        );
    }


    if (response.status === 204) {
        return null;
    }

    return response.json();
}


function log(text) {

    const time =
        new Date().toLocaleTimeString();

    logElement.textContent +=
        `\n[${time}] ${text}`;

    logElement.scrollTop =
        logElement.scrollHeight;
}


function renderServers(
    servers
) {

    serverGrid.innerHTML = "";

    for (
        let i = 0;
        i < 4;
        i++
    ) {

        const server =
            servers[i] || {
                slot: i + 1,
                status: "available",
                endpoint: null,
                run_id: null
            };


        const status =
            String(
                server.status || "available"
            ).toLowerCase();


        let statusText =
            "OFFLINE";

        let statusClass =
            "offline";


        if (status === "online") {

            statusText =
                "ONLINE";

            statusClass =
                "online";

        } else if (
            status === "starting" ||
            status === "preparing"
        ) {

            statusText =
                "STARTING";

            statusClass =
                "starting";
        }


        const card =
            document.createElement("div");

        card.className =
            "card server";


        const endpoint =
            server.endpoint;


        card.innerHTML = `
            <div class="server-title">

                <div class="server-number">
                    Server ${server.slot}
                </div>

                <div class="status">

                    <span
                        class="dot ${statusClass}"
                    ></span>

                    ${statusText}

                </div>

            </div>

            ${
                endpoint
                ?
                `<div class="endpoint">
                    ${escapeHtml(endpoint)}
                </div>`
                :
                `<div class="endpoint no-endpoint">
                    Public endpoint not available yet
                </div>`
            }

            <div class="info">
                Local UDP:
                ${7776 + Number(server.slot)}
                <br>

                ${
                    server.run_id
                    ?
                    `Run ID: ${escapeHtml(String(server.run_id))}`
                    :
                    "Run ID: —"
                }
            </div>
        `;


        serverGrid.appendChild(card);
    }
}


function escapeHtml(
    value
) {

    return value
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


async function readDatabase() {

    const timestamp =
        Date.now();


    const response =
        await fetch(
            `https://api.github.com/gists/${GIST_ID}?t=${timestamp}`,
            {
                headers: {
                    "Accept":
                        "application/vnd.github+json",

                    "X-GitHub-Api-Version":
                        API_VERSION,

                    ...(tokenInput.value.trim()
                        ? {
                            "Authorization":
                                "Bearer " +
                                getToken()
                        }
                        : {})
                }
            }
        );


    if (!response.ok) {

        let message =
            response.statusText;

        try {

            const data =
                await response.json();

            if (data.message) {
                message = data.message;
            }

        } catch (_) {}

        throw new Error(
            `Gist API ${response.status}: ${message}`
        );
    }


    const data =
        await response.json();


    if (
        !data.files ||
        !data.files[GIST_FILE]
    ) {

        throw new Error(
            `${GIST_FILE} was not found in the Gist.`
        );
    }


    return JSON.parse(
        data.files[GIST_FILE].content
    );
}


async function refreshDatabase() {

    try {

        systemStatus.textContent =
            "Refreshing server database...";

        const data =
            await readDatabase();


        renderServers(
            data.servers || []
        );


        const online =
            (data.servers || [])
                .filter(
                    server =>
                        server.status === "online"
                )
                .length;


        systemStatus.textContent =
            `${online}/4 servers online.`;


        log(
            "Server database refreshed."
        );


    } catch (error) {

        systemStatus.textContent =
            "Refresh failed: " +
            error.message;

        log(
            "Refresh failed: " +
            error.message
        );
    }
}


async function findActiveRun() {

    const data =
        await github(
            `/repos/${OWNER}/${REPO}/actions/workflows/${WORKFLOW}/runs?per_page=20`
        );


    return data.workflow_runs?.find(
        run =>
            run.event === "workflow_dispatch" &&
            (
                run.status === "queued" ||
                run.status === "in_progress"
            )
    );
}


async function startServers() {

    try {

        startButton.disabled =
            true;

        stopButton.disabled =
            true;


        log(
            "Starting the 4-server workflow..."
        );


        await github(
            `/repos/${OWNER}/${REPO}/actions/workflows/${WORKFLOW}/dispatches`,
            {
                method: "POST",

                body:
                    JSON.stringify({
                        ref: "main"
                    })
            }
        );


        log(
            "Workflow dispatch sent."
        );


        let run = null;


        for (
            let attempt = 0;
            attempt < 30;
            attempt++
        ) {

            run =
                await findActiveRun();


            if (run) {
                break;
            }


            await sleep(2000);
        }


        if (!run) {

            throw new Error(
                "Workflow started but no active run was found."
            );
        }


        currentRunId =
            run.id;


        sessionStorage.setItem(
            "lac_run_id",
            String(currentRunId)
        );


        log(
            `Workflow run detected: ${currentRunId}`
        );


        startPolling();


    } catch (error) {

        startButton.disabled =
            false;

        log(
            "Start failed: " +
            error.message
        );
    }
}


async function stopServers() {

    if (!currentRunId) {

        const run =
            await findActiveRun();

        if (run) {
            currentRunId =
                run.id;
        }
    }


    if (!currentRunId) {

        log(
            "No active workflow found."
        );

        return;
    }


    if (
        !confirm(
            "Stop all four L.A. Crimes servers?"
        )
    ) {
        return;
    }


    try {

        stopButton.disabled =
            true;


        log(
            `Stopping workflow ${currentRunId}...`
        );


        await github(
            `/repos/${OWNER}/${REPO}/actions/runs/${currentRunId}/cancel`,
            {
                method: "POST"
            }
        );


        log(
            "Stop request sent."
        );


        startPolling();


    } catch (error) {

        stopButton.disabled =
            false;

        log(
            "Stop failed: " +
            error.message
        );
    }
}


function startPolling() {

    if (pollTimer) {
        clearInterval(pollTimer);
    }


    poll();

    pollTimer =
        setInterval(
            poll,
            5000
        );
}


async function poll() {

    try {

        const data =
            await readDatabase();


        renderServers(
            data.servers || []
        );


        const activeServers =
            (data.servers || [])
                .filter(
                    server =>
                        server.status === "online" ||
                        server.status === "starting"
                );


        if (activeServers.length > 0) {

            startButton.disabled =
                true;

            stopButton.disabled =
                false;

        } else {

            startButton.disabled =
                false;

            stopButton.disabled =
                true;
        }


        if (currentRunId) {

            try {

                const run =
                    await github(
                        `/repos/${OWNER}/${REPO}/actions/runs/${currentRunId}`
                    );


                systemStatus.textContent =
                    `Workflow ${run.id}: ${run.status}`;


                if (
                    run.status === "completed"
                ) {

                    log(
                        `Workflow ${run.id} completed.`
                    );


                    sessionStorage.removeItem(
                        "lac_run_id"
                    );


                    currentRunId =
                        null;


                    startButton.disabled =
                        false;

                    stopButton.disabled =
                        true;


                    if (pollTimer) {

                        clearInterval(
                            pollTimer
                        );

                        pollTimer =
                            null;
                    }


                    await refreshDatabase();
                }

            } catch (error) {

                log(
                    "Workflow check failed: " +
                    error.message
                );
            }
        }

    } catch (error) {

        log(
            "Polling failed: " +
            error.message
        );
    }
}


function sleep(
    milliseconds
) {

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                milliseconds
            )
    );
}


window.addEventListener(
    "load",
    async () => {

        renderServers([]);


        if (
            tokenInput.value.trim()
        ) {

            await refreshDatabase();

        } else {

            systemStatus.textContent =
                "Enter your GitHub token.";

        }
    }
);
</script>

</body>
    </html>

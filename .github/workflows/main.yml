name: L.A. Crimes Server

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Server operation"
        required: true
        type: choice
        options:
          - start
          - setup
        default: start

      slot:
        description: "Server slot (ignored for setup)"
        required: true
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"
        default: "1"

permissions:
  contents: read

concurrency:
  group: lac-server-slot-${{ inputs.slot }}
  cancel-in-progress: false

env:
  GIST_ID: cb2aaaece7a231ec707429d41e1457f4
  GIST_FILE: servers.json
  PLAYIT_VERSION: "1.0.10"
  PLAYIT_CLI_URL: "https://github.com/playit-cloud/playit-agent/releases/download/v1.0.10/playit-cli-linux-amd64"
  PLAYIT_AGENT_URL: "https://github.com/playit-cloud/playit-agent/releases/download/v1.0.10/playit-linux-amd64"

jobs:

  setup:
    if: ${{ inputs.mode == 'setup' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      PLAYIT_SECRET_1: ${{ secrets.PLAYIT_SECRET_1 }}
      PLAYIT_SECRET_2: ${{ secrets.PLAYIT_SECRET_2 }}
      PLAYIT_SECRET_3: ${{ secrets.PLAYIT_SECRET_3 }}
      PLAYIT_SECRET_4: ${{ secrets.PLAYIT_SECRET_4 }}
      DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}

    steps:
      - name: Install tools
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y wget curl jq

      - name: Prepare directories
        run: |
          set -e
          sudo mkdir -p /run/playit
          sudo chmod 777 /run/playit
          mkdir -p "$HOME/.config/playit_gg"
          mkdir -p "$HOME/.config/playit"

      - name: Download Playit CLI + Agent
        run: |
          set -e
          wget --timeout=60 --tries=5 -O "$GITHUB_WORKSPACE/playit-cli" "$PLAYIT_CLI_URL"
          wget --timeout=60 --tries=5 -O "$GITHUB_WORKSPACE/playit" "$PLAYIT_AGENT_URL"
          chmod +x "$GITHUB_WORKSPACE/playit-cli" "$GITHUB_WORKSPACE/playit"

      - name: Check secrets and create missing agents
        run: |
          set -e

          echo "=============================================="
          echo "  L.A. CRIMES – PLAYIT SECRET SETUP"
          echo "=============================================="
          echo

          check_secret() {
            local name="$1" value="$2"
            if [ -z "$value" ]; then
              echo "❌  $name  →  MISSING"
              return 1
            else
              echo "✅  $name  →  present"
              return 0
            fi
          }

          MISSING=()
          echo "Current secret status:"
          echo "----------------------------------------------"
          check_secret "DASHBOARD_TOKEN"   "$DASHBOARD_TOKEN"   || MISSING+=("DASHBOARD_TOKEN")
          check_secret "PLAYIT_SECRET_1"   "$PLAYIT_SECRET_1"   || MISSING+=("PLAYIT_SECRET_1")
          check_secret "PLAYIT_SECRET_2"   "$PLAYIT_SECRET_2"   || MISSING+=("PLAYIT_SECRET_2")
          check_secret "PLAYIT_SECRET_3"   "$PLAYIT_SECRET_3"   || MISSING+=("PLAYIT_SECRET_3")
          check_secret "PLAYIT_SECRET_4"   "$PLAYIT_SECRET_4"   || MISSING+=("PLAYIT_SECRET_4")
          echo "----------------------------------------------"
          echo

          if [ ${#MISSING[@]} -eq 0 ]; then
            echo "All required secrets already exist. Nothing to do."
            exit 0
          fi

          echo "Secrets that still need to be created:"
          for s in "${MISSING[@]}"; do echo "  • $s"; done
          echo

          create_agent() {
            local SECRET_NAME="$1"
            local SLOT_HINT="$2"

            echo
            echo "##################################################"
            echo "# Creating agent for  $SECRET_NAME"
            echo "##################################################"
            echo

            rm -rf "$HOME/.config/playit_gg" "$HOME/.config/playit" 2>/dev/null || true
            mkdir -p "$HOME/.config/playit_gg"

            CLAIM_CODE=$("$GITHUB_WORKSPACE/playit-cli" claim generate 2>/dev/null | tr -d '\r\n' || true)

            if [ -z "$CLAIM_CODE" ] || [ ${#CLAIM_CODE} -lt 8 ]; then
              echo "ERROR: claim generate failed"
              exit 1
            fi

            echo "Claim code: $CLAIM_CODE"

            CLAIM_URL=$("$GITHUB_WORKSPACE/playit-cli" claim url "$CLAIM_CODE" \
              --name "lac-slot-$SLOT_HINT" \
              --type "docker" 2>/dev/null | grep -oE 'https://playit\.gg/claim/[A-Za-z0-9_-]+' || true)

            if [ -z "$CLAIM_URL" ]; then
              CLAIM_URL="https://playit.gg/claim/$CLAIM_CODE"
            fi

            echo
            echo "=================================================="
            echo "1. Open this link (logged into playit.gg):"
            echo "    $CLAIM_URL"
            echo "2. Claim the agent, leave defaults, finish wizard"
            echo "3. Job will wait for the secret..."
            echo "=================================================="
            echo

            SECRET=""
            for i in $(seq 1 72); do
              sleep 10
              SECRET=$("$GITHUB_WORKSPACE/playit-cli" claim exchange "$CLAIM_CODE" --wait 5 2>/dev/null | tail -n 15 | grep -oE '[0-9a-fA-F]{32,}' | tail -1 || true)
              if [ -n "$SECRET" ] && [ ${#SECRET} -ge 32 ]; then break; fi
              if [ -f "$HOME/.config/playit_gg/playit.toml" ]; then
                SECRET=$(grep -oE 'secret_key\s*=\s*"[^"]+"' "$HOME/.config/playit_gg/playit.toml" 2>/dev/null || true)
                SECRET=${SECRET#*\"}
                SECRET=${SECRET%\"}
                if [ -n "$SECRET" ] && [ ${#SECRET} -ge 32 ]; then break; fi
              fi
              echo "  still waiting... ($((i*10))s)"
            done

            if [ -z "$SECRET" ] || [ ${#SECRET} -lt 32 ]; then
              echo "ERROR: Timed out waiting for secret."
              exit 1
            fi

            echo
            echo "✅  Secret obtained!"
            echo
            echo ">>> COPY THIS SECRET INTO GITHUB <<<"
            echo "Secret name : $SECRET_NAME"
            echo "Secret value: $SECRET"
            echo
          }

          for s in "${MISSING[@]}"; do
            case "$s" in
              PLAYIT_SECRET_1) create_agent "PLAYIT_SECRET_1" "1" ;;
              PLAYIT_SECRET_2) create_agent "PLAYIT_SECRET_2" "2" ;;
              PLAYIT_SECRET_3) create_agent "PLAYIT_SECRET_3" "3" ;;
              PLAYIT_SECRET_4) create_agent "PLAYIT_SECRET_4" "4" ;;
              DASHBOARD_TOKEN)
                echo "Create a GitHub PAT with Gist access and add it as DASHBOARD_TOKEN"
                ;;
            esac
          done

          echo
          echo "Setup finished. Add the secrets, then run mode=start."

  server:
    if: ${{ inputs.mode == 'start' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      SLOT: ${{ inputs.slot }}

    steps:
      - name: Configure server slot
        id: config
        run: |
          set -e
          PORT="7777"
          case "$SLOT" in
            1)
              DOMAIN="drake-missy.tun.ply.gg"
              IP="147.185.221.231"
              PUBLIC_PORT="46049"
              SECRET_NAME="PLAYIT_SECRET_1"
              ;;
            2)
              DOMAIN="drake-embraced.tun.ply.gg"
              IP="147.185.221.231"
              PUBLIC_PORT="47064"
              SECRET_NAME="PLAYIT_SECRET_2"
              ;;
            3)
              DOMAIN="drake-limbs.tun.ply.gg"
              IP="147.185.221.30"
              PUBLIC_PORT="40093"
              SECRET_NAME="PLAYIT_SECRET_3"
              ;;
            4)
              DOMAIN="drake-relativity.tun.ply.gg"
              IP="147.185.221.230"
              PUBLIC_PORT="49177"
              SECRET_NAME="PLAYIT_SECRET_4"
              ;;
            *)
              echo "Invalid server slot."
              exit 1
              ;;
          esac

          ENDPOINT="${DOMAIN}:${PUBLIC_PORT}"

          echo "PORT=$PORT" >> "$GITHUB_OUTPUT"
          echo "DOMAIN=$DOMAIN" >> "$GITHUB_OUTPUT"
          echo "IP=$IP" >> "$GITHUB_OUTPUT"
          echo "PUBLIC_PORT=$PUBLIC_PORT" >> "$GITHUB_OUTPUT"
          echo "ENDPOINT=$ENDPOINT" >> "$GITHUB_OUTPUT"
          echo "SECRET_NAME=$SECRET_NAME" >> "$GITHUB_OUTPUT"

          echo
          echo "=========================================="
          echo "L.A. CRIMES SERVER"
          echo "=========================================="
          echo "Slot:       $SLOT"
          echo "Local UDP:  $PORT"
          echo "Endpoint:   $ENDPOINT"
          echo "Playit:     $SECRET_NAME"
          echo "=========================================="

      - name: Check required secrets
        env:
          DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
          PLAYIT_SECRET_1: ${{ secrets.PLAYIT_SECRET_1 }}
          PLAYIT_SECRET_2: ${{ secrets.PLAYIT_SECRET_2 }}
          PLAYIT_SECRET_3: ${{ secrets.PLAYIT_SECRET_3 }}
          PLAYIT_SECRET_4: ${{ secrets.PLAYIT_SECRET_4 }}
        run: |
          set -e
          if [ -z "$DASHBOARD_TOKEN" ]; then
            echo "ERROR: DASHBOARD_TOKEN missing."
            exit 1
          fi
          case "$SLOT" in
            1) PLAYIT_SECRET="$PLAYIT_SECRET_1" ;;
            2) PLAYIT_SECRET="$PLAYIT_SECRET_2" ;;
            3) PLAYIT_SECRET="$PLAYIT_SECRET_3" ;;
            4) PLAYIT_SECRET="$PLAYIT_SECRET_4" ;;
            *) exit 1 ;;
          esac
          if [ -z "$PLAYIT_SECRET" ]; then
            echo "ERROR: PLAYIT_SECRET_$SLOT missing."
            exit 1
          fi
          echo "::add-mask::$PLAYIT_SECRET"
          echo "Required secrets are available."

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (from official README)
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            unzip wget curl ca-certificates iproute2 jq python3 \
            screen libc6-i386 lib32stdc++6 \
            || true
          sudo apt-get install -y libncurses5:i386 2>/dev/null || true

      - name: Disable IPv6 (required by LAC README)
        run: |
          set -e
          echo "Disabling IPv6..."
          sudo sysctl -w net.ipv6.conf.all.disable_ipv6=1
          sudo sysctl -w net.ipv6.conf.default.disable_ipv6=1
          sudo sysctl -w net.ipv6.conf.lo.disable_ipv6=1
          echo "IPv6 status:"
          ip -6 addr show || true
          echo "IPv6 disabled."

      - name: Download server database
        env:
          DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
        run: |
          set -e
          curl --fail --silent --show-error \
            --request GET \
            --url "https://api.github.com/gists/$GIST_ID" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $DASHBOARD_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            > "$GITHUB_WORKSPACE/gist-response.json"
          jq -e '.files["servers.json"].content' "$GITHUB_WORKSPACE/gist-response.json" > /dev/null
          jq -r '.files["servers.json"].content' "$GITHUB_WORKSPACE/gist-response.json" > "$GITHUB_WORKSPACE/servers.json"
          jq empty "$GITHUB_WORKSPACE/servers.json"
          echo "Server database loaded."

      - name: Mark server STARTING
        env:
          DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
          PORT: ${{ steps.config.outputs.PORT }}
          ENDPOINT: ${{ steps.config.outputs.ENDPOINT }}
          IP: ${{ steps.config.outputs.IP }}
        run: |
          set -e
          python3 - "$GITHUB_WORKSPACE/servers.json" "$SLOT" "$GITHUB_RUN_ID" "$PORT" "$ENDPOINT" "$IP" <<'PY'
          import json, sys
          path, slot, run_id, port, endpoint, ip = sys.argv[1], int(sys.argv[2]), str(sys.argv[3]), int(sys.argv[4]), sys.argv[5], sys.argv[6]
          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)
          for server in data["servers"]:
              if int(server["slot"]) != slot: continue
              current_run = server.get("run_id")
              if current_run not in (None, "", run_id):
                  raise SystemExit(f"Server {slot} is already owned by workflow {current_run}.")
              server["status"] = "starting"
              server["run_id"] = run_id
              server["endpoint"] = endpoint
              server["ip"] = ip
              server["port"] = port
              break
          else:
              raise SystemExit(f"Server slot {slot} does not exist.")
          with open(path, "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2)
              f.write("\n")
          PY
          PAYLOAD=$(jq -n --arg content "$(cat "$GITHUB_WORKSPACE/servers.json")" --arg filename "$GIST_FILE" '{files:{($filename):{content:$content}}}')
          curl --fail --silent --show-error \
            --request PATCH --url "https://api.github.com/gists/$GIST_ID" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $DASHBOARD_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --data "$PAYLOAD" > /dev/null
          echo "Server $SLOT marked STARTING."

      - name: Download L.A. Crimes
        run: |
          set -e
          wget --timeout=60 --tries=5 -O "$GITHUB_WORKSPACE/LAC.zip" \
            "https://lacrimesonline.com/builds/LAC_Linux_v1.9.6.zip"
          rm -rf "$GITHUB_WORKSPACE/lac"
          mkdir -p "$GITHUB_WORKSPACE/lac"
          unzip -q "$GITHUB_WORKSPACE/LAC.zip" -d "$GITHUB_WORKSPACE/lac"
          SERVER=$(find "$GITHUB_WORKSPACE/lac" -type f -name "LAC_Linux_v1.9.6.x86_64" -print -quit)
          if [ -z "$SERVER" ]; then
            echo "ERROR: L.A. Crimes executable not found."
            find "$GITHUB_WORKSPACE/lac" -maxdepth 5 -type f -print
            exit 1
          fi
          chmod +x "$SERVER"
          echo "$SERVER" > "$GITHUB_WORKSPACE/server-path.txt"
          echo "Found server binary: $SERVER"

      - name: Install ServerConfig.txt (official path)
        run: |
          set -e

          if [ ! -f "$GITHUB_WORKSPACE/ServerConfig.txt" ]; then
            echo "ERROR: ServerConfig.txt not found in the repository root."
            echo "Commit ServerConfig.txt to the root of the repo."
            ls -la "$GITHUB_WORKSPACE" || true
            exit 1
          fi

          echo "Repo ServerConfig.txt:"
          cat "$GITHUB_WORKSPACE/ServerConfig.txt"
          echo

          sudo mkdir -p /root/.config/unity3d/MA/LAC
          sudo cp "$GITHUB_WORKSPACE/ServerConfig.txt" /root/.config/unity3d/MA/LAC/ServerConfig.txt
          sudo chmod 644 /root/.config/unity3d/MA/LAC/ServerConfig.txt
          sudo chown root:root /root/.config/unity3d/MA/LAC/ServerConfig.txt

          echo "Installed to:"
          sudo ls -la /root/.config/unity3d/MA/LAC/ServerConfig.txt
          echo
          echo "Contents on disk:"
          sudo cat /root/.config/unity3d/MA/LAC/ServerConfig.txt

      - name: Start L.A. Crimes as root
        env:
          PORT: ${{ steps.config.outputs.PORT }}
        run: |
          set -e
          SERVER=$(cat "$GITHUB_WORKSPACE/server-path.txt")
          SERVER_DIR=$(dirname "$SERVER")

          cd "$SERVER_DIR"
          sudo ./LAC_Linux_v1.9.6.x86_64 -batchmode -nographics > "$GITHUB_WORKSPACE/lac-server.log" 2>&1 &
          LAC_PID=$!
          echo "$LAC_PID" > "$GITHUB_WORKSPACE/lac.pid"

          sleep 15

          if ! kill -0 "$LAC_PID" 2>/dev/null; then
            echo "ERROR: L.A. Crimes stopped."
            echo "----- last log lines -----"
            tail -300 "$GITHUB_WORKSPACE/lac-server.log" || true
            exit 1
          fi

          echo "L.A. Crimes is running as root. PID: $LAC_PID  Local UDP: $PORT"
          echo "Config path used: /root/.config/unity3d/MA/LAC/ServerConfig.txt"

      - name: Download Playit agent
        run: |
          set -e
          wget --timeout=60 --tries=5 -O "$GITHUB_WORKSPACE/playit" "$PLAYIT_AGENT_URL"
          chmod +x "$GITHUB_WORKSPACE/playit"

      - name: Start Playit
        env:
          PLAYIT_SECRET_1: ${{ secrets.PLAYIT_SECRET_1 }}
          PLAYIT_SECRET_2: ${{ secrets.PLAYIT_SECRET_2 }}
          PLAYIT_SECRET_3: ${{ secrets.PLAYIT_SECRET_3 }}
          PLAYIT_SECRET_4: ${{ secrets.PLAYIT_SECRET_4 }}
        run: |
          set -e
          case "$SLOT" in
            1) PLAYIT_SECRET="$PLAYIT_SECRET_1" ;;
            2) PLAYIT_SECRET="$PLAYIT_SECRET_2" ;;
            3) PLAYIT_SECRET="$PLAYIT_SECRET_3" ;;
            4) PLAYIT_SECRET="$PLAYIT_SECRET_4" ;;
            *) exit 1 ;;
          esac
          if [ -z "$PLAYIT_SECRET" ]; then
            echo "Playit secret is empty."
            exit 1
          fi
          echo "::add-mask::$PLAYIT_SECRET"
          sudo mkdir -p /run/playit
          sudo chmod 777 /run/playit
          mkdir -p "$HOME/.config/playit_gg"
          "$GITHUB_WORKSPACE/playit" --secret "$PLAYIT_SECRET" > "$GITHUB_WORKSPACE/playit.log" 2>&1 &
          PLAYIT_PID=$!
          echo "$PLAYIT_PID" > "$GITHUB_WORKSPACE/playit.pid"
          sleep 10
          if ! kill -0 "$PLAYIT_PID" 2>/dev/null; then
            echo "ERROR: Playit stopped."
            cat "$GITHUB_WORKSPACE/playit.log" || true
            exit 1
          fi
          echo "Playit agent is running."

      - name: Mark server ONLINE
        env:
          DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
          PORT: ${{ steps.config.outputs.PORT }}
          ENDPOINT: ${{ steps.config.outputs.ENDPOINT }}
          IP: ${{ steps.config.outputs.IP }}
        run: |
          set -e
          python3 - "$GITHUB_WORKSPACE/servers.json" "$SLOT" "$GITHUB_RUN_ID" "$PORT" "$ENDPOINT" "$IP" <<'PY'
          import json, sys
          path, slot, run_id, port, endpoint, ip = sys.argv[1], int(sys.argv[2]), str(sys.argv[3]), int(sys.argv[4]), sys.argv[5], sys.argv[6]
          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)
          for server in data["servers"]:
              if int(server["slot"]) != slot: continue
              if str(server.get("run_id")) != run_id:
                  raise SystemExit("Run ownership changed.")
              server["status"] = "online"
              server["run_id"] = run_id
              server["endpoint"] = endpoint
              server["ip"] = ip
              server["port"] = port
              break
          else:
              raise SystemExit(f"Server slot {slot} does not exist.")
          with open(path, "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2)
              f.write("\n")
          PY
          PAYLOAD=$(jq -n --arg content "$(cat "$GITHUB_WORKSPACE/servers.json")" --arg filename "$GIST_FILE" '{files:{($filename):{content:$content}}}')
          curl --fail --silent --show-error \
            --request PATCH --url "https://api.github.com/gists/$GIST_ID" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $DASHBOARD_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --data "$PAYLOAD" > /dev/null
          echo "Server $SLOT is ONLINE."

      - name: Keep server alive
        run: |
          set -e
          echo "Server $SLOT is online."
          while true; do
            LAC_PID=$(cat "$GITHUB_WORKSPACE/lac.pid")
            PLAYIT_PID=$(cat "$GITHUB_WORKSPACE/playit.pid")
            if ! kill -0 "$LAC_PID" 2>/dev/null; then
              echo "L.A. Crimes stopped."
              tail -100 "$GITHUB_WORKSPACE/lac-server.log" || true
              exit 1
            fi
            if ! kill -0 "$PLAYIT_PID" 2>/dev/null; then
              echo "Playit stopped."
              cat "$GITHUB_WORKSPACE/playit.log" || true
              exit 1
            fi
            echo "[$(date '+%H:%M:%S')] SERVER=$SLOT STATUS=ONLINE"
            sleep 10
          done

      - name: Cleanup server state
        if: always()
        env:
          DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
        run: |
          set +e
          if [ ! -f "$GITHUB_WORKSPACE/servers.json" ]; then exit 0; fi
          python3 - "$GITHUB_WORKSPACE/servers.json" "$SLOT" "$GITHUB_RUN_ID" <<'PY'
          import json, sys
          path, slot, run_id = sys.argv[1], int(sys.argv[2]), str(sys.argv[3])
          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)
          for server in data["servers"]:
              if int(server["slot"]) != slot: continue
              current_run = server.get("run_id")
              if current_run is not None and str(current_run) != run_id:
                  print(f"Cleanup ignored: server belongs to {current_run}.")
                  sys.exit(0)
              server["status"] = "offline"
              server["run_id"] = None
              server["endpoint"] = None
              server["ip"] = None
              server["port"] = None
              break
          with open(path, "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2)
              f.write("\n")
          PY
          PAYLOAD=$(jq -n --arg content "$(cat "$GITHUB_WORKSPACE/servers.json")" --arg filename "$GIST_FILE" '{files:{($filename):{content:$content}}}')
          curl --silent --show-error \
            --request PATCH --url "https://api.github.com/gists/$GIST_ID" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $DASHBOARD_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --data "$PAYLOAD" > /dev/null || true
          echo "Server cleanup complete."

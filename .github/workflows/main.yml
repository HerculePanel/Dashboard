name: L.A. Crimes Server

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Choose server operation or Playit agent setup"
        required: true
        type: choice
        default: start
        options:
          - start
          - setup

      slot:
        description: "Server slot to start (used when mode=start)"
        required: true
        type: choice
        default: "1"
        options:
          - "1"
          - "2"
          - "3"
          - "4"

permissions:
  contents: read

env:
  GIST_ID: cb2aaaece7a231ec707429d41e1457f4
  GIST_FILE: servers.json

  PLAYIT_VERSION: "1.0.10"
  PLAYIT_AGENT_URL: "https://github.com/playit-cloud/playit-agent/releases/download/v1.0.10/playit-linux-amd64"
  PLAYIT_CLI_URL: "https://github.com/playit-cloud/playit-agent/releases/download/v1.0.10/playit-cli-linux-amd64"


# ============================================================
# ============================================================
# PLAYIT AGENT SETUP
# ============================================================
# ============================================================

jobs:

  setup:
    if: ${{ inputs.mode == 'setup' }}

    runs-on: ubuntu-latest

    timeout-minutes: 60

    steps:

      # --------------------------------------------------------
      # INSTALL DEPENDENCIES
      # --------------------------------------------------------

      - name: Install setup dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            wget \
            curl \
            ca-certificates

      # --------------------------------------------------------
      # DOWNLOAD PLAYIT CLI
      # --------------------------------------------------------

      - name: Download Playit CLI
        run: |
          set -e

          echo "=============================================="
          echo "DOWNLOADING PLAYIT CLI"
          echo "=============================================="

          wget \
            --timeout=60 \
            --tries=5 \
            -O "$GITHUB_WORKSPACE/playit-cli" \
            "$PLAYIT_CLI_URL"

          chmod +x "$GITHUB_WORKSPACE/playit-cli"

          echo
          echo "Playit CLI version:"
          "$GITHUB_WORKSPACE/playit-cli" version || true

      # --------------------------------------------------------
      # CREATE ASSIGNABLE AGENTS
      # --------------------------------------------------------

      - name: Create Playit agents
        run: |
          set -e

          PLAYIT_CLI="$GITHUB_WORKSPACE/playit-cli"

          echo
          echo "=================================================="
          echo "PLAYIT AGENT SETUP"
          echo "=================================================="
          echo
          echo "IMPORTANT:"
          echo
          echo "This workflow creates ASSIGNABLE agents."
          echo "That means they can later be selected"
          echo "when creating a Playit tunnel."
          echo
          echo "You have two Playit accounts."
          echo
          echo "Account 1:"
          echo "  Agent 1"
          echo "  Agent 2"
          echo
          echo "Account 2:"
          echo "  Agent 3"
          echo "  Agent 4"
          echo
          echo "=================================================="

          create_agent() {

            SLOT="$1"
            AGENT_NAME="$2"
            ACCOUNT_NAME="$3"

            echo
            echo
            echo "=================================================="
            echo "CREATING PLAYIT AGENT $SLOT"
            echo "=================================================="
            echo
            echo "Agent:"
            echo "$AGENT_NAME"
            echo
            echo "Account:"
            echo "$ACCOUNT_NAME"
            echo
            echo "Agent type:"
            echo "assignable"
            echo

            # ------------------------------------------------
            # GENERATE CLAIM CODE
            # ------------------------------------------------

            CLAIM_CODE="$(
              "$PLAYIT_CLI" \
                --stdout \
                claim generate
            )"

            if [ -z "$CLAIM_CODE" ]; then
              echo
              echo "ERROR:"
              echo "Playit did not return a claim code."
              return 1
            fi

            echo "Claim code generated."

            # ------------------------------------------------
            # CREATE ASSIGNABLE CLAIM URL
            #
            # THIS IS THE IMPORTANT FIX.
            #
            # --type assignable
            # makes the agent assignable to tunnels.
            # ------------------------------------------------

            CLAIM_URL="$(
              "$PLAYIT_CLI" \
                --stdout \
                claim url \
                "$CLAIM_CODE" \
                --name "$AGENT_NAME" \
                --type assignable
            )"

            if [ -z "$CLAIM_URL" ]; then
              echo
              echo "ERROR:"
              echo "Playit did not return a claim URL."
              return 1
            fi

            echo
            echo "**************************************************"
            echo
            echo "PLAYIT AGENT $SLOT"
            echo
            echo "Agent name:"
            echo "$AGENT_NAME"
            echo
            echo "Agent type:"
            echo "ASSIGNABLE"
            echo
            echo "Account:"
            echo "$ACCOUNT_NAME"
            echo
            echo "OPEN THIS URL:"
            echo
            echo "$CLAIM_URL"
            echo
            echo "**************************************************"
            echo
            echo "Instructions:"
            echo
            echo "1. Open the URL above."
            echo
            echo "2. Log into the correct Playit account."
            echo
            echo "3. Claim the agent."
            echo
            echo "4. Make sure it appears as:"
            echo "   $AGENT_NAME"
            echo
            echo "5. Make sure it is an ASSIGNABLE agent."
            echo
            echo "The workflow will wait for approval."
            echo

            # ------------------------------------------------
            # WAIT FOR APPROVAL
            # ------------------------------------------------

            SECRET_OUTPUT="$(
              "$PLAYIT_CLI" \
                --stdout \
                claim exchange \
                --wait 0 \
                "$CLAIM_CODE" 2>&1
            )"

            # ------------------------------------------------
            # EXTRACT SECRET
            # ------------------------------------------------

            SECRET="$(
              echo "$SECRET_OUTPUT" |
              grep -E '^[a-f0-9]{64}$' |
              head -1
            )"

            if [ -z "$SECRET" ]; then

              echo
              echo "ERROR:"
              echo "Playit did not return a valid agent secret."
              echo
              echo "CLI output:"
              echo "$SECRET_OUTPUT"

              return 1
            fi

            echo "::add-mask::$SECRET"

            # ------------------------------------------------
            # DISPLAY SECRET
            # ------------------------------------------------

            echo
            echo
            echo "=================================================="
            echo "AGENT $SLOT SUCCESSFULLY CLAIMED"
            echo "=================================================="
            echo
            echo "Agent:"
            echo "$AGENT_NAME"
            echo
            echo "Type:"
            echo "ASSIGNABLE"
            echo
            echo "GitHub secret name:"
            echo "PLAYIT_SECRET_$SLOT"
            echo
            echo "SECRET:"
            echo
            echo "$SECRET"
            echo
            echo "=================================================="
            echo
            echo "ADD THIS TO GITHUB:"
            echo
            echo "Repository Settings"
            echo "  -> Secrets and variables"
            echo "  -> Actions"
            echo "  -> New repository secret"
            echo
            echo "Name:"
            echo "PLAYIT_SECRET_$SLOT"
            echo
            echo "Value:"
            echo "Paste the secret above."
            echo
            echo "=================================================="

          }


          # ==================================================
          # ACCOUNT 1
          # ==================================================

          create_agent \
            "1" \
            "LAC Server Agent 1" \
            "Playit Account 1"

          create_agent \
            "2" \
            "LAC Server Agent 2" \
            "Playit Account 1"


          # ==================================================
          # ACCOUNT 2
          # ==================================================

          create_agent \
            "3" \
            "LAC Server Agent 3" \
            "Playit Account 2"

          create_agent \
            "4" \
            "LAC Server Agent 4" \
            "Playit Account 2"


          echo
          echo
          echo "=================================================="
          echo "PLAYIT SETUP COMPLETE"
          echo "=================================================="
          echo
          echo "Four ASSIGNABLE Playit agents were created."
          echo
          echo "Required GitHub secrets:"
          echo
          echo "PLAYIT_SECRET_1"
          echo "PLAYIT_SECRET_2"
          echo "PLAYIT_SECRET_3"
          echo "PLAYIT_SECRET_4"
          echo
          echo "After adding all four secrets,"
          echo "run this workflow with mode=start."
          echo
          echo "=================================================="

      # --------------------------------------------------------
      # FINAL SETUP STATUS
      # --------------------------------------------------------

      - name: Setup final status
        if: always()
        run: |
          echo
          echo "=============================================="
          echo "PLAYIT SETUP FINISHED"
          echo "=============================================="

          echo "WORKFLOW_STATUS=${{ job.status }}"
          echo "RUN_ID=${{ github.run_id }}"

          echo "=============================================="


# ============================================================
# ============================================================
# L.A. CRIMES SERVER
# ============================================================
# ============================================================

  server:

    if: ${{ inputs.mode == 'start' }}

    runs-on: ubuntu-latest

    timeout-minutes: 350

    env:
      SLOT: ${{ inputs.slot }}

    steps:

      # --------------------------------------------------------
      # CONFIGURE SLOT
      # --------------------------------------------------------

      - name: Configure server slot
        id: config
        run: |
          set -e

          PORT="7777"

          case "$SLOT" in

            1)
              SECRET_NAME="PLAYIT_SECRET_1"
              DOMAIN="irvine-util.tun.ply.gg"
              IP="147.185.221.231"
              PUBLIC_PORT="54710"
              ;;

            2)
              SECRET_NAME="PLAYIT_SECRET_2"
              DOMAIN="drake-expansion.tun.ply.gg"
              IP="147.185.221.18"
              PUBLIC_PORT="20718"
              ;;

            3)
              SECRET_NAME="PLAYIT_SECRET_3"
              DOMAIN="drake-drama.tun.ply.gg"
              IP="147.185.221.231"
              PUBLIC_PORT="58951"
              ;;

            4)
              SECRET_NAME="PLAYIT_SECRET_4"
              DOMAIN="drake-muscle.tun.ply.gg"
              IP="147.185.221.231"
              PUBLIC_PORT="58968"
              ;;

            *)
              echo "ERROR: Invalid server slot: $SLOT"
              exit 1
              ;;

          esac

          ENDPOINT="${DOMAIN}:${PUBLIC_PORT}"

          echo "PORT=$PORT" >> "$GITHUB_OUTPUT"
          echo "SECRET_NAME=$SECRET_NAME" >> "$GITHUB_OUTPUT"
          echo "DOMAIN=$DOMAIN" >> "$GITHUB_OUTPUT"
          echo "IP=$IP" >> "$GITHUB_OUTPUT"
          echo "PUBLIC_PORT=$PUBLIC_PORT" >> "$GITHUB_OUTPUT"
          echo "ENDPOINT=$ENDPOINT" >> "$GITHUB_OUTPUT"

          echo
          echo "======================================"
          echo "L.A. CRIMES SERVER CONFIGURATION"
          echo "======================================"

          echo "SERVER SLOT: $SLOT"
          echo "LOCAL UDP: $PORT"
          echo "PLAYIT SECRET: $SECRET_NAME"
          echo "PUBLIC DOMAIN: $DOMAIN"
          echo "PUBLIC IP: $IP"
          echo "PUBLIC PORT: $PUBLIC_PORT"
          echo "ENDPOINT: $ENDPOINT"

          echo "======================================"


      # --------------------------------------------------------
      # CHECK SECRETS
      # --------------------------------------------------------

      - name: Check required secrets
        env:
          DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
          PLAYIT_SECRET_1: ${{ secrets.PLAYIT_SECRET_1 }}
          PLAYIT_SECRET_2: ${{ secrets.PLAYIT_SECRET_2 }}
          PLAYIT_SECRET_3: ${{ secrets.PLAYIT_SECRET_3 }}
          PLAYIT_SECRET_4: ${{ secrets.PLAYIT_SECRET_4 }}
        run: |
          set -e

          if [ -z "$DASHBOARD_TOKEN" ]; then
            echo "ERROR: DASHBOARD_TOKEN is missing."
            exit 1
          fi

          case "$SLOT" in

            1)
              PLAYIT_SECRET="$PLAYIT_SECRET_1"
              ;;

            2)
              PLAYIT_SECRET="$PLAYIT_SECRET_2"
              ;;

            3)
              PLAYIT_SECRET="$PLAYIT_SECRET_3"
              ;;

            4)
              PLAYIT_SECRET="$PLAYIT_SECRET_4"
              ;;

            *)
              echo "ERROR: Invalid slot."
              exit 1
              ;;

          esac

          if [ -z "$PLAYIT_SECRET" ]; then

            echo
            echo "ERROR:"
            echo "PLAYIT_SECRET_$SLOT is missing."
            echo
            echo "Run setup first and add the secret."
            exit 1

          fi

          echo "::add-mask::$PLAYIT_SECRET"

          echo "Required secrets found."


      # --------------------------------------------------------
      # CHECKOUT
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # INSTALL DEPENDENCIES
      # --------------------------------------------------------

      - name: Install dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            unzip \
            wget \
            curl \
            ca-certificates \
            iproute2 \
            jq \
            python3


      # --------------------------------------------------------
      # DOWNLOAD DATABASE
      # --------------------------------------------------------

      - name: Download server database
        env:
          DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
        run: |
          set -e

          curl \
            --fail \
            --silent \
            --show-error \
            --request GET \
            --url "https://api.github.com/gists/$GIST_ID" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $DASHBOARD_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            > "$GITHUB_WORKSPACE/gist-response.json"

          jq \
            -e \
            '.files["servers.json"].content' \
            "$GITHUB_WORKSPACE/gist-response.json" \
            > /dev/null

          jq \
            -r \
            '.files["servers.json"].content' \
            "$GITHUB_WORKSPACE/gist-response.json" \
            > "$GITHUB_WORKSPACE/servers.json"

          jq empty \
            "$GITHUB_WORKSPACE/servers.json"

          echo "Database loaded."


      # --------------------------------------------------------
      # MARK STARTING
      # --------------------------------------------------------

      - name: Mark server STARTING
        env:
          DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
          PORT: ${{ steps.config.outputs.PORT }}
          ENDPOINT: ${{ steps.config.outputs.ENDPOINT }}
          IP: ${{ steps.config.outputs.IP }}
        run: |
          set -e

          python3 - \
            "$GITHUB_WORKSPACE/servers.json" \
            "$SLOT" \
            "$GITHUB_RUN_ID" \
            "$PORT" \
            "$ENDPOINT" \
            "$IP" <<'PY'

          import json
          import sys

          path = sys.argv[1]
          slot = int(sys.argv[2])
          run_id = str(sys.argv[3])
          port = int(sys.argv[4])
          endpoint = sys.argv[5]
          ip = sys.argv[6]

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          for server in data["servers"]:

              if int(server["slot"]) == slot:

                  current_run = server.get("run_id")

                  if current_run not in (None, "", run_id):
                      raise SystemExit(
                          f"Server {slot} is already owned by "
                          f"workflow run {current_run}."
                      )

                  server["status"] = "starting"
                  server["run_id"] = run_id
                  server["endpoint"] = endpoint
                  server["ip"] = ip
                  server["port"] = port

                  break

          else:
              raise SystemExit(
                  f"Server slot {slot} was not found."
              )

          with open(path, "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2)
              f.write("\n")

          PY

          PAYLOAD=$(
            jq -n \
              --arg content "$(cat "$GITHUB_WORKSPACE/servers.json")" \
              --arg filename "$GIST_FILE" \
              '{
                files: {
                  ($filename): {
                    content: $content
                  }
                }
              }'
          )

          curl \
            --fail \
            --silent \
            --show-error \
            --request PATCH \
            --url "https://api.github.com/gists/$GIST_ID" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $DASHBOARD_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --data "$PAYLOAD" \
            > /dev/null

          echo "Server $SLOT marked STARTING."


      # --------------------------------------------------------
      # DOWNLOAD L.A. CRIMES
      # --------------------------------------------------------

      - name: Download L.A. Crimes
        run: |
          set -e

          wget \
            --timeout=60 \
            --tries=5 \
            -O "$GITHUB_WORKSPACE/LAC.zip" \
            "https://www.lacrimesonline.com/builds/LAC_Linux_v1.9.6.zip"

          rm -rf "$GITHUB_WORKSPACE/lac"

          mkdir -p "$GITHUB_WORKSPACE/lac"

          unzip -q \
            "$GITHUB_WORKSPACE/LAC.zip" \
            -d "$GITHUB_WORKSPACE/lac"

          SERVER=$(
            find "$GITHUB_WORKSPACE/lac" \
              -type f \
              -name "LAC_Linux_v1.9.6.x86_64" \
              -print -quit
          )

          if [ -z "$SERVER" ]; then

            echo "ERROR: L.A. Crimes executable not found."

            find \
              "$GITHUB_WORKSPACE/lac" \
              -maxdepth 5 \
              -type f \
              -print

            exit 1

          fi

          chmod +x "$SERVER"

          echo "$SERVER" \
            > "$GITHUB_WORKSPACE/server-path.txt"


      # --------------------------------------------------------
      # CREATE SERVER CONFIG
      # --------------------------------------------------------

      - name: Create ServerConfig.txt
        run: |
          set -e

          cat > "$GITHUB_WORKSPACE/ServerConfig.txt" <<'EOF'
          #Maps (City, Garage, RagdollParty, TrainFacility)
          #Maps (ZombieSurvival, NewTerrainRamps, Island, CarSoccer)
          #Editor Maps (editor:myMap)

          admin code=YOUR-NUM-CODE
          lock down=true

          restart timer=never
          max players=16
          map name=City
          starting port=7777

          share to community=true
          server language=English
          server password=none

          username=HOST
          password=0000
          EOF

          echo "ServerConfig:"
          cat "$GITHUB_WORKSPACE/ServerConfig.txt"


      # --------------------------------------------------------
      # INSTALL SERVER CONFIG
      # --------------------------------------------------------

      - name: Install ServerConfig.txt
        run: |
          set -e

          CONFIG_DIR="/root/.config/unity3d/MA/LAC"

          sudo mkdir -p "$CONFIG_DIR"

          sudo cp \
            "$GITHUB_WORKSPACE/ServerConfig.txt" \
            "$CONFIG_DIR/ServerConfig.txt"

          sudo chmod 644 \
            "$CONFIG_DIR/ServerConfig.txt"


      # --------------------------------------------------------
      # START L.A. CRIMES
      # --------------------------------------------------------

      - name: Start L.A. Crimes
        env:
          PORT: ${{ steps.config.outputs.PORT }}
        run: |
          set -e

          SERVER=$(
            cat "$GITHUB_WORKSPACE/server-path.txt"
          )

          SERVER_DIR=$(dirname "$SERVER")

          cd "$SERVER_DIR"

          echo
          echo "======================================"
          echo "STARTING L.A. CRIMES"
          echo "======================================"

          echo "SERVER SLOT: $SLOT"
          echo "LOCAL UDP: $PORT"

          echo "======================================"

          ./LAC_Linux_v1.9.6.x86_64 \
            -batchmode \
            -nographics \
            > "$GITHUB_WORKSPACE/lac-server.log" 2>&1 &

          LAC_PID=$!

          echo "$LAC_PID" \
            > "$GITHUB_WORKSPACE/lac.pid"

          sleep 10

          if ! kill -0 "$LAC_PID" 2>/dev/null; then

            echo "ERROR: L.A. Crimes stopped."

            tail -250 \
              "$GITHUB_WORKSPACE/lac-server.log" \
              || true

            exit 1

          fi

          echo "L.A. Crimes is running."

          echo "LAC_PID=$LAC_PID"

          ss -lunp |
            grep ":$PORT" ||
            true


      # --------------------------------------------------------
      # DOWNLOAD PLAYIT AGENT
      # --------------------------------------------------------

      - name: Download Playit
        run: |
          set -e

          wget \
            --timeout=60 \
            --tries=5 \
            -O "$GITHUB_WORKSPACE/playit" \
            "$PLAYIT_AGENT_URL"

          chmod +x "$GITHUB_WORKSPACE/playit"

          echo "Playit agent downloaded."


      # --------------------------------------------------------
      # PREPARE PLAYIT
      # --------------------------------------------------------

      - name: Prepare Playit runtime
        run: |
          set -e

          sudo rm -rf /run/playit

          sudo mkdir -p /run/playit

          sudo chown \
            "$(id -u):$(id -g)" \
            /run/playit

          sudo chmod 700 /run/playit

          echo "Playit runtime prepared."


      # --------------------------------------------------------
      # START PLAYIT
      # --------------------------------------------------------

      - name: Start Playit
        env:
          PLAYIT_SECRET_1: ${{ secrets.PLAYIT_SECRET_1 }}
          PLAYIT_SECRET_2: ${{ secrets.PLAYIT_SECRET_2 }}
          PLAYIT_SECRET_3: ${{ secrets.PLAYIT_SECRET_3 }}
          PLAYIT_SECRET_4: ${{ secrets.PLAYIT_SECRET_4 }}
        run: |
          set -e

          case "$SLOT" in

            1)
              PLAYIT_SECRET="$PLAYIT_SECRET_1"
              ;;

            2)
              PLAYIT_SECRET="$PLAYIT_SECRET_2"
              ;;

            3)
              PLAYIT_SECRET="$PLAYIT_SECRET_3"
              ;;

            4)
              PLAYIT_SECRET="$PLAYIT_SECRET_4"
              ;;

            *)
              echo "ERROR: Invalid slot."
              exit 1
              ;;

          esac

          if [ -z "$PLAYIT_SECRET" ]; then
            echo "ERROR: Selected Playit secret is empty."
            exit 1
          fi

          echo "::add-mask::$PLAYIT_SECRET"

          echo
          echo "======================================"
          echo "STARTING PLAYIT AGENT"
          echo "======================================"

          echo "SERVER SLOT: $SLOT"

          echo "======================================"

          export PLAYIT_HOME="/run/playit"

          "$GITHUB_WORKSPACE/playit" \
            --secret "$PLAYIT_SECRET" \
            > "$GITHUB_WORKSPACE/playit.log" 2>&1 &

          PLAYIT_PID=$!

          echo "$PLAYIT_PID" \
            > "$GITHUB_WORKSPACE/playit.pid"

          for i in $(seq 1 60); do

            if ! kill -0 "$PLAYIT_PID" 2>/dev/null; then

              echo "ERROR: Playit stopped."

              cat \
                "$GITHUB_WORKSPACE/playit.log" \
                || true

              exit 1

            fi

            echo "Playit running... $i/60"

            sleep 1

          done

          echo "Playit agent is running."


      # --------------------------------------------------------
      # VERIFY PLAYIT
      # --------------------------------------------------------

      - name: Verify Playit
        env:
          ENDPOINT: ${{ steps.config.outputs.ENDPOINT }}
        run: |
          set -e

          echo
          echo "======================================"
          echo "PLAYIT STATUS"
          echo "======================================"

          echo
          echo "Expected endpoint:"
          echo "$ENDPOINT"

          echo
          echo "Playit log:"

          tail -100 \
            "$GITHUB_WORKSPACE/playit.log" \
            || true

          echo
          echo "======================================"
          echo "IMPORTANT"
          echo "======================================"

          echo
          echo "The selected agent must have a tunnel"
          echo "configured in the Playit dashboard."
          echo
          echo "The tunnel should point to:"
          echo
          echo "127.0.0.1:7777"
          echo
          echo "Protocol:"
          echo "UDP"

          echo
          echo "======================================"


      # --------------------------------------------------------
      # MARK ONLINE
      # --------------------------------------------------------

      - name: Mark server ONLINE
        env:
          DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
          PORT: ${{ steps.config.outputs.PORT }}
          ENDPOINT: ${{ steps.config.outputs.ENDPOINT }}
          IP: ${{ steps.config.outputs.IP }}
        run: |
          set -e

          python3 - \
            "$GITHUB_WORKSPACE/servers.json" \
            "$SLOT" \
            "$GITHUB_RUN_ID" \
            "$PORT" \
            "$ENDPOINT" \
            "$IP" <<'PY'

          import json
          import sys

          path = sys.argv[1]
          slot = int(sys.argv[2])
          run_id = str(sys.argv[3])
          port = int(sys.argv[4])
          endpoint = sys.argv[5]
          ip = sys.argv[6]

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          for server in data["servers"]:

              if int(server["slot"]) == slot:

                  if str(server.get("run_id")) != run_id:
                      raise SystemExit(
                          "Refusing to mark server online: "
                          "run ID ownership changed."
                      )

                  server["status"] = "online"
                  server["run_id"] = run_id
                  server["endpoint"] = endpoint
                  server["ip"] = ip
                  server["port"] = port

                  break

          else:
              raise SystemExit(
                  f"Server slot {slot} was not found."
              )

          with open(path, "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2)
              f.write("\n")

          PY

          PAYLOAD=$(
            jq -n \
              --arg content "$(cat "$GITHUB_WORKSPACE/servers.json")" \
              --arg filename "$GIST_FILE" \
              '{
                files: {
                  ($filename): {
                    content: $content
                  }
                }
              }'
          )

          curl \
            --fail \
            --silent \
            --show-error \
            --request PATCH \
            --url "https://api.github.com/gists/$GIST_ID" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $DASHBOARD_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --data "$PAYLOAD" \
            > /dev/null

          echo
          echo "======================================"
          echo "SERVER ONLINE"
          echo "======================================"

          echo "SLOT: $SLOT"
          echo "ENDPOINT: $ENDPOINT"
          echo "IP: $IP"
          echo "PORT: $PORT"
          echo "RUN ID: $GITHUB_RUN_ID"

          echo "======================================"


      # --------------------------------------------------------
      # KEEP ALIVE
      # --------------------------------------------------------

      - name: Keep server alive
        env:
          PORT: ${{ steps.config.outputs.PORT }}
          ENDPOINT: ${{ steps.config.outputs.ENDPOINT }}
        run: |
          set -e

          echo "Server $SLOT is online."
          echo "Endpoint: $ENDPOINT"
          echo "Port: $PORT"

          while true; do

            LAC_PID=$(
              cat "$GITHUB_WORKSPACE/lac.pid"
            )

            PLAYIT_PID=$(
              cat "$GITHUB_WORKSPACE/playit.pid"
            )

            if ! kill -0 "$LAC_PID" 2>/dev/null; then

              echo
              echo "ERROR: L.A. Crimes stopped."

              tail -250 \
                "$GITHUB_WORKSPACE/lac-server.log" \
                || true

              exit 1

            fi

            if ! kill -0 "$PLAYIT_PID" 2>/dev/null; then

              echo
              echo "ERROR: Playit stopped."

              cat \
                "$GITHUB_WORKSPACE/playit.log" \
                || true

              exit 1

            fi

            echo
            echo "[$(date '+%H:%M:%S')]"

            echo "SERVER_SLOT=$SLOT"
            echo "SERVER_STATUS=ONLINE"
            echo "LOCAL_UDP=$PORT"
            echo "PUBLIC_ENDPOINT=$ENDPOINT"
            echo "RUN_ID=${{ github.run_id }}"

            sleep 10

          done


      # --------------------------------------------------------
      # CLEANUP
      # --------------------------------------------------------

      - name: Cleanup server state
        if: always()
        env:
          DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
        run: |
          set +e

          echo
          echo "======================================"
          echo "CLEANING SERVER $SLOT"
          echo "======================================"

          if [ ! -f "$GITHUB_WORKSPACE/servers.json" ]; then
            echo "servers.json does not exist."
            exit 0
          fi

          python3 - \
            "$GITHUB_WORKSPACE/servers.json" \
            "$SLOT" \
            "$GITHUB_RUN_ID" <<'PY'

          import json
          import sys

          path = sys.argv[1]
          slot = int(sys.argv[2])
          run_id = str(sys.argv[3])

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          for server in data["servers"]:

              if int(server["slot"]) != slot:
                  continue

              current_run = server.get("run_id")

              if current_run is not None:

                  if str(current_run) != run_id:

                      print(
                          f"Server {slot} currently belongs to "
                          f"run {current_run}."
                      )

                      print(
                          f"Cleanup from run {run_id} ignored."
                      )

                      sys.exit(0)

              server["status"] = "available"
              server["run_id"] = None

              break

          with open(path, "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2)
              f.write("\n")

          PY

          PAYLOAD=$(
            jq -n \
              --arg content "$(cat "$GITHUB_WORKSPACE/servers.json")" \
              --arg filename "$GIST_FILE" \
              '{
                files: {
                  ($filename): {
                    content: $content
                  }
                }
              }'
          )

          curl \
            --silent \
            --show-error \
            --request PATCH \
            --url "https://api.github.com/gists/$GIST_ID" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $DASHBOARD_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --data "$PAYLOAD" \
            > /dev/null \
            || true

          echo "Cleanup finished."


      # --------------------------------------------------------
      # FINAL STATUS
      # --------------------------------------------------------

      - name: Final status
        if: always()
        env:
          PORT: ${{ steps.config.outputs.PORT }}
          ENDPOINT: ${{ steps.config.outputs.ENDPOINT }}
        run: |
          echo
          echo "======================================"
          echo "L.A. CRIMES SERVER FINISHED"
          echo "======================================"

          echo "SERVER_SLOT=$SLOT"
          echo "LOCAL_UDP=$PORT"
          echo "PUBLIC_ENDPOINT=$ENDPOINT"
          echo "WORKFLOW_STATUS=${{ job.status }}"
          echo "RUN_ID=${{ github.run_id }}"

          echo "======================================"

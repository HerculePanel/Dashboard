name: L.A. Crimes 4 Server Playit

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  GIST_ID: cb2aaaece7a231ec707429d41e1457f4
  GIST_FILE: servers.json

jobs:
  servers:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            unzip \
            wget \
            curl \
            jq \
            python3 \
            iproute2 \
            ca-certificates

      - name: Download server database
        env:
          DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
        run: |
          set -e

          curl \
            --fail \
            --silent \
            --show-error \
            --request GET \
            --url "https://api.github.com/gists/$GIST_ID" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $DASHBOARD_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            > gist.json

          jq -e '.files["servers.json"].content' gist.json > /dev/null

          jq -r \
            '.files["servers.json"].content' \
            gist.json \
            > servers.json

          echo "Current server database:"
          cat servers.json

      - name: Validate server database
        run: |
          set -e

          jq -e '
            .servers |
            length == 4
          ' servers.json > /dev/null

          echo "Server database contains 4 servers."

      - name: Download L.A. Crimes
        run: |
          set -e

          echo "Downloading L.A. Crimes..."

          wget \
            --timeout=60 \
            --tries=5 \
            -O LAC.zip \
            "https://www.lacrimesonline.com/builds/LAC_Linux_v1.9.6.zip"

          rm -rf lac

          mkdir -p lac

          unzip -q \
            LAC.zip \
            -d lac

          SERVER=$(
            find lac \
              -type f \
              -name "LAC_Linux_v1.9.6.x86_64" \
              -print -quit
          )

          if [ -z "$SERVER" ]; then
            echo "ERROR: L.A. Crimes executable not found."
            find lac -maxdepth 5 -type f
            exit 1
          fi

          chmod +x "$SERVER"

          echo "L.A. Crimes executable:"
          echo "$SERVER"

      - name: Mark all servers starting
        env:
          DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
        run: |
          set -e

          python3 - <<'PY'
          import json

          with open("servers.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          for server in data["servers"]:
              server["status"] = "starting"
              server["endpoint"] = None
              server["run_id"] = None

          with open("servers.json", "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2)
              f.write("\n")
          PY

          PAYLOAD=$(
            jq -n \
              --arg content "$(cat servers.json)" \
              '{
                files: {
                  "servers.json": {
                    content: $content
                  }
                }
              }'
          )

          curl \
            --fail \
            --silent \
            --show-error \
            --request PATCH \
            --url "https://api.github.com/gists/$GIST_ID" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $DASHBOARD_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --data "$PAYLOAD" \
            > /dev/null

      - name: Create server directories
        run: |
          set -e

          mkdir -p server1
          mkdir -p server2
          mkdir -p server3
          mkdir -p server4

      - name: Create Server 1 config
        run: |
          cat > server1/ServerConfig.txt <<'EOF'
          (Moderator)
          admin code=YOUR-NUM-CODE
          lock down=true

          (Basic)
          restart timer=never
          max players=16
          map name=City
          starting port=7777

          (Server List)
          share to community=true
          server language=English
          server password=none

          (Roleplay)
          username=HOST
          password=0000
          EOF

      - name: Create Server 2 config
        run: |
          cat > server2/ServerConfig.txt <<'EOF'
          (Moderator)
          admin code=YOUR-NUM-CODE
          lock down=true

          (Basic)
          restart timer=never
          max players=16
          map name=City
          starting port=7778

          (Server List)
          share to community=true
          server language=English
          server password=none

          (Roleplay)
          username=HOST
          password=0000
          EOF

      - name: Create Server 3 config
        run: |
          cat > server3/ServerConfig.txt <<'EOF'
          (Moderator)
          admin code=YOUR-NUM-CODE
          lock down=true

          (Basic)
          restart timer=never
          max players=16
          map name=City
          starting port=7779

          (Server List)
          share to community=true
          server language=English
          server password=none

          (Roleplay)
          username=HOST
          password=0000
          EOF

      - name: Create Server 4 config
        run: |
          cat > server4/ServerConfig.txt <<'EOF'
          (Moderator)
          admin code=YOUR-NUM-CODE
          lock down=true

          (Basic)
          restart timer=never
          max players=16
          map name=City
          starting port=7780

          (Server List)
          share to community=true
          server language=English
          server password=none

          (Roleplay)
          username=HOST
          password=0000
          EOF

      - name: Prepare Unity config directories
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/home1/.config/unity3d/MA/LAC"
          mkdir -p "$GITHUB_WORKSPACE/home2/.config/unity3d/MA/LAC"
          mkdir -p "$GITHUB_WORKSPACE/home3/.config/unity3d/MA/LAC"
          mkdir -p "$GITHUB_WORKSPACE/home4/.config/unity3d/MA/LAC"

          cp server1/ServerConfig.txt \
            "$GITHUB_WORKSPACE/home1/.config/unity3d/MA/LAC/ServerConfig.txt"

          cp server2/ServerConfig.txt \
            "$GITHUB_WORKSPACE/home2/.config/unity3d/MA/LAC/ServerConfig.txt"

          cp server3/ServerConfig.txt \
            "$GITHUB_WORKSPACE/home3/.config/unity3d/MA/LAC/ServerConfig.txt"

          cp server4/ServerConfig.txt \
            "$GITHUB_WORKSPACE/home4/.config/unity3d/MA/LAC/ServerConfig.txt"

      - name: Start all four L.A. Crimes servers
        run: |
          set -e

          SERVER=$(
            find "$GITHUB_WORKSPACE/lac" \
              -type f \
              -name "LAC_Linux_v1.9.6.x86_64" \
              -print -quit
          )

          if [ -z "$SERVER" ]; then
            echo "Server executable missing."
            exit 1
          fi

          echo "Starting Server 1 on UDP 7777..."

          (
            export HOME="$GITHUB_WORKSPACE/home1"

            cd "$(dirname "$SERVER")"

            ./LAC_Linux_v1.9.6.x86_64 \
              -batchmode \
              -nographics \
              > "$GITHUB_WORKSPACE/server1.log" 2>&1
          ) &

          echo $! > server1.pid

          echo "Starting Server 2 on UDP 7778..."

          (
            export HOME="$GITHUB_WORKSPACE/home2"

            cd "$(dirname "$SERVER")"

            ./LAC_Linux_v1.9.6.x86_64 \
              -batchmode \
              -nographics \
              > "$GITHUB_WORKSPACE/server2.log" 2>&1
          ) &

          echo $! > server2.pid

          echo "Starting Server 3 on UDP 7779..."

          (
            export HOME="$GITHUB_WORKSPACE/home3"

            cd "$(dirname "$SERVER")"

            ./LAC_Linux_v1.9.6.x86_64 \
              -batchmode \
              -nographics \
              > "$GITHUB_WORKSPACE/server3.log" 2>&1
          ) &

          echo $! > server3.pid

          echo "Starting Server 4 on UDP 7780..."

          (
            export HOME="$GITHUB_WORKSPACE/home4"

            cd "$(dirname "$SERVER")"

            ./LAC_Linux_v1.9.6.x86_64 \
              -batchmode \
              -nographics \
              > "$GITHUB_WORKSPACE/server4.log" 2>&1
          ) &

          echo $! > server4.pid

          sleep 15

          echo "Checking processes..."

          for FILE in server1.pid server2.pid server3.pid server4.pid; do
            PID=$(cat "$FILE")

            if ! kill -0 "$PID" 2>/dev/null; then
              echo "ERROR: Process $PID stopped."

              for LOG in server1.log server2.log server3.log server4.log; do
                echo
                echo "===== $LOG ====="
                tail -100 "$LOG" || true
              done

              exit 1
            fi
          done

          echo "All four L.A. Crimes processes are running."

      - name: Check local UDP ports
        run: |
          echo "===== UDP PORTS ====="

          ss -lunp | grep -E \
            ':(7777|7778|7779|7780)' \
            || true

      - name: Download Playit
        run: |
          set -e

          wget \
            --timeout=60 \
            --tries=5 \
            -O playit \
            "https://github.com/playit-cloud/playit-agent/releases/download/v1.0.10/playit-linux-amd64"

          chmod +x playit

          ./playit --help || true

      - name: Start Playit agent
        env:
          PLAYIT_SECRET: ${{ secrets.PLAYIT_SECRET }}
        run: |
          set -e

          if [ -z "$PLAYIT_SECRET" ]; then
            echo "ERROR: PLAYIT_SECRET is missing."
            exit 1
          fi

          echo "Starting the single Playit agent..."

          ./playit \
            --secret "$PLAYIT_SECRET" \
            > playit.log 2>&1 &

          echo $! > playit.pid

          sleep 15

          PID=$(cat playit.pid)

          if ! kill -0 "$PID" 2>/dev/null; then
            echo "ERROR: Playit stopped."

            cat playit.log || true

            exit 1
          fi

          echo "Playit agent is running."

          echo
          echo "===== PLAYIT LOG ====="

          cat playit.log || true

      - name: Wait for Playit tunnels
        run: |
          set -e

          echo "Waiting for Playit tunnels..."

          for i in $(seq 1 60); do

            PID=$(cat playit.pid)

            if ! kill -0 "$PID" 2>/dev/null; then
              echo "ERROR: Playit stopped."

              cat playit.log || true

              exit 1
            fi

            echo "Playit check $i/60"

            sleep 2

          done

          echo
          echo "===== FINAL PLAYIT LOG ====="

          cat playit.log || true

      - name: Detect Playit endpoints
        id: endpoints
        run: |
          set -e

          LOG="playit.log"

          echo "Searching Playit output for public addresses..."

          ENDPOINTS=$(
            grep -Eo \
              '([A-Za-z0-9.-]+\.(playit\.gg|playit\.cloud):[0-9]+|[0-9]{1,3}(\.[0-9]{1,3}){3}:[0-9]+)' \
              "$LOG" |
            awk '!seen[$0]++' |
            head -4 ||
            true
          )

          echo "Detected endpoints:"
          echo "$ENDPOINTS"

          ENDPOINT1=$(echo "$ENDPOINTS" | sed -n '1p')
          ENDPOINT2=$(echo "$ENDPOINTS" | sed -n '2p')
          ENDPOINT3=$(echo "$ENDPOINTS" | sed -n '3p')
          ENDPOINT4=$(echo "$ENDPOINTS" | sed -n '4p')

          {
            echo "endpoint1=$ENDPOINT1"
            echo "endpoint2=$ENDPOINT2"
            echo "endpoint3=$ENDPOINT3"
            echo "endpoint4=$ENDPOINT4"
          } >> "$GITHUB_OUTPUT"

      - name: Mark all servers online
        env:
          DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
          ENDPOINT1: ${{ steps.endpoints.outputs.endpoint1 }}
          ENDPOINT2: ${{ steps.endpoints.outputs.endpoint2 }}
          ENDPOINT3: ${{ steps.endpoints.outputs.endpoint3 }}
          ENDPOINT4: ${{ steps.endpoints.outputs.endpoint4 }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -e

          python3 - <<'PY'
          import json
          import os

          endpoints = [
              os.environ.get("ENDPOINT1", "").strip(),
              os.environ.get("ENDPOINT2", "").strip(),
              os.environ.get("ENDPOINT3", "").strip(),
              os.environ.get("ENDPOINT4", "").strip(),
          ]

          run_id = os.environ["RUN_ID"]

          with open("servers.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          for index, server in enumerate(data["servers"]):
              server["status"] = "online"
              server["run_id"] = run_id
              server["endpoint"] = endpoints[index] or None

          with open("servers.json", "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2)
              f.write("\n")
          PY

          echo "Updated database:"
          cat servers.json

          PAYLOAD=$(
            jq -n \
              --arg content "$(cat servers.json)" \
              '{
                files: {
                  "servers.json": {
                    content: $content
                  }
                }
              }'
          )

          curl \
            --fail \
            --silent \
            --show-error \
            --request PATCH \
            --url "https://api.github.com/gists/$GIST_ID" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $DASHBOARD_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --data "$PAYLOAD" \
            > /dev/null

          echo "Gist updated."

      - name: Server ready
        env:
          ENDPOINT1: ${{ steps.endpoints.outputs.endpoint1 }}
          ENDPOINT2: ${{ steps.endpoints.outputs.endpoint2 }}
          ENDPOINT3: ${{ steps.endpoints.outputs.endpoint3 }}
          ENDPOINT4: ${{ steps.endpoints.outputs.endpoint4 }}
        run: |
          echo
          echo "=========================================="
          echo "     L.A. CRIMES 4-SERVER SYSTEM"
          echo "=========================================="

          echo "Server 1: ${ENDPOINT1:-NOT DETECTED}"
          echo "Server 2: ${ENDPOINT2:-NOT DETECTED}"
          echo "Server 3: ${ENDPOINT3:-NOT DETECTED}"
          echo "Server 4: ${ENDPOINT4:-NOT DETECTED}"

          echo
          echo "All four servers are running."
          echo "=========================================="

      - name: Keep all servers alive
        run: |
          set -e

          while true; do

            FAILED=0

            for FILE in \
              server1.pid \
              server2.pid \
              server3.pid \
              server4.pid \
              playit.pid
            do

              if [ ! -f "$FILE" ]; then
                echo "Missing PID file: $FILE"
                FAILED=1
                continue
              fi

              PID=$(cat "$FILE")

              if ! kill -0 "$PID" 2>/dev/null; then
                echo "Process stopped: $FILE ($PID)"
                FAILED=1
              fi

            done

            if [ "$FAILED" -ne 0 ]; then

              echo
              echo "===== SERVER 1 LOG ====="
              tail -100 server1.log || true

              echo
              echo "===== SERVER 2 LOG ====="
              tail -100 server2.log || true

              echo
              echo "===== SERVER 3 LOG ====="
              tail -100 server3.log || true

              echo
              echo "===== SERVER 4 LOG ====="
              tail -100 server4.log || true

              echo
              echo "===== PLAYIT LOG ====="
              tail -100 playit.log || true

              exit 1
            fi

            echo
            echo "[$(date '+%H:%M:%S')]"
            echo "Server 1: ONLINE"
            echo "Server 2: ONLINE"
            echo "Server 3: ONLINE"
            echo "Server 4: ONLINE"
            echo "Playit: ONLINE"

            sleep 10

          done

      - name: Cleanup all servers
        if: always()
        env:
          DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
        run: |
          set +e

          echo "Cleaning up..."

          for FILE in \
            server1.pid \
            server2.pid \
            server3.pid \
            server4.pid \
            playit.pid
          do

            if [ -f "$FILE" ]; then
              PID=$(cat "$FILE")
              kill "$PID" 2>/dev/null || true
            fi

          done

          sleep 3

          if [ -f servers.json ]; then

            python3 - <<'PY'
          import json

          with open("servers.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          for server in data["servers"]:
              server["status"] = "available"
              server["endpoint"] = None
              server["run_id"] = None

          with open("servers.json", "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2)
              f.write("\n")
          PY

            PAYLOAD=$(
              jq -n \
                --arg content "$(cat servers.json)" \
                '{
                  files: {
                    "servers.json": {
                      content: $content
                    }
                  }
                }'
            )

            curl \
              --silent \
              --show-error \
              --request PATCH \
              --url "https://api.github.com/gists/$GIST_ID" \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $DASHBOARD_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --header "Content-Type: application/json" \
              --data "$PAYLOAD" \
              > /dev/null || true

          fi

          echo "All servers returned to AVAILABLE."

      - name: Final status
        if: always()
        run: |
          echo
          echo "=========================================="
          echo "       L.A. CRIMES WORKFLOW FINISHED"
          echo "=========================================="
          echo "Workflow status: ${{ job.status }}"
          echo "=========================================="

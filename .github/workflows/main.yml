name: L.A. Crimes 4 Server Controller

"on":
  workflow_dispatch:

  repository_dispatch:
    types:
      - server-control

permissions:
  contents: read

env:
  GIST_ID: cb2aaaece7a231ec707429d41e1457f4
  GIST_FILE: servers.json

jobs:
  server-controller:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      # ==========================================
      # CHECK DASHBOARD TOKEN
      # ==========================================

      - name: Check dashboard token
        env:
          DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
        run: |
          set -e

          if [ -z "$DASHBOARD_TOKEN" ]; then
            echo "ERROR: DASHBOARD_TOKEN is missing."
            exit 1
          fi

          echo "DASHBOARD_TOKEN_FOUND=true"

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # INSTALL DEPENDENCIES
      # ==========================================

      - name: Install dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            unzip \
            wget \
            curl \
            ca-certificates \
            iproute2 \
            jq \
            python3

      # ==========================================
      # DOWNLOAD CURRENT DATABASE
      # ==========================================

      - name: Download server database
        env:
          DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
        run: |
          set -e

          echo "Downloading server database..."

          curl \
            --fail \
            --silent \
            --show-error \
            --request GET \
            --url "https://api.github.com/gists/$GIST_ID" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $DASHBOARD_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            > "$GITHUB_WORKSPACE/gist-response.json"

          jq \
            -e \
            '.files["servers.json"].content' \
            "$GITHUB_WORKSPACE/gist-response.json" \
            > /dev/null

          jq \
            -r \
            '.files["servers.json"].content' \
            "$GITHUB_WORKSPACE/gist-response.json" \
            > "$GITHUB_WORKSPACE/servers.json"

          echo "Current database:"
          cat "$GITHUB_WORKSPACE/servers.json"

      # ==========================================
      # DETERMINE ACTIVE SERVERS
      # ==========================================

      - name: Determine requested servers
        run: |
          set -e

          python3 - "$GITHUB_WORKSPACE/servers.json" <<'PY'
          import json
          import sys

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          print("======================================")
          print("REQUESTED SERVER STATES")
          print("======================================")

          for server in data["servers"]:
              slot = int(server["slot"])
              desired = server.get("desired", "offline")

              print(
                  f"SERVER {slot}: "
                  f"desired={desired}"
              )
          PY

      # ==========================================
      # DOWNLOAD PLAYIT
      # ==========================================

      - name: Download Playit
        run: |
          set -e

          echo "======================================"
          echo "DOWNLOADING PLAYIT"
          echo "======================================"

          wget \
            --timeout=60 \
            --tries=5 \
            -O "$GITHUB_WORKSPACE/playit" \
            "https://github.com/playit-cloud/playit-agent/releases/download/v1.0.10/playit-linux-amd64"

          chmod +x "$GITHUB_WORKSPACE/playit"

          "$GITHUB_WORKSPACE/playit" --help || true

      # ==========================================
      # DOWNLOAD L.A. CRIMES
      # ==========================================

      - name: Download L.A. Crimes
        run: |
          set -e

          echo "======================================"
          echo "DOWNLOADING L.A. CRIMES"
          echo "======================================"

          wget \
            --timeout=60 \
            --tries=5 \
            -O "$GITHUB_WORKSPACE/LAC.zip" \
            "https://www.lacrimesonline.com/builds/LAC_Linux_v1.9.6.zip"

          rm -rf "$GITHUB_WORKSPACE/lac"

          mkdir -p "$GITHUB_WORKSPACE/lac"

          unzip -q \
            "$GITHUB_WORKSPACE/LAC.zip" \
            -d "$GITHUB_WORKSPACE/lac"

          SERVER_BINARY=$(
            find "$GITHUB_WORKSPACE/lac" \
              -type f \
              -name "LAC_Linux_v1.9.6.x86_64" \
              -print -quit
          )

          if [ -z "$SERVER_BINARY" ]; then
            echo "ERROR: L.A. Crimes executable not found."

            find "$GITHUB_WORKSPACE/lac" \
              -maxdepth 5 \
              -type f \
              -print

            exit 1
          fi

          chmod +x "$SERVER_BINARY"

          echo "L.A. Crimes executable:"
          echo "$SERVER_BINARY"

      # ==========================================
      # CREATE FOUR SERVER RUNTIMES
      # ==========================================

      - name: Create server configurations
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/runtimes"

          for SLOT in 1 2 3 4; do
            mkdir -p \
              "$GITHUB_WORKSPACE/runtimes/server-$SLOT/.config/unity3d/MA/LAC"
          done

          cat > "$GITHUB_WORKSPACE/runtimes/server-1/.config/unity3d/MA/LAC/ServerConfig.txt" <<'EOF'
          (Moderator)
          admin code=YOUR-NUM-CODE
          lock down=true

          (Basic)
          restart timer=never
          max players=16
          map name=City
          starting port=7777

          (Server List)
          share to community=true
          server language=English
          server password=none

          (Roleplay)
          username=HOST
          password=0000
          EOF

          cat > "$GITHUB_WORKSPACE/runtimes/server-2/.config/unity3d/MA/LAC/ServerConfig.txt" <<'EOF'
          (Moderator)
          admin code=YOUR-NUM-CODE
          lock down=true

          (Basic)
          restart timer=never
          max players=16
          map name=City
          starting port=7777

          (Server List)
          share to community=true
          server language=English
          server password=none

          (Roleplay)
          username=HOST
          password=0000
          EOF

          cat > "$GITHUB_WORKSPACE/runtimes/server-3/.config/unity3d/MA/LAC/ServerConfig.txt" <<'EOF'
          (Moderator)
          admin code=YOUR-NUM-CODE
          lock down=true

          (Basic)
          restart timer=never
          max players=16
          map name=City
          starting port=7777

          (Server List)
          share to community=true
          server language=English
          server password=none

          (Roleplay)
          username=HOST
          password=0000
          EOF

          cat > "$GITHUB_WORKSPACE/runtimes/server-4/.config/unity3d/MA/LAC/ServerConfig.txt" <<'EOF'
          (Moderator)
          admin code=YOUR-NUM-CODE
          lock down=true

          (Basic)
          restart timer=never
          max players=16
          map name=City
          starting port=7777

          (Server List)
          share to community=true
          server language=English
          server password=none

          (Roleplay)
          username=HOST
          password=0000
          EOF

          echo "Four server configurations created."

      # ==========================================
      # START REQUESTED L.A. CRIMES SERVERS
      # ==========================================

      - name: Start requested servers
        run: |
          set -e

          SERVER_BINARY=$(
            find "$GITHUB_WORKSPACE/lac" \
              -type f \
              -name "LAC_Linux_v1.9.6.x86_64" \
              -print -quit
          )

          for SLOT in 1 2 3 4; do

            DESIRED=$(
              jq -r \
                --argjson slot "$SLOT" \
                '.servers[] | select(.slot == $slot) | .desired' \
                "$GITHUB_WORKSPACE/servers.json"
            )

            PORT=7777

            echo
            echo "======================================"
            echo "SERVER $SLOT"
            echo "DESIRED=$DESIRED"
            echo "LOCAL_PORT=$PORT"
            echo "======================================"

            if [ "$DESIRED" != "online" ]; then
              echo "Server $SLOT is not requested."
              continue
            fi

            RUNTIME="$GITHUB_WORKSPACE/runtimes/server-$SLOT"

            LOG="$GITHUB_WORKSPACE/server-$SLOT.log"

            echo "Starting Server $SLOT..."

            (
              cd "$(dirname "$SERVER_BINARY")"

              export HOME="$RUNTIME"

              export XDG_CONFIG_HOME="$RUNTIME/.config"

              "./$(basename "$SERVER_BINARY")" \
                -batchmode \
                -nographics
            ) > "$LOG" 2>&1 &

            PID=$!

            echo "$PID" \
              > "$GITHUB_WORKSPACE/server-$SLOT.pid"

            echo "SERVER_$SLOT_PID=$PID"

            sleep 5

            if kill -0 "$PID" 2>/dev/null; then
              echo "Server $SLOT is running."
            else
              echo "ERROR: Server $SLOT failed to start."

              tail -250 "$LOG" || true

              exit 1
            fi

          done

      # ==========================================
      # CHECK LOCAL PORTS
      # ==========================================

      - name: Check server ports
        run: |
          echo "======================================"
          echo "LOCAL SERVER PORTS"
          echo "======================================"

          ss -lunp || true

          for PORT in 7777; do
            echo
            echo "UDP PORT $PORT"

            ss -lunp |
              grep ":$PORT" ||
              echo "Not currently detected."
          done

      # ==========================================
      # CHECK PLAYIT SECRET
      # ==========================================

      - name: Check Playit secret
        env:
          PLAYIT_SECRET: ${{ secrets.PLAYIT_SECRET }}
        run: |
          set -e

          if [ -z "$PLAYIT_SECRET" ]; then
            echo "ERROR: PLAYIT_SECRET is missing."
            exit 1
          fi

          echo "PLAYIT_SECRET_FOUND=true"

      # ==========================================
      # START ONE PLAYIT AGENT
      # ==========================================

      - name: Start single Playit agent
        env:
          PLAYIT_SECRET: ${{ secrets.PLAYIT_SECRET }}
        run: |
          set -e

          echo "======================================"
          echo "STARTING SINGLE PLAYIT AGENT"
          echo "======================================"

          mkdir -p "$GITHUB_WORKSPACE/playit-runtime"
          mkdir -p "$GITHUB_WORKSPACE/playit-sockets"

          chmod 700 \
            "$GITHUB_WORKSPACE/playit-runtime"
          chmod 700 \
            "$GITHUB_WORKSPACE/playit-sockets"

          echo "Starting Playit..."

          cd "$GITHUB_WORKSPACE"

          PLAYIT_RUNTIME="$GITHUB_WORKSPACE/playit-runtime"

          "$GITHUB_WORKSPACE/playit" \
            --secret "$PLAYIT_SECRET" \
            --socket-path "$GITHUB_WORKSPACE/playit-sockets/playit.sock" \
            > "$GITHUB_WORKSPACE/playit.log" 2>&1 &

          PLAYIT_PID=$!

          echo "$PLAYIT_PID" \
            > "$GITHUB_WORKSPACE/playit.pid"

          echo "PLAYIT_PID=$PLAYIT_PID"

          for i in $(seq 1 60); do

            if ! kill -0 "$PLAYIT_PID" 2>/dev/null; then
              echo "ERROR: Playit stopped."

              cat \
                "$GITHUB_WORKSPACE/playit.log" \
                || true

              exit 1
            fi

            echo "Playit running... $i/60"

            sleep 1

          done

          echo "======================================"
          echo "PLAYIT AGENT RUNNING"
          echo "======================================"

          cat \
            "$GITHUB_WORKSPACE/playit.log" \
            || true

      # ==========================================
      # UPDATE DATABASE ONLINE
      # ==========================================

      - name: Mark requested servers online
        env:
          DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
        run: |
          set -e

          python3 - "$GITHUB_WORKSPACE/servers.json" <<'PY'
          import json
          import os
          import sys

          path = sys.argv[1]

          addresses = {
              1: {
                  "domain": "irvine-util.tun.ply.gg",
                  "ip": "147.185.221.231",
                  "port": 54710
              },
              2: {
                  "domain": "drake-expansion.tun.ply.gg",
                  "ip": "147.185.221.18",
                  "port": 20718
              },
              3: {
                  "domain": "drake-drama.tun.ply.gg",
                  "ip": "147.185.221.231",
                  "port": 58951
              },
              4: {
                  "domain": "drake-muscle.tun.ply.gg",
                  "ip": "147.185.221.231",
                  "port": 58968
              }
          }

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          run_id = os.environ.get("GITHUB_RUN_ID")

          for server in data["servers"]:

              slot = int(server["slot"])

              if server.get("desired") == "online":

                  server["status"] = "online"
                  server["run_id"] = int(run_id)

                  server["domain"] = addresses[slot]["domain"]
                  server["ip"] = addresses[slot]["ip"]
                  server["port"] = addresses[slot]["port"]

              else:

                  server["status"] = "offline"
                  server["run_id"] = int(run_id)

          with open(path, "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2)
              f.write("\n")

          PY

          PAYLOAD=$(
            jq -n \
              --arg content "$(cat "$GITHUB_WORKSPACE/servers.json")" \
              --arg filename "$GIST_FILE" \
              '{
                files: {
                  ($filename): {
                    content: $content
                  }
                }
              }'
          )

          curl \
            --fail \
            --silent \
            --show-error \
            --request PATCH \
            --url "https://api.github.com/gists/$GIST_ID" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $DASHBOARD_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --data "$PAYLOAD" \
            > /dev/null

          echo "Server database updated."

      # ==========================================
      # CONTROLLER LOOP
      # ==========================================

      - name: Control server lifecycle
        env:
          DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
        run: |
          set -e

          echo "======================================"
          echo "L.A. CRIMES CONTROLLER ONLINE"
          echo "======================================"

          while true; do

            echo
            echo "======================================"
            echo "CONTROLLER CHECK"
            echo "======================================"
            date

            curl \
              --fail \
              --silent \
              --show-error \
              --request GET \
              --url "https://api.github.com/gists/$GIST_ID" \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $DASHBOARD_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              > "$GITHUB_WORKSPACE/gist-response.json"

            jq \
              -r \
              '.files["servers.json"].content' \
              "$GITHUB_WORKSPACE/gist-response.json" \
              > "$GITHUB_WORKSPACE/servers.json"

            ANY_ONLINE=false

            for SLOT in 1 2 3 4; do

              DESIRED=$(
                jq -r \
                  --argjson slot "$SLOT" \
                  '.servers[] | select(.slot == $slot) | .desired' \
                  "$GITHUB_WORKSPACE/servers.json"
              )

              PID_FILE="$GITHUB_WORKSPACE/server-$SLOT.pid"

              if [ "$DESIRED" = "online" ]; then

                ANY_ONLINE=true

                if [ -f "$PID_FILE" ]; then

                  PID=$(cat "$PID_FILE")

                  if kill -0 "$PID" 2>/dev/null; then
                    echo "Server $SLOT: ONLINE"
                  else
                    echo "Server $SLOT: PROCESS STOPPED"
                  fi

                else

                  echo "Server $SLOT: NO PID"

                fi

              else

                echo "Server $SLOT: requested OFFLINE"

                if [ -f "$PID_FILE" ]; then

                  PID=$(cat "$PID_FILE")

                  if kill -0 "$PID" 2>/dev/null; then
                    echo "Stopping Server $SLOT..."

                    kill "$PID" 2>/dev/null || true

                    sleep 2

                    kill -9 "$PID" 2>/dev/null || true
                  fi

                  rm -f "$PID_FILE"

                fi

              fi

            done

            if [ "$ANY_ONLINE" = false ]; then
              echo
              echo "No servers are requested online."
              echo "Stopping Playit agent."

              if [ -f "$GITHUB_WORKSPACE/playit.pid" ]; then

                PLAYIT_PID=$(
                  cat "$GITHUB_WORKSPACE/playit.pid"
                )

                kill "$PLAYIT_PID" 2>/dev/null || true

              fi

              break
            fi

            sleep 10

          done

      # ==========================================
      # CLEANUP
      # ==========================================

      - name: Cleanup
        if: always()
        run: |
          echo "======================================"
          echo "CLEANUP"
          echo "======================================"

          for SLOT in 1 2 3 4; do

            PID_FILE="$GITHUB_WORKSPACE/server-$SLOT.pid"

            if [ -f "$PID_FILE" ]; then

              PID=$(cat "$PID_FILE")

              kill "$PID" 2>/dev/null || true

            fi

          done

          if [ -f "$GITHUB_WORKSPACE/playit.pid" ]; then

            PLAYIT_PID=$(
              cat "$GITHUB_WORKSPACE/playit.pid"
            )

            kill "$PLAYIT_PID" 2>/dev/null || true

          fi

          echo "Cleanup complete."

      # ==========================================
      # FINAL STATUS
      # ==========================================

      - name: Final status
        if: always()
        run: |
          echo
          echo "======================================"
          echo "L.A. CRIMES WORKFLOW FINISHED"
          echo "======================================"

          echo "WORKFLOW_STATUS=${{ job.status }}"

          echo "======================================"

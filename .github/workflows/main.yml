name: L.A. Crimes 4 Server Network

on:
  workflow_dispatch:
    inputs:
      slot:
        description: "Server slot to start"
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"

permissions:
  contents: read

env:
  GIST_ID: cb2aaaece7a231ec707429d41e1457f4
  GIST_FILE: servers.json

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    strategy:
      fail-fast: false
      matrix:
        slot: ["1", "2", "3", "4"]

    env:
      SLOT: ${{ matrix.slot }}
      LOCAL_UDP: ${{ matrix.slot == '1' && '7777' || matrix.slot == '2' && '7778' || matrix.slot == '3' && '7779' || '7780' }}

    steps:

      # ==========================================
      # CHECK TOKENS
      # ==========================================

      - name: Check required secrets
        env:
          DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
          PLAYIT_SECRET: ${{ secrets.PLAYIT_SECRET }}
        run: |
          set -e

          echo "======================================"
          echo "SERVER SLOT $SLOT"
          echo "LOCAL UDP $LOCAL_UDP"
          echo "======================================"

          if [ -z "$DASHBOARD_TOKEN" ]; then
            echo "ERROR: DASHBOARD_TOKEN is missing."
            exit 1
          fi

          if [ -z "$PLAYIT_SECRET" ]; then
            echo "ERROR: PLAYIT_SECRET is missing."
            exit 1
          fi

          echo "Required secrets found."

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # DEPENDENCIES
      # ==========================================

      - name: Install dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            unzip \
            wget \
            curl \
            ca-certificates \
            iproute2 \
            jq \
            python3

      # ==========================================
      # DOWNLOAD DATABASE
      # ==========================================

      - name: Download server database
        env:
          DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
        run: |
          set -e

          echo "Downloading server database..."

          curl \
            --fail \
            --silent \
            --show-error \
            --request GET \
            --url "https://api.github.com/gists/$GIST_ID" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $DASHBOARD_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            > "$GITHUB_WORKSPACE/gist-response.json"

          jq \
            -e \
            '.files["servers.json"].content' \
            "$GITHUB_WORKSPACE/gist-response.json" \
            > /dev/null

          jq \
            -r \
            '.files["servers.json"].content' \
            "$GITHUB_WORKSPACE/gist-response.json" \
            > "$GITHUB_WORKSPACE/servers.json"

          cat "$GITHUB_WORKSPACE/servers.json"

      # ==========================================
      # MARK STARTING
      # ==========================================

      - name: Mark server STARTING
        env:
          DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
        run: |
          set -e

          python3 - "$GITHUB_WORKSPACE/servers.json" "$SLOT" "$LOCAL_UDP" <<'PY'
          import json
          import sys

          path = sys.argv[1]
          slot = int(sys.argv[2])
          port = int(sys.argv[3])

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          found = False

          for server in data["servers"]:
              if int(server["slot"]) == slot:
                  server["status"] = "starting"
                  server["endpoint"] = None
                  server["port"] = port
                  server["run_id"] = None
                  found = True
                  break

          if not found:
              raise SystemExit(f"Server slot {slot} was not found.")

          with open(path, "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2)
              f.write("\n")
          PY

          PAYLOAD=$(
            jq -n \
              --arg content "$(cat "$GITHUB_WORKSPACE/servers.json")" \
              --arg filename "$GIST_FILE" \
              '{
                files: {
                  ($filename): {
                    content: $content
                  }
                }
              }'
          )

          curl \
            --fail \
            --silent \
            --show-error \
            --request PATCH \
            --url "https://api.github.com/gists/$GIST_ID" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $DASHBOARD_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --data "$PAYLOAD" \
            > /dev/null

          echo "Server $SLOT marked STARTING."

      # ==========================================
      # DOWNLOAD L.A. CRIMES
      # ==========================================

      - name: Download L.A. Crimes
        run: |
          set -e

          wget \
            --timeout=60 \
            --tries=5 \
            -O "$GITHUB_WORKSPACE/LAC.zip" \
            "https://www.lacrimesonline.com/builds/LAC_Linux_v1.9.6.zip"

          rm -rf "$GITHUB_WORKSPACE/lac"

          mkdir -p "$GITHUB_WORKSPACE/lac"

          unzip -q \
            "$GITHUB_WORKSPACE/LAC.zip" \
            -d "$GITHUB_WORKSPACE/lac"

          SERVER=$(
            find "$GITHUB_WORKSPACE/lac" \
              -type f \
              -name "LAC_Linux_v1.9.6.x86_64" \
              -print -quit
          )

          if [ -z "$SERVER" ]; then
            echo "ERROR: L.A. Crimes executable not found."
            find "$GITHUB_WORKSPACE/lac" -maxdepth 5 -type f -print
            exit 1
          fi

          chmod +x "$SERVER"

          echo "$SERVER" > "$GITHUB_WORKSPACE/server-path.txt"

      # ==========================================
      # CREATE SLOT CONFIG
      # ==========================================

      - name: Create ServerConfig.txt
        run: |
          set -e

          cat > "$GITHUB_WORKSPACE/ServerConfig.txt" <<EOF
          #Maps (City, Garage, RagdollParty, TrainFacility)
          #Maps (ZombieSurvival, NewTerrainRamps, Island, CarSoccer)
          #Editor Maps (editor:myMap)

          (Moderator)
          admin code=YOUR-NUM-CODE
          lock down=true

          (Basic)
          restart timer=never
          max players=16
          map name=City
          starting port=$LOCAL_UDP

          (Server List)
          share to community=true
          server language=English
          server password=none

          (Roleplay)
          username=HOST
          password=0000
          EOF

          echo "Server $SLOT configuration:"
          cat "$GITHUB_WORKSPACE/ServerConfig.txt"

      # ==========================================
      # INSTALL CONFIG
      # ==========================================

      - name: Install ServerConfig.txt
        run: |
          set -e

          CONFIG_DIR="/root/.config/unity3d/MA/LAC"

          sudo mkdir -p "$CONFIG_DIR"

          sudo cp \
            "$GITHUB_WORKSPACE/ServerConfig.txt" \
            "$CONFIG_DIR/ServerConfig.txt"

          sudo chmod 644 \
            "$CONFIG_DIR/ServerConfig.txt"

      # ==========================================
      # START L.A. CRIMES
      # ==========================================

      - name: Start L.A. Crimes
        run: |
          set -e

          SERVER=$(cat "$GITHUB_WORKSPACE/server-path.txt")
          SERVER_DIR=$(dirname "$SERVER")

          cd "$SERVER_DIR"

          echo "======================================"
          echo "STARTING L.A. CRIMES"
          echo "SERVER SLOT: $SLOT"
          echo "LOCAL UDP: $LOCAL_UDP"
          echo "======================================"

          ./LAC_Linux_v1.9.6.x86_64 \
            -batchmode \
            -nographics \
            > "$GITHUB_WORKSPACE/lac-server.log" 2>&1 &

          LAC_PID=$!

          echo "$LAC_PID" > "$GITHUB_WORKSPACE/lac.pid"

          sleep 10

          if ! kill -0 "$LAC_PID" 2>/dev/null; then
            echo "ERROR: L.A. Crimes stopped."

            tail -250 \
              "$GITHUB_WORKSPACE/lac-server.log" \
              || true

            exit 1
          fi

          echo "L.A. Crimes is running."
          echo "LAC_PID=$LAC_PID"

          ss -lunp |
            grep ":$LOCAL_UDP" ||
            true

      # ==========================================
      # DOWNLOAD PLAYIT
      # ==========================================

      - name: Download Playit
        run: |
          set -e

          wget \
            --timeout=60 \
            --tries=5 \
            -O "$GITHUB_WORKSPACE/playit" \
            "https://github.com/playit-cloud/playit-agent/releases/download/v1.0.10/playit-linux-amd64"

          chmod +x "$GITHUB_WORKSPACE/playit"

      # ==========================================
      # PREPARE PLAYIT IPC
      # ==========================================

      - name: Prepare Playit runtime
        run: |
          set -e

          sudo rm -rf /run/playit

          sudo mkdir -p /run/playit

          sudo chown \
            "$(id -u):$(id -g)" \
            /run/playit

          sudo chmod 700 /run/playit

          echo "Playit runtime prepared."

      # ==========================================
      # START PLAYIT
      # ==========================================

      - name: Start Playit
        env:
          PLAYIT_SECRET: ${{ secrets.PLAYIT_SECRET }}
        run: |
          set -e

          echo "======================================"
          echo "STARTING PLAYIT"
          echo "SERVER SLOT: $SLOT"
          echo "LOCAL UDP: $LOCAL_UDP"
          echo "======================================"

          export PLAYIT_HOME="/run/playit"

          "$GITHUB_WORKSPACE/playit" \
            --secret "$PLAYIT_SECRET" \
            > "$GITHUB_WORKSPACE/playit.log" 2>&1 &

          PLAYIT_PID=$!

          echo "$PLAYIT_PID" \
            > "$GITHUB_WORKSPACE/playit.pid"

          for i in $(seq 1 60); do
            if ! kill -0 "$PLAYIT_PID" 2>/dev/null; then
              echo "ERROR: Playit stopped."

              cat \
                "$GITHUB_WORKSPACE/playit.log" \
                || true

              exit 1
            fi

            echo "Playit running... $i/60"

            sleep 1
          done

          echo "Playit is running."

      # ==========================================
      # DETECT ENDPOINT
      # ==========================================

      - name: Detect Playit endpoint
        id: endpoint
        run: |
          set -e

          LOG="$GITHUB_WORKSPACE/playit.log"

          ENDPOINT=""

          for i in $(seq 1 30); do

            ENDPOINT=$(
              grep -Eo \
                '([A-Za-z0-9.-]+\.(playit\.gg|playit\.cloud):[0-9]+|[0-9]{1,3}(\.[0-9]{1,3}){3}:[0-9]+)' \
                "$LOG" |
              head -1 ||
              true
            )

            if [ -n "$ENDPOINT" ]; then
              break
            fi

            sleep 2
          done

          if [ -z "$ENDPOINT" ]; then
            echo "WARNING: Public endpoint not detected yet."

            echo "ENDPOINT=" >> "$GITHUB_OUTPUT"
          else
            echo "PUBLIC_ENDPOINT=$ENDPOINT"

            echo "ENDPOINT=$ENDPOINT" \
              >> "$GITHUB_OUTPUT"
          fi

      # ==========================================
      # SAVE RUN ID
      # ==========================================

      - name: Save run information
        env:
          DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
          ENDPOINT: ${{ steps.endpoint.outputs.ENDPOINT }}
        run: |
          set -e

          python3 \
            "$GITHUB_WORKSPACE/servers.json" \
            "$SLOT" \
            "$GITHUB_RUN_ID" \
            "$LOCAL_UDP" \
            "$ENDPOINT" <<'PY'

          import json
          import sys

          path = sys.argv[1]
          slot = int(sys.argv[2])
          run_id = sys.argv[3]
          port = int(sys.argv[4])
          endpoint = sys.argv[5]

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          for server in data["servers"]:
              if int(server["slot"]) == slot:
                  server["status"] = "online"
                  server["run_id"] = run_id
                  server["port"] = port
                  server["endpoint"] = endpoint or None
                  break
          else:
              raise SystemExit(f"Server slot {slot} was not found.")

          with open(path, "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2)
              f.write("\n")
          PY

          PAYLOAD=$(
            jq -n \
              --arg content "$(cat "$GITHUB_WORKSPACE/servers.json")" \
              --arg filename "$GIST_FILE" \
              '{
                files: {
                  ($filename): {
                    content: $content
                  }
                }
              }'
          )

          curl \
            --fail \
            --silent \
            --show-error \
            --request PATCH \
            --url "https://api.github.com/gists/$GIST_ID" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $DASHBOARD_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --data "$PAYLOAD" \
            > /dev/null

          echo "Server $SLOT marked ONLINE."

      # ==========================================
      # SERVER READY
      # ==========================================

      - name: Server ready
        env:
          ENDPOINT: ${{ steps.endpoint.outputs.ENDPOINT }}
        run: |
          echo "======================================"
          echo "L.A. CRIMES SERVER READY"
          echo "======================================"

          echo "SERVER_SLOT=$SLOT"
          echo "SERVER_STATUS=ONLINE"
          echo "SERVER_READY=true"
          echo "LOCAL_UDP=$LOCAL_UDP"
          echo "PUBLIC_ENDPOINT=$ENDPOINT"

      # ==========================================
      # KEEP ALIVE
      # ==========================================

      - name: Keep server alive
        run: |
          set -e

          echo "Server $SLOT is staying online."

          while true; do

            LAC_PID=$(cat \
              "$GITHUB_WORKSPACE/lac.pid")

            PLAYIT_PID=$(cat \
              "$GITHUB_WORKSPACE/playit.pid")

            if ! kill -0 "$LAC_PID" 2>/dev/null; then
              echo "L.A. Crimes stopped."
              exit 1
            fi

            if ! kill -0 "$PLAYIT_PID" 2>/dev/null; then
              echo "Playit stopped."
              exit 1
            fi

            echo
            echo "[$(date '+%H:%M:%S')]"
            echo "SERVER_SLOT=$SLOT"
            echo "SERVER_STATUS=ONLINE"
            echo "LOCAL_UDP=$LOCAL_UDP"

            sleep 10
          done

      # ==========================================
      # CLEANUP DATABASE
      # ==========================================

      - name: Cleanup server state
        if: always()
        env:
          DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
        run: |
          set +e

          echo "======================================"
          echo "CLEANING SERVER $SLOT"
          echo "======================================"

          if [ ! -f "$GITHUB_WORKSPACE/servers.json" ]; then
            exit 0
          fi

          python3 \
            "$GITHUB_WORKSPACE/servers.json" \
            "$SLOT" <<'PY'

          import json
          import sys

          path = sys.argv[1]
          slot = int(sys.argv[2])

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          for server in data["servers"]:
              if int(server["slot"]) == slot:
                  server["status"] = "available"
                  server["endpoint"] = None
                  server["run_id"] = None
                  break

          with open(path, "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2)
              f.write("\n")
          PY

          PAYLOAD=$(
            jq -n \
              --arg content "$(cat "$GITHUB_WORKSPACE/servers.json")" \
              --arg filename "$GIST_FILE" \
              '{
                files: {
                  ($filename): {
                    content: $content
                  }
                }
              }'
          )

          curl \
            --silent \
            --show-error \
            --request PATCH \
            --url "https://api.github.com/gists/$GIST_ID" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $DASHBOARD_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --data "$PAYLOAD" \
            > /dev/null \
            || true

          echo "Server $SLOT returned to AVAILABLE."

      # ==========================================
      # FINAL STATUS
      # ==========================================

      - name: Final status
        if: always()
        run: |
          echo
          echo "======================================"
          echo "L.A. CRIMES SERVER FINISHED"
          echo "======================================"

          echo "SERVER_SLOT=$SLOT"
          echo "LOCAL_UDP=$LOCAL_UDP"
          echo "WORKFLOW_STATUS=${{ job.status }}"

          echo "======================================"

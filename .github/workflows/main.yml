name: L.A. Crimes Playit Server

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # DEPENDENCIES
      # ==========================================

      - name: Install dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            unzip \
            wget \
            curl \
            ca-certificates


      # ==========================================
      # DOWNLOAD PLAYIT CLI
      # ==========================================

      - name: Download Playit CLI
        run: |
          set -e

          echo "======================================"
          echo "LAC_SERVER_STATE=INSTALLING_PLAYIT_CLI"
          echo "======================================"

          wget \
            --timeout=60 \
            --tries=5 \
            -O "$GITHUB_WORKSPACE/playit-cli" \
            "https://github.com/playit-cloud/playit-agent/releases/download/v1.0.10/playit-cli-linux-amd64"

          chmod +x \
            "$GITHUB_WORKSPACE/playit-cli"

          echo
          echo "Playit CLI:"
          "$GITHUB_WORKSPACE/playit-cli" version || true


      # ==========================================
      # DOWNLOAD PLAYIT AGENT
      # ==========================================

      - name: Download Playit agent
        run: |
          set -e

          echo "======================================"
          echo "Downloading Playit agent..."
          echo "======================================"

          wget \
            --timeout=60 \
            --tries=5 \
            -O "$GITHUB_WORKSPACE/playit" \
            "https://github.com/playit-cloud/playit-agent/releases/download/v1.0.10/playit-linux-amd64"

          chmod +x \
            "$GITHUB_WORKSPACE/playit"

          echo
          echo "Playit agent downloaded."

          "$GITHUB_WORKSPACE/playit" \
            --help || true


      # ==========================================
      # PLAYIT SECRET / CLAIM
      # ==========================================

      - name: Setup Playit agent
        env:
          PLAYIT_SECRET: ${{ secrets.PLAYIT_SECRET }}
        run: |
          set -e

          echo "======================================"
          echo "LAC_SERVER_STATE=PLAYIT_SETUP"
          echo "======================================"

          if [ -n "$PLAYIT_SECRET" ]; then

            echo
            echo "Existing PLAYIT_SECRET found."
            echo "Using existing Playit agent."

            printf '%s' "$PLAYIT_SECRET" \
              > "$GITHUB_WORKSPACE/playit-secret"

            chmod 600 \
              "$GITHUB_WORKSPACE/playit-secret"

            echo "PLAYIT_AGENT=EXISTING"

          else

            echo
            echo "======================================"
            echo "PLAYIT AGENT CLAIM REQUIRED"
            echo "======================================"

            echo
            echo "Generating Playit claim..."

            CLAIM_CODE=$(
              "$GITHUB_WORKSPACE/playit-cli" \
                claim generate
            )

            if [ -z "$CLAIM_CODE" ]; then
              echo "ERROR: Could not generate Playit claim."
              exit 1
            fi

            CLAIM_URL=$(
              "$GITHUB_WORKSPACE/playit-cli" \
                claim url "$CLAIM_CODE"
            )

            if [ -z "$CLAIM_URL" ]; then
              echo "ERROR: Could not generate Playit claim URL."
              exit 1
            fi

            echo
            echo
            echo "################################################"
            echo "#                                              #"
            echo "#       PLAYIT AGENT CLAIM REQUIRED            #"
            echo "#                                              #"
            echo "################################################"
            echo
            echo "OPEN THIS URL ON YOUR ANDROID PHONE:"
            echo
            echo "$CLAIM_URL"
            echo
            echo "################################################"
            echo
            echo "CLAIM CODE:"
            echo "$CLAIM_CODE"
            echo
            echo "Approve the agent in your Playit account."
            echo
            echo "################################################"
            echo

            echo "LAC_SERVER_STATE=WAITING_FOR_PLAYIT_CLAIM"
            echo "PLAYIT_AGENT=WAITING"

            echo
            echo "Waiting for approval..."

            "$GITHUB_WORKSPACE/playit-cli" \
              claim exchange "$CLAIM_CODE" \
              --wait 600 \
              > "$GITHUB_WORKSPACE/playit-secret"

            if [ ! -s "$GITHUB_WORKSPACE/playit-secret" ]; then

              echo
              echo "ERROR: Playit did not return an agent secret."

              exit 1

            fi

            chmod 600 \
              "$GITHUB_WORKSPACE/playit-secret"

            echo
            echo "======================================"
            echo "PLAYIT AGENT CLAIMED"
            echo "======================================"

            echo "LAC_SERVER_STATE=PLAYIT_CLAIMED"
            echo "PLAYIT_AGENT=CLAIMED"

            echo
            echo "The Playit secret was received."
            echo "It will NOT be printed."

            echo
            echo "For future runs save it as:"
            echo "PLAYIT_SECRET"

          fi


      # ==========================================
      # DOWNLOAD L.A. CRIMES
      # ==========================================

      - name: Download L.A. Crimes
        run: |
          set -e

          echo "======================================"
          echo "LAC_SERVER_STATE=DOWNLOADING"
          echo "======================================"

          wget \
            --timeout=60 \
            --tries=5 \
            -O "$GITHUB_WORKSPACE/LAC.zip" \
            "https://www.lacrimesonline.com/builds/LAC_Linux_v1.9.6.zip"

          rm -rf \
            "$GITHUB_WORKSPACE/lac"

          mkdir -p \
            "$GITHUB_WORKSPACE/lac"

          unzip -q \
            "$GITHUB_WORKSPACE/LAC.zip" \
            -d "$GITHUB_WORKSPACE/lac"

          SERVER=$(
            find "$GITHUB_WORKSPACE/lac" \
              -type f \
              -name "LAC_Linux_v1.9.6.x86_64" \
              -print -quit
          )

          if [ -z "$SERVER" ]; then

            echo
            echo "ERROR: L.A. Crimes executable was not found."

            echo
            echo "Files found:"

            find "$GITHUB_WORKSPACE/lac" \
              -maxdepth 5 \
              -type f \
              -print

            exit 1

          fi

          chmod +x "$SERVER"

          echo
          echo "L.A. Crimes executable:"
          echo "$SERVER"


      # ==========================================
      # SERVER CONFIG
      # ==========================================

      - name: Create ServerConfig.txt
        run: |
          set -e

          echo "======================================"
          echo "LAC_SERVER_STATE=CONFIGURING"
          echo "======================================"

          cat > "$GITHUB_WORKSPACE/ServerConfig.txt" <<'EOF'
          #Maps (City, Garage, RagdollParty, TrainFacility)
          #Maps (ZombieSurvival, NewTerrainRamps, Island, CarSoccer)
          #Editor Maps (editor:myMap)

          (Moderator)
          admin code=YOUR-NUM-CODE
          lock down=true

          (Basic)
          restart timer=never
          max players=16
          map name=City
          starting port=7777

          (Server List)
          share to community=true
          server language=English
          server password=none

          (Roleplay)
          username=HOST
          password=0000
          EOF

          echo "MAP=City"
          echo "LOCAL_UDP=7777"


      # ==========================================
      # INSTALL SERVER CONFIG
      # ==========================================

      - name: Install ServerConfig.txt
        run: |
          set -e

          CONFIG_DIR="/root/.config/unity3d/MA/LAC"

          sudo mkdir -p \
            "$CONFIG_DIR"

          sudo cp \
            "$GITHUB_WORKSPACE/ServerConfig.txt" \
            "$CONFIG_DIR/ServerConfig.txt"

          sudo chmod 644 \
            "$CONFIG_DIR/ServerConfig.txt"

          echo "CONFIG_INSTALLED=true"


      # ==========================================
      # START L.A. CRIMES
      # ==========================================

      - name: Start L.A. Crimes
        run: |
          set -e

          SERVER=$(
            find "$GITHUB_WORKSPACE/lac" \
              -type f \
              -name "LAC_Linux_v1.9.6.x86_64" \
              -print -quit
          )

          SERVER_DIR=$(dirname "$SERVER")

          cd "$SERVER_DIR"

          echo "======================================"
          echo "LAC_SERVER_STATE=STARTING_GAME"
          echo "======================================"

          echo "MAP=City"
          echo "LOCAL_UDP=7777"

          ./LAC_Linux_v1.9.6.x86_64 \
            -batchmode \
            -nographics \
            > "$GITHUB_WORKSPACE/lac-server.log" 2>&1 &

          LAC_PID=$!

          echo "$LAC_PID" \
            > "$GITHUB_WORKSPACE/lac.pid"

          echo "LAC_PID=$LAC_PID"

          sleep 10

          if ! kill -0 "$LAC_PID" 2>/dev/null; then

            echo
            echo "LAC_SERVER_STATE=GAME_FAILED"

            echo
            echo "===== L.A. CRIMES LOG ====="

            tail -250 \
              "$GITHUB_WORKSPACE/lac-server.log" \
              || true

            exit 1

          fi

          echo
          echo "===== L.A. CRIMES PROCESS ====="

          ps aux | grep '[L]AC_Linux' || true

          echo
          echo "===== UDP 7777 ====="

          ss -lunp | grep ':7777' || true

          echo
          echo "LAC_SERVER_STATE=GAME_RUNNING"


      # ==========================================
      # PREPARE PLAYIT IPC
      # ==========================================

      - name: Prepare Playit IPC
        run: |
          set -e

          echo "======================================"
          echo "LAC_SERVER_STATE=PREPARING_PLAYIT"
          echo "======================================"

          # Playit's official Linux service uses
          # /run/playit/playitd.sock.
          sudo mkdir -p \
            /run/playit

          sudo chmod 755 \
            /run/playit

          SOCKET_PATH="/run/playit/playitd.sock"

          rm -f \
            "$SOCKET_PATH"

          echo "PLAYIT_SOCKET=$SOCKET_PATH"

          echo
          echo "IPC directory:"
          ls -ld /run/playit


      # ==========================================
      # START PLAYIT
      # ==========================================

      - name: Start Playit tunnel
        run: |
          set -e

          echo "======================================"
          echo "LAC_SERVER_STATE=STARTING_TUNNEL"
          echo "======================================"

          echo "TUNNEL_PROVIDER=playit"
          echo "LOCAL_UDP=7777"

          SOCKET_PATH="/run/playit/playitd.sock"

          "$GITHUB_WORKSPACE/playit" \
            --secret-path "$GITHUB_WORKSPACE/playit-secret" \
            --socket-path "$SOCKET_PATH" \
            > "$GITHUB_WORKSPACE/playit.log" 2>&1 &

          PLAYIT_PID=$!

          echo "$PLAYIT_PID" \
            > "$GITHUB_WORKSPACE/playit.pid"

          echo "PLAYIT_PID=$PLAYIT_PID"

          echo
          echo "Waiting for Playit..."

          for i in $(seq 1 30); do

            if ! kill -0 "$PLAYIT_PID" 2>/dev/null; then

              echo
              echo "ERROR: Playit stopped."

              echo
              echo "===== PLAYIT LOG ====="

              cat \
                "$GITHUB_WORKSPACE/playit.log" \
                || true

              exit 1

            fi

            echo "Playit running... $i/30"

            sleep 1

          done

          echo
          echo "======================================"
          echo "LAC_SERVER_STATE=TUNNEL_RUNNING"
          echo "======================================"

          echo "TUNNEL_PROVIDER=playit"
          echo "LOCAL_UDP=7777"

          echo
          echo "===== PLAYIT LOG ====="

          cat \
            "$GITHUB_WORKSPACE/playit.log" \
            || true


      # ==========================================
      # SERVER READY
      # ==========================================

      - name: Server ready
        run: |
          set -e

          echo
          echo "======================================"
          echo "       L.A. CRIMES SERVER READY"
          echo "======================================"

          echo "LAC_SERVER_STATE=ONLINE"
          echo "SERVER_STATUS=ONLINE"
          echo "SERVER_READY=true"

          echo "MAP=City"
          echo "LOCAL_UDP=7777"
          echo "TUNNEL_PROVIDER=playit"

          echo
          echo "======================================"


      # ==========================================
      # KEEP SERVER ALIVE
      # ==========================================

      - name: Keep server alive
        run: |
          set -e

          echo
          echo "======================================"
          echo "SERVER_READY=true"
          echo "SERVER_STATUS=ONLINE"
          echo "LAC_SERVER_STATE=ONLINE"
          echo "MAP=City"
          echo "LOCAL_UDP=7777"
          echo "TUNNEL_PROVIDER=playit"
          echo "======================================"

          while true; do

            LAC_PID=$(cat \
              "$GITHUB_WORKSPACE/lac.pid")

            PLAYIT_PID=$(cat \
              "$GITHUB_WORKSPACE/playit.pid")

            # --------------------------------------
            # L.A. CRIMES CHECK
            # --------------------------------------

            if ! kill -0 "$LAC_PID" 2>/dev/null; then

              echo
              echo "======================================"
              echo "SERVER_READY=false"
              echo "SERVER_STATUS=OFFLINE"
              echo "LAC_SERVER_STATE=GAME_STOPPED"
              echo "======================================"

              echo
              echo "===== L.A. CRIMES LOG ====="

              tail -250 \
                "$GITHUB_WORKSPACE/lac-server.log" \
                || true

              exit 1

            fi

            # --------------------------------------
            # PLAYIT CHECK
            # --------------------------------------

            if ! kill -0 "$PLAYIT_PID" 2>/dev/null; then

              echo
              echo "======================================"
              echo "SERVER_READY=false"
              echo "SERVER_STATUS=OFFLINE"
              echo "LAC_SERVER_STATE=TUNNEL_STOPPED"
              echo "======================================"

              echo
              echo "===== PLAYIT LOG ====="

              cat \
                "$GITHUB_WORKSPACE/playit.log" \
                || true

              exit 1

            fi

            # --------------------------------------
            # HEARTBEAT
            # --------------------------------------

            echo
            echo "[$(date '+%H:%M:%S')]"

            echo "LAC_SERVER_STATE=ONLINE"
            echo "SERVER_READY=true"
            echo "SERVER_STATUS=ONLINE"
            echo "MAP=City"
            echo "LOCAL_UDP=7777"
            echo "TUNNEL_PROVIDER=playit"

            sleep 10

          done

name: L.A. Crimes Playit Server

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # DEPENDENCIES
      # ==========================================

      - name: Install dependencies
        run: |
          set -e

          echo "======================================"
          echo "LAC_SERVER_STATE=INSTALLING_DEPENDENCIES"
          echo "======================================"

          sudo apt-get update

          sudo apt-get install -y \
            unzip \
            wget \
            curl \
            ca-certificates \
            iproute2


      # ==========================================
      # DOWNLOAD PLAYIT CLI
      # ==========================================

      - name: Download Playit CLI
        run: |
          set -e

          echo "======================================"
          echo "LAC_SERVER_STATE=INSTALLING_PLAYIT_CLI"
          echo "======================================"

          wget \
            --timeout=60 \
            --tries=5 \
            -O "$GITHUB_WORKSPACE/playit-cli" \
            "https://github.com/playit-cloud/playit-agent/releases/download/v1.0.10/playit-cli-linux-amd64"

          chmod +x \
            "$GITHUB_WORKSPACE/playit-cli"

          echo "Playit CLI installed."

          "$GITHUB_WORKSPACE/playit-cli" --help || true


      # ==========================================
      # DOWNLOAD PLAYIT AGENT
      # ==========================================

      - name: Download Playit agent
        run: |
          set -e

          echo "======================================"
          echo "LAC_SERVER_STATE=INSTALLING_PLAYIT"
          echo "======================================"

          wget \
            --timeout=60 \
            --tries=5 \
            -O "$GITHUB_WORKSPACE/playit" \
            "https://github.com/playit-cloud/playit-agent/releases/download/v1.0.10/playit-linux-amd64"

          chmod +x \
            "$GITHUB_WORKSPACE/playit"

          echo "Playit agent installed."

          "$GITHUB_WORKSPACE/playit" --help || true


      # ==========================================
      # CHECK PLAYIT SECRET
      # ==========================================

      - name: Check Playit secret
        id: playit_secret_check
        env:
          PLAYIT_SECRET: ${{ secrets.PLAYIT_SECRET }}
        run: |
          set -e

          echo "======================================"
          echo "CHECKING PLAYIT SECRET"
          echo "======================================"

          if [ -n "$PLAYIT_SECRET" ]; then

            echo "HAS_SECRET=true" >> "$GITHUB_OUTPUT"

            echo "PLAYIT_SECRET_FOUND=true"

          else

            echo "HAS_SECRET=false" >> "$GITHUB_OUTPUT"

            echo "PLAYIT_SECRET_FOUND=false"

          fi


      # ==========================================
      # FIRST PLAYIT SETUP
      # ==========================================

      - name: First Playit agent setup
        if: steps.playit_secret_check.outputs.HAS_SECRET == 'false'
        run: |
          set -e

          echo "======================================"
          echo "LAC_SERVER_STATE=PLAYIT_SETUP"
          echo "======================================"

          echo
          echo "############################################################"
          echo "#                                                          #"
          echo "#              FIRST PLAYIT AGENT SETUP                   #"
          echo "#                                                          #"
          echo "############################################################"

          echo
          echo "Generating Playit claim code..."

          CLAIM_OUTPUT=$(
            "$GITHUB_WORKSPACE/playit-cli" \
              claim generate 2>&1
          )

          echo "$CLAIM_OUTPUT"

          CLAIM_CODE=$(
            echo "$CLAIM_OUTPUT" |
            grep -Eo '[0-9]{6,}' |
            tail -1
          )

          if [ -z "$CLAIM_CODE" ]; then

            echo
            echo "ERROR: Could not find Playit claim code."

            exit 1

          fi

          echo
          echo "CLAIM CODE:"
          echo "$CLAIM_CODE"

          echo
          echo "############################################################"
          echo "#                                                          #"
          echo "#              PLAYIT AGENT CLAIM REQUIRED                #"
          echo "#                                                          #"
          echo "############################################################"

          echo
          echo "Open the Playit claim URL shown above."

          echo
          echo "Approve LACServer2 in your Playit account."

          echo
          echo "DO NOT CLOSE THIS WORKFLOW."

          echo
          echo "############################################################"

          echo
          echo "LAC_SERVER_STATE=WAITING_FOR_PLAYIT_CLAIM"
          echo "PLAYIT_AGENT=WAITING"

          # --------------------------------------
          # WAIT FOR CLAIM
          # --------------------------------------

          echo
          echo "Waiting for Playit approval..."

          "$GITHUB_WORKSPACE/playit-cli" \
            claim exchange "$CLAIM_CODE" \
            --wait 600 \
            > "$GITHUB_WORKSPACE/playit-claim-output.txt" 2>&1

          echo
          echo "Playit claim command finished."

          echo
          echo "===== CLAIM OUTPUT ====="

          cat \
            "$GITHUB_WORKSPACE/playit-claim-output.txt"

          # --------------------------------------
          # EXTRACT SECRET
          # --------------------------------------

          SECRET=$(
            grep -Eo '^[A-Za-z0-9_-]{20,}$' \
              "$GITHUB_WORKSPACE/playit-claim-output.txt" |
              tail -1
          )

          if [ -z "$SECRET" ]; then

            echo
            echo "ERROR: Could not extract Playit agent secret."

            echo
            echo "The claim completed, but the returned"
            echo "secret format was not recognized."

            exit 1

          fi

          printf '%s' "$SECRET" \
            > "$GITHUB_WORKSPACE/PLAYIT_SECRET.txt"

          chmod 600 \
            "$GITHUB_WORKSPACE/PLAYIT_SECRET.txt"

          echo
          echo "======================================"
          echo "LAC_SERVER_STATE=PLAYIT_CLAIMED"
          echo "======================================"

          echo
          echo "LACServer2 was successfully claimed."

          echo
          echo "The secret was extracted and will be"
          echo "uploaded as a temporary artifact."

          echo
          echo "DO NOT paste the secret into the workflow."


      # ==========================================
      # UPLOAD SECRET
      # ==========================================

      - name: Upload Playit secret
        if: steps.playit_secret_check.outputs.HAS_SECRET == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: playit-agent-secret
          path: PLAYIT_SECRET.txt
          retention-days: 1
          if-no-files-found: error


      # ==========================================
      # STOP FIRST RUN
      # ==========================================

      - name: Finish first-time setup
        if: steps.playit_secret_check.outputs.HAS_SECRET == 'false'
        run: |
          set -e

          echo
          echo "======================================"
          echo "FIRST PLAYIT SETUP COMPLETE"
          echo "======================================"

          echo
          echo "Download the artifact:"
          echo
          echo "playit-agent-secret"

          echo
          echo "Inside it is:"
          echo
          echo "PLAYIT_SECRET.txt"

          echo
          echo "Create this GitHub repository secret:"
          echo
          echo "PLAYIT_SECRET"

          echo
          echo "Location:"
          echo
          echo "Repository"
          echo "→ Settings"
          echo "→ Secrets and variables"
          echo "→ Actions"
          echo "→ New repository secret"

          echo
          echo "Then run this workflow again."

          echo
          echo "======================================"

          exit 0


      # ==========================================
      # LOAD EXISTING SECRET
      # ==========================================

      - name: Load Playit secret
        if: steps.playit_secret_check.outputs.HAS_SECRET == 'true'
        env:
          PLAYIT_SECRET: ${{ secrets.PLAYIT_SECRET }}
        run: |
          set -e

          echo "======================================"
          echo "LAC_SERVER_STATE=PLAYIT_REUSING_AGENT"
          echo "======================================"

          if [ -z "$PLAYIT_SECRET" ]; then

            echo "ERROR: PLAYIT_SECRET is empty."

            exit 1

          fi

          printf '%s' "$PLAYIT_SECRET" \
            > "$GITHUB_WORKSPACE/playit-secret"

          chmod 600 \
            "$GITHUB_WORKSPACE/playit-secret"

          echo "PLAYIT_AGENT=PERSISTENT"
          echo "LACServer2 will be reused."


      # ==========================================
      # DOWNLOAD L.A. CRIMES
      # ==========================================

      - name: Download L.A. Crimes
        if: steps.playit_secret_check.outputs.HAS_SECRET == 'true'
        run: |
          set -e

          echo "======================================"
          echo "LAC_SERVER_STATE=DOWNLOADING"
          echo "======================================"

          wget \
            --timeout=60 \
            --tries=5 \
            -O "$GITHUB_WORKSPACE/LAC.zip" \
            "https://www.lacrimesonline.com/builds/LAC_Linux_v1.9.6.zip"

          rm -rf \
            "$GITHUB_WORKSPACE/lac"

          mkdir -p \
            "$GITHUB_WORKSPACE/lac"

          unzip -q \
            "$GITHUB_WORKSPACE/LAC.zip" \
            -d "$GITHUB_WORKSPACE/lac"

          SERVER=$(
            find "$GITHUB_WORKSPACE/lac" \
              -type f \
              -name "LAC_Linux_v1.9.6.x86_64" \
              -print -quit
          )

          if [ -z "$SERVER" ]; then

            echo "ERROR: L.A. Crimes executable was not found."

            find "$GITHUB_WORKSPACE/lac" \
              -maxdepth 5 \
              -type f \
              -print

            exit 1

          fi

          chmod +x "$SERVER"

          echo
          echo "L.A. Crimes executable:"
          echo "$SERVER"


      # ==========================================
      # CREATE SERVER CONFIG
      # ==========================================

      - name: Create ServerConfig.txt
        if: steps.playit_secret_check.outputs.HAS_SECRET == 'true'
        run: |
          set -e

          cat > "$GITHUB_WORKSPACE/ServerConfig.txt" <<'EOF'
          #Maps (City, Garage, RagdollParty, TrainFacility)
          #Maps (ZombieSurvival, NewTerrainRamps, Island, CarSoccer)
          #Editor Maps (editor:myMap)

          (Moderator)
          admin code=YOUR-NUM-CODE
          lock down=true

          (Basic)
          restart timer=never
          max players=16
          map name=City
          starting port=7777

          (Server List)
          share to community=true
          server language=English
          server password=none

          (Roleplay)
          username=HOST
          password=0000
          EOF

          echo "======================================"
          echo "LAC_SERVER_STATE=CONFIGURING"
          echo "======================================"

          echo "MAP=City"
          echo "LOCAL_UDP=7777"


      # ==========================================
      # INSTALL SERVER CONFIG
      # ==========================================

      - name: Install ServerConfig.txt
        if: steps.playit_secret_check.outputs.HAS_SECRET == 'true'
        run: |
          set -e

          CONFIG_DIR="/root/.config/unity3d/MA/LAC"

          sudo mkdir -p \
            "$CONFIG_DIR"

          sudo cp \
            "$GITHUB_WORKSPACE/ServerConfig.txt" \
            "$CONFIG_DIR/ServerConfig.txt"

          sudo chmod 644 \
            "$CONFIG_DIR/ServerConfig.txt"

          echo "CONFIG_INSTALLED=true"


      # ==========================================
      # START L.A. CRIMES
      # ==========================================

      - name: Start L.A. Crimes
        if: steps.playit_secret_check.outputs.HAS_SECRET == 'true'
        run: |
          set -e

          SERVER=$(
            find "$GITHUB_WORKSPACE/lac" \
              -type f \
              -name "LAC_Linux_v1.9.6.x86_64" \
              -print -quit
          )

          SERVER_DIR=$(dirname "$SERVER")

          cd "$SERVER_DIR"

          echo "======================================"
          echo "LAC_SERVER_STATE=STARTING_GAME"
          echo "======================================"

          echo "MAP=City"
          echo "LOCAL_UDP=7777"

          ./LAC_Linux_v1.9.6.x86_64 \
            -batchmode \
            -nographics \
            > "$GITHUB_WORKSPACE/lac-server.log" 2>&1 &

          LAC_PID=$!

          echo "$LAC_PID" \
            > "$GITHUB_WORKSPACE/lac.pid"

          echo "LAC_PID=$LAC_PID"

          sleep 10

          if ! kill -0 "$LAC_PID" 2>/dev/null; then

            echo
            echo "LAC_SERVER_STATE=GAME_FAILED"

            tail -250 \
              "$GITHUB_WORKSPACE/lac-server.log" \
              || true

            exit 1

          fi

          echo
          echo "LAC_SERVER_STATE=GAME_RUNNING"

          echo
          echo "===== UDP 7777 ====="

          ss -lunp | grep ':7777' || true


      # ==========================================
      # START PLAYIT TUNNEL
      # ==========================================

      - name: Start Playit tunnel
        if: steps.playit_secret_check.outputs.HAS_SECRET == 'true'
        env:
          PLAYIT_SECRET: ${{ secrets.PLAYIT_SECRET }}
        run: |
          set -e

          echo "======================================"
          echo "LAC_SERVER_STATE=STARTING_TUNNEL"
          echo "======================================"

          echo "TUNNEL_PROVIDER=playit"
          echo "LOCAL_UDP=7777"

          if [ -z "$PLAYIT_SECRET" ]; then

            echo "ERROR: PLAYIT_SECRET is missing."

            exit 1

          fi

          # --------------------------------------
          # CREATE PRIVATE PLAYIT RUNTIME
          # --------------------------------------

          PLAYIT_RUNTIME="$GITHUB_WORKSPACE/playit-runtime"

          rm -rf \
            "$PLAYIT_RUNTIME"

          mkdir -p \
            "$PLAYIT_RUNTIME"

          chmod 700 \
            "$PLAYIT_RUNTIME"

          echo
          echo "PLAYIT_RUNTIME=$PLAYIT_RUNTIME"

          # --------------------------------------
          # CREATE SOCKET DIRECTORY
          # --------------------------------------

          mkdir -p \
            "$PLAYIT_RUNTIME/sockets"

          chmod 700 \
            "$PLAYIT_RUNTIME/sockets"

          # --------------------------------------
          # START PLAYIT
          # --------------------------------------

          echo
          echo "Starting Playit agent..."

          "$GITHUB_WORKSPACE/playit" \
            --secret "$PLAYIT_SECRET" \
            --state-dir "$PLAYIT_RUNTIME" \
            > "$GITHUB_WORKSPACE/playit.log" 2>&1 &

          PLAYIT_PID=$!

          echo "$PLAYIT_PID" \
            > "$GITHUB_WORKSPACE/playit.pid"

          echo "PLAYIT_PID=$PLAYIT_PID"

          # --------------------------------------
          # WAIT FOR PLAYIT
          # --------------------------------------

          echo
          echo "Waiting for Playit..."

          CONNECTED=false

          for i in $(seq 1 60); do

            if ! kill -0 "$PLAYIT_PID" 2>/dev/null; then

              echo
              echo "ERROR: Playit stopped."

              echo
              echo "===== PLAYIT LOG ====="

              cat \
                "$GITHUB_WORKSPACE/playit.log" \
                || true

              exit 1

            fi

            echo "Playit running... $i/60"

            if grep -qi \
              -E "connected|tunnel|online|ready" \
              "$GITHUB_WORKSPACE/playit.log" \
              2>/dev/null; then

              CONNECTED=true

            fi

            sleep 1

          done

          echo
          echo "======================================"
          echo "LAC_SERVER_STATE=TUNNEL_RUNNING"
          echo "======================================"

          echo "TUNNEL_PROVIDER=playit"
          echo "LOCAL_UDP=7777"
          echo "PLAYIT_CONNECTED=$CONNECTED"

          echo
          echo "===== PLAYIT LOG ====="

          cat \
            "$GITHUB_WORKSPACE/playit.log" \
            || true


      # ==========================================
      # SERVER READY
      # ==========================================

      - name: Server ready
        if: steps.playit_secret_check.outputs.HAS_SECRET == 'true'
        run: |
          set -e

          echo
          echo "======================================"
          echo "       L.A. CRIMES SERVER READY"
          echo "======================================"

          echo "LAC_SERVER_STATE=ONLINE"
          echo "SERVER_STATUS=ONLINE"
          echo "SERVER_READY=true"

          echo "MAP=City"
          echo "LOCAL_UDP=7777"
          echo "TUNNEL_PROVIDER=playit"

          echo
          echo "======================================"


      # ==========================================
      # KEEP SERVER ALIVE
      # ==========================================

      - name: Keep server alive
        if: steps.playit_secret_check.outputs.HAS_SECRET == 'true'
        run: |
          set -e

          echo
          echo "======================================"
          echo "SERVER_READY=true"
          echo "SERVER_STATUS=ONLINE"
          echo "LAC_SERVER_STATE=ONLINE"
          echo "MAP=City"
          echo "LOCAL_UDP=7777"
          echo "TUNNEL_PROVIDER=playit"
          echo "======================================"

          while true; do

            LAC_PID=$(cat "$GITHUB_WORKSPACE/lac.pid")
            PLAYIT_PID=$(cat "$GITHUB_WORKSPACE/playit.pid")

            # --------------------------------------
            # CHECK GAME
            # --------------------------------------

            if ! kill -0 "$LAC_PID" 2>/dev/null; then

              echo
              echo "SERVER_READY=false"
              echo "SERVER_STATUS=OFFLINE"
              echo "LAC_SERVER_STATE=GAME_STOPPED"

              echo
              echo "===== L.A. CRIMES LOG ====="

              tail -250 \
                "$GITHUB_WORKSPACE/lac-server.log" \
                || true

              exit 1

            fi

            # --------------------------------------
            # CHECK PLAYIT
            # --------------------------------------

            if ! kill -0 "$PLAYIT_PID" 2>/dev/null; then

              echo
              echo "SERVER_READY=false"
              echo "SERVER_STATUS=OFFLINE"
              echo "LAC_SERVER_STATE=TUNNEL_STOPPED"

              echo
              echo "===== PLAYIT LOG ====="

              cat \
                "$GITHUB_WORKSPACE/playit.log" \
                || true

              exit 1

            fi

            # --------------------------------------
            # STATUS
            # --------------------------------------

            echo
            echo "[$(date '+%H:%M:%S')]"

            echo "LAC_SERVER_STATE=ONLINE"
            echo "SERVER_READY=true"
            echo "SERVER_STATUS=ONLINE"
            echo "MAP=City"
            echo "LOCAL_UDP=7777"
            echo "TUNNEL_PROVIDER=playit"

            sleep 10

          done

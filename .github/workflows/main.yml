name: L.A. Crimes Server

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Server operation"
        required: true
        type: choice
        options:
          - start
          - setup
        default: start

      slot:
        description: "Server slot (ignored for setup)"
        required: true
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"
        default: "1"

permissions:
  contents: read

concurrency:
  group: lac-server-slot-${{ inputs.slot }}
  cancel-in-progress: false

env:
  GIST_ID: cb2aaaece7a231ec707429d41e1457f4
  GIST_FILE: servers.json
  PLAYIT_VERSION: "1.0.10"
  PLAYIT_CLI_URL: "https://github.com/playit-cloud/playit-agent/releases/download/v1.0.10/playit-cli-linux-amd64"
  PLAYIT_AGENT_URL: "https://github.com/playit-cloud/playit-agent/releases/download/v1.0.10/playit-linux-amd64"

jobs:

  setup:
    if: ${{ inputs.mode == 'setup' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PLAYIT_SECRET_1: ${{ secrets.PLAYIT_SECRET_1 }}
      PLAYIT_SECRET_2: ${{ secrets.PLAYIT_SECRET_2 }}
      PLAYIT_SECRET_3: ${{ secrets.PLAYIT_SECRET_3 }}
      PLAYIT_SECRET_4: ${{ secrets.PLAYIT_SECRET_4 }}
      DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
    steps:
      - name: Install tools
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y wget curl jq

      - name: Prepare directories
        run: |
          set -e
          sudo mkdir -p /run/playit
          sudo chmod 777 /run/playit
          mkdir -p "$HOME/.config/playit_gg" "$HOME/.config/playit"

      - name: Download Playit CLI + Agent
        run: |
          set -e
          wget --timeout=60 --tries=5 -O "$GITHUB_WORKSPACE/playit-cli" "$PLAYIT_CLI_URL"
          wget --timeout=60 --tries=5 -O "$GITHUB_WORKSPACE/playit" "$PLAYIT_AGENT_URL"
          chmod +x "$GITHUB_WORKSPACE/playit-cli" "$GITHUB_WORKSPACE/playit"

      - name: Check secrets and create missing agents
        run: |
          set -e
          check_secret() {
            local name="$1" value="$2"
            if [ -z "$value" ]; then echo "MISSING $name"; return 1
            else echo "OK $name"; return 0; fi
          }
          MISSING=()
          check_secret "DASHBOARD_TOKEN" "$DASHBOARD_TOKEN" || MISSING+=("DASHBOARD_TOKEN")
          check_secret "PLAYIT_SECRET_1" "$PLAYIT_SECRET_1" || MISSING+=("PLAYIT_SECRET_1")
          check_secret "PLAYIT_SECRET_2" "$PLAYIT_SECRET_2" || MISSING+=("PLAYIT_SECRET_2")
          check_secret "PLAYIT_SECRET_3" "$PLAYIT_SECRET_3" || MISSING+=("PLAYIT_SECRET_3")
          check_secret "PLAYIT_SECRET_4" "$PLAYIT_SECRET_4" || MISSING+=("PLAYIT_SECRET_4")
          if [ ${#MISSING[@]} -eq 0 ]; then echo "All secrets present."; exit 0; fi
          create_agent() {
            local SECRET_NAME="$1" SLOT_HINT="$2"
            rm -rf "$HOME/.config/playit_gg" "$HOME/.config/playit" 2>/dev/null || true
            mkdir -p "$HOME/.config/playit_gg"
            CLAIM_CODE=$("$GITHUB_WORKSPACE/playit-cli" claim generate 2>/dev/null | tr -d '\r\n' || true)
            if [ -z "$CLAIM_CODE" ] || [ ${#CLAIM_CODE} -lt 8 ]; then echo "claim generate failed"; exit 1; fi
            CLAIM_URL="https://playit.gg/claim/$CLAIM_CODE"
            echo "Open: $CLAIM_URL"
            SECRET=""
            for i in $(seq 1 72); do
              sleep 10
              SECRET=$("$GITHUB_WORKSPACE/playit-cli" claim exchange "$CLAIM_CODE" --wait 5 2>/dev/null | tail -n 15 | grep -oE '[0-9a-fA-F]{32,}' | tail -1 || true)
              if [ -n "$SECRET" ] && [ ${#SECRET} -ge 32 ]; then break; fi
              echo "waiting $((i*10))s"
            done
            if [ -z "$SECRET" ] || [ ${#SECRET} -lt 32 ]; then echo "Timed out"; exit 1; fi
            echo "Secret name : $SECRET_NAME"
            echo "Secret value: $SECRET"
          }
          for s in "${MISSING[@]}"; do
            case "$s" in
              PLAYIT_SECRET_1) create_agent "PLAYIT_SECRET_1" "1" ;;
              PLAYIT_SECRET_2) create_agent "PLAYIT_SECRET_2" "2" ;;
              PLAYIT_SECRET_3) create_agent "PLAYIT_SECRET_3" "3" ;;
              PLAYIT_SECRET_4) create_agent "PLAYIT_SECRET_4" "4" ;;
              DASHBOARD_TOKEN) echo "Add DASHBOARD_TOKEN" ;;
            esac
          done

  server:
    if: ${{ inputs.mode == 'start' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      SLOT: ${{ inputs.slot }}

    steps:
      - name: Configure server slot
        id: config
        run: |
          set -e
          PORT="7777"
          case "$SLOT" in
            1) DOMAIN="drake-missy.tun.ply.gg"; IP="147.185.221.231"; PUBLIC_PORT="46049" ;;
            2) DOMAIN="drake-embraced.tun.ply.gg"; IP="147.185.221.231"; PUBLIC_PORT="47064" ;;
            3) DOMAIN="drake-limbs.tun.ply.gg"; IP="147.185.221.30"; PUBLIC_PORT="40093" ;;
            4) DOMAIN="drake-relativity.tun.ply.gg"; IP="147.185.221.230"; PUBLIC_PORT="49177" ;;
            *) echo "Invalid slot"; exit 1 ;;
          esac
          echo "PORT=$PORT" >> "$GITHUB_OUTPUT"
          echo "IP=$IP" >> "$GITHUB_OUTPUT"
          echo "ENDPOINT=${DOMAIN}:${PUBLIC_PORT}" >> "$GITHUB_OUTPUT"

      - name: Check required secrets
        env:
          DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
          PLAYIT_SECRET_1: ${{ secrets.PLAYIT_SECRET_1 }}
          PLAYIT_SECRET_2: ${{ secrets.PLAYIT_SECRET_2 }}
          PLAYIT_SECRET_3: ${{ secrets.PLAYIT_SECRET_3 }}
          PLAYIT_SECRET_4: ${{ secrets.PLAYIT_SECRET_4 }}
        run: |
          set -e
          [ -n "$DASHBOARD_TOKEN" ] || { echo "DASHBOARD_TOKEN missing"; exit 1; }
          case "$SLOT" in
            1) PLAYIT_SECRET="$PLAYIT_SECRET_1" ;;
            2) PLAYIT_SECRET="$PLAYIT_SECRET_2" ;;
            3) PLAYIT_SECRET="$PLAYIT_SECRET_3" ;;
            4) PLAYIT_SECRET="$PLAYIT_SECRET_4" ;;
          esac
          [ -n "$PLAYIT_SECRET" ] || { echo "PLAYIT_SECRET_$SLOT missing"; exit 1; }
          echo "::add-mask::$PLAYIT_SECRET"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y unzip wget curl ca-certificates iproute2 jq python3 screen libc6-i386 lib32stdc++6 || true

      - name: Disable IPv6
        run: |
          set -e
          sudo sysctl -w net.ipv6.conf.all.disable_ipv6=1
          sudo sysctl -w net.ipv6.conf.default.disable_ipv6=1
          sudo sysctl -w net.ipv6.conf.lo.disable_ipv6=1

      - name: Download server database
        env:
          DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
        run: |
          set -e
          curl --fail --silent --show-error --request GET \
            --url "https://api.github.com/gists/$GIST_ID" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $DASHBOARD_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            > "$GITHUB_WORKSPACE/gist-response.json"
          jq -r '.files["servers.json"].content' "$GITHUB_WORKSPACE/gist-response.json" > "$GITHUB_WORKSPACE/servers.json"
          jq empty "$GITHUB_WORKSPACE/servers.json"

      - name: Mark server STARTING
        env:
          DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
          PORT: ${{ steps.config.outputs.PORT }}
          ENDPOINT: ${{ steps.config.outputs.ENDPOINT }}
          IP: ${{ steps.config.outputs.IP }}
        run: |
          set -e
          python3 - "$GITHUB_WORKSPACE/servers.json" "$SLOT" "$GITHUB_RUN_ID" "$PORT" "$ENDPOINT" "$IP" <<'PY'
          import json, sys
          path, slot, run_id, port, endpoint, ip = sys.argv[1], int(sys.argv[2]), str(sys.argv[3]), int(sys.argv[4]), sys.argv[5], sys.argv[6]
          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)
          for server in data["servers"]:
              if int(server["slot"]) != slot:
                  continue
              current_run = server.get("run_id")
              if current_run not in (None, "", run_id):
                  raise SystemExit(f"Server {slot} owned by {current_run}")
              server.update({"status": "starting", "run_id": run_id, "endpoint": endpoint, "ip": ip, "port": port})
              break
          else:
              raise SystemExit(f"Slot {slot} missing")
          with open(path, "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2)
              f.write("\n")
          PY
          python3 - <<'PY'
          import json, os
          gist_id = os.environ["GIST_ID"]
          token = os.environ["DASHBOARD_TOKEN"]
          filename = os.environ["GIST_FILE"]
          with open(os.path.join(os.environ["GITHUB_WORKSPACE"], "servers.json"), "r", encoding="utf-8") as f:
              content = f.read()
          payload = {"files": {filename: {"content": content}}}
          import urllib.request
          req = urllib.request.Request(
              f"https://api.github.com/gists/{gist_id}",
              data=json.dumps(payload).encode("utf-8"),
              method="PATCH",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
          )
          urllib.request.urlopen(req).read()
          PY

      - name: Download L.A. Crimes
        run: |
          set -e
          wget --timeout=60 --tries=5 -O "$GITHUB_WORKSPACE/LAC.zip" \
            "https://lacrimesonline.com/builds/LAC_Linux_v1.9.6.zip"
          rm -rf "$GITHUB_WORKSPACE/lac"
          mkdir -p "$GITHUB_WORKSPACE/lac"
          unzip -q "$GITHUB_WORKSPACE/LAC.zip" -d "$GITHUB_WORKSPACE/lac"
          SERVER=$(find "$GITHUB_WORKSPACE/lac" -type f -name "LAC_Linux_v1.9.6.x86_64" -print -quit)
          [ -n "$SERVER" ] || { echo "Binary not found"; find "$GITHUB_WORKSPACE/lac" -maxdepth 4 -type f; exit 1; }
          chmod +x "$SERVER"
          echo "$SERVER" > "$GITHUB_WORKSPACE/server-path.txt"
          echo "Binary: $SERVER"

      - name: Install ServerConfig.txt and Prime map into every Unity path
        run: |
          set -e
          [ -f "$GITHUB_WORKSPACE/ServerConfig.txt" ] || { echo "ServerConfig.txt missing in repo root"; exit 1; }
          [ -f "$GITHUB_WORKSPACE/Prime.txt" ] || { echo "Prime.txt missing in repo root"; exit 1; }

          grep -q '^map name=editor:Prime' "$GITHUB_WORKSPACE/ServerConfig.txt" \
            || echo "WARNING: ServerConfig.txt does not contain map name=editor:Prime"

          install_tree() {
            local BASE="$1"
            sudo mkdir -p "$BASE/editor/Prime"
            sudo cp "$GITHUB_WORKSPACE/ServerConfig.txt" "$BASE/ServerConfig.txt"
            sudo cp "$GITHUB_WORKSPACE/Prime.txt" "$BASE/editor/Prime.txt"
            if [ -d "$GITHUB_WORKSPACE/Prime" ]; then
              sudo cp -a "$GITHUB_WORKSPACE/Prime/." "$BASE/editor/Prime/"
            fi
            if [ -f "$GITHUB_WORKSPACE/prefs" ]; then
              sudo cp "$GITHUB_WORKSPACE/prefs" "$BASE/prefs"
            fi
            sudo chmod -R a+rX "$BASE"
          }

          install_tree /root/.config/unity3d/MA/LAC
          install_tree "$HOME/.config/unity3d/MA/LAC"
          if [ -n "${XDG_CONFIG_HOME:-}" ]; then
            install_tree "$XDG_CONFIG_HOME/unity3d/MA/LAC"
          fi

          echo "===== installed files ====="
          sudo find /root/.config/unity3d/MA/LAC -print
          find "$HOME/.config/unity3d/MA/LAC" -print
          echo "===== ServerConfig ====="
          sudo cat /root/.config/unity3d/MA/LAC/ServerConfig.txt

      - name: Start L.A. Crimes with forced config home
        run: |
          set -e
          SERVER=$(cat "$GITHUB_WORKSPACE/server-path.txt")
          cd "$(dirname "$SERVER")"

          sudo -H env \
            HOME=/root \
            XDG_CONFIG_HOME=/root/.config \
            XDG_DATA_HOME=/root/.local/share \
            XDG_CACHE_HOME=/root/.cache \
            ./LAC_Linux_v1.9.6.x86_64 \
            > "$GITHUB_WORKSPACE/lac-server.log" 2>&1 &

          echo $! > "$GITHUB_WORKSPACE/lac.pid"
          sleep 25

          if ! kill -0 "$(cat "$GITHUB_WORKSPACE/lac.pid")" 2>/dev/null; then
            echo "L.A. Crimes stopped"
            tail -300 "$GITHUB_WORKSPACE/lac-server.log" || true
            exit 1
          fi

          echo "PID=$(cat "$GITHUB_WORKSPACE/lac.pid")"
          echo "===== files after start ====="
          sudo find /root/.config/unity3d/MA/LAC -print
          echo "===== ServerConfig after start ====="
          sudo cat /root/.config/unity3d/MA/LAC/ServerConfig.txt || true
          echo "===== log tail ====="
          tail -80 "$GITHUB_WORKSPACE/lac-server.log" || true

      - name: Download Playit agent
        run: |
          set -e
          wget --timeout=60 --tries=5 -O "$GITHUB_WORKSPACE/playit" "$PLAYIT_AGENT_URL"
          chmod +x "$GITHUB_WORKSPACE/playit"

      - name: Start Playit
        env:
          PLAYIT_SECRET_1: ${{ secrets.PLAYIT_SECRET_1 }}
          PLAYIT_SECRET_2: ${{ secrets.PLAYIT_SECRET_2 }}
          PLAYIT_SECRET_3: ${{ secrets.PLAYIT_SECRET_3 }}
          PLAYIT_SECRET_4: ${{ secrets.PLAYIT_SECRET_4 }}
        run: |
          set -e
          case "$SLOT" in
            1) PLAYIT_SECRET="$PLAYIT_SECRET_1" ;;
            2) PLAYIT_SECRET="$PLAYIT_SECRET_2" ;;
            3) PLAYIT_SECRET="$PLAYIT_SECRET_3" ;;
            4) PLAYIT_SECRET="$PLAYIT_SECRET_4" ;;
          esac
          echo "::add-mask::$PLAYIT_SECRET"
          sudo mkdir -p /run/playit
          sudo chmod 777 /run/playit
          mkdir -p "$HOME/.config/playit_gg"
          "$GITHUB_WORKSPACE/playit" --secret "$PLAYIT_SECRET" > "$GITHUB_WORKSPACE/playit.log" 2>&1 &
          echo $! > "$GITHUB_WORKSPACE/playit.pid"
          sleep 10
          kill -0 "$(cat "$GITHUB_WORKSPACE/playit.pid")" 2>/dev/null || { cat "$GITHUB_WORKSPACE/playit.log"; exit 1; }

      - name: Mark server ONLINE
        env:
          DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
          PORT: ${{ steps.config.outputs.PORT }}
          ENDPOINT: ${{ steps.config.outputs.ENDPOINT }}
          IP: ${{ steps.config.outputs.IP }}
        run: |
          set -e
          python3 - "$GITHUB_WORKSPACE/servers.json" "$SLOT" "$GITHUB_RUN_ID" "$PORT" "$ENDPOINT" "$IP" <<'PY'
          import json, sys
          path, slot, run_id, port, endpoint, ip = sys.argv[1], int(sys.argv[2]), str(sys.argv[3]), int(sys.argv[4]), sys.argv[5], sys.argv[6]
          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)
          for server in data["servers"]:
              if int(server["slot"]) != slot:
                  continue
              if str(server.get("run_id")) != run_id:
                  raise SystemExit("ownership changed")
              server.update({"status": "online", "run_id": run_id, "endpoint": endpoint, "ip": ip, "port": port})
              break
          with open(path, "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2)
              f.write("\n")
          PY
          python3 - <<'PY'
          import json, os, urllib.request
          gist_id = os.environ["GIST_ID"]
          token = os.environ["DASHBOARD_TOKEN"]
          filename = os.environ["GIST_FILE"]
          with open(os.path.join(os.environ["GITHUB_WORKSPACE"], "servers.json"), "r", encoding="utf-8") as f:
              content = f.read()
          payload = {"files": {filename: {"content": content}}}
          req = urllib.request.Request(
              f"https://api.github.com/gists/{gist_id}",
              data=json.dumps(payload).encode("utf-8"),
              method="PATCH",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
          )
          urllib.request.urlopen(req).read()
          PY

      - name: Keep server alive
        run: |
          set -e
          while true; do
            kill -0 "$(cat "$GITHUB_WORKSPACE/lac.pid")" 2>/dev/null || { tail -100 "$GITHUB_WORKSPACE/lac-server.log"; exit 1; }
            kill -0 "$(cat "$GITHUB_WORKSPACE/playit.pid")" 2>/dev/null || { cat "$GITHUB_WORKSPACE/playit.log"; exit 1; }
            echo "[$(date '+%H:%M:%S')] SERVER=$SLOT ONLINE"
            sleep 10
          done

      - name: Cleanup server state
        if: always()
        env:
          DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
        run: |
          set +e
          [ -f "$GITHUB_WORKSPACE/servers.json" ] || exit 0
          python3 - "$GITHUB_WORKSPACE/servers.json" "$SLOT" "$GITHUB_RUN_ID" <<'PY'
          import json, sys
          path, slot, run_id = sys.argv[1], int(sys.argv[2]), str(sys.argv[3])
          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)
          for server in data["servers"]:
              if int(server["slot"]) != slot:
                  continue
              current_run = server.get("run_id")
              if current_run is not None and str(current_run) != run_id:
                  print("Cleanup ignored")
                  sys.exit(0)
              server["status"] = "offline"
              server["run_id"] = None
              server["endpoint"] = None
              server["ip"] = None
              server["port"] = None
              break
          with open(path, "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2)
              f.write("\n")
          PY
          python3 - <<'PY'
          import json, os, urllib.request
          gist_id = os.environ.get("GIST_ID", "")
          token = os.environ.get("DASHBOARD_TOKEN", "")
          filename = os.environ.get("GIST_FILE", "servers.json")
          if not gist_id or not token:
              raise SystemExit(0)
          path = os.path.join(os.environ["GITHUB_WORKSPACE"], "servers.json")
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()
          payload = {"files": {filename: {"content": content}}}
          req = urllib.request.Request(
              f"https://api.github.com/gists/{gist_id}",
              data=json.dumps(payload).encode("utf-8"),
              method="PATCH",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
          )
          try:
              urllib.request.urlopen(req).read()
          except Exception:
              pass
          PY

name: L.A. Crimes 4 Server Controller

"on":
  workflow_dispatch:

  repository_dispatch:
    types:
      - server-control

permissions:
  contents: read

env:
  GIST_ID: cb2aaaece7a231ec707429d41e1457f4
  GIST_FILE: servers.json

jobs:
  server-controller:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      # ==========================================
      # CHECK DASHBOARD TOKEN
      # ==========================================

      - name: Check dashboard token
        env:
          DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
        run: |
          set -e

          if [ -z "$DASHBOARD_TOKEN" ]; then
            echo "ERROR: DASHBOARD_TOKEN is missing."
            exit 1
          fi

          echo "DASHBOARD_TOKEN_FOUND=true"

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # INSTALL DEPENDENCIES
      # ==========================================

      - name: Install dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            unzip \
            wget \
            curl \
            ca-certificates \
            iproute2 \
            jq \
            python3

      # ==========================================
      # DOWNLOAD CURRENT DATABASE
      # ==========================================

      - name: Download server database
        env:
          DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
        run: |
          set -e

          echo "Downloading server database..."

          curl \
            --fail \
            --silent \
            --show-error \
            --request GET \
            --url "https://api.github.com/gists/$GIST_ID" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $DASHBOARD_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            > "$GITHUB_WORKSPACE/gist-response.json"

          jq \
            -e \
            '.files["servers.json"].content' \
            "$GITHUB_WORKSPACE/gist-response.json" \
            > /dev/null

          jq \
            -r \
            '.files["servers.json"].content' \
            "$GITHUB_WORKSPACE/gist-response.json" \
            > "$GITHUB_WORKSPACE/servers.json"

          echo "Current database:"
          cat "$GITHUB_WORKSPACE/servers.json"

      # ==========================================
      # DETERMINE ACTIVE SERVERS
      # ==========================================

      - name: Determine requested servers
        run: |
          set -e

          python3 - "$GITHUB_WORKSPACE/servers.json" <<'PY'
          import json
          import sys

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          print("======================================")
          print("REQUESTED SERVER STATES")
          print("======================================")

          for server in data["servers"]:
              slot = int(server["slot"])
              desired = server.get("desired", "offline")

              print(
                  f"SERVER {slot}: "
                  f"desired={desired}"
              )
          PY

      # ==========================================
      # DOWNLOAD PLAYIT
      # ==========================================

      - name: Download Playit
        run: |
          set -e

          echo "======================================"
          echo "DOWNLOADING PLAYIT"
          echo "======================================"

          wget \
            --timeout=60 \
            --tries=5 \
            -O "$GITHUB_WORKSPACE/playit" \
            "https://github.com/playit-cloud/playit-agent/releases/download/v1.0.10/playit-linux-amd64"

          chmod +x "$GITHUB_WORKSPACE/playit"

          "$GITHUB_WORKSPACE/playit" --help || true

      # ==========================================
      # DOWNLOAD L.A. CRIMES (one copy per slot)
      # ==========================================
      # NOTE: host is lacrimesonline.com, no "www", no "dl." subdomain
      # (confirmed working directly). Each slot gets its OWN extracted
      # copy of the binary so four concurrent processes never share
      # one working directory (avoids lock-file / relative-path
      # collisions).

      - name: Download L.A. Crimes
        run: |
          set -e

          echo "======================================"
          echo "DOWNLOADING L.A. CRIMES"
          echo "======================================"

          wget \
            --timeout=60 \
            --tries=5 \
            -O "$GITHUB_WORKSPACE/LAC.zip" \
            "https://lacrimesonline.com/builds/LAC_Linux_v1.9.6.zip"

          for SLOT in 1 2 3 4; do

            rm -rf "$GITHUB_WORKSPACE/lac-$SLOT"

            mkdir -p "$GITHUB_WORKSPACE/lac-$SLOT"

            unzip -q \
              "$GITHUB_WORKSPACE/LAC.zip" \
              -d "$GITHUB_WORKSPACE/lac-$SLOT"

            SERVER_BINARY=$(
              find "$GITHUB_WORKSPACE/lac-$SLOT" \
                -type f \
                -name "LAC_Linux_v1.9.6.x86_64" \
                -print -quit
            )

            if [ -z "$SERVER_BINARY" ]; then
              echo "ERROR: L.A. Crimes executable not found for slot $SLOT."

              find "$GITHUB_WORKSPACE/lac-$SLOT" \
                -maxdepth 5 \
                -type f \
                -print

              exit 1
            fi

            chmod +x "$SERVER_BINARY"

            echo "Slot $SLOT executable: $SERVER_BINARY"

          done

      # ==========================================
      # CREATE FOUR SERVER RUNTIMES
      # ==========================================

      - name: Create server configurations
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/runtimes"

          for SLOT in 1 2 3 4; do
            mkdir -p \
              "$GITHUB_WORKSPACE/runtimes/server-$SLOT/.config/unity3d/MA/LAC"
          done

          PORTS=(0 7777 7778 7779 7780)

          for SLOT in 1 2 3 4; do

            PORT="${PORTS[$SLOT]}"

            cat > "$GITHUB_WORKSPACE/runtimes/server-$SLOT/.config/unity3d/MA/LAC/ServerConfig.txt" <<EOF
          (Moderator)
          admin code=YOUR-NUM-CODE
          lock down=true

          (Basic)
          restart timer=never
          max players=16
          map name=City
          starting port=$PORT

          (Server List)
          share to community=true
          server language=English
          server password=none

          (Roleplay)
          username=HOST
          password=0000
          EOF

          done

          echo "Four server configurations created."

      # ==========================================
      # START REQUESTED L.A. CRIMES SERVERS
      # ==========================================
      # Uses each slot's own binary copy under lac-$SLOT.

      - name: Start requested servers
        run: |
          set -e

          for SLOT in 1 2 3 4; do

            DESIRED=$(
              jq -r \
                --argjson slot "$SLOT" \
                '.servers[] | select(.slot == $slot) | .desired' \
                "$GITHUB_WORKSPACE/servers.json"
            )

            PORT=$((7776 + SLOT))

            echo
            echo "======================================"
            echo "SERVER $SLOT"
            echo "DESIRED=$DESIRED"
            echo "LOCAL_PORT=$PORT"
            echo "======================================"

            if [ "$DESIRED" != "online" ]; then
              echo "Server $SLOT is not requested."
              continue
            fi

            SERVER_BINARY=$(
              find "$GITHUB_WORKSPACE/lac-$SLOT" \
                -type f \
                -name "LAC_Linux_v1.9.6.x86_64" \
                -print -quit
            )

            RUNTIME="$GITHUB_WORKSPACE/runtimes/server-$SLOT"

            LOG="$GITHUB_WORKSPACE/server-$SLOT.log"

            echo "Starting Server $SLOT..."

            (
              cd "$(dirname "$SERVER_BINARY")"

              export HOME="$RUNTIME"

              export XDG_CONFIG_HOME="$RUNTIME/.config"

              "./$(basename "$SERVER_BINARY")" \
                -batchmode \
                -nographics
            ) > "$LOG" 2>&1 &

            PID=$!

            echo "$PID" \
              > "$GITHUB_WORKSPACE/server-$SLOT.pid"

            echo "SERVER_${SLOT}_PID=$PID"

            sleep 5

            if kill -0 "$PID" 2>/dev/null; then
              echo "Server $SLOT is running."
            else
              echo "ERROR: Server $SLOT failed to start."

              tail -250 "$LOG" || true

              exit 1
            fi

          done

      # ==========================================
      # CHECK LOCAL PORTS (per-slot verification)
      # ==========================================
      # Confirms each slot actually BOUND its own assigned
      # UDP port, rather than assuming "process alive" means
      # "listening on the right port".

      - name: Check server ports
        run: |
          echo "======================================"
          echo "LOCAL SERVER PORTS"
          echo "======================================"

          ss -lunp || true

          FAILED=0

          for SLOT in 1 2 3 4; do

            PORT=$((7776 + SLOT))

            PID_FILE="$GITHUB_WORKSPACE/server-$SLOT.pid"

            if [ ! -f "$PID_FILE" ]; then
              echo "Slot $SLOT: not requested, skipping port check."
              continue
            fi

            echo
            echo "SLOT $SLOT expects UDP PORT $PORT"

            if ss -lunp | grep -q ":$PORT "; then
              echo "OK: slot $SLOT is bound to $PORT."
            else
              echo "WARNING: slot $SLOT is NOT bound to $PORT."
              echo "This usually means the game binary ignored"
              echo "the 'starting port=' config value. If another"
              echo "slot IS bound to 7777 instead, all instances"
              echo "are likely colliding on the same hardcoded port."
              FAILED=1
            fi

          done

          if [ "$FAILED" = "1" ]; then
            echo
            echo "======================================"
            echo "PORT VERIFICATION FAILED FOR ONE OR MORE SLOTS"
            echo "======================================"
          fi

      # ==========================================
      # CHECK PLAYIT SECRET
      # ==========================================

      - name: Check Playit secret
        env:
          PLAYIT_SECRET: ${{ secrets.PLAYIT_SECRET }}
        run: |
          set -e

          if [ -z "$PLAYIT_SECRET" ]; then
            echo "ERROR: PLAYIT_SECRET is missing."
            exit 1
          fi

          echo "PLAYIT_SECRET_FOUND=true"

      # ==========================================
      # START ONE PLAYIT AGENT
      # ==========================================

      - name: Start single Playit agent
        env:
          PLAYIT_SECRET: ${{ secrets.PLAYIT_SECRET }}
        run: |
          set -e

          echo "======================================"
          echo "STARTING SINGLE PLAYIT AGENT"
          echo "======================================"

          mkdir -p "$GITHUB_WORKSPACE/playit-runtime"

          chmod 700 \
            "$GITHUB_WORKSPACE/playit-runtime"

          echo "Starting Playit..."

          cd "$GITHUB_WORKSPACE"

          PLAYIT_RUNTIME="$GITHUB_WORKSPACE/playit-runtime"

          "$GITHUB_WORKSPACE/playit" \
            --secret "$PLAYIT_SECRET" \
            > "$GITHUB_WORKSPACE/playit.log" 2>&1 &

          PLAYIT_PID=$!

          echo "$PLAYIT_PID" \
            > "$GITHUB_WORKSPACE/playit.pid"

          echo "PLAYIT_PID=$PLAYIT_PID"

          for i in $(seq 1 60); do

            if ! kill -0 "$PLAYIT_PID" 2>/dev/null; then
              echo "ERROR: Playit stopped."

              cat \
                "$GITHUB_WORKSPACE/playit.log" \
                || true

              exit 1
            fi

            echo "Playit running... $i/60"

            sleep 1

          done

          echo "======================================"
          echo "PLAYIT AGENT RUNNING"
          echo "======================================"

          cat \
            "$GITHUB_WORKSPACE/playit.log" \
            || true

      # ==========================================
      # UPDATE DATABASE ONLINE
      # ==========================================

      - name: Mark requested servers online
        env:
          DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
        run: |
          set -e

          python3 - "$GITHUB_WORKSPACE/servers.json" <<'PY'

          import json
          import os
          import sys

          path = sys.argv[1]

          addresses = {
              1: {
                  "domain": "irvine-util.tun.ply.gg",
                  "ip": "147.185.221.231",
                  "port": 54710
              },
              2: {
                  "domain": "drake-expansion.tun.ply.gg",
                  "ip": "147.185.221.18",
                  "port": 20718
              },
              3: {
                  "domain": "drake-drama.tun.ply.gg",
                  "ip": "147.185.221.231",
                  "port": 58951
              },
              4: {
                  "domain": "drake-muscle.tun.ply.gg",
                  "ip": "147.185.221.231",
                  "port": 58968
              }
          }

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          run_id = os.environ.get("GITHUB_RUN_ID")

          for server in data["servers"]:

              slot = int(server["slot"])

              if server.get("desired") == "online":

                  server["status"] = "online"
                  server["run_id"] = int(run_id)

                  server["domain"] = addresses[slot]["domain"]
                  server["ip"] = addresses[slot]["ip"]
                  server["port"] = addresses[slot]["port"]

              else:

                  server["status"] = "offline"
                  server["run_id"] = int(run_id)

          with open(path, "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2)
              f.write("\n")

          PY

          PAYLOAD=$(
            jq -n \
              --arg content "$(cat "$GITHUB_WORKSPACE/servers.json")" \
              --arg filename "$GIST_FILE" \
              '{
                files: {
                  ($filename): {
                    content: $content
                  }
                }
              }'
          )

          curl \
            --fail \
            --silent \
            --show-error \
            --request PATCH \
            --url "https://api.github.com/gists/$GIST_ID" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $DASHBOARD_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --data "$PAYLOAD" \
            > /dev/null

          echo "Server database updated."

      # ==========================================
      # CONTROLLER LOOP
      # ==========================================
      # Fixed: this loop now also LAUNCHES any slot that
      # becomes newly "desired=online" while the job is
      # already running (previously it only ever stopped
      # servers; starting a 2nd/3rd/4th server after the
      # job had already begun silently did nothing).

      - name: Control server lifecycle
        env:
          DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
        run: |
          set -e

          echo "======================================"
          echo "L.A. CRIMES CONTROLLER ONLINE"
          echo "======================================"

          while true; do

            echo
            echo "======================================"
            echo "CONTROLLER CHECK"
            echo "======================================"
            date

            curl \
              --fail \
              --silent \
              --show-error \
              --request GET \
              --url "https://api.github.com/gists/$GIST_ID" \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $DASHBOARD_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              > "$GITHUB_WORKSPACE/gist-response.json"

            jq \
              -r \
              '.files["servers.json"].content' \
              "$GITHUB_WORKSPACE/gist-response.json" \
              > "$GITHUB_WORKSPACE/servers.json"

            ANY_ONLINE=false
            DB_CHANGED=false

            for SLOT in 1 2 3 4; do

              DESIRED=$(
                jq -r \
                  --argjson slot "$SLOT" \
                  '.servers[] | select(.slot == $slot) | .desired' \
                  "$GITHUB_WORKSPACE/servers.json"
              )

              PID_FILE="$GITHUB_WORKSPACE/server-$SLOT.pid"

              if [ "$DESIRED" = "online" ]; then

                ANY_ONLINE=true

                if [ -f "$PID_FILE" ]; then

                  PID=$(cat "$PID_FILE")

                  if kill -0 "$PID" 2>/dev/null; then
                    echo "Server $SLOT: ONLINE"
                  else
                    echo "Server $SLOT: PROCESS STOPPED, restarting..."
                    rm -f "$PID_FILE"
                  fi

                fi

                if [ ! -f "$PID_FILE" ]; then

                  echo "Server $SLOT: newly requested, starting now..."

                  SERVER_BINARY=$(
                    find "$GITHUB_WORKSPACE/lac-$SLOT" \
                      -type f \
                      -name "LAC_Linux_v1.9.6.x86_64" \
                      -print -quit
                  )

                  RUNTIME="$GITHUB_WORKSPACE/runtimes/server-$SLOT"
                  LOG="$GITHUB_WORKSPACE/server-$SLOT.log"

                  (
                    cd "$(dirname "$SERVER_BINARY")"
                    export HOME="$RUNTIME"
                    export XDG_CONFIG_HOME="$RUNTIME/.config"
                    "./$(basename "$SERVER_BINARY")" \
                      -batchmode \
                      -nographics
                  ) > "$LOG" 2>&1 &

                  NEWPID=$!
                  echo "$NEWPID" > "$PID_FILE"
                  sleep 5

                  if kill -0 "$NEWPID" 2>/dev/null; then
                    echo "Server $SLOT started (PID $NEWPID)."
                  else
                    echo "ERROR: Server $SLOT failed to start."
                    tail -100 "$LOG" || true
                    rm -f "$PID_FILE"
                  fi

                  DB_CHANGED=true

                fi

              else

                echo "Server $SLOT: requested OFFLINE"

                if [ -f "$PID_FILE" ]; then

                  PID=$(cat "$PID_FILE")

                  if kill -0 "$PID" 2>/dev/null; then
                    echo "Stopping Server $SLOT..."

                    kill "$PID" 2>/dev/null || true

                    sleep 2

                    kill -9 "$PID" 2>/dev/null || true
                  fi

                  rm -f "$PID_FILE"

                  DB_CHANGED=true

                fi

              fi

            done

            if [ "$DB_CHANGED" = "true" ]; then

              python3 - "$GITHUB_WORKSPACE/servers.json" <<'PY'
          import json
          import os
          import sys

          path = sys.argv[1]

          addresses = {
              1: {"domain": "irvine-util.tun.ply.gg", "ip": "147.185.221.231", "port": 54710},
              2: {"domain": "drake-expansion.tun.ply.gg", "ip": "147.185.221.18", "port": 20718},
              3: {"domain": "drake-drama.tun.ply.gg", "ip": "147.185.221.231", "port": 58951},
              4: {"domain": "drake-muscle.tun.ply.gg", "ip": "147.185.221.231", "port": 58968}
          }

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          run_id = os.environ.get("GITHUB_RUN_ID")

          for server in data["servers"]:
              slot = int(server["slot"])
              pid_file = f"{os.environ['GITHUB_WORKSPACE']}/server-{slot}.pid"

              if os.path.exists(pid_file):
                  server["status"] = "online"
                  server["run_id"] = int(run_id)
                  server["domain"] = addresses[slot]["domain"]
                  server["ip"] = addresses[slot]["ip"]
                  server["port"] = addresses[slot]["port"]
              else:
                  server["status"] = "offline"
                  server["run_id"] = int(run_id)

          with open(path, "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2)
              f.write("\n")
          PY

              PAYLOAD=$(
                jq -n \
                  --arg content "$(cat "$GITHUB_WORKSPACE/servers.json")" \
                  --arg filename "$GIST_FILE" \
                  '{files: {($filename): {content: $content}}}'
              )

              curl \
                --fail \
                --silent \
                --show-error \
                --request PATCH \
                --url "https://api.github.com/gists/$GIST_ID" \
                --header "Accept: application/vnd.github+json" \
                --header "Authorization: Bearer $DASHBOARD_TOKEN" \
                --header "X-GitHub-Api-Version: 2022-11-28" \
                --header "Content-Type: application/json" \
                --data "$PAYLOAD" \
                > /dev/null

              echo "Server database updated after lifecycle change."

            fi

            if [ "$ANY_ONLINE" = false ]; then
              echo
              echo "No servers are requested online."
              echo "Stopping Playit agent."

              if [ -f "$GITHUB_WORKSPACE/playit.pid" ]; then

                PLAYIT_PID=$(
                  cat "$GITHUB_WORKSPACE/playit.pid"
                )

                kill "$PLAYIT_PID" 2>/dev/null || true

              fi

              break
            fi

            sleep 10

          done

      # ==========================================
      # CLEANUP
      # ==========================================

      - name: Cleanup
        if: always()
        run: |
          echo "======================================"
          echo "CLEANUP"
          echo "======================================"

          for SLOT in 1 2 3 4; do

            PID_FILE="$GITHUB_WORKSPACE/server-$SLOT.pid"

            if [ -f "$PID_FILE" ]; then

              PID=$(cat "$PID_FILE")

              kill "$PID" 2>/dev/null || true

            fi

          done

          if [ -f "$GITHUB_WORKSPACE/playit.pid" ]; then

            PLAYIT_PID=$(
              cat "$GITHUB_WORKSPACE/playit.pid"
            )

            kill "$PLAYIT_PID" 2>/dev/null || true

          fi

          echo "Cleanup complete."

      # ==========================================
      # FINAL STATUS
      # ==========================================

      - name: Final status
        if: always()
        run: |
          echo
          echo "======================================"
          echo "L.A. CRIMES WORKFLOW FINISHED"
          echo "======================================"

          echo "WORKFLOW_STATUS=${{ job.status }}"

          echo "======================================"

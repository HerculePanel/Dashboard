name: L.A. Crimes 4-Server Host

"on":
  workflow_dispatch:
  repository_dispatch:
    types:
      - server-control

permissions:
  contents: read

concurrency:
  group: lac-4server-host
  cancel-in-progress: false

env:
  GIST_ID: cb2aaaece7a231ec707429d41e1457f4
  GIST_FILE: servers.json
  PLAYIT_VERSION: v1.0.10

jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y \
            unzip \
            wget \
            curl \
            ca-certificates \
            iproute2 \
            jq \
            python3

      - name: Check required secrets
        env:
          DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
          PLAYIT_SECRET: ${{ secrets.PLAYIT_SECRET }}
        run: |
          set -e

          if [ -z "$DASHBOARD_TOKEN" ]; then
            echo "ERROR: DASHBOARD_TOKEN is missing."
            exit 1
          fi

          if [ -z "$PLAYIT_SECRET" ]; then
            echo "ERROR: PLAYIT_SECRET is missing."
            exit 1
          fi

          echo "Required secrets found."

      - name: Download server database
        env:
          DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
        run: |
          set -e

          curl \
            --fail \
            --silent \
            --show-error \
            --request GET \
            --url "https://api.github.com/gists/$GIST_ID" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $DASHBOARD_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            > "$GITHUB_WORKSPACE/gist-response.json"

          jq -e --arg filename "$GIST_FILE" '.files[$filename].content' \
            "$GITHUB_WORKSPACE/gist-response.json" > /dev/null

          jq -r --arg filename "$GIST_FILE" '.files[$filename].content' \
            "$GITHUB_WORKSPACE/gist-response.json" \
            > "$GITHUB_WORKSPACE/servers.json"

          jq empty "$GITHUB_WORKSPACE/servers.json"

          echo "Current server database:"
          cat "$GITHUB_WORKSPACE/servers.json"

      - name: Download L.A. Crimes
        run: |
          set -e

          wget \
            --timeout=60 \
            --tries=5 \
            -O "$GITHUB_WORKSPACE/LAC.zip" \
            "https://www.lacrimesonline.com/builds/LAC_Linux_v1.9.6.zip"

          rm -rf "$GITHUB_WORKSPACE/lac"
          mkdir -p "$GITHUB_WORKSPACE/lac"

          unzip -q \
            "$GITHUB_WORKSPACE/LAC.zip" \
            -d "$GITHUB_WORKSPACE/lac"

          SERVER=$(
            find "$GITHUB_WORKSPACE/lac" \
              -type f \
              -name "LAC_Linux_v1.9.6.x86_64" \
              -print -quit
          )

          if [ -z "$SERVER" ]; then
            echo "ERROR: L.A. Crimes executable not found."
            find "$GITHUB_WORKSPACE/lac" -maxdepth 5 -type f -print
            exit 1
          fi

          chmod +x "$SERVER"
          echo "$SERVER" > "$GITHUB_WORKSPACE/server-path.txt"

      - name: Download Playit
        run: |
          set -e

          wget \
            --timeout=60 \
            --tries=5 \
            -O "$GITHUB_WORKSPACE/playit" \
            "https://github.com/playit-cloud/playit-agent/releases/download/$PLAYIT_VERSION/playit-linux-amd64"

          chmod +x "$GITHUB_WORKSPACE/playit"

      - name: Prepare Playit runtime
        run: |
          set -e

          rm -rf "$GITHUB_WORKSPACE/playit-home"
          mkdir -p "$GITHUB_WORKSPACE/playit-home"
          chmod 700 "$GITHUB_WORKSPACE/playit-home"

      - name: Start single Playit agent
        env:
          PLAYIT_SECRET: ${{ secrets.PLAYIT_SECRET }}
        run: |
          set -e

          echo "Starting the single Playit agent."
          echo "This agent must own all four L.A. Crimes tunnels."

          HOME="$GITHUB_WORKSPACE/playit-home" \
            "$GITHUB_WORKSPACE/playit" \
            --secret "$PLAYIT_SECRET" \
            > "$GITHUB_WORKSPACE/playit.log" 2>&1 &

          PLAYIT_PID=$!
          echo "$PLAYIT_PID" > "$GITHUB_WORKSPACE/playit.pid"

          for i in $(seq 1 60); do
            if ! kill -0 "$PLAYIT_PID" 2>/dev/null; then
              echo "ERROR: Playit stopped."
              cat "$GITHUB_WORKSPACE/playit.log" || true
              exit 1
            fi

            if grep -q "tunnels loaded" "$GITHUB_WORKSPACE/playit.log"; then
              echo "Playit reports that tunnels were loaded."
              break
            fi

            echo "Waiting for Playit... $i/60"
            sleep 1
          done

          echo "===== PLAYIT LOG ====="
          cat "$GITHUB_WORKSPACE/playit.log" || true

          if ! kill -0 "$PLAYIT_PID" 2>/dev/null; then
            echo "ERROR: Playit is not running."
            exit 1
          fi

      - name: Prepare server directories
        run: |
          set -e

          for SLOT in 1 2 3 4; do
            HOME_DIR="$GITHUB_WORKSPACE/server-home-$SLOT"
            CONFIG_DIR="$HOME_DIR/.config/unity3d/MA/LAC"

            mkdir -p "$CONFIG_DIR"

            case "$SLOT" in
              1) PORT=7777 ;;
              2) PORT=7778 ;;
              3) PORT=7779 ;;
              4) PORT=7780 ;;
            esac

            cat > "$CONFIG_DIR/ServerConfig.txt" <<EOF
          #Maps (City, Garage, RagdollParty, TrainFacility)
          #Maps (ZombieSurvival, NewTerrainRamps, Island, CarSoccer)
          #Editor Maps (editor:myMap)

          (Moderator)
          admin code=YOUR-NUM-CODE
          lock down=true

          (Basic)
          restart timer=never
          max players=16
          map name=City
          starting port=$PORT

          (Server List)
          share to community=true
          server language=English
          server password=none

          (Roleplay)
          username=HOST
          password=0000
          EOF

            chmod -R u+rwX "$HOME_DIR"
            echo "Prepared slot $SLOT on local UDP port $PORT."
          done

      - name: Create controller scripts
        run: |
          set -e

          cat > "$GITHUB_WORKSPACE/update_gist.py" <<'PY'
          import json
          import sys
          import urllib.request

          gist_id = sys.argv[1]
          token = sys.argv[2]
          path = sys.argv[3]

          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          payload = json.dumps({
              "files": {
                  "servers.json": {
                      "content": content
                  }
              }
          }).encode("utf-8")

          request = urllib.request.Request(
              f"https://api.github.com/gists/{gist_id}",
              data=payload,
              method="PATCH",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              if response.status < 200 or response.status >= 300:
                  raise SystemExit(f"Gist update failed: HTTP {response.status}")
          PY

          cat > "$GITHUB_WORKSPACE/set_slot_status.py" <<'PY'
          import json
          import sys

          path = sys.argv[1]
          slot = int(sys.argv[2])
          status = sys.argv[3]

          endpoint = sys.argv[4] if len(sys.argv) > 4 else None

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          for server in data["servers"]:
              if int(server["slot"]) == slot:
                  server["status"] = status
                  if endpoint is not None:
                      server["endpoint"] = endpoint
                  break
          else:
              raise SystemExit(f"Server slot {slot} was not found.")

          with open(path, "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2)
              f.write("\n")
          PY

      - name: Start and manage requested servers
        env:
          DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
        run: |
          set -e

          SERVER_BINARY=$(cat "$GITHUB_WORKSPACE/server-path.txt")

          declare -a LAC_PIDS
          LAC_PIDS[1]=""
          LAC_PIDS[2]=""
          LAC_PIDS[3]=""
          LAC_PIDS[4]=""

          update_gist() {
            python3 \
              "$GITHUB_WORKSPACE/update_gist.py" \
              "$GIST_ID" \
              "$DASHBOARD_TOKEN" \
              "$GITHUB_WORKSPACE/servers.json"
          }

          refresh_gist() {
            curl \
              --fail \
              --silent \
              --show-error \
              --request GET \
              --url "https://api.github.com/gists/$GIST_ID" \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $DASHBOARD_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              > "$GITHUB_WORKSPACE/gist-response.json"

            jq -r --arg filename "$GIST_FILE" '.files[$filename].content' \
              "$GITHUB_WORKSPACE/gist-response.json" \
              > "$GITHUB_WORKSPACE/servers.json"

            jq empty "$GITHUB_WORKSPACE/servers.json"
          }

          set_status() {
            SLOT="$1"
            STATUS="$2"
            ENDPOINT="${3:-}"

            python3 \
              "$GITHUB_WORKSPACE/set_slot_status.py" \
              "$GITHUB_WORKSPACE/servers.json" \
              "$SLOT" \
              "$STATUS" \
              "$ENDPOINT"

            update_gist
          }

          start_slot() {
            SLOT="$1"

            if [ -n "${LAC_PIDS[$SLOT]}" ] && kill -0 "${LAC_PIDS[$SLOT]}" 2>/dev/null; then
              return
            fi

            case "$SLOT" in
              1) PORT=7777 ;;
              2) PORT=7778 ;;
              3) PORT=7779 ;;
              4) PORT=7780 ;;
            esac

            HOME_DIR="$GITHUB_WORKSPACE/server-home-$SLOT"
            LOG="$GITHUB_WORKSPACE/lac-server-$SLOT.log"

            echo "Starting L.A. Crimes Server $SLOT on UDP $PORT."

            set_status "$SLOT" "starting"

            (
              cd "$(dirname "$SERVER_BINARY")"
              HOME="$HOME_DIR" \
                "$SERVER_BINARY" \
                -batchmode \
                -nographics \
                -logFile "$LOG"
            > /dev/null 2>&1 &

            PID=$!
            LAC_PIDS[$SLOT]="$PID"

            echo "$PID" > "$GITHUB_WORKSPACE/lac-$SLOT.pid"

            sleep 10

            if kill -0 "$PID" 2>/dev/null; then
              set_status "$SLOT" "online"
              echo "Server $SLOT is ONLINE."
            else
              echo "Server $SLOT failed to start."
              tail -250 "$LOG" || true
              set_status "$SLOT" "offline"
            fi
          }

          stop_slot() {
            SLOT="$1"
            PID="${LAC_PIDS[$SLOT]}"

            if [ -n "$PID" ] && kill -0 "$PID" 2>/dev/null; then
              echo "Stopping L.A. Crimes Server $SLOT."
              kill "$PID" 2>/dev/null || true

              for i in $(seq 1 20); do
                if ! kill -0 "$PID" 2>/dev/null; then
                  break
                fi
                sleep 1
              done

              if kill -0 "$PID" 2>/dev/null; then
                kill -9 "$PID" 2>/dev/null || true
              fi
            fi

            LAC_PIDS[$SLOT]=""
            set_status "$SLOT" "offline"
          }

          cleanup() {
            set +e

            for SLOT in 1 2 3 4; do
              PID="${LAC_PIDS[$SLOT]}"
              if [ -n "$PID" ] && kill -0 "$PID" 2>/dev/null; then
                kill "$PID" 2>/dev/null || true
              fi
            done

            if [ -f "$GITHUB_WORKSPACE/playit.pid" ]; then
              PLAYIT_PID=$(cat "$GITHUB_WORKSPACE/playit.pid")
              if kill -0 "$PLAYIT_PID" 2>/dev/null; then
                kill "$PLAYIT_PID" 2>/dev/null || true
              fi
            fi

            for SLOT in 1 2 3 4; do
              python3 \
                "$GITHUB_WORKSPACE/set_slot_status.py" \
                "$GITHUB_WORKSPACE/servers.json" \
                "$SLOT" \
                "offline" \
                || true
            done

            update_gist || true
          }

          trap cleanup EXIT INT TERM

          echo "======================================"
          echo "L.A. CRIMES 4-SERVER CONTROLLER"
          echo "======================================"

          refresh_gist

          while true; do
            refresh_gist

            ONLINE_COUNT=0

            for SLOT in 1 2 3 4; do
              DESIRED=$(
                jq -r \
                  --argjson slot "$SLOT" \
                  '.servers[] | select(.slot == $slot) | .desired' \
                  "$GITHUB_WORKSPACE/servers.json"
              )

              STATUS=$(
                jq -r \
                  --argjson slot "$SLOT" \
                  '.servers[] | select(.slot == $slot) | .status' \
                  "$GITHUB_WORKSPACE/servers.json"
              )

              if [ "$DESIRED" = "online" ]; then
                ONLINE_COUNT=$((ONLINE_COUNT + 1))

                if [ -z "${LAC_PIDS[$SLOT]}" ] || ! kill -0 "${LAC_PIDS[$SLOT]}" 2>/dev/null; then
                  start_slot "$SLOT"
                fi
              else
                if [ -n "${LAC_PIDS[$SLOT]}" ] && kill -0 "${LAC_PIDS[$SLOT]}" 2>/dev/null; then
                  stop_slot "$SLOT"
                elif [ "$STATUS" != "offline" ] && [ "$STATUS" != "available" ]; then
                  set_status "$SLOT" "offline"
                fi
              fi
            done

            echo
            echo "[$(date '+%H:%M:%S')]"
            echo "Controller running."
            echo "Requested online servers: $ONLINE_COUNT"

            if [ "$ONLINE_COUNT" -eq 0 ]; then
              echo "No servers requested. Ending controller."
              break
            fi

            sleep 10
          done

      - name: Final status
        if: always()
        run: |
          echo "======================================"
          echo "L.A. CRIMES 4-SERVER WORKFLOW FINISHED"
          echo "======================================"
          echo "WORKFLOW_STATUS=${{ job.status }}"
          echo "======================================"

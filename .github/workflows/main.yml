name: L.A. Crimes Playit Server

on:
  workflow_dispatch:
    inputs:
      slot:
        description: "Server slot"
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"

  repository_dispatch:
    types:
      - create-server

permissions:
  contents: read

env:
  GIST_ID: a6bd68866931ce5999003aa4f59d50b5
  GIST_FILE: servers.json
  LOCAL_UDP: "7777"

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:

      # ==========================================
      # DETERMINE SLOT
      # ==========================================

      - name: Determine server slot
        id: slot
        env:
          EVENT_SLOT: ${{ github.event.client_payload.slot }}
          MANUAL_SLOT: ${{ inputs.slot }}
        run: |
          set -e

          SLOT="$EVENT_SLOT"

          if [ -z "$SLOT" ]; then
            SLOT="$MANUAL_SLOT"
          fi

          if [ -z "$SLOT" ]; then
            SLOT="1"
          fi

          case "$SLOT" in
            1|2|3|4)
              ;;
            *)
              echo "ERROR: Invalid server slot: $SLOT"
              exit 1
              ;;
          esac

          echo "SLOT=$SLOT" >> "$GITHUB_OUTPUT"

          echo "======================================"
          echo "SERVER_SLOT=$SLOT"
          echo "RUN_ID=$GITHUB_RUN_ID"
          echo "======================================"


      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # DEPENDENCIES
      # ==========================================

      - name: Install dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            unzip \
            wget \
            curl \
            ca-certificates \
            iproute2 \
            jq \
            python3

          echo "Dependencies installed."


      # ==========================================
      # CHECK DASHBOARD TOKEN
      # ==========================================

      - name: Check dashboard token
        env:
          DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
        run: |
          set -e

          echo "======================================"
          echo "CHECKING DASHBOARD TOKEN"
          echo "======================================"

          if [ -z "$DASHBOARD_TOKEN" ]; then
            echo "ERROR: DASHBOARD_TOKEN is missing."
            exit 1
          fi

          echo "DASHBOARD_TOKEN_FOUND=true"


      # ==========================================
      # TEST GITHUB TOKEN
      # ==========================================

      - name: Test GitHub token
        env:
          DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
        run: |
          set -e

          echo "======================================"
          echo "TESTING GITHUB TOKEN"
          echo "======================================"

          RESPONSE=$(
            curl \
              --fail \
              --silent \
              --show-error \
              --request GET \
              --url "https://api.github.com/user" \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $DASHBOARD_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28"
          )

          USERNAME=$(
            echo "$RESPONSE" |
            jq -r '.login // empty'
          )

          if [ -z "$USERNAME" ]; then
            echo "ERROR: GitHub token test failed."
            exit 1
          fi

          echo "GitHub token works."
          echo "Authenticated account: $USERNAME"


      # ==========================================
      # DOWNLOAD GIST DATABASE
      # ==========================================

      - name: Download server database
        env:
          DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
        run: |
          set -e

          echo "======================================"
          echo "DOWNLOADING SERVER DATABASE"
          echo "======================================"

          curl \
            --fail \
            --silent \
            --show-error \
            --request GET \
            --url "https://api.github.com/gists/$GIST_ID" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $DASHBOARD_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            > "$GITHUB_WORKSPACE/gist-response.json"

          jq \
            -e \
            '.files["servers.json"].content' \
            "$GITHUB_WORKSPACE/gist-response.json" \
            > /dev/null

          jq \
            -r \
            '.files["servers.json"].content' \
            "$GITHUB_WORKSPACE/gist-response.json" \
            > "$GITHUB_WORKSPACE/servers.json"

          echo "Current database:"
          cat "$GITHUB_WORKSPACE/servers.json"


      # ==========================================
      # MARK SLOT STARTING
      # ==========================================

      - name: Mark server starting
        env:
          DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
          SLOT: ${{ steps.slot.outputs.SLOT }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -e

          echo "======================================"
          echo "SERVER $SLOT -> STARTING"
          echo "RUN_ID=$RUN_ID"
          echo "======================================"

          python3 - \
            "$GITHUB_WORKSPACE/servers.json" \
            "$SLOT" \
            "$RUN_ID" <<'PY'
          import json
          import sys

          path = sys.argv[1]
          slot = int(sys.argv[2])
          run_id = int(sys.argv[3])

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          found = False

          for server in data["servers"]:
              if int(server["slot"]) == slot:
                  server["status"] = "starting"
                  server["endpoint"] = None
                  server["run_id"] = run_id
                  found = True
                  break

          if not found:
              raise SystemExit(
                  f"Server slot {slot} was not found."
              )

          with open(path, "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2)
              f.write("\n")
          PY

          PAYLOAD=$(
            jq -n \
              --arg content "$(cat "$GITHUB_WORKSPACE/servers.json")" \
              --arg filename "$GIST_FILE" \
              '{
                files: {
                  ($filename): {
                    content: $content
                  }
                }
              }'
          )

          curl \
            --fail \
            --silent \
            --show-error \
            --request PATCH \
            --url "https://api.github.com/gists/$GIST_ID" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $DASHBOARD_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --data "$PAYLOAD" \
            > /dev/null

          echo "Server $SLOT marked STARTING."


      # ==========================================
      # DOWNLOAD PLAYIT
      # ==========================================

      - name: Download Playit
        run: |
          set -e

          echo "======================================"
          echo "LAC_SERVER_STATE=INSTALLING_PLAYIT"
          echo "======================================"

          wget \
            --timeout=60 \
            --tries=5 \
            -O "$GITHUB_WORKSPACE/playit" \
            "https://github.com/playit-cloud/playit-agent/releases/download/v1.0.10/playit-linux-amd64"

          chmod +x "$GITHUB_WORKSPACE/playit"

          "$GITHUB_WORKSPACE/playit" --help || true


      # ==========================================
      # CHECK PLAYIT SECRET
      # ==========================================

      - name: Check Playit secret
        id: playit_secret_check
        env:
          PLAYIT_SECRET: ${{ secrets.PLAYIT_SECRET }}
        run: |
          set -e

          if [ -n "$PLAYIT_SECRET" ]; then
            echo "HAS_SECRET=true" >> "$GITHUB_OUTPUT"
            echo "PLAYIT_SECRET_FOUND=true"
          else
            echo "HAS_SECRET=false" >> "$GITHUB_OUTPUT"
            echo "PLAYIT_SECRET_FOUND=false"
          fi


      # ==========================================
      # REQUIRE PLAYIT SECRET
      # ==========================================

      - name: Require Playit secret
        if: steps.playit_secret_check.outputs.HAS_SECRET == 'false'
        run: |
          echo "ERROR: PLAYIT_SECRET is missing."
          echo
          echo "Add it under:"
          echo "Settings -> Secrets and variables -> Actions"
          echo
          echo "Secret name:"
          echo "PLAYIT_SECRET"
          exit 1


      # ==========================================
      # DOWNLOAD L.A. CRIMES
      # ==========================================

      - name: Download L.A. Crimes
        run: |
          set -e

          echo "======================================"
          echo "LAC_SERVER_STATE=DOWNLOADING"
          echo "======================================"

          wget \
            --timeout=60 \
            --tries=5 \
            -O "$GITHUB_WORKSPACE/LAC.zip" \
            "https://www.lacrimesonline.com/builds/LAC_Linux_v1.9.6.zip"

          rm -rf "$GITHUB_WORKSPACE/lac"

          mkdir -p "$GITHUB_WORKSPACE/lac"

          unzip -q \
            "$GITHUB_WORKSPACE/LAC.zip" \
            -d "$GITHUB_WORKSPACE/lac"

          SERVER=$(
            find "$GITHUB_WORKSPACE/lac" \
              -type f \
              -name "LAC_Linux_v1.9.6.x86_64" \
              -print -quit
          )

          if [ -z "$SERVER" ]; then
            echo "ERROR: L.A. Crimes executable not found."

            find "$GITHUB_WORKSPACE/lac" \
              -maxdepth 5 \
              -type f \
              -print

            exit 1
          fi

          chmod +x "$SERVER"

          echo "L.A. Crimes executable:"
          echo "$SERVER"


      # ==========================================
      # CREATE SERVER CONFIG
      # ==========================================

      - name: Create ServerConfig.txt
        run: |
          set -e

          cat > "$GITHUB_WORKSPACE/ServerConfig.txt" <<'EOF'
          #Maps (City, Garage, RagdollParty, TrainFacility)
          #Maps (ZombieSurvival, NewTerrainRamps, Island, CarSoccer)
          #Editor Maps (editor:myMap)

          (Moderator)
          admin code=YOUR-NUM-CODE
          lock down=true

          (Basic)
          restart timer=never
          max players=16
          map name=City
          starting port=7777

          (Server List)
          share to community=true
          server language=English
          server password=none

          (Roleplay)
          username=HOST
          password=0000
          EOF


      # ==========================================
      # INSTALL SERVER CONFIG
      # ==========================================

      - name: Install ServerConfig.txt
        run: |
          set -e

          CONFIG_DIR="/root/.config/unity3d/MA/LAC"

          sudo mkdir -p "$CONFIG_DIR"

          sudo cp \
            "$GITHUB_WORKSPACE/ServerConfig.txt" \
            "$CONFIG_DIR/ServerConfig.txt"

          sudo chmod 644 \
            "$CONFIG_DIR/ServerConfig.txt"

          echo "CONFIG_INSTALLED=true"


      # ==========================================
      # START L.A. CRIMES
      # ==========================================

      - name: Start L.A. Crimes
        run: |
          set -e

          SERVER=$(
            find "$GITHUB_WORKSPACE/lac" \
              -type f \
              -name "LAC_Linux_v1.9.6.x86_64" \
              -print -quit
          )

          SERVER_DIR=$(dirname "$SERVER")

          cd "$SERVER_DIR"

          echo "======================================"
          echo "LAC_SERVER_STATE=STARTING_GAME"
          echo "======================================"

          echo "MAP=City"
          echo "LOCAL_UDP=7777"

          ./LAC_Linux_v1.9.6.x86_64 \
            -batchmode \
            -nographics \
            > "$GITHUB_WORKSPACE/lac-server.log" 2>&1 &

          LAC_PID=$!

          echo "$LAC_PID" \
            > "$GITHUB_WORKSPACE/lac.pid"

          echo "LAC_PID=$LAC_PID"

          sleep 10

          if ! kill -0 "$LAC_PID" 2>/dev/null; then
            echo "LAC_SERVER_STATE=GAME_FAILED"

            echo "===== L.A. CRIMES LOG ====="

            tail -250 \
              "$GITHUB_WORKSPACE/lac-server.log" \
              || true

            exit 1
          fi

          echo "LAC_SERVER_STATE=GAME_RUNNING"

          echo "===== UDP 7777 ====="

          ss -lunp |
            grep ':7777' ||
            true


      # ==========================================
      # PREPARE PLAYIT
      # ==========================================

      - name: Prepare Playit runtime
        run: |
          set -e

          echo "======================================"
          echo "LAC_SERVER_STATE=PREPARING_PLAYIT"
          echo "======================================"

          sudo rm -rf /run/playit

          sudo mkdir -p /run/playit

          sudo chown \
            "$(id -u):$(id -g)" \
            /run/playit

          sudo chmod 700 /run/playit

          echo "PLAYIT_RUNTIME=/run/playit"

          ls -ld /run/playit


      # ==========================================
      # START PLAYIT
      # ==========================================

      - name: Start Playit tunnel
        env:
          PLAYIT_SECRET: ${{ secrets.PLAYIT_SECRET }}
        run: |
          set -e

          echo "======================================"
          echo "LAC_SERVER_STATE=STARTING_TUNNEL"
          echo "======================================"

          echo "TUNNEL_PROVIDER=playit"
          echo "LOCAL_UDP=7777"

          "$GITHUB_WORKSPACE/playit" \
            --secret "$PLAYIT_SECRET" \
            > "$GITHUB_WORKSPACE/playit.log" 2>&1 &

          PLAYIT_PID=$!

          echo "$PLAYIT_PID" \
            > "$GITHUB_WORKSPACE/playit.pid"

          echo "PLAYIT_PID=$PLAYIT_PID"

          echo "Waiting for Playit..."

          for i in $(seq 1 60); do
            if ! kill -0 "$PLAYIT_PID" 2>/dev/null; then
              echo "ERROR: Playit stopped."

              echo "===== PLAYIT LOG ====="

              cat \
                "$GITHUB_WORKSPACE/playit.log" \
                || true

              exit 1
            fi

            echo "Playit running... $i/60"

            sleep 1
          done

          echo "======================================"
          echo "LAC_SERVER_STATE=TUNNEL_RUNNING"
          echo "======================================"

          echo "TUNNEL_PROVIDER=playit"
          echo "LOCAL_UDP=7777"

          echo "===== PLAYIT LOG ====="

          cat \
            "$GITHUB_WORKSPACE/playit.log" \
            || true


      # ==========================================
      # DETECT PLAYIT ENDPOINT
      # ==========================================

      - name: Detect Playit endpoint
        id: endpoint
        run: |
          set -e

          LOG="$GITHUB_WORKSPACE/playit.log"

          ENDPOINT=""

          ENDPOINT=$(
            grep -Eo \
              '([A-Za-z0-9.-]+\.(playit\.gg|playit\.cloud):[0-9]+|[0-9]{1,3}(\.[0-9]{1,3}){3}:[0-9]+)' \
              "$LOG" |
            head -1 ||
            true
          )

          if [ -z "$ENDPOINT" ]; then
            echo "No public endpoint detected in Playit log."
            echo "ENDPOINT=" >> "$GITHUB_OUTPUT"
          else
            echo "Playit endpoint detected:"
            echo "$ENDPOINT"

            echo "ENDPOINT=$ENDPOINT" >> "$GITHUB_OUTPUT"
          fi


      # ==========================================
      # MARK SERVER ONLINE
      # ==========================================

      - name: Mark server online
        env:
          DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
          SLOT: ${{ steps.slot.outputs.SLOT }}
          ENDPOINT: ${{ steps.endpoint.outputs.ENDPOINT }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -e

          echo "======================================"
          echo "SERVER $SLOT -> ONLINE"
          echo "RUN_ID=$RUN_ID"
          echo "======================================"

          python3 - \
            "$GITHUB_WORKSPACE/servers.json" \
            "$SLOT" \
            "$ENDPOINT" \
            "$RUN_ID" <<'PY'
          import json
          import sys

          path = sys.argv[1]
          slot = int(sys.argv[2])
          endpoint = sys.argv[3]
          run_id = int(sys.argv[4])

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          found = False

          for server in data["servers"]:
              if int(server["slot"]) == slot:
                  server["status"] = "online"
                  server["endpoint"] = endpoint or None
                  server["run_id"] = run_id
                  found = True
                  break

          if not found:
              raise SystemExit(
                  f"Server slot {slot} was not found."
              )

          with open(path, "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2)
              f.write("\n")
          PY

          PAYLOAD=$(
            jq -n \
              --arg content "$(cat "$GITHUB_WORKSPACE/servers.json")" \
              --arg filename "$GIST_FILE" \
              '{
                files: {
                  ($filename): {
                    content: $content
                  }
                }
              }'
          )

          curl \
            --fail \
            --silent \
            --show-error \
            --request PATCH \
            --url "https://api.github.com/gists/$GIST_ID" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $DASHBOARD_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --data "$PAYLOAD" \
            > /dev/null

          echo "Gist updated."
          echo "Server $SLOT is ONLINE."


      # ==========================================
      # READY
      # ==========================================

      - name: Server ready
        env:
          SLOT: ${{ steps.slot.outputs.SLOT }}
          ENDPOINT: ${{ steps.endpoint.outputs.ENDPOINT }}
          RUN_ID: ${{ github.run_id }}
        run: |
          echo
          echo "======================================"
          echo "       L.A. CRIMES SERVER READY"
          echo "======================================"

          echo "LAC_SERVER_STATE=ONLINE"
          echo "SERVER_STATUS=ONLINE"
          echo "SERVER_READY=true"
          echo "SERVER_SLOT=$SLOT"
          echo "RUN_ID=$RUN_ID"
          echo "MAP=City"
          echo "LOCAL_UDP=7777"
          echo "TUNNEL_PROVIDER=playit"

          if [ -n "$ENDPOINT" ]; then
            echo "PUBLIC_ENDPOINT=$ENDPOINT"
          else
            echo "PUBLIC_ENDPOINT=NOT_DETECTED"
          fi

          echo "======================================"


      # ==========================================
      # KEEP SERVER ALIVE
      # ==========================================

      - name: Keep server alive
        env:
          SLOT: ${{ steps.slot.outputs.SLOT }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -e

          echo "SERVER_READY=true"
          echo "SERVER_STATUS=ONLINE"
          echo "SERVER_SLOT=$SLOT"
          echo "RUN_ID=$RUN_ID"

          while true; do
            LAC_PID=$(cat "$GITHUB_WORKSPACE/lac.pid")
            PLAYIT_PID=$(cat "$GITHUB_WORKSPACE/playit.pid")

            if ! kill -0 "$LAC_PID" 2>/dev/null; then
              echo "GAME PROCESS STOPPED"
              echo "SERVER_STATUS=OFFLINE"
              exit 1
            fi

            if ! kill -0 "$PLAYIT_PID" 2>/dev/null; then
              echo "PLAYIT PROCESS STOPPED"
              echo "SERVER_STATUS=OFFLINE"
              exit 1
            fi

            echo
            echo "[$(date '+%H:%M:%S')]"
            echo "LAC_SERVER_STATE=ONLINE"
            echo "SERVER_READY=true"
            echo "SERVER_STATUS=ONLINE"
            echo "SERVER_SLOT=$SLOT"
            echo "RUN_ID=$RUN_ID"
            echo "MAP=City"
            echo "LOCAL_UDP=7777"
            echo "TUNNEL_PROVIDER=playit"

            sleep 10
          done


      # ==========================================
      # FINAL GIST CLEANUP
      #
      # IMPORTANT:
      # always() means this runs after failure/cancel
      # whenever GitHub allows the runner to continue.
      # ==========================================

      - name: Free slot after workflow ends
        if: always()
        env:
          DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
          SLOT: ${{ steps.slot.outputs.SLOT }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set +e

          echo "======================================"
          echo "CLEANING UP SERVER SLOT $SLOT"
          echo "RUN_ID=$RUN_ID"
          echo "======================================"

          if [ ! -f "$GITHUB_WORKSPACE/servers.json" ]; then
            curl \
              --silent \
              --show-error \
              --request GET \
              --url "https://api.github.com/gists/$GIST_ID" \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $DASHBOARD_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              > "$GITHUB_WORKSPACE/gist-response.json"

            jq \
              -r \
              '.files["servers.json"].content' \
              "$GITHUB_WORKSPACE/gist-response.json" \
              > "$GITHUB_WORKSPACE/servers.json"
          fi

          if [ -f "$GITHUB_WORKSPACE/servers.json" ]; then

            python3 - \
              "$GITHUB_WORKSPACE/servers.json" \
              "$SLOT" \
              "$RUN_ID" <<'PY'
          import json
          import sys

          path = sys.argv[1]
          slot = int(sys.argv[2])
          run_id = int(sys.argv[3])

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          for server in data["servers"]:
              if int(server["slot"]) == slot:

                  current_run_id = server.get("run_id")

                  if (
                      current_run_id is None
                      or int(current_run_id) == run_id
                  ):
                      server["status"] = "available"
                      server["endpoint"] = None
                      server["run_id"] = None

                  break

          with open(path, "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2)
              f.write("\n")
          PY

            PAYLOAD=$(
              jq -n \
                --arg content "$(cat "$GITHUB_WORKSPACE/servers.json")" \
                --arg filename "$GIST_FILE" \
                '{
                  files: {
                    ($filename): {
                      content: $content
                    }
                  }
                }'
            )

            curl \
              --silent \
              --show-error \
              --request PATCH \
              --url "https://api.github.com/gists/$GIST_ID" \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $DASHBOARD_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --header "Content-Type: application/json" \
              --data "$PAYLOAD" \
              > /dev/null

            echo "Server $SLOT cleanup complete."

          else
            echo "WARNING: servers.json could not be loaded."
          fi


      # ==========================================
      # FINAL STATUS
      # ==========================================

      - name: Final status
        if: always()
        env:
          SLOT: ${{ steps.slot.outputs.SLOT }}
          RUN_ID: ${{ github.run_id }}
        run: |
          echo
          echo "======================================"
          echo "L.A. CRIMES WORKFLOW FINISHED"
          echo "======================================"

          echo "SERVER_SLOT=$SLOT"
          echo "RUN_ID=$RUN_ID"
          echo "WORKFLOW_STATUS=${{ job.status }}"

          echo "======================================"

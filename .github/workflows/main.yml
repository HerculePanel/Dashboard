name: L.A. Crimes Rustunnel Server

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # DEPENDENCIES
      # ==========================================

      - name: Install dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            unzip \
            wget \
            curl \
            jq \
            tar \
            git

      # ==========================================
      # INSTALL RUSTUNNEL
      # ==========================================

      - name: Install Rustunnel
        run: |
          set -e

          echo "======================================"
          echo "LAC_SERVER_STATE=INSTALLING_RUSTUNNEL"
          echo "======================================"

          RELEASE_API="https://api.github.com/repos/joaoh82/rustunnel/releases/latest"

          echo "Finding latest Rustunnel release..."

          ASSET_URL=$(curl -fsSL "$RELEASE_API" \
            | jq -r '
                .assets[]
                | select(
                    .name
                    | test("^rustunnel-v[0-9.]+-x86_64-unknown-linux-gnu\\.tar\\.gz$")
                  )
                | .browser_download_url
              ' \
            | head -n 1)

          if [ -z "$ASSET_URL" ] || [ "$ASSET_URL" = "null" ]; then
            echo "ERROR: Linux x86_64 Rustunnel asset was not found."

            echo
            echo "Available release assets:"

            curl -fsSL "$RELEASE_API" \
              | jq -r '.assets[].name'

            exit 1
          fi

          echo
          echo "Rustunnel asset:"
          echo "$ASSET_URL"

          wget \
            --timeout=60 \
            --tries=5 \
            -O /tmp/rustunnel.tar.gz \
            "$ASSET_URL"

          rm -rf /tmp/rustunnel

          mkdir -p /tmp/rustunnel

          tar \
            -xzf /tmp/rustunnel.tar.gz \
            -C /tmp/rustunnel

          RUSTUNNEL_BIN=$(find /tmp/rustunnel \
            -type f \
            -name "rustunnel" \
            -print -quit)

          if [ -z "$RUSTUNNEL_BIN" ]; then
            echo "ERROR: Rustunnel executable was not found."

            find /tmp/rustunnel \
              -maxdepth 4 \
              -type f \
              -print

            exit 1
          fi

          chmod +x "$RUSTUNNEL_BIN"

          sudo install \
            -m 755 \
            "$RUSTUNNEL_BIN" \
            /usr/local/bin/rustunnel

          echo
          echo "======================================"
          echo "RUSTUNNEL INSTALLED"
          echo "======================================"

          rustunnel --version

      # ==========================================
      # DOWNLOAD L.A. CRIMES
      # ==========================================

      - name: Download L.A. Crimes
        run: |
          set -e

          echo "======================================"
          echo "LAC_SERVER_STATE=DOWNLOADING"
          echo "======================================"

          wget \
            --timeout=60 \
            --tries=5 \
            -O "$GITHUB_WORKSPACE/LAC.zip" \
            "https://www.lacrimesonline.com/builds/LAC_Linux_v1.9.6.zip"

          rm -rf "$GITHUB_WORKSPACE/lac"

          mkdir -p "$GITHUB_WORKSPACE/lac"

          unzip -q \
            "$GITHUB_WORKSPACE/LAC.zip" \
            -d "$GITHUB_WORKSPACE/lac"

          SERVER=$(find "$GITHUB_WORKSPACE/lac" \
            -type f \
            -name "LAC_Linux_v1.9.6.x86_64" \
            -print -quit)

          if [ -z "$SERVER" ]; then
            echo "ERROR: L.A. Crimes executable not found."

            find "$GITHUB_WORKSPACE/lac" \
              -maxdepth 5 \
              -type f \
              -print

            exit 1
          fi

          chmod +x "$SERVER"

          echo
          echo "L.A. Crimes executable:"
          echo "$SERVER"

      # ==========================================
      # CREATE SERVER CONFIG
      # ==========================================

      - name: Create ServerConfig.txt
        run: |
          set -e

          echo "======================================"
          echo "LAC_SERVER_STATE=CONFIGURING"
          echo "======================================"

          cat > "$GITHUB_WORKSPACE/ServerConfig.txt" <<'EOF'
          #Maps (City, Garage, RagdollParty, TrainFacility)
          #Maps (ZombieSurvival, NewTerrainRamps, Island, CarSoccer)
          #Editor Maps (editor:myMap)

          (Moderator)
          admin code=YOUR-NUM-CODE
          lock down=true

          (Basic)
          restart timer=never
          max players=16
          map name=City
          starting port=7777

          (Server List)
          share to community=true
          server language=English
          server password=none

          (Roleplay)
          username=HOST
          password=0000
          EOF

          echo "MAP=City"
          echo "LOCAL_UDP=7777"

      # ==========================================
      # INSTALL CONFIG
      # ==========================================

      - name: Install ServerConfig.txt
        run: |
          set -e

          CONFIG_DIR="/root/.config/unity3d/MA/LAC"

          sudo mkdir -p "$CONFIG_DIR"

          sudo cp \
            "$GITHUB_WORKSPACE/ServerConfig.txt" \
            "$CONFIG_DIR/ServerConfig.txt"

          sudo chmod 644 \
            "$CONFIG_DIR/ServerConfig.txt"

          echo "CONFIG_INSTALLED=true"

      # ==========================================
      # START L.A. CRIMES
      # ==========================================

      - name: Start L.A. Crimes
        run: |
          set -e

          SERVER=$(find "$GITHUB_WORKSPACE/lac" \
            -type f \
            -name "LAC_Linux_v1.9.6.x86_64" \
            -print -quit)

          SERVER_DIR=$(dirname "$SERVER")

          cd "$SERVER_DIR"

          echo "======================================"
          echo "LAC_SERVER_STATE=STARTING_GAME"
          echo "======================================"

          echo "MAP=City"
          echo "LOCAL_UDP=7777"

          ./LAC_Linux_v1.9.6.x86_64 \
            -batchmode \
            -nographics \
            > "$GITHUB_WORKSPACE/lac-server.log" 2>&1 &

          LAC_PID=$!

          echo "$LAC_PID" \
            > "$GITHUB_WORKSPACE/lac.pid"

          echo "LAC_PID=$LAC_PID"

          echo
          echo "Waiting 10 seconds for L.A. Crimes..."

          sleep 10

          echo
          echo "===== PROCESS ====="

          ps aux | grep '[L]AC_Linux' || true

          echo
          echo "===== UDP 7777 ====="

          ss -lunp | grep ':7777' || true

          if ! kill -0 "$LAC_PID" 2>/dev/null; then
            echo "LAC_SERVER_STATE=GAME_FAILED"

            echo
            echo "===== L.A. CRIMES LOG ====="

            tail -250 \
              "$GITHUB_WORKSPACE/lac-server.log" \
              || true

            exit 1
          fi

          echo
          echo "LAC_SERVER_STATE=GAME_RUNNING"

      # ==========================================
      # START RUSTUNNEL
      # ==========================================

      - name: Start Rustunnel UDP tunnel
        env:
          RUSTUNNEL_TOKEN: ${{ secrets.RUSTUNNEL_TOKEN }}
        run: |
          set -e

          if [ -z "$RUSTUNNEL_TOKEN" ]; then
            echo "ERROR: RUSTUNNEL_TOKEN is missing."

            echo
            echo "Create it under:"
            echo "Repository Settings"
            echo "→ Secrets and variables"
            echo "→ Actions"

            exit 1
          fi

          echo "======================================"
          echo "LAC_SERVER_STATE=STARTING_TUNNEL"
          echo "======================================"

          echo "RUSTUNNEL_SERVER=edge.rustunnel.com:4040"
          echo "LOCAL_UDP=7777"

          rm -f "$GITHUB_WORKSPACE/rustunnel.log"

          rustunnel udp 7777 \
            --server "edge.rustunnel.com:4040" \
            --token "$RUSTUNNEL_TOKEN" \
            --json \
            > "$GITHUB_WORKSPACE/rustunnel.log" 2>&1 &

          RUSTUNNEL_PID=$!

          echo "$RUSTUNNEL_PID" \
            > "$GITHUB_WORKSPACE/rustunnel.pid"

          echo "RUSTUNNEL_PID=$RUSTUNNEL_PID"

          echo
          echo "Waiting for Rustunnel tunnel..."

          READY="false"

          for i in $(seq 1 60); do

            if ! kill -0 "$RUSTUNNEL_PID" 2>/dev/null; then

              echo "Rustunnel process stopped."

              echo
              echo "===== RUSTUNNEL LOG ====="

              cat \
                "$GITHUB_WORKSPACE/rustunnel.log" \
                || true

              exit 1
            fi

            if grep -q \
              '"event":"tunnel_ready"' \
              "$GITHUB_WORKSPACE/rustunnel.log" 2>/dev/null; then

              READY="true"
              break
            fi

            sleep 1

          done

          if [ "$READY" != "true" ]; then

            echo "ERROR: Rustunnel did not become ready."

            echo
            echo "===== RUSTUNNEL LOG ====="

            cat \
              "$GITHUB_WORKSPACE/rustunnel.log" \
              || true

            exit 1
          fi

          TUNNEL_JSON=$(grep \
            '"event":"tunnel_ready"' \
            "$GITHUB_WORKSPACE/rustunnel.log" \
            | tail -n 1)

          echo
          echo "===== TUNNEL EVENT ====="

          echo "$TUNNEL_JSON"

          PUBLIC_ENDPOINT=$(echo "$TUNNEL_JSON" \
            | jq -r '.public_addr // empty')

          if [ -z "$PUBLIC_ENDPOINT" ] || [ "$PUBLIC_ENDPOINT" = "null" ]; then

            echo "ERROR: Could not extract public endpoint."

            echo
            echo "Full Rustunnel output:"

            cat \
              "$GITHUB_WORKSPACE/rustunnel.log"

            exit 1
          fi

          echo "$PUBLIC_ENDPOINT" \
            > "$GITHUB_WORKSPACE/public-endpoint.txt"

          echo
          echo "======================================"
          echo "LAC_SERVER_STATE=TUNNEL_READY"
          echo "======================================"

          echo "PUBLIC_ENDPOINT=$PUBLIC_ENDPOINT"

      # ==========================================
      # ANNOUNCE SERVER READY
      # ==========================================

      - name: Announce server ready
        run: |
          set -e

          PUBLIC_ENDPOINT=$(cat \
            "$GITHUB_WORKSPACE/public-endpoint.txt")

          echo
          echo "======================================"
          echo "LAC_SERVER_READY"
          echo "======================================"

          echo "SERVER_STATUS=ONLINE"
          echo "SERVER_READY=true"
          echo "MAP=City"
          echo "LOCAL_UDP=7777"
          echo "PUBLIC_ENDPOINT=$PUBLIC_ENDPOINT"

          echo "======================================"

      # ==========================================
      # KEEP SERVER ALIVE
      # ==========================================

      - name: Keep server alive
        run: |
          set -e

          PUBLIC_ENDPOINT=$(cat \
            "$GITHUB_WORKSPACE/public-endpoint.txt")

          echo
          echo "======================================"
          echo "LAC_SERVER_READY"
          echo "======================================"

          echo "SERVER_STATUS=ONLINE"
          echo "SERVER_READY=true"
          echo "MAP=City"
          echo "LOCAL_UDP=7777"
          echo "PUBLIC_ENDPOINT=$PUBLIC_ENDPOINT"

          echo
          echo "======================================"
          echo "L.A. CRIMES SERVER IS RUNNING"
          echo "======================================"

          while true; do

            LAC_PID=$(cat \
              "$GITHUB_WORKSPACE/lac.pid")

            RUSTUNNEL_PID=$(cat \
              "$GITHUB_WORKSPACE/rustunnel.pid")

            # --------------------------------------
            # CHECK L.A. CRIMES
            # --------------------------------------

            if ! kill -0 "$LAC_PID" 2>/dev/null; then

              echo
              echo "======================================"
              echo "LAC_SERVER_READY=false"
              echo "SERVER_STATUS=OFFLINE"
              echo "LAC_SERVER_STATE=GAME_STOPPED"
              echo "======================================"

              echo
              echo "===== L.A. CRIMES LOG ====="

              tail -250 \
                "$GITHUB_WORKSPACE/lac-server.log" \
                || true

              exit 1
            fi

            # --------------------------------------
            # CHECK RUSTUNNEL
            # --------------------------------------

            if ! kill -0 "$RUSTUNNEL_PID" 2>/dev/null; then

              echo
              echo "======================================"
              echo "LAC_SERVER_READY=false"
              echo "SERVER_STATUS=OFFLINE"
              echo "LAC_SERVER_STATE=TUNNEL_STOPPED"
              echo "======================================"

              echo
              echo "===== RUSTUNNEL LOG ====="

              cat \
                "$GITHUB_WORKSPACE/rustunnel.log" \
                || true

              exit 1
            fi

            # --------------------------------------
            # HEARTBEAT
            # --------------------------------------

            echo
            echo "[$(date '+%H:%M:%S')]"

            echo "LAC_SERVER_STATE=ONLINE"
            echo "SERVER_STATUS=ONLINE"
            echo "SERVER_READY=true"
            echo "MAP=City"
            echo "LOCAL_UDP=7777"
            echo "PUBLIC_ENDPOINT=$PUBLIC_ENDPOINT"

            sleep 10

          done

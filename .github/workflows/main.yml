name: L.A. Crimes Server

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Server operation"
        required: true
        type: choice
        options:
          - start
          - setup
        default: start
      slot:
        description: "Server slot (ignored for setup)"
        required: true
        type: choice
        options: ["1", "2", "3", "4"]
        default: "1"
      map:
        description: "Official map or Custom"
        required: false
        type: choice
        options:
          - City
          - Garage
          - RagdollParty
          - TrainFacility
          - ZombieSurvival
          - NewTerrainRamps
          - Island
          - CarSoccer
          - Custom
        default: TrainFacility
      admin_code:
        description: "Numeric admin code"
        required: false
        default: "12345"
      custom_map_name:
        description: "Custom map name without .txt"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: lac-server-slot-${{ inputs.slot }}
  cancel-in-progress: false

env:
  GIST_ID: cb2aaaece7a231ec707429d41e1457f4
  GIST_FILE: servers.json
  PLAYIT_VERSION: "1.0.10"
  PLAYIT_CLI_URL: "https://github.com/playit-cloud/playit-agent/releases/download/v1.0.10/playit-cli-linux-amd64"
  PLAYIT_AGENT_URL: "https://github.com/playit-cloud/playit-agent/releases/download/v1.0.10/playit-linux-amd64"

jobs:
  setup:
    if: ${{ inputs.mode == 'setup' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PLAYIT_SECRET_1: ${{ secrets.PLAYIT_SECRET_1 }}
      PLAYIT_SECRET_2: ${{ secrets.PLAYIT_SECRET_2 }}
      PLAYIT_SECRET_3: ${{ secrets.PLAYIT_SECRET_3 }}
      PLAYIT_SECRET_4: ${{ secrets.PLAYIT_SECRET_4 }}
      DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
    steps:
      - name: Install tools
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y wget curl jq
      - name: Prepare directories
        run: |
          set -e
          sudo mkdir -p /run/playit
          sudo chmod 777 /run/playit
          mkdir -p "$HOME/.config/playit_gg"
      - name: Download Playit CLI + Agent
        run: |
          set -e
          wget --timeout=60 --tries=5 -O "$GITHUB_WORKSPACE/playit-cli" "$PLAYIT_CLI_URL"
          wget --timeout=60 --tries=5 -O "$GITHUB_WORKSPACE/playit" "$PLAYIT_AGENT_URL"
          chmod +x "$GITHUB_WORKSPACE/playit-cli" "$GITHUB_WORKSPACE/playit"
      - name: Check secrets and create missing agents
        run: |
          set -e
          MISSING=()
          [ -n "$DASHBOARD_TOKEN" ] || MISSING+=("DASHBOARD_TOKEN")
          [ -n "$PLAYIT_SECRET_1" ] || MISSING+=("PLAYIT_SECRET_1")
          [ -n "$PLAYIT_SECRET_2" ] || MISSING+=("PLAYIT_SECRET_2")
          [ -n "$PLAYIT_SECRET_3" ] || MISSING+=("PLAYIT_SECRET_3")
          [ -n "$PLAYIT_SECRET_4" ] || MISSING+=("PLAYIT_SECRET_4")
          if [ ${#MISSING[@]} -eq 0 ]; then echo "All secrets present."; exit 0; fi
          create_agent() {
            local SECRET_NAME="$1"
            rm -rf "$HOME/.config/playit_gg" 2>/dev/null || true
            mkdir -p "$HOME/.config/playit_gg"
            CLAIM_CODE=$("$GITHUB_WORKSPACE/playit-cli" claim generate 2>/dev/null | tr -d '\r\n' || true)
            [ -n "$CLAIM_CODE" ] || { echo "claim generate failed"; exit 1; }
            echo "Open: https://playit.gg/claim/$CLAIM_CODE"
            SECRET=""
            for i in $(seq 1 72); do
              sleep 10
              SECRET=$("$GITHUB_WORKSPACE/playit-cli" claim exchange "$CLAIM_CODE" --wait 5 2>/dev/null | tail -n 15 | grep -oE '[0-9a-fA-F]{32,}' | tail -1 || true)
              [ -n "$SECRET" ] && [ ${#SECRET} -ge 32 ] && break
            done
            [ -n "$SECRET" ] || { echo "Timed out"; exit 1; }
            echo "Secret name : $SECRET_NAME"
            echo "Secret value: $SECRET"
          }
          for s in "${MISSING[@]}"; do
            case "$s" in
              PLAYIT_SECRET_*) create_agent "$s" ;;
              DASHBOARD_TOKEN) echo "Add DASHBOARD_TOKEN" ;;
            esac
          done

  server:
    if: ${{ inputs.mode == 'start' }}
    runs-on: ubuntu-latest
    timeout-minutes: 346
    env:
      SLOT: ${{ inputs.slot }}
      MAP_NAME: ${{ inputs.map }}
      ADMIN_CODE: ${{ inputs.admin_code }}
      CUSTOM_MAP_NAME: ${{ inputs.custom_map_name }}
      DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
    steps:
      - name: Configure server slot
        id: config
        run: |
          set -e
          PORT="7777"
          MAP_NAME="${MAP_NAME:-TrainFacility}"
          ADMIN_CODE="${ADMIN_CODE:-12345}"
          ADMIN_CODE=$(echo "$ADMIN_CODE" | tr -cd '0-9')
          [ -n "$ADMIN_CODE" ] || ADMIN_CODE="12345"
          CUSTOM_MAP_NAME=$(echo "${CUSTOM_MAP_NAME:-}" | sed 's/\.txt$//' | tr -cd 'A-Za-z0-9_-')
          case "$SLOT" in
            1) DOMAIN="drake-missy.tun.ply.gg"; IP="147.185.221.231"; PUBLIC_PORT="46049" ;;
            2) DOMAIN="drake-embraced.tun.ply.gg"; IP="147.185.221.231"; PUBLIC_PORT="47064" ;;
            3) DOMAIN="drake-limbs.tun.ply.gg"; IP="147.185.221.30"; PUBLIC_PORT="40093" ;;
            4) DOMAIN="drake-relativity.tun.ply.gg"; IP="147.185.221.230"; PUBLIC_PORT="49177" ;;
            *) echo "Invalid slot"; exit 1 ;;
          esac
          if [ "$MAP_NAME" = "Custom" ]; then
            [ -n "$CUSTOM_MAP_NAME" ] || { echo "custom_map_name missing"; exit 1; }
            DISPLAY_MAP="editor:${CUSTOM_MAP_NAME}"
          else
            DISPLAY_MAP="$MAP_NAME"
          fi
          echo "PORT=$PORT" >> "$GITHUB_OUTPUT"
          echo "IP=$IP" >> "$GITHUB_OUTPUT"
          echo "ENDPOINT=${DOMAIN}:${PUBLIC_PORT}" >> "$GITHUB_OUTPUT"
          echo "MAP_NAME=$MAP_NAME" >> "$GITHUB_OUTPUT"
          echo "DISPLAY_MAP=$DISPLAY_MAP" >> "$GITHUB_OUTPUT"
          echo "ADMIN_CODE=$ADMIN_CODE" >> "$GITHUB_OUTPUT"
          echo "CUSTOM_MAP_NAME=$CUSTOM_MAP_NAME" >> "$GITHUB_OUTPUT"

      - name: Check required secrets
        env:
          PLAYIT_SECRET_1: ${{ secrets.PLAYIT_SECRET_1 }}
          PLAYIT_SECRET_2: ${{ secrets.PLAYIT_SECRET_2 }}
          PLAYIT_SECRET_3: ${{ secrets.PLAYIT_SECRET_3 }}
          PLAYIT_SECRET_4: ${{ secrets.PLAYIT_SECRET_4 }}
        run: |
          set -e
          [ -n "$DASHBOARD_TOKEN" ] || { echo "DASHBOARD_TOKEN missing"; exit 1; }
          case "$SLOT" in
            1) PLAYIT_SECRET="$PLAYIT_SECRET_1" ;;
            2) PLAYIT_SECRET="$PLAYIT_SECRET_2" ;;
            3) PLAYIT_SECRET="$PLAYIT_SECRET_3" ;;
            4) PLAYIT_SECRET="$PLAYIT_SECRET_4" ;;
          esac
          [ -n "$PLAYIT_SECRET" ] || { echo "PLAYIT_SECRET_$SLOT missing"; exit 1; }

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y unzip wget curl ca-certificates iproute2 jq python3 libc6-i386 lib32stdc++6 || true

      - name: Disable IPv6
        run: |
          set -e
          sudo sysctl -w net.ipv6.conf.all.disable_ipv6=1
          sudo sysctl -w net.ipv6.conf.default.disable_ipv6=1
          sudo sysctl -w net.ipv6.conf.lo.disable_ipv6=1

      - name: Download server database
        run: |
          set -e
          curl --fail --silent --show-error --request GET \
            --url "https://api.github.com/gists/$GIST_ID" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $DASHBOARD_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            > "$GITHUB_WORKSPACE/gist-response.json"
          jq -r '.files["servers.json"].content' "$GITHUB_WORKSPACE/gist-response.json" > "$GITHUB_WORKSPACE/servers.json"

      - name: Mark server STARTING
        env:
          PORT: ${{ steps.config.outputs.PORT }}
          ENDPOINT: ${{ steps.config.outputs.ENDPOINT }}
          IP: ${{ steps.config.outputs.IP }}
          DISPLAY_MAP: ${{ steps.config.outputs.DISPLAY_MAP }}
        run: |
          set -e
          python3 - "$GITHUB_WORKSPACE/servers.json" "$SLOT" "$GITHUB_RUN_ID" "$PORT" "$ENDPOINT" "$IP" "$DISPLAY_MAP" <<'PY'
          import json, sys
          from datetime import datetime, timezone
          path, slot, run_id = sys.argv[1], int(sys.argv[2]), str(sys.argv[3])
          port, endpoint, ip, map_name = int(sys.argv[4]), sys.argv[5], sys.argv[6], sys.argv[7]
          now = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)
          for server in data["servers"]:
              if int(server["slot"]) != slot:
                  continue
              current_run = server.get("run_id")
              if current_run not in (None, "", run_id):
                  raise SystemExit(f"Server {slot} owned by {current_run}")
              server.update({"status":"starting","run_id":run_id,"endpoint":endpoint,"ip":ip,"port":port,"map":map_name,"started_at":now})
              break
          else:
              raise SystemExit("slot missing")
          with open(path, "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2)
              f.write("\n")
          PY
          python3 - <<'PY'
          import json, os, urllib.request
          with open(os.path.join(os.environ["GITHUB_WORKSPACE"], "servers.json"), "r", encoding="utf-8") as f:
              content = f.read()
          payload = {"files": {os.environ["GIST_FILE"]: {"content": content}}}
          req = urllib.request.Request("https://api.github.com/gists/" + os.environ["GIST_ID"], data=json.dumps(payload).encode(), method="PATCH", headers={"Accept":"application/vnd.github+json","Authorization":"Bearer "+os.environ["DASHBOARD_TOKEN"],"X-GitHub-Api-Version":"2022-11-28","Content-Type":"application/json"})
          urllib.request.urlopen(req).read()
          PY

      - name: Download L.A. Crimes
        run: |
          set -e
          wget --timeout=60 --tries=5 -O "$GITHUB_WORKSPACE/LAC.zip" "https://lacrimesonline.com/builds/LAC_Linux_v1.9.6.zip"
          rm -rf "$GITHUB_WORKSPACE/lac"
          mkdir -p "$GITHUB_WORKSPACE/lac"
          unzip -q "$GITHUB_WORKSPACE/LAC.zip" -d "$GITHUB_WORKSPACE/lac"
          SERVER=$(find "$GITHUB_WORKSPACE/lac" -type f -name "LAC_Linux_v1.9.6.x86_64" -print -quit)
          [ -n "$SERVER" ] || { echo "Binary not found"; exit 1; }
          chmod +x "$SERVER"
          echo "$SERVER" > "$GITHUB_WORKSPACE/server-path.txt"

      - name: Install ServerConfig and optional custom map
        env:
          MAP_NAME: ${{ steps.config.outputs.MAP_NAME }}
          DISPLAY_MAP: ${{ steps.config.outputs.DISPLAY_MAP }}
          ADMIN_CODE: ${{ steps.config.outputs.ADMIN_CODE }}
          CUSTOM_MAP_NAME: ${{ steps.config.outputs.CUSTOM_MAP_NAME }}
        run: |
          set -e
          cat > "$GITHUB_WORKSPACE/ServerConfig.txt" <<EOF
          #place config in /root/.config/unity3d/MA/LAC/ServerConfig.txt
          #place maps in   /root/.config/unity3d/MA/LAC/editor/myMap.txt
          #Maps (City, Garage, RagdollParty, TrainFacility)
          #Maps (ZombieSurvival, NewTerrainRamps, Island, CarSoccer)
          #Editor Maps (editor:myMap)

          (Moderator)
          admin code=${ADMIN_CODE}
          lock down=true

          (Basic)
          restart timer=never
          max players=16
          map name=${DISPLAY_MAP}
          starting port=7777

          (Server List)
          share to community=true
          server language=English
          server password=

          (Roleplay)
          username=HOST
          password=0000
          EOF
          sed -i 's/^          //' "$GITHUB_WORKSPACE/ServerConfig.txt"
          install_tree() {
            sudo mkdir -p "$1/editor"
            sudo cp "$GITHUB_WORKSPACE/ServerConfig.txt" "$1/ServerConfig.txt"
          }
          install_tree /root/.config/unity3d/MA/LAC
          install_tree "$HOME/.config/unity3d/MA/LAC"
          if [ "$MAP_NAME" = "Custom" ]; then
            python3 - "$SLOT" "$CUSTOM_MAP_NAME" <<'PY'
          import json, os, sys, urllib.request
          slot, name = sys.argv[1], sys.argv[2]
          filename = "custom-map-%s.txt" % slot
          req = urllib.request.Request(
              "https://api.github.com/gists/" + os.environ["GIST_ID"],
              headers={"Accept":"application/vnd.github+json","Authorization":"Bearer "+os.environ["DASHBOARD_TOKEN"],"X-GitHub-Api-Version":"2022-11-28"},
          )
          with urllib.request.urlopen(req) as resp:
              gist = json.load(resp)
          file = gist["files"].get(filename)
          if not file or not file.get("content"):
              raise SystemExit("custom map gist file missing: " + filename)
          content = file["content"]
          if file.get("truncated") and file.get("raw_url"):
              content = urllib.request.urlopen(file["raw_url"]).read().decode("utf-8", "replace")
          path = os.path.join(os.environ["GITHUB_WORKSPACE"], name + ".txt")
          with open(path, "w", encoding="utf-8") as f:
              f.write(content)
          print("custom map bytes", len(content))
          PY
            sudo cp "$GITHUB_WORKSPACE/${CUSTOM_MAP_NAME}.txt" "/root/.config/unity3d/MA/LAC/editor/${CUSTOM_MAP_NAME}.txt"
            sudo mkdir -p "/root/.config/unity3d/MA/LAC/editor/${CUSTOM_MAP_NAME}"
            sudo cp "$GITHUB_WORKSPACE/${CUSTOM_MAP_NAME}.txt" "$HOME/.config/unity3d/MA/LAC/editor/${CUSTOM_MAP_NAME}.txt"
            sudo mkdir -p "$HOME/.config/unity3d/MA/LAC/editor/${CUSTOM_MAP_NAME}"
          fi
          sudo chmod -R a+rX /root/.config/unity3d/MA/LAC "$HOME/.config/unity3d/MA/LAC"
          echo "===== ServerConfig ====="
          sudo cat /root/.config/unity3d/MA/LAC/ServerConfig.txt
          echo "===== editor ====="
          sudo ls -la /root/.config/unity3d/MA/LAC/editor || true

      - name: Start L.A. Crimes
        run: |
          set -e
          SERVER=$(cat "$GITHUB_WORKSPACE/server-path.txt")
          cd "$(dirname "$SERVER")"
          sudo -H env HOME=/root XDG_CONFIG_HOME=/root/.config \
            ./LAC_Linux_v1.9.6.x86_64 -batchmode -nographics \
            > "$GITHUB_WORKSPACE/lac-server.log" 2>&1 &
          echo $! > "$GITHUB_WORKSPACE/lac.pid"
          sleep 25
          if ! kill -0 "$(cat "$GITHUB_WORKSPACE/lac.pid")" 2>/dev/null; then
            tail -300 "$GITHUB_WORKSPACE/lac-server.log" || true
            exit 1
          fi
          sudo ss -ulnp || true
          tail -80 "$GITHUB_WORKSPACE/lac-server.log" || true

      - name: Download Playit agent
        run: |
          set -e
          wget --timeout=60 --tries=5 -O "$GITHUB_WORKSPACE/playit" "$PLAYIT_AGENT_URL"
          chmod +x "$GITHUB_WORKSPACE/playit"

      - name: Start Playit
        env:
          PLAYIT_SECRET_1: ${{ secrets.PLAYIT_SECRET_1 }}
          PLAYIT_SECRET_2: ${{ secrets.PLAYIT_SECRET_2 }}
          PLAYIT_SECRET_3: ${{ secrets.PLAYIT_SECRET_3 }}
          PLAYIT_SECRET_4: ${{ secrets.PLAYIT_SECRET_4 }}
        run: |
          set -e
          case "$SLOT" in
            1) PLAYIT_SECRET="$PLAYIT_SECRET_1" ;;
            2) PLAYIT_SECRET="$PLAYIT_SECRET_2" ;;
            3) PLAYIT_SECRET="$PLAYIT_SECRET_3" ;;
            4) PLAYIT_SECRET="$PLAYIT_SECRET_4" ;;
          esac
          echo "::add-mask::$PLAYIT_SECRET"
          sudo mkdir -p /run/playit
          sudo chmod 777 /run/playit
          mkdir -p "$HOME/.config/playit_gg"
          "$GITHUB_WORKSPACE/playit" --secret "$PLAYIT_SECRET" > "$GITHUB_WORKSPACE/playit.log" 2>&1 &
          echo $! > "$GITHUB_WORKSPACE/playit.pid"
          sleep 10
          kill -0 "$(cat "$GITHUB_WORKSPACE/playit.pid")" 2>/dev/null || { cat "$GITHUB_WORKSPACE/playit.log"; exit 1; }

      - name: Mark server ONLINE
        env:
          PORT: ${{ steps.config.outputs.PORT }}
          ENDPOINT: ${{ steps.config.outputs.ENDPOINT }}
          IP: ${{ steps.config.outputs.IP }}
          DISPLAY_MAP: ${{ steps.config.outputs.DISPLAY_MAP }}
        run: |
          set -e
          python3 - "$GITHUB_WORKSPACE/servers.json" "$SLOT" "$GITHUB_RUN_ID" "$PORT" "$ENDPOINT" "$IP" "$DISPLAY_MAP" <<'PY'
          import json, sys
          from datetime import datetime, timezone
          path, slot, run_id = sys.argv[1], int(sys.argv[2]), str(sys.argv[3])
          port, endpoint, ip, map_name = int(sys.argv[4]), sys.argv[5], sys.argv[6], sys.argv[7]
          now = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)
          for server in data["servers"]:
              if int(server["slot"]) != slot:
                  continue
              if str(server.get("run_id")) != run_id:
                  raise SystemExit("ownership changed")
              server.update({"status":"online","run_id":run_id,"endpoint":endpoint,"ip":ip,"port":port,"map":map_name,"started_at":server.get("started_at") or now})
              break
          with open(path, "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2)
              f.write("\n")
          PY
          python3 - <<'PY'
          import json, os, urllib.request
          with open(os.path.join(os.environ["GITHUB_WORKSPACE"], "servers.json"), "r", encoding="utf-8") as f:
              content = f.read()
          payload = {"files": {os.environ["GIST_FILE"]: {"content": content}}}
          req = urllib.request.Request("https://api.github.com/gists/" + os.environ["GIST_ID"], data=json.dumps(payload).encode(), method="PATCH", headers={"Accept":"application/vnd.github+json","Authorization":"Bearer "+os.environ["DASHBOARD_TOKEN"],"X-GitHub-Api-Version":"2022-11-28","Content-Type":"application/json"})
          urllib.request.urlopen(req).read()
          PY

      - name: Keep server alive and sync gist every minute
        env:
          PORT: ${{ steps.config.outputs.PORT }}
          ENDPOINT: ${{ steps.config.outputs.ENDPOINT }}
          IP: ${{ steps.config.outputs.IP }}
          DISPLAY_MAP: ${{ steps.config.outputs.DISPLAY_MAP }}
        run: |
          set -e
          START=$(date +%s)
          LIMIT=$((5 * 3600 + 45 * 60))
          snapshot_and_upload() {
            python3 - <<'PY'
          import json, os, subprocess
          slot = os.environ.get("SLOT", "1")
          def run(cmd):
              try:
                  return subprocess.check_output(cmd, shell=True, text=True, stderr=subprocess.STDOUT)
              except Exception as e:
                  return str(e)
          ws = os.environ.get("GITHUB_WORKSPACE", "")
          files = {}
          for p in ["/root/.config/unity3d/MA/LAC", "/root/.config/unity3d/MA/LAC/editor", "/home/runner/.config/unity3d/MA/LAC"]:
              files[p] = {"type": "dir", "body": run("sudo ls -la " + p)}
          listing = run("sudo find /root/.config/unity3d/MA/LAC -maxdepth 3 -printf '%y %p\\n'")
          for line in listing.splitlines():
              parts = line.split(" ", 1)
              if len(parts) != 2:
                  continue
              kind, path = parts
              if kind == "d":
                  files[path] = {"type": "dir", "body": run("sudo ls -la " + path)}
              elif kind == "f" and path.endswith((".txt", ".log", "prefs")):
                  files[path] = {"type": "file", "body": run("sudo tail -c 20000 " + path)[:20000]}
          for f in [os.path.join(ws, "lac-server.log"), os.path.join(ws, "playit.log")]:
              files[f] = {"type": "file", "body": run("sudo tail -c 20000 " + f)[:20000]}
          out = {"slot": int(slot), "time": run("date -u +%Y-%m-%dT%H:%M:%SZ").strip(), "files": files}
          with open(os.path.join(ws, "runtime-snapshot.json"), "w", encoding="utf-8") as fh:
              json.dump(out, fh, indent=2)
          PY
            python3 - <<'PY'
          import json, os, urllib.request
          filename = "runtime-" + os.environ.get("SLOT", "1") + ".json"
          with open(os.path.join(os.environ["GITHUB_WORKSPACE"], "runtime-snapshot.json"), "r", encoding="utf-8") as f:
              content = f.read()
          payload = {"files": {filename: {"content": content}}}
          req = urllib.request.Request("https://api.github.com/gists/" + os.environ["GIST_ID"], data=json.dumps(payload).encode(), method="PATCH", headers={"Accept":"application/vnd.github+json","Authorization":"Bearer "+os.environ["DASHBOARD_TOKEN"],"X-GitHub-Api-Version":"2022-11-28","Content-Type":"application/json"})
          try:
              urllib.request.urlopen(req).read()
          except Exception as e:
              print("snapshot upload failed:", e)
          PY
          }
          sync_gist_truth() {
            python3 - "$SLOT" "$GITHUB_RUN_ID" "$PORT" "$ENDPOINT" "$IP" "$DISPLAY_MAP" <<'PY'
          import json, os, sys, urllib.request
          from datetime import datetime, timezone
          slot, run_id = int(sys.argv[1]), str(sys.argv[2])
          port, endpoint, ip, map_name = int(sys.argv[3]), sys.argv[4], sys.argv[5], sys.argv[6]
          gist_id, token, filename = os.environ["GIST_ID"], os.environ["DASHBOARD_TOKEN"], os.environ["GIST_FILE"]
          req = urllib.request.Request("https://api.github.com/gists/" + gist_id, headers={"Accept":"application/vnd.github+json","Authorization":"Bearer "+token,"X-GitHub-Api-Version":"2022-11-28"})
          with urllib.request.urlopen(req) as resp:
              gist = json.load(resp)
          data = json.loads(gist["files"][filename]["content"])
          changed = False
          found = False
          for server in data["servers"]:
              if int(server["slot"]) != slot:
                  continue
              found = True
              wanted = {"status":"online","run_id":run_id,"endpoint":endpoint,"ip":ip,"port":port,"map":map_name}
              for key, value in wanted.items():
                  if server.get(key) != value:
                      server[key] = value
                      changed = True
              if not server.get("started_at"):
                  server["started_at"] = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
                  changed = True
              break
          if not found or not changed:
              print("Gist already truthful for slot", slot)
              sys.exit(0)
          print("Gist was stale. Updating slot", slot)
          payload = {"files": {filename: {"content": json.dumps(data, indent=2) + "\n"}}}
          patch = urllib.request.Request("https://api.github.com/gists/" + gist_id, data=json.dumps(payload).encode(), method="PATCH", headers={"Accept":"application/vnd.github+json","Authorization":"Bearer "+token,"X-GitHub-Api-Version":"2022-11-28","Content-Type":"application/json"})
          urllib.request.urlopen(patch).read()
          PY
          }
          LAST_SYNC=0
          while true; do
            NOW=$(date +%s)
            if [ $((NOW - START)) -ge "$LIMIT" ]; then
              echo "Auto-stop after 5h45m"
              exit 0
            fi
            kill -0 "$(cat "$GITHUB_WORKSPACE/lac.pid")" 2>/dev/null || { tail -100 "$GITHUB_WORKSPACE/lac-server.log"; exit 1; }
            kill -0 "$(cat "$GITHUB_WORKSPACE/playit.pid")" 2>/dev/null || { cat "$GITHUB_WORKSPACE/playit.log"; exit 1; }
            if [ $((NOW - LAST_SYNC)) -ge 60 ]; then
              sync_gist_truth || true
              snapshot_and_upload || true
              LAST_SYNC=$NOW
            fi
            echo "[$(date '+%H:%M:%S')] SERVER=$SLOT ONLINE left=$((LIMIT - (NOW - START)))s"
            sleep 10
          done

      - name: Cleanup server state
        if: always()
        run: |
          set +e
          python3 - "$SLOT" "$GITHUB_RUN_ID" <<'PY'
          import json, os, sys, urllib.request
          slot, run_id = int(sys.argv[1]), str(sys.argv[2])
          gist_id, token, filename = os.environ.get("GIST_ID",""), os.environ.get("DASHBOARD_TOKEN",""), os.environ.get("GIST_FILE","servers.json")
          if not gist_id or not token:
              sys.exit(0)
          req = urllib.request.Request("https://api.github.com/gists/" + gist_id, headers={"Accept":"application/vnd.github+json","Authorization":"Bearer "+token,"X-GitHub-Api-Version":"2022-11-28"})
          try:
              with urllib.request.urlopen(req) as resp:
                  data = json.loads(json.load(resp)["files"][filename]["content"])
          except Exception as e:
              print("cleanup fetch failed:", e)
              sys.exit(0)
          for server in data["servers"]:
              if int(server["slot"]) != slot:
                  continue
              if server.get("run_id") not in (None, "", run_id) and str(server.get("run_id")) != run_id:
                  print("Cleanup ignored")
                  sys.exit(0)
              server.update({"status":"offline","run_id":None,"endpoint":None,"ip":None,"port":None,"map":None,"started_at":None})
              break
          payload = {"files": {filename: {"content": json.dumps(data, indent=2) + "\n"}}}
          patch = urllib.request.Request("https://api.github.com/gists/" + gist_id, data=json.dumps(payload).encode(), method="PATCH", headers={"Accept":"application/vnd.github+json","Authorization":"Bearer "+token,"X-GitHub-Api-Version":"2022-11-28","Content-Type":"application/json"})
          try:
              urllib.request.urlopen(patch).read()
              print("Cleanup wrote offline to gist")
          except Exception as e:
              print("cleanup patch failed:", e)
          PY

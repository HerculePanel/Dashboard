name: L.A. Crimes Server

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Choose normal server operation or Playit agent setup"
        required: true
        type: choice
        default: start
        options:
          - start
          - setup

      slot:
        description: "Server slot to start (used when mode=start)"
        required: true
        type: choice
        default: "1"
        options:
          - "1"
          - "2"
          - "3"
          - "4"

permissions:
  contents: read

env:
  GIST_ID: cb2aaaece7a231ec707429d41e1457f4
  GIST_FILE: servers.json

  PLAYIT_VERSION: "1.0.10"
  PLAYIT_AGENT_URL: "https://github.com/playit-cloud/playit-agent/releases/download/v1.0.10/playit-linux-amd64"

jobs:

  setup:
    if: ${{ inputs.mode == 'setup' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check setup token
        env:
          DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
        run: |
          set -e

          echo "======================================"
          echo "PLAYIT AGENT SETUP"
          echo "======================================"

          if [ -z "$DASHBOARD_TOKEN" ]; then
            echo "ERROR: DASHBOARD_TOKEN is missing."
            exit 1
          fi

          echo "DASHBOARD_TOKEN found."

      - name: Check which secrets exist
        id: check_secrets
        env:
          PLAYIT_SECRET_1: ${{ secrets.PLAYIT_SECRET_1 }}
          PLAYIT_SECRET_2: ${{ secrets.PLAYIT_SECRET_2 }}
          PLAYIT_SECRET_3: ${{ secrets.PLAYIT_SECRET_3 }}
          PLAYIT_SECRET_4: ${{ secrets.PLAYIT_SECRET_4 }}
        run: |
          set -e

          echo "======================================"
          echo "CHECKING EXISTING SECRETS"
          echo "======================================"

          MISSING_AGENTS=""

          if [ -z "$PLAYIT_SECRET_1" ]; then
            echo "❌ PLAYIT_SECRET_1 is MISSING"
            MISSING_AGENTS="${MISSING_AGENTS}1"
          else
            echo "✅ PLAYIT_SECRET_1 exists"
          fi

          if [ -z "$PLAYIT_SECRET_2" ]; then
            echo "❌ PLAYIT_SECRET_2 is MISSING"
            MISSING_AGENTS="${MISSING_AGENTS}2"
          else
            echo "✅ PLAYIT_SECRET_2 exists"
          fi

          if [ -z "$PLAYIT_SECRET_3" ]; then
            echo "❌ PLAYIT_SECRET_3 is MISSING"
            MISSING_AGENTS="${MISSING_AGENTS}3"
          else
            echo "✅ PLAYIT_SECRET_3 exists"
          fi

          if [ -z "$PLAYIT_SECRET_4" ]; then
            echo "❌ PLAYIT_SECRET_4 is MISSING"
            MISSING_AGENTS="${MISSING_AGENTS}4"
          else
            echo "✅ PLAYIT_SECRET_4 exists"
          fi

          echo "MISSING_AGENTS=$MISSING_AGENTS" >> "$GITHUB_OUTPUT"

          if [ -z "$MISSING_AGENTS" ]; then
            echo
            echo "======================================"
            echo "✅ ALL SECRETS EXIST!"
            echo "======================================"
            echo "No setup needed. Run with mode=start."
          else
            echo
            echo "======================================"
            echo "⚠️  MISSING AGENTS: $MISSING_AGENTS"
            echo "======================================"
            echo "Will create secrets for agents: $MISSING_AGENTS"
          fi

      - name: Install setup dependencies
        if: steps.check_secrets.outputs.MISSING_AGENTS != ''
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            wget \
            curl \
            ca-certificates \
            jq

      - name: Download Playit agent
        if: steps.check_secrets.outputs.MISSING_AGENTS != ''
        run: |
          set -e

          wget \
            --timeout=60 \
            --tries=5 \
            -O "$GITHUB_WORKSPACE/playit" \
            "$PLAYIT_AGENT_URL"

          chmod +x "$GITHUB_WORKSPACE/playit"

          echo "Playit agent downloaded."

          "$GITHUB_WORKSPACE/playit" --version || true

      - name: Create missing Playit agents
        if: steps.check_secrets.outputs.MISSING_AGENTS != ''
        env:
          MISSING_AGENTS: ${{ steps.check_secrets.outputs.MISSING_AGENTS }}
        run: |
          set -e

          PLAYIT="$GITHUB_WORKSPACE/playit"

          create_agent() {

            SLOT="$1"
            SECRET_NAME="$2"
            AGENT_NAME="$3"

            echo
            echo
            echo "=============================================="
            echo "PLAYIT AGENT SETUP"
            echo "AGENT: $AGENT_NAME"
            echo "SLOT: $SLOT"
            echo "SECRET: $SECRET_NAME"
            echo "=============================================="

            # Kill any existing Playit processes
            pkill -f "playit" || true

            # Create a directory for the agent
            mkdir -p "$GITHUB_WORKSPACE/agent-$SLOT"

            # Run the agent to generate claim link
            echo "Generating claim link for agent $SLOT..."
            
            cd "$GITHUB_WORKSPACE/agent-$SLOT"

            # Run the agent in the background to get the claim link
            $PLAYIT run \
              > "$GITHUB_WORKSPACE/agent-$SLOT/agent.log" 2>&1 &

            AGENT_PID=$!

            echo "Agent PID: $AGENT_PID"

            # Wait for claim link to appear
            CLAIM_URL=""
            for i in $(seq 1 30); do
              sleep 2
              CLAIM_URL=$(grep -o 'https://playit.gg/claim/[a-zA-Z0-9]*' "$GITHUB_WORKSPACE/agent-$SLOT/agent.log" | head -1)
              if [ -n "$CLAIM_URL" ]; then
                break
              fi
              echo "Waiting for claim link... $i/30"
            done

            if [ -z "$CLAIM_URL" ]; then
              echo "ERROR: Failed to get claim URL from agent."
              cat "$GITHUB_WORKSPACE/agent-$SLOT/agent.log"
              return 1
            fi

            echo
            echo "**************************************************"
            echo
            echo "CLAIM AGENT $SLOT"
            echo
            echo "Agent name to use in Playit dashboard:"
            echo "$AGENT_NAME"
            echo
            echo "Open this URL in your browser:"
            echo
            echo "$CLAIM_URL"
            echo
            echo "**************************************************"
            echo
            echo "IMPORTANT:"
            echo "1. Open the URL above in your browser."
            echo "2. Log in to your Playit account."
            echo "3. Claim the agent and name it:"
            echo "   $AGENT_NAME"
            echo
            echo "⚠️  DO NOT CLOSE THIS WORKFLOW YET!"
            echo "The agent needs to stay running to receive the secret."
            echo
            echo "After claiming in browser, the agent will automatically"
            echo "receive and store the permanent secret."
            echo

            echo "Waiting for agent to be claimed in browser..."
            echo "The agent will automatically detect when claimed."

            # Wait for the agent to be claimed (it will store the secret)
            SECRET_FOUND=false
            for i in $(seq 1 60); do
              sleep 2
              
              # Check if the agent got a secret (it will write it to the log)
              if grep -q "Secret provisioned" "$GITHUB_WORKSPACE/agent-$SLOT/agent.log" 2>/dev/null; then
                echo "✅ Agent $SLOT successfully claimed!"
                SECRET_FOUND=true
                break
              fi
              
              # Also check if the secret file was created
              if [ -f "$GITHUB_WORKSPACE/agent-$SLOT/playit.toml" ]; then
                echo "✅ Agent $SLOT successfully claimed! (secret file found)"
                SECRET_FOUND=true
                break
              fi
              
              echo "Waiting for agent to be claimed... $i/60"
            done

            # Kill the agent process
            kill "$AGENT_PID" 2>/dev/null || true

            if [ "$SECRET_FOUND" = true ]; then
              # Extract the secret from the config file
              if [ -f "$GITHUB_WORKSPACE/agent-$SLOT/playit.toml" ]; then
                SECRET=$(cat "$GITHUB_WORKSPACE/agent-$SLOT/playit.toml" | grep -o '[a-f0-9]\{64\}' | head -1)
              else
                # Try to get it from the log
                SECRET=$(grep -o '[a-f0-9]\{64\}' "$GITHUB_WORKSPACE/agent-$SLOT/agent.log" | head -1)
              fi

              if [ -z "$SECRET" ]; then
                echo "ERROR: Could not extract secret from agent."
                cat "$GITHUB_WORKSPACE/agent-$SLOT/agent.log"
                return 1
              fi

              echo
              echo "=============================================="
              echo "AGENT SECRET FOR $SECRET_NAME"
              echo "=============================================="
              echo
              echo "Copy this secret value:"
              echo
              echo "$SECRET"
              echo
              echo "=============================================="
              echo
              echo "NEXT STEPS:"
              echo "1. Go to: https://github.com/LACServer/Dashboard/settings/secrets/actions"
              echo "2. Click 'New repository secret'"
              echo "3. Name: $SECRET_NAME"
              echo "4. Value: (paste the secret above)"
              echo "5. Click 'Add secret'"
              echo
              echo "After adding the secret, run this workflow again"
              echo "with mode=start to launch your server."
              echo "=============================================="
            else
              echo
              echo "⚠️  Agent was not claimed within the time limit."
              echo
              echo "You can still claim it manually:"
              echo "1. Open: $CLAIM_URL"
              echo "2. Log in and claim the agent"
              echo "3. Then get the secret from the Playit dashboard"
              echo "4. Add it as a GitHub secret: $SECRET_NAME"
              echo
              echo "The agent will continue to run in the background."
              echo "=============================================="
              return 1
            fi
          }

          # Loop through missing agents
          MISSING="$MISSING_AGENTS"
          
          if [[ "$MISSING" == *"1"* ]]; then
            create_agent "1" "PLAYIT_SECRET_1" "LAC Server Agent 1"
          fi

          if [[ "$MISSING" == *"2"* ]]; then
            create_agent "2" "PLAYIT_SECRET_2" "LAC Server Agent 2"
          fi

          if [[ "$MISSING" == *"3"* ]]; then
            create_agent "3" "PLAYIT_SECRET_3" "LAC Server Agent 3"
          fi

          if [[ "$MISSING" == *"4"* ]]; then
            create_agent "4" "PLAYIT_SECRET_4" "LAC Server Agent 4"
          fi

          echo
          echo "=============================================="
          echo "MISSING AGENTS HAVE BEEN CONFIGURED"
          echo "=============================================="
          echo
          echo "Agents created: $MISSING_AGENTS"
          echo
          echo "Add the secrets above to GitHub Secrets,"
          echo "then run this workflow with mode=start to launch your server."

      - name: No setup needed
        if: steps.check_secrets.outputs.MISSING_AGENTS == ''
        run: |
          echo
          echo "======================================"
          echo "✅ ALL SECRETS EXIST - NO SETUP NEEDED"
          echo "======================================"
          echo
          echo "All 4 Playit agent secrets are already configured."
          echo "Run this workflow with mode=start to launch your server."

      - name: Setup final status
        if: always()
        run: |
          echo
          echo "======================================"
          echo "PLAYIT SETUP FINISHED"
          echo "======================================"

          echo "WORKFLOW_STATUS=${{ job.status }}"
          echo "RUN_ID=${{ github.run_id }}"

          echo "======================================"

  server:
    if: ${{ inputs.mode == 'start' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      SLOT: ${{ inputs.slot }}

    steps:
      - name: Configure server slot
        id: config
        run: |
          set -e

          PORT="7777"

          case "$SLOT" in

            1)
              SECRET_NAME="PLAYIT_SECRET_1"
              DOMAIN="irvine-util.tun.ply.gg"
              IP="147.185.221.231"
              PUBLIC_PORT="54710"
              ;;

            2)
              SECRET_NAME="PLAYIT_SECRET_2"
              DOMAIN="drake-expansion.tun.ply.gg"
              IP="147.185.221.18"
              PUBLIC_PORT="20718"
              ;;

            3)
              SECRET_NAME="PLAYIT_SECRET_3"
              DOMAIN="drake-drama.tun.ply.gg"
              IP="147.185.221.231"
              PUBLIC_PORT="58951"
              ;;

            4)
              SECRET_NAME="PLAYIT_SECRET_4"
              DOMAIN="drake-muscle.tun.ply.gg"
              IP="147.185.221.231"
              PUBLIC_PORT="58968"
              ;;

            *)
              echo "ERROR: Invalid server slot: $SLOT"
              exit 1
              ;;

          esac

          echo "PORT=$PORT" >> "$GITHUB_OUTPUT"
          echo "SECRET_NAME=$SECRET_NAME" >> "$GITHUB_OUTPUT"
          echo "DOMAIN=$DOMAIN" >> "$GITHUB_OUTPUT"
          echo "IP=$IP" >> "$GITHUB_OUTPUT"
          echo "PUBLIC_PORT=$PUBLIC_PORT" >> "$GITHUB_OUTPUT"
          echo "ENDPOINT=${DOMAIN}:${PUBLIC_PORT}" >> "$GITHUB_OUTPUT"

          echo
          echo "======================================"
          echo "L.A. CRIMES SERVER CONFIGURATION"
          echo "======================================"
          echo "SERVER SLOT: $SLOT"
          echo "LOCAL UDP: $PORT"
          echo "PLAYIT SECRET: $SECRET_NAME"
          echo "PUBLIC DOMAIN: $DOMAIN"
          echo "PUBLIC IP: $IP"
          echo "PUBLIC PORT: $PUBLIC_PORT"
          echo "ENDPOINT: ${DOMAIN}:${PUBLIC_PORT}"
          echo "======================================"

      - name: Check required secrets
        env:
          DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
          PLAYIT_SECRET_1: ${{ secrets.PLAYIT_SECRET_1 }}
          PLAYIT_SECRET_2: ${{ secrets.PLAYIT_SECRET_2 }}
          PLAYIT_SECRET_3: ${{ secrets.PLAYIT_SECRET_3 }}
          PLAYIT_SECRET_4: ${{ secrets.PLAYIT_SECRET_4 }}
        run: |
          set -e

          if [ -z "$DASHBOARD_TOKEN" ]; then
            echo "ERROR: DASHBOARD_TOKEN is missing."
            exit 1
          fi

          case "$SLOT" in
            1)
              SECRET="$PLAYIT_SECRET_1"
              ;;

            2)
              SECRET="$PLAYIT_SECRET_2"
              ;;

            3)
              SECRET="$PLAYIT_SECRET_3"
              ;;

            4)
              SECRET="$PLAYIT_SECRET_4"
              ;;
          esac

          if [ -z "$SECRET" ]; then
            echo
            echo "ERROR: Playit secret for Server $SLOT is missing."
            echo
            echo "Run this workflow with:"
            echo "mode = setup"
            echo
            echo "first, then add the secret to GitHub Secrets."
            exit 1
          fi

          echo "✅ Required secrets found."

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            unzip \
            wget \
            curl \
            ca-certificates \
            iproute2 \
            jq \
            python3

      - name: Download server database
        env:
          DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
        run: |
          set -e

          curl \
            --fail \
            --silent \
            --show-error \
            --request GET \
            --url "https://api.github.com/gists/$GIST_ID" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $DASHBOARD_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            > "$GITHUB_WORKSPACE/gist-response.json"

          jq \
            -e \
            '.files["servers.json"].content' \
            "$GITHUB_WORKSPACE/gist-response.json" \
            > /dev/null

          jq \
            -r \
            '.files["servers.json"].content' \
            "$GITHUB_WORKSPACE/gist-response.json" \
            > "$GITHUB_WORKSPACE/servers.json"

          jq empty \
            "$GITHUB_WORKSPACE/servers.json"

          echo "Database loaded."

      - name: Mark server STARTING
        env:
          DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
          PORT: ${{ steps.config.outputs.PORT }}
          ENDPOINT: ${{ steps.config.outputs.ENDPOINT }}
          IP: ${{ steps.config.outputs.IP }}
        run: |
          set -e

          python3 - \
            "$GITHUB_WORKSPACE/servers.json" \
            "$SLOT" \
            "$GITHUB_RUN_ID" \
            "$PORT" \
            "$ENDPOINT" \
            "$IP" <<'PY'

          import json
          import sys

          path = sys.argv[1]
          slot = int(sys.argv[2])
          run_id = str(sys.argv[3])
          port = int(sys.argv[4])
          endpoint = sys.argv[5]
          ip = sys.argv[6]

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          for server in data["servers"]:

              if int(server["slot"]) == slot:

                  current_run = server.get("run_id")

                  if current_run not in (None, "", run_id):
                      raise SystemExit(
                          f"Server {slot} is already owned by "
                          f"workflow run {current_run}."
                      )

                  server["status"] = "starting"
                  server["run_id"] = run_id
                  server["endpoint"] = endpoint
                  server["ip"] = ip
                  server["port"] = port

                  break

          else:
              raise SystemExit(
                  f"Server slot {slot} was not found."
              )

          with open(path, "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2)
              f.write("\n")

          PY

          PAYLOAD=$(
            jq -n \
              --arg content "$(cat "$GITHUB_WORKSPACE/servers.json")" \
              --arg filename "$GIST_FILE" \
              '{
                files: {
                  ($filename): {
                    content: $content
                  }
                }
              }'
          )

          curl \
            --fail \
            --silent \
            --show-error \
            --request PATCH \
            --url "https://api.github.com/gists/$GIST_ID" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $DASHBOARD_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --data "$PAYLOAD" \
            > /dev/null

          echo "Server $SLOT marked STARTING."

      - name: Download L.A. Crimes
        run: |
          set -e

          wget \
            --timeout=60 \
            --tries=5 \
            -O "$GITHUB_WORKSPACE/LAC.zip" \
            "https://www.lacrimesonline.com/builds/LAC_Linux_v1.9.6.zip"

          rm -rf "$GITHUB_WORKSPACE/lac"

          mkdir -p "$GITHUB_WORKSPACE/lac"

          unzip -q \
            "$GITHUB_WORKSPACE/LAC.zip" \
            -d "$GITHUB_WORKSPACE/lac"

          SERVER=$(
            find "$GITHUB_WORKSPACE/lac" \
              -type f \
              -name "LAC_Linux_v1.9.6.x86_64" \
              -print -quit
          )

          if [ -z "$SERVER" ]; then

            echo "ERROR: L.A. Crimes executable not found."

            find \
              "$GITHUB_WORKSPACE/lac" \
              -maxdepth 5 \
              -type f \
              -print

            exit 1
          fi

          chmod +x "$SERVER"

          echo "$SERVER" \
            > "$GITHUB_WORKSPACE/server-path.txt"

      - name: Create ServerConfig.txt
        run: |
          set -e

          cat > "$GITHUB_WORKSPACE/ServerConfig.txt" <<'EOF'
          #Maps (City, Garage, RagdollParty, TrainFacility)
          #Maps (ZombieSurvival, NewTerrainRamps, Island, CarSoccer)
          #Editor Maps (editor:myMap)

          admin code=YOUR-NUM-CODE
          lock down=true

          restart timer=never
          max players=16
          map name=City
          starting port=7777

          share to community=true
          server language=English
          server password=none

          username=HOST
          password=0000
          EOF

          echo "ServerConfig:"
          cat "$GITHUB_WORKSPACE/ServerConfig.txt"

      - name: Install ServerConfig.txt
        run: |
          set -e

          CONFIG_DIR="/root/.config/unity3d/MA/LAC"

          sudo mkdir -p "$CONFIG_DIR"

          sudo cp \
            "$GITHUB_WORKSPACE/ServerConfig.txt" \
            "$CONFIG_DIR/ServerConfig.txt"

          sudo chmod 644 \
            "$CONFIG_DIR/ServerConfig.txt"

      - name: Start L.A. Crimes
        env:
          PORT: ${{ steps.config.outputs.PORT }}
        run: |
          set -e

          SERVER=$(
            cat "$GITHUB_WORKSPACE/server-path.txt"
          )

          SERVER_DIR=$(dirname "$SERVER")

          cd "$SERVER_DIR"

          echo
          echo "======================================"
          echo "STARTING L.A. CRIMES"
          echo "======================================"
          echo "SERVER SLOT: $SLOT"
          echo "LOCAL UDP: $PORT"
          echo "======================================"

          ./LAC_Linux_v1.9.6.x86_64 \
            -batchmode \
            -nographics \
            > "$GITHUB_WORKSPACE/lac-server.log" 2>&1 &

          LAC_PID=$!

          echo "$LAC_PID" \
            > "$GITHUB_WORKSPACE/lac.pid"

          sleep 10

          if ! kill -0 "$LAC_PID" 2>/dev/null; then

            echo "ERROR: L.A. Crimes stopped."

            tail -250 \
              "$GITHUB_WORKSPACE/lac-server.log" \
              || true

            exit 1
          fi

          echo "L.A. Crimes is running."
          echo "LAC_PID=$LAC_PID"

          ss -lunp |
            grep ":$PORT" ||
            true

      - name: Download Playit
        run: |
          set -e

          wget \
            --timeout=60 \
            --tries=5 \
            -O "$GITHUB_WORKSPACE/playit" \
            "$PLAYIT_AGENT_URL"

          chmod +x "$GITHUB_WORKSPACE/playit"

          echo "Playit agent downloaded."

      - name: Prepare Playit runtime
        run: |
          set -e

          sudo rm -rf /run/playit

          sudo mkdir -p /run/playit

          sudo chown \
            "$(id -u):$(id -g)" \
            /run/playit

          sudo chmod 700 /run/playit

          echo "Playit runtime prepared."

      - name: Start Playit
        env:
          PLAYIT_SECRET_1: ${{ secrets.PLAYIT_SECRET_1 }}
          PLAYIT_SECRET_2: ${{ secrets.PLAYIT_SECRET_2 }}
          PLAYIT_SECRET_3: ${{ secrets.PLAYIT_SECRET_3 }}
          PLAYIT_SECRET_4: ${{ secrets.PLAYIT_SECRET_4 }}
        run: |
          set -e

          case "$SLOT" in
            1)
              PLAYIT_SECRET="$PLAYIT_SECRET_1"
              ;;

            2)
              PLAYIT_SECRET="$PLAYIT_SECRET_2"
              ;;

            3)
              PLAYIT_SECRET="$PLAYIT_SECRET_3"
              ;;

            4)
              PLAYIT_SECRET="$PLAYIT_SECRET_4"
              ;;
          esac

          if [ -z "$PLAYIT_SECRET" ]; then
            echo "ERROR: Selected Playit secret is empty."
            exit 1
          fi

          echo "::add-mask::$PLAYIT_SECRET"

          echo
          echo "======================================"
          echo "STARTING PLAYIT AGENT"
          echo "======================================"
          echo "SERVER SLOT: $SLOT"
          echo "======================================"

          export PLAYIT_HOME="/run/playit"

          "$GITHUB_WORKSPACE/playit" \
            --secret "$PLAYIT_SECRET" \
            > "$GITHUB_WORKSPACE/playit.log" 2>&1 &

          PLAYIT_PID=$!

          echo "$PLAYIT_PID" \
            > "$GITHUB_WORKSPACE/playit.pid"

          for i in $(seq 1 60); do

            if ! kill -0 "$PLAYIT_PID" 2>/dev/null; then

              echo "ERROR: Playit stopped."

              cat \
                "$GITHUB_WORKSPACE/playit.log" \
                || true

              exit 1
            fi

            echo "Playit running... $i/60"

            sleep 1
          done

          echo "Playit agent is running."

      - name: Verify Playit tunnel
        env:
          ENDPOINT: ${{ steps.config.outputs.ENDPOINT }}
          IP: ${{ steps.config.outputs.IP }}
        run: |
          set -e

          echo
          echo "======================================"
          echo "PLAYIT TUNNEL"
          echo "======================================"

          echo "Configured public endpoint:"
          echo "$ENDPOINT"

          echo
          echo "Configured public IP:"
          echo "$IP"

          echo
          echo "Playit log:"
          tail -100 \
            "$GITHUB_WORKSPACE/playit.log" \
            || true

          echo
          echo "NOTE:"
          echo "The endpoint above must match the tunnel assigned"
          echo "to this agent in your Playit dashboard."

      - name: Mark server ONLINE
        env:
          DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
          PORT: ${{ steps.config.outputs.PORT }}
          ENDPOINT: ${{ steps.config.outputs.ENDPOINT }}
          IP: ${{ steps.config.outputs.IP }}
        run: |
          set -e

          python3 - \
            "$GITHUB_WORKSPACE/servers.json" \
            "$SLOT" \
            "$GITHUB_RUN_ID" \
            "$PORT" \
            "$ENDPOINT" \
            "$IP" <<'PY'

          import json
          import sys

          path = sys.argv[1]
          slot = int(sys.argv[2])
          run_id = str(sys.argv[3])
          port = int(sys.argv[4])
          endpoint = sys.argv[5]
          ip = sys.argv[6]

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          for server in data["servers"]:

              if int(server["slot"]) == slot:

                  if str(server.get("run_id")) != run_id:
                      raise SystemExit(
                          "Refusing to mark server online: "
                          "run ID ownership changed."
                      )

                  server["status"] = "online"
                  server["run_id"] = run_id
                  server["endpoint"] = endpoint
                  server["ip"] = ip
                  server["port"] = port

                  break

          else:
              raise SystemExit(
                  f"Server slot {slot} was not found."
              )

          with open(path, "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2)
              f.write("\n")

          PY

          PAYLOAD=$(
            jq -n \
              --arg content "$(cat "$GITHUB_WORKSPACE/servers.json")" \
              --arg filename "$GIST_FILE" \
              '{
                files: {
                  ($filename): {
                    content: $content
                  }
                }
              }'
          )

          curl \
            --fail \
            --silent \
            --show-error \
            --request PATCH \
            --url "https://api.github.com/gists/$GIST_ID" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $DASHBOARD_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --data "$PAYLOAD" \
            > /dev/null

          echo
          echo "======================================"
          echo "SERVER ONLINE"
          echo "======================================"
          echo "SLOT: $SLOT"
          echo "ENDPOINT: $ENDPOINT"
          echo "IP: $IP"
          echo "PORT: $PORT"
          echo "RUN ID: $GITHUB_RUN_ID"
          echo "======================================"

      - name: Keep server alive
        env:
          PORT: ${{ steps.config.outputs.PORT }}
          ENDPOINT: ${{ steps.config.outputs.ENDPOINT }}
        run: |
          set -e

          echo "Server $SLOT is online."
          echo "Endpoint: $ENDPOINT"
          echo "Port: $PORT"

          while true; do

            LAC_PID=$(
              cat "$GITHUB_WORKSPACE/lac.pid"
            )

            PLAYIT_PID=$(
              cat "$GITHUB_WORKSPACE/playit.pid"
            )

            if ! kill -0 "$LAC_PID" 2>/dev/null; then

              echo
              echo "ERROR: L.A. Crimes stopped."

              tail -250 \
                "$GITHUB_WORKSPACE/lac-server.log" \
                || true

              exit 1
            fi

            if ! kill -0 "$PLAYIT_PID" 2>/dev/null; then

              echo
              echo "ERROR: Playit stopped."

              cat \
                "$GITHUB_WORKSPACE/playit.log" \
                || true

              exit 1
            fi

            echo
            echo "[$(date '+%H:%M:%S')]"
            echo "SERVER_SLOT=$SLOT"
            echo "SERVER_STATUS=ONLINE"
            echo "LOCAL_UDP=$PORT"
            echo "PUBLIC_ENDPOINT=$ENDPOINT"
            echo "RUN_ID=${{ github.run_id }}"

            sleep 10
          done

      - name: Cleanup server state
        if: always()
        env:
          DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
        run: |
          set +e

          echo
          echo "======================================"
          echo "CLEANING SERVER $SLOT"
          echo "======================================"

          if [ ! -f "$GITHUB_WORKSPACE/servers.json" ]; then
            echo "servers.json does not exist."
            exit 0
          fi

          python3 - \
            "$GITHUB_WORKSPACE/servers.json" \
            "$SLOT" \
            "$GITHUB_RUN_ID" <<'PY'

          import json
          import sys

          path = sys.argv[1]
          slot = int(sys.argv[2])
          run_id = str(sys.argv[3])

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          for server in data["servers"]:

              if int(server["slot"]) != slot:
                  continue

              current_run = server.get("run_id")

              if current_run is not None:
                  if str(current_run) != run_id:

                      print(
                          f"Server {slot} currently belongs to "
                          f"run {current_run}."
                      )

                      print(
                          f"Cleanup from run {run_id} ignored."
                      )

                      sys.exit(0)

              server["status"] = "available"
              server["run_id"] = None

              break

          with open(path, "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2)
              f.write("\n")

          PY

          PAYLOAD=$(
            jq -n \
              --arg content "$(cat "$GITHUB_WORKSPACE/servers.json")" \
              --arg filename "$GIST_FILE" \
              '{
                files: {
                  ($filename): {
                    content: $content
                  }
                }
              }'
          )

          curl \
            --silent \
            --show-error \
            --request PATCH \
            --url "https://api.github.com/gists/$GIST_ID" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $DASHBOARD_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --data "$PAYLOAD" \
            > /dev/null \
            || true

          echo "Cleanup finished."

      - name: Final status
        if: always()
        env:
          PORT: ${{ steps.config.outputs.PORT }}
          ENDPOINT: ${{ steps.config.outputs.ENDPOINT }}
        run: |
          echo
          echo "======================================"
          echo "L.A. CRIMES SERVER FINISHED"
          echo "======================================"

          echo "SERVER_SLOT=$SLOT"
          echo "LOCAL_UDP=$PORT"
          echo "PUBLIC_ENDPOINT=$ENDPOINT"
          echo "WORKFLOW_STATUS=${{ job.status }}"
          echo "RUN_ID=${{ github.run_id }}"

          echo "======================================"
